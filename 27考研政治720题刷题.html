个资本家追求超额剩余价值导致整个社会各个生产部门的劳动生产率普遍提高，导致生活资料的价值下降和补偿劳动力价值的必要劳动时间缩短，剩余劳动时间相对延长，整个资本家阶级普遍获得相对剩余价值3）劳动力价值本质就是工资，其构成包含历史和道德的因素：劳动力商品的价值构成包括：养家糊口+教育训练（维持劳动者本人和家属生存所必需的生活资料的价值及劳动者接受教育和训练所支出的费用）","tips":"","title":"第四章 · 资本主义的本质及规律","module":"马原"},{"chapter":"第四章","section":"单选","no":15,"stem":"资本是在运动中增殖的，必须不断地、周而复始地循环，才能不断地带来剩余价值。产业资本划分为货币资本、生产资本、商品资本的依据是资本各个部分（　　）","opts":{"A":"在价值增殖过程中的作用不同","B":"价值周转方式的不同","C":"存在的物质形态不同","D":"在循环中的职能不同"},"ans":"D","point":"资本的循环周转与再生产","explain":"马克思在《资本论》第二卷分析资本循环时明确指出：“产业资本的循环过程包括三个阶段在第一阶段，资本表现为货币形态，执行购买劳动力和生产资料的职能；在第二阶段，资本进入生产领域，转化为生产资本，执行生产剩余价值的职能；在第三阶段，资本以商品形态回到流通领域，执行出售商品、实现价值和剩余价值的职能。”他进一步强调：“这三种形式并不是独立的资本种类，而是产业资本在循环过程中依次采取的不同职能形式。货币资本的职能是为剩余价值生产准备条件，生产资本的职能是生产剩余价值，商品资本的职能是实现剩余价值。”这种划分的核心在于，资本的每一种形态都对应着循环过程中的特定职能，“正是由于这些职能的不同，我们才将产业资本区分为货币资本、生产资本和商品资本”。A选项是划分不变资本和可变资本的依据，B选项是划分固定资本和流动资本的依据，生产资本的各种划分均不以其存在的物质形态为依据。所以，A、B、C选项均不符合题意。","notes":"①「D选项」资本循环是资本从一种形式出发，经过一系列形式的变化，又回到原来出发点的运动。产业资本在循环过程中要经历三个不同的阶段，与此相联系的是资本依次执行三种不同的职能\n②「D选项」产业资本依据它在资本循环过程中的不同阶段所担负的职能的不同，划分为货币资本、生产资本和商品资本根据资本在剩余价值生产中所起的不同作用，可以将资本划分为不变资本与可变资本根据资本周转方式或价值转移方式的不同，可以将资本划分为固定资本和流动资本：1）固定资本：不变资本中的劳动资料（厂房、机器等，多次生产过程中逐渐转移）2）流动资本：可变资本+不变资本中的原材料、燃料等（一次生产过程中全部转移）阶段内容职能购买生产资料和劳动力的购买阶段货币资本生产生产资料与劳动力按比例结合在一起从事资本主义生产生产资本售卖商品资本向货币资本的转化商品资本产业资本运动的基本前提条件：①三种职能形式必须在空间上同时并存：②三种职能形式必须在时间上继起","tips":"","title":"第四章 · 资本主义的本质及规律","module":"马原"},{"chapter":"第四章","section":"单选","no":16,"stem":"马克思强调：“工人出卖的是劳动力，而不是劳动。劳动力在使用过程中（即劳动）创造的价值，大于劳动力自身的价值，这个差额就是剩余价值，但工资形式使这一剥削关系完全被掩盖了。”资本主义工资之所以掩盖了剥削，是由于它（　　）","opts":{"A":"表现为劳动的价格","B":"是劳动力的价值","C":"是劳动者必要劳动创造的价值","D":"是劳动力的价值或价格的转化形态"},"ans":"A","point":"工资与剩余价值的分配","explain":"在资本主义制度下，工人工资是劳动力的价值或价格，这是资本主义工资的本质。在这种制度下，资本家购买工人的劳动力是以货币工资形式支付的，工人为资本家劳动，资本家付给工人工资，工资表现为“劳动的价格”或工人全部劳动的报酬，这就模糊了工人必要劳动和剩余劳动的界限，掩盖了资本主义的剥削关系。应选A。这里的“转化形式”有两层含义：一是指这是现象形式；二是指这是掩盖了事物本质或者使事物本质歪曲表现的现象形式。B选项指的是资本主义工资的本质。C选项指的是再生产出来的劳动力价值，用于补偿资本家购买劳动力的可变资本的支出。D选项指的是资本主义工资的内涵。B、C、D是干扰项。","notes":"①「A选项」工资以货币形式支付给工人，表面上看起来是工人出卖劳动的报酬，即“劳动的价格”，这就模糊了工人必要劳动和剩余劳动的界限，掩盖了资本主义的剥削关系。但工资的本质是劳动力的价值。劳动力商品的价值构成包括“养家糊口+教育训练”\n②「A选项」在价值增殖过程中，雇佣工人的劳动分为两部分：一部分是必要劳动，用于再生产劳动力的价值；另一部分是剩余劳动，用于无偿地为资本家生产剩余价值。因此，剩余价值是雇佣工人所创造并被资本家无偿占有的超过劳动力价值的那部分价值，它是雇佣工人剩余劳动的凝结，体现了资本家与雇佣工人之间剥削与被剥削的关系","tips":"","title":"第四章 · 资本主义的本质及规律","module":"马原"},{"chapter":"第四章","section":"单选","no":17,"stem":"关于资本主义工资的本质，马克思在《资本论》中尖锐地指出：“工资的形式消灭了工作日分为必要劳动和剩余劳动、有酬劳动和无酬劳动的一切痕迹。全部劳动都表现为有酬劳动。”他进一步分析：“劳动力的价值或价格转化为工资形式，即转化为劳动本身的价值或价格，具有决定性的重要意义。这种表现形式掩盖了现实关系，正好显示出相反的假象。”因此在揭示资本主义工资本质问题上，首先要区分（　　）","opts":{"A":"必要劳动和剩余劳动","B":"劳动和劳动力","C":"有酬劳动和无酬劳动","D":"私人劳动和社会劳动"},"ans":"B","point":"工资与剩余价值的分配","explain":"在揭示资本主义工资本质时，马克思首先强调了“劳动”与“劳动力”的根本区别：“劳动力存在于人的身体中，是人的脑力和体力的总和，而劳动则是劳动力的使用过程。”他明确指出：“劳动不是商品，它在出卖前不能独立存在工人在市场上出卖的不是劳动，而是劳动力。”这一区分是理解工资本质的关键：“如果把劳动说成是商品，就会陷入矛盾一一要么违背价值规律，要么消灭资本主义生产本身。”马克思进一步说明：“只有区分劳动和劳动力，才能看清工资的本质是劳动力的价值或价格，而不是劳动的全部报酬。工资形式掩盖了必要劳动与剩余劳动的界限，使工人的全部劳动看起来都像是有酬劳动。”因此，“在考察工资时，首要的任务就是把劳动和劳动力严格区分开来”。所以，正确选项是B。A选项“必要劳动和剩余劳动”与C选项“有酬劳动和无酬劳动”揭示工人的剩余劳动是剩余价值的源泉，主要是区分工资与剩余价值。D选项分析简单商品经济的基本矛盾，均不符合题意。","notes":"①「B选项」资本主义工资的本质是劳动力的价值或价格，而非劳动本身的报酬。工人出卖的是劳动力（劳动能力），而非劳动过程本身。这一区分是理解工资掩盖剥削的关键\n②「B选项」劳动力是工人的劳动能力，其价值由维持劳动者本人和家属生存所必需的生活资料的价值及劳动者接受教育和训练所支出的费用所决定（即工资）\n③「B选项」劳动是劳动力的使用过程，在生产中创造新价值（包括劳动力价值和剩余价值）\n④「B选项」马克思在《资本论》中明确指出，工资是“劳动力的价值或价格的转化形式”，而非“劳动的价值或价格”","tips":"马克思在《资本论》中强调：“雇佣工人只有为资本家白白地劳动一定的时间，才被允许为维持自己的生活而劳动。”这一“白白劳动”的部分就是剩余劳动，其存在之所以被掩盖，正是因为工资形式混淆了劳动与劳动力。","title":"第四章 · 资本主义的本质及规律","module":"马原"},{"chapter":"第四章","section":"单选","no":18,"stem":"某企业投资汽车生产。生产一辆汽车所耗费的生产资料价值为15万元，支付给工人的工资为5万元，假定市场的平均利润为10%，那么，在自由竞争条件下，该汽车的生产价格是（　　）","opts":{"A":"20.5万元","B":"20万元","C":"21.5万元","D":"22万元"},"ans":"D","point":"工资与剩余价值的分配","explain":"此题考查的知识点是生产价格。从题意得出，不变资本c为15万元，可变资本v为5万元，平均利润率是剩余价值和全部预付资本的比率，因此得出剩余价值m是20×10%=2万元，故生产价格=c+v+m=15+5+2=22，所以答案选D。","notes":"平均利润的形成：为了得到尽可能高的利润率和尽可能多的利润，不同生产部门的资本家之间必然展开激烈的竞争，大量资本必然从利润率低的部门转投到利润率高的部门，从而导致利润率平均化：在利润率平均化的过程中，形成了社会的平均利润率，按照平均利润率计算和获得的利润，叫作平均利润价值规律起作用的形式（可以改变）：1）平均利润出现前，价格围绕商品价值上下波动2）平均利润出现后（价值转化为生产价格），价格围绕生产价格上下波动3）垄断出现后，价格围绕断价格上下波动产成本与平均利润之和平均利润的形成并不会消除超额剩余价值，平均利润的形成是不同部门之间竞争的结果，而超额利润的出现是部门内部竞争的结果","tips":"","title":"第四章 · 资本主义的本质及规律","module":"马原"},{"chapter":"第四章","section":"单选","no":19,"stem":"马克思在《资本论》中指出：“一切真正的危机的最根本的原因，总不外乎群众的贫困和他们的有限的消费，资本主义生产却不顾这种情况而力图发展生产力。”这一论断在当代得到生动印证：苹果公司2024年推出的iPhone16系列销量同比下滑12%，但全球电子垃圾年增5000万吨；特斯拉上海工厂产能利用率降至65%，而全球电动汽车库存积压超200万辆。这种“一边是商品堆积如山，一边是购买力萎缩”的现象，使2024年美国企业破产数量达14年来的峰值。这说明了资本主义经济危机爆发的根本原因在于（　　）","opts":{"A":"生产相对过剩","B":"货币作为支付手段和流通手段","C":"资本主义的基本矛盾","D":"社会总产品两大部类比例失衡"},"ans":"C","point":"资本主义经济危机","explain":"资本主义经济危机爆发的根本原因是资本主义的基本矛盾，这一基本矛盾具体表现为两个方面：第一，生产无限扩大的趋势与劳动人民有支付能力的需求相对缩小的矛盾；第二，单个企业内部生产的有组织性和整个社会生产的无政府状态之间的矛盾。材料中“生产社会化与私有制的冲突”贯穿始终。iPhone产能过剩与购买力萎缩、特斯拉库存积压与工人贫困，均是生产社会化要求按比例分配资源与私有制追求利润最大化的矛盾体现。应选C。A选项不符合题意。生产相对过剩是危机的表现而非根源。材料中电子垃圾激增与消费不足并存，正是基本矛盾导致的结果。B选项不符合题意。货币作为支付手段和流通手段造成了经济危机的抽象的一般的可能性。D选项不符合题意。两大部类失衡是再生产环节的具体矛盾，材料中全球产业链断裂源于资本逐利导致的生产无序化，本质仍是基本矛盾。","notes":"①「A选项」生产过剩是资本主义经济危机的本质特征，但是这种过剩是相对过剩，即相对于劳动人民有支付能力的需求来说社会生产的商品显得过剩，而不是与劳动人民的实际需要相比的绝对过剩爆发的根本原因是资本主义的基本矛盾：这一基本矛盾具体表现在以下两个方面：其一，生产无限扩大的趋势与劳动人民有支付能力的需求相对缩小的矛盾；其二，单个企业内部生产的有组织性和整个社会生产的无政府状态之间的矛盾\n③「B选项」经济危机的抽象的一般的可能性，首先是由货币作为流通手段和支付手段引起（现货交易受阻、流通变慢、债务危机等）。如果有一些商品生产者在出卖了自己的商品后不接着购买他人生产的商品，就会有另一些商品生产者的商品卖不出去。同时，在商品买卖有更多的部分采取购赊销方式的情况下，如果某些债务人在债务到期时不能支付，就会破坏整个信用关系资本主义经济危机具有周期性，这是由资本主义基本矛盾运动的阶段性决定的。只要存在资本主义制度，经济危机就是不可避免的经济危机和金融危机不一样！金融危机指的是流动性危机，局限在资本市场投资机会范围：而经济危机则覆盖整个社会的金融与实体经济范围","tips":"","title":"第四章 · 资本主义的本质及规律","module":"马原"},{"chapter":"第四章","section":"单选","no":20,"stem":"资本主义经济危机每隔若干年就会爆发一次，呈现出周期性。从一次危机开始，到下一次危机爆发的间隔时期，就是一个再生产的周期。每个周期一般包括危机、萧条、复苏、高涨四个阶段。资本主义经济危机具有周期性，这是由（　　）","opts":{"A":"固定资本的大规模更新决定的","B":"社会资本再生产的周期性决定的","C":"资本主义基本矛盾运动的阶段性决定的","D":"两大部类生产在规模上和结构上经常处于失衡状态决定的"},"ans":"C","point":"资本主义经济危机","explain":"资本主义经济危机具有周期性，这是由资本主义基本矛盾运动的阶段性决定的。当资本主义基本矛盾达到尖锐化程度时，社会生产结构严重失调，就会引发经济危机。而经济危机使企业倒闭、生产下降，供求矛盾得到缓解，随着资本主义经济的恢复和高涨，资本主义基本矛盾又重新激化，这必然再一次导致经济危机的爆发。C选项正确。固定资本更新是资本主义经济危机周期性爆发的物质基础。固定资本的大规模更新，为资本主义摆脱经展，使社会经济逐渐走出萧条，走向复苏和高涨；另一方面，又为下一次危机的到来准备了物质基础，因为固定资本更新会导致生产能力的进一步扩张，加剧生产与消费的矛盾，从而引发新的经济危机。A选项不符合题意。资本主义经济危机的周期性爆发的特点，使社会资本再生产也呈现出周期性的特点，一般包括四个阶段：危机、萧条、复苏和高涨。B选项因果倒置。两大部类生产在规模上和结构上经常处于失衡状态，最严重时会导致经济危机爆发。D选项不符合题意。","notes":"①「C选项」资本主义经济危机具有周期性，这是由资本主义基本矛盾运动的阶段性决定的。当资本主义基本矛盾达到尖锐化程度时，社会生产结构严重失调，引发经济危机。而经济危机的爆发，使企业纷纷倒闭、生产大幅下降，从而使供求矛盾得到缓解，逐步渡过经济危机。但是，经济危机只能得到暂时缓解，资本主义基本矛盾无法根除。随着资本主义经济的恢复和高涨，资本主义基本矛盾又重新激化，必然导致再一次经济危机的爆发。只要存在资本主义制度，经济危机就是不可避免的资本主义经济危机周期性爆发的特点，使社会资本再生产也呈现出周期性的特点，从一次危机开始到另一次危机的爆发，就是再生产的一个周期。社会资本再生产的周期一般包括四个阶段，即危机、萧条、复苏和高涨。这四个阶段是相互联系的，其中危机阶段是周期的基本阶段。资本主义的再生产不一定都经过四个阶段，但是危机阶段是必经阶段\n③「D选项」两大部类的定义：社会总产品在物质形态上，根据其最终用途可以划分为用于生产消费的生产资料和用于生活消费的消费资料。相应地，社会生产可以划分为两大部类：第一部类由生产生产资料的部门所构成，其产品进入生产消费领域（例如麻、面粉）；第二部类由生产消费资料的部门所构成，其产品进入生活消费领域（例如衣服、面包）\n④「D选项」社会生产是连续不断地进行的，这种连续不断重复的生产就是再生产。社会再生产的核心问题是社会总产品的实现问题，即社会总产品的价值补偿和实物补偿问题5「D选项」社会总产品在实物上得到替换，在价值上实现补偿，客观上就要求两大部类内部各个产业部门之间和两大部类之间保持一定的比例关系","tips":"","title":"第四章 · 资本主义的本质及规律","module":"马原"},{"chapter":"第四章","section":"多选","no":21,"stem":"劳动生产率指的是劳动者生产使用价值的能力，它的高低可以用单位劳动时间内生产的产品数量来测量，也可以用单位产品中所耗费的劳动时间来测量。影响劳动生产率的因素主要包括（　　）","opts":{"A":"劳动者的平均熟练程度","B":"科学技术的发展程度及其在生产中的应用","C":"生产过程中的分工与协作","D":"生产资料的规模和效能以及自然条件"},"ans":"ABCD","point":"商品价值量的决定","explain":"影响劳动生产率的因素有：第一，劳动者的平均熟练程度；第二，科学技术的发展程度及其在生产中的应用；第三，生产过程的社会结合（即生产过程中的分工与协作）；第四，生产资料的规模和效能以及自然条件。故A、B、C、D选项均正确。","notes":"劳动生产率指的是劳动者生产使用价值的效率，它的高低可以用单位劳动时间内生产的商品数量来测量，也可以用单位商品中所耗费的劳动时间来测量同一商品的使用价值可以用商品数量来衡量（1个面包、2个面包...）影响劳动生产率的主要因素：1）劳动者的平均熟练程度2）科学技术的发展水平及其在生产中的应用程度3）生产过程的社会结合4）生产资料的规模和效能以及自然条件","tips":"生产资料的规模与效能，主要指劳动工具的有效使用程度，对原材料和动力燃料等的利用程度。自然条件也直接影响劳动生产率，特别是农业和采矿业。","title":"第四章 · 资本主义的本质及规律","module":"马原"},{"chapter":"第四章","section":"多选","no":22,"stem":"同一劳动在同一时间内，当部门劳动生产率提高时会使（　　）","opts":{"A":"单位商品的价值量降低","B":"商品的使用价值量增加","C":"单位商品的价值量不变","D":"单位商品的价值量提高"},"ans":"AB","point":"商品价值量的决定","explain":"劳动生产率是指劳动者生产某种产品的效率。它通常用单位劳动时间里生产的产品数量或生产单位产品耗费的劳动时间来表示。在单位时间内生产的产品数量越多，或者生产单位产品所需要的劳动时间越少，表示劳动生产率越高；反之，表示劳动生产率越低。商品中所包含的价值量与生产商品的社会必要劳动量成正比，与生产该商品的劳动生产率成反比。无论劳动生产率怎样变化，同一劳动在同一劳动时间内生产的价值总量是不变的。但是劳动生产率提高，单位时间里生产的商品件数增加，而因为价值总量不变，单个商品中所包含的价值量就会下降。反之，就会上升。故选A、B。C、D两项关于单位商品价值量不变和提高的结论都是错误的。","notes":"决定商品价值量的不是生产商品的个别劳动时间，而是社会必要劳动时间。社会必要劳动时间是在现有的社会正常的生产条件下，在社会平均的劳动熟练程度和劳动强度下制造某种使用价值所需要的劳动时间同一商品的使用价值可以用商品数量来衡量（1个面包、2个面包…...）社会必要劳动时间的本质是同一生产部门内不同生产者之间劳动时间的平均化。部门=社会的某一行业全体","tips":"","title":"第四章 · 资本主义的本质及规律","module":"马原"},{"chapter":"第四章","section":"多选","no":23,"stem":"某消费者的下列经济行为中，属于货币执行支付手段职能的有（　　）","opts":{"A":"购买商品房，合同约定房价30万元","B":"按购房合同约定，第二年付房款10万元","C":"缴纳房屋契税9000元","D":"在装饰材料市场现购材料5万元"},"ans":"BC","point":"货币的本质和职能","explain":"货币具有价值尺度、流通手段、贮藏手段、支付手段和世界货币等职能，其中价值尺度和流通手段是最基本的职能。货币作为支付手段，打破了商品交换中“一手交钱，一手交货”的对等关系，是价值的单方面转移。在除购销、清偿债务、支付租金、税金、工资等活动中，货币在没有同时获得相应商品或服务作为对等交换的情况下，从一方转移到另一方。货币执行支付手段职能时，会产生一系列的债权债务关系。支付手段的运用涉及不同的时间点，交易的发生和货币的支付在时间上是分离的。根据这一特点，B选项“按购房合同约定，第二年付房款10万元”、C选项“缴纳房屋契税9000元”都是货币作为支付手段的体现。A选项表明的是房价，货币执行的是价值尺度的职能。D选项表明现买现卖，货币执行的是流通手段的职能，所以A、D是错误选项","notes":"商品的交换是以货币为媒介的，货币是在长期交换过程中形成的固定充当一般等价物的商品，体现商品生产者之间的社会经济关系货币具有五种基本的职能，即价值尺度、流通手段、贮藏手段、支付手段和世界货币。价值尺度和流通手段是货币的两个最基本的职能货市的五种基本职能价值尺度为商品定价，只需要观念的货币（如柜台里的价签只需写上数字，不用放上等额人民币）流通手段一手交钱、一手交货等现货交易形式，必须是实在的货币贮藏手段退出流通领域，必须是足值的金属货币支付手段赊购赊销，清偿债务，租金缴纳等延期支付形式世界货币前述各种货币职能在世界范围内的应用","tips":"","title":"第四章 · 资本主义的本质及规律","module":"马原"},{"chapter":"第四章","section":"多选","no":24,"stem":"在分析市场机制时，马克思强调：“供求关系的不平衡导致价格偏离价值，而价格波动又反过来调节供求，促使资源向利润率高的部门流动。这种由竞争引发的价格波动，正是价值规律得以贯彻的唯一形式。”这说明价值规律作用的实现有赖于（　　）","opts":{"A":"市场竞争","B":"资源有效配置","C":"价格波动","D":"供求关系的变化"},"ans":"ACD","point":"价值规律及其作用","explain":"马克思强调：“供求关系的不平衡导致价格偏离价值，而价格波动又反过来调节供求，促使资源向利润率高的部门流动。这种由竞争引发的价格波动，正是价值规律得以贯彻的唯一形式。”这解释了价值规律作用的实现有赖于供求关系的变化、市场竞争、价格波动。B选项干扰性极强。自发地调节生产资料和劳动力在社会各生产部门之间的分配比例，在社会有效配置资源只是价值规律作用的具体表现，不是价值规律作用的实现途径；并且价值规律自发调节社会资源在社会生产各个部门的配置时，也可能出现比例失调的情况。所以，B选项不符合题意。","notes":"「A、C、D选项」价值规律实现的三个核心要素：市场竞争、价格波动和供求关系变化2「A、C、D选项」供求变化打破均衡→价格波动反映并调节供求→竞争推动资本流动→资源向高利润率部门集中→社会劳动按比例分配。这一链条表明，价值规律的实现必须依赖供求变化、价格波动和市场竞争的共同作用价值规律贯穿于商品经济的全部过程，它既支配商品生产，又支配商品流通。价值规律是在市场配置资源的过程中体现它的客观要求和作用的（供需关系），价值规律在市场配置资源过程中的作用表现在：第一，自发地调节生产资料和劳动力在社会各生产部门之间的分配比例；第二，自发地刺激社会生产力的发展；第三，地调节社会收入的分配价值规律的表现形式是，商品的价格围绕商品的价值自发波动价值规律的基本内容是：商品的价值量由生产商品的社会必要劳动时间决定，商品交换以价值量为基础，按照等价交换的原则进行","tips":"很多同学对于B选项拿不稳，资源有效配置是价值规律作用的结果，而非实现条件。题干强调“价值规律得以贯彻的形式”，即价格波动如何通过供求和竞争实现资源配置，但B选项本身并非价值规律实现的依赖因素，而是其作用效果。","title":"第四章 · 资本主义的本质及规律","module":"马原"},{"chapter":"第四章","section":"多选","no":25,"stem":"马克思在谈到价值规律的表现形式时说：“价格和价值量之间的量的不一致的可能性，或者价格偏离价值量的可能性，已经包含在价格形式本身中。但这并不是这种形式的缺点，相反地，却使这种形式成为这样一种生产方式的适当形式，在这种生产方式下，规则只能作为没有规则性的盲目起作用的平均数规律来为自己开辟道路。”这表明价值规律发挥作用的表现形式有（　　）","opts":{"A":"价格围绕价值上下波动","B":"价格围绕交换价值上下波动","C":"价格围绕成本价格上下波动","D":"市场价格围绕生产价格上下波动"},"ans":"AD","point":"价值规律及其作用","explain":"价值规律在不同时期有不同的表现形式。在简单商品经济条件下和资本主义发展初期，价值是商品交换的基础，价值规律的表现形式是价格随着供求关系的变化而围绕价值上下波动。在价值转化为生产价格以后，生产价格成为商品交换的基础，这改变了价值规律作用的表现形式，即价格随着供求关系的变化而围绕生产价格上下波动。A、D选项正确。交换价值是价值的表现形式，成本价格是指生产商品所耗费的不变资本（c）和可变资本（v）的总和，也被称为生产成本。它是资本家经营企业盈亏的平衡点。B、C是干扰项，","notes":"1「A、D选项」价值规律起作用的形式（可以改变）：1）平均利润出现前，价格围绕商品价值上下波动2）平均利润出现后（价值转化为生产价格），价格围绕生产价格上下波动3）垄断出现后，价格围绕垄断价格上下波动\n②「B选项」价值是交换价值的基础，交换价值是价值的表现形式（如商品与商品的交换比例），其本身由价值决定，价格波动的基础是价值而非交换价值。使用价值是价值或交换价值的物质承担者\n③「C选项」成本价格（c+v）仅是生产价格的组成部分，无法独立成为价格波动的中心。在资本主义生产中，价格需覆盖成本并实现平均利润，故波动围绕生产价格展开产成本与平均利润之和","tips":"","title":"第四章 · 资本主义的本质及规律","module":"马原"},{"chapter":"第四章","section":"多选","no":26,"stem":"在分析资本主义生产时，马克思强调：“只有通过劳动价值论，才能揭示劳动力商品的特教条，而是随着时代发展的科学理论。例如，在机器大工业时代，复杂劳动、科技劳动对价值创造的作用需要重新认识，但这并未推翻‘劳动是价值唯一源泉”的本质规定。”马克思的劳动价值论（　　）","opts":{"A":"是对古典政治经济学劳动价值论的批判、继承和发展","B":"是剩余价值理论的基础","C":"是研究价值分配的理论","D":"为揭示资本主义生产方式的本质奠定了理论基础"},"ans":"ABD","point":"在当代条件下深化对马克思劳动价值论的认识","explain":"马克思的劳动价值理论，就其理论来源角度分析，是对古典政治经济学劳动价值理论的批判、继承和发展；就其在马克思主义政治经济学理论体系中的地位和作用来说，劳动价值理论是剩余价值理论的基础。剩余价值理论揭示了资本主义生产方式的本质是剩余价值生产，但只有运用劳动二重性原理，才能科学地揭示剩余价值的本质及其真正来源。马克思主义理论不是僵死的教条，而是活的行动指南，是随着时代和实践的发展而不断发展的科学理论。所以，正确选项是A、B、D。马克思的劳动价值理论就其科学内涵来说，是研究价值创造而不是研究价值分配的理论。C是干扰项。","notes":"在马克思之前，英国古典政治经济学的代表人物亚当·斯密已经认识到商品的二因素，提出了劳动创造价值的观点。马克思在继承英国古典政治经济学劳动创造价值理论的同时，创立了劳动二重性理论，第一次确定了什么样的劳动形成价值，为什么形成价值以及怎样形成价值，阐明了具体劳动和抽象劳动在商品价值形成中的不同作用，从而为揭示剩余价值的真正来源，创立剩余价值理论奠定了基础2②「C选项」劳动价值论的核心是价值创造，而非分配。价值分配（如工资、利润、地租的分配）由生产关系决定马克思创立了劳动二重性理论，劳动二重性理论是“理解政治经济学的枢纽”剩余价值理论是马克思经济学说的核心内容和基石，是无产阶级反对资产阶级、揭示资本主义制度剥削本质的锐利武器。由于唯物史观和剩余价值理论的发现（即两大发现），社会主义由空想变为科学商品是劳动产品，生产商品的劳动具有二重性，即具体劳动和抽象劳动。具体劳动指生产一定使用价值的具体形式的劳动。抽象劳动指撇开一切具体形式的、无差别的一般人类劳动，即人的脑力和体力的耗费。生产商品的具体劳动创造商品的使用价值，抽象劳动形成商品的价值或价值实体（价值的定义）具体劳动和抽象劳动是同一劳动的两种规定（不同角度去看）。任何一种生产商品的劳动，一方面是特殊的具体劳动，另一方面又是一般的抽象劳动，这就是劳动的二重性。正是劳动的二重性决定了商品的二因素","tips":"","title":"第四章 · 资本主义的本质及规律","module":"马原"},{"chapter":"第四章","section":"多选","no":27,"stem":"马克思指出，所谓资本原始积累只不过是生产者和生产资料分离的历史过程。这个过程之所以表现为“原始的”，因为它是形成资本及与之相适应的生产方式的前史。资本原始积累的主要途径有（　　）","opts":{"A":"用暴力手段剥夺农民土地","B":"用剥削手段榨取剩余价值","C":"用野蛮手段进行殖民掠夺","D":"用资本手段获取市场暴利"},"ans":"AC","point":"资本的原始积累","explain":"所谓资本原始积累，就是生产者与生产资料相分离，货币资本迅速集中于少数人手中的历史过程。资本原始积累主要通过两个途径进行：一是用暴力手段剥夺农民的土地；二是用暴力手段掠夺货币财富。因此，本题的正确答案是A、C选项。用剥削手段榨取剩余价值，用资本手段获取市场暴利，这是资本积累规模不断扩大的手段，不是资本原始积累的途径。B、D是干扰项，","notes":"所谓资本原始积累，就是以暴力手段使生产者与生产资料相分离，货币资本迅速集中于少数人手中的历史过程\n②「A、C选项」资本原始积累的途径：一是用暴力手段剥夺农民的土地（这是资本原始积累过程的基础）；二是用暴力手段掠夺货币财富。利用国家政权的力量进行残酷的殖民掠夺是资本原始积累的又一个重要方式（“抢地抢钱抢人”）","tips":"","title":"第四章 · 资本主义的本质及规律","module":"马原"},{"chapter":"第四章","section":"多选","no":28,"stem":"劳动力是任何社会生产的基本要素，在特定的社会发展阶段和特定的历史条件下，劳动力作为一种特殊商品，其价值的构成包括（　　）","opts":{"A":"维持劳动者自身生存所必需的生活资料的价值","B":"劳动者在劳动时间内创造的价值","C":"劳动者繁育后代所必需的生活资料的价值","D":"培养和训练劳动者所需要的费用"},"ans":"ACD","point":"劳动力成为商品的基本条件","explain":"劳动力是特殊商品，它的使用价值和价值具有不同于普通商品的特点。劳动力商品的价值是由生产它所需要的社会必要劳动时间决定的。但由于劳动力存在于活的人体中，劳动力的生产和再生产，就是维持人的生存的生活过程，是要消耗必要的生活资料才能实现的。所以，劳动力价值可以还原为劳动者维持自己及其家属生存所必需的生活资料的价值，它包括三个部分。本题备选项中的A、C、D三项，正是劳动力价值构成的三个部分。劳动力商品的使用价值就是劳动。劳动力在使用过程中，不仅能创造价值，而且能创造出比自身价值更大的价值。这部分超过劳动力价值的价值就是剩余价值。因此，雇佣工人的劳动分为两部分：一部分是必要劳动，用于再生产劳动力的价值；另一部分是剩余劳动，用于无偿地为资本家生产剩余价值。本题直接考查的是劳动力的价值构成，但它延伸到劳动力的使用价值即劳动，而雇佣工人的劳动又分为必要劳动和剩余劳动，前者创造出劳动力自身的价值，后者创造出剩余价值，劳动者的劳动是两者的共同源泉。","notes":"「A、C、D选项」劳动力价值本质就是工资，其构成包含历史和道德的因素；劳动力商品的价值构成包括：养家糊口十教育训练（维持劳动者本人和家属生存所必需的生活资料的价值及劳动者接受教育和训练所支出的费用）由于劳动力价值的构成包含历史和道德的因素，在不同的国家或在同一国家的不同历史时期，劳动者所必需的生活资料的数量和构成是有区别的，所以劳动力价值的最低界限是由生活上不可缺少的生活资料的价值决定的。一旦劳动力价值降低到这个界限以下，劳动力就只能在萎缩的状态下维持劳动力商品在使用价值上有一个很突出的特点，就是它的使用价值是价值的源泉（劳动是价值的唯一源泉），在消费过程中能够创造新的价值，而且这个新的价值比劳动力本身的价值更大一旦货币购买的劳动力带来剩余价值，货币也就变成了资本（资本是能够带来剩余价值的价值）。在资本主义条件下，资本家购买的是雇佣工人的劳动力而不是劳动。劳动是劳动力商品的使用价值，它本身并不是商品","tips":"","title":"第四章 · 资本主义的本质及规律","module":"马原"},{"chapter":"第四章","section":"多选","no":29,"stem":"马克思在《资本论》第二卷中系统阐述资本的本质时指出：“资本在生产过程中分为两个部分，一部分是变为生产资料的那部分资本，在生产过程中并不改变自己的价值量，我把它称为不变资本；另一部分是变为劳动力的那部分资本，在生产过程中改变自己的价值量，它再生产自身的等价物和一个超过这个等价物而形成的余额，良即剩余价值，我把它称为可变资本。”马克思把资本划分为不变资本和可变资本，其意义在于（　　）","opts":{"A":"揭示了剩余价值的真正来源","B":"为计算剩余价值率提供了科学依据","C":"为计算资本周转速度提供了依据","D":"为资本有机构成奠定了基础"},"ans":"ABD","point":"资本的不同部分在剩余价值生产中的作用","explain":"资本在生产过程中以两种形式存在，即生产资料和劳动力。马克思根据这两部分资本在剩余价值生产及价值增殖过程中作用的不同，把它们分为不变资本和可变资本。不变资本是指以生产资料形式存在的资本，在生产过程中只是转移自己的价值，并不发生价值量的变化；可变资本指在生产过程中以劳动力形式存在的资本，这个资本在生产过程中会通过工人的劳动产生量的变化，这个价值增殖的部分就是剩余价值。把资本区分为不变资本和可变资本的意义：进一步揭露了剩余价值的源泉和资本主义剥削的实质；为准确计算资本家对工人的剥削程度提供了科学依据；为理解资本有机构成、平均利润等理论奠定了基础应选A、B、D。研究预付资本的周转速度要看固定资本和流动资本的划分，与不变资本和可变资本的区分无关。C选项是干扰项。","notes":"资本循环是资本从一种形式出发，经过一系列形式的变化，又回到原来出发点的运动。产业资本在循环过程中要经历三个不同的阶段，与此相联系的是资本依次执行三种不同的职能产业资本依据它在资本循环过程中的不同阶段所担负的职能的不同，划分为货币资本、生产资本和商品资本\n③「A选项」根据资本在剩余价值生产中所起的不同作用，可以将资本划分为不变资本与可变资本根据资本周转方式或价值转移方式的不同，可以将资本划分为固定资本和流动资本。固定资本：不变资本中的劳动资料（厂房、机器等）（多次生产过程中逐渐转移）；流动资本：可变资本+不变资本中的原材料、燃料等（一次生产过程中全部转移）本的固定资本和流动资本的构成（固定资本占的比重大，整个资本周转速度就慢：相反，流动资本占的比重大，整个资本周转速度就快）","tips":"","title":"第四章 · 资本主义的本质及规律","module":"马原"},{"chapter":"第四章","section":"多选","no":30,"stem":"恩格斯指出：“马克思一有机会就提醒读者注意，决不要把他所说的剩余价值同利润或资本赢利相混淆。”对这段话的正确理解应是（　　）","opts":{"A":"利润往往是剩余价值的一部分","B":"剩余价值是利润的本质内容","C":"剩余价值是资本的赢利","D":"利润是剩余价值的一种具体形式"},"ans":"ABD","point":"工资与剩余价值的分配","explain":"剩余价值的本质是由雇佣工人创造的，它直接体现着资本家对雇佣工人的剥削关系，剩余价值是利润的本质；利润是针对全部预付资本而言的，它是剩余价值的转化形式，这是质的方面。在量的方面，剩余价值经过分配，不但采取了利润形式（包括产业利润、商业利润和银行利润）还采取了利息和地租等转化形式，因此，利润常常只是剩余价值的一部分。所以，正确答案是选项A、B、D。本题最具难度的选项是A，相当多的考生认为既然利润是剩余价值的转化形式，它们在量上就应完全一致，因而不选A。发生这一错误的原因是仅仅从质的方面理解和掌握剩余价值与利润的关系，而没有从量的方面理解和把握它们之间的关系。利润是资本的赢利，C选项表述错误。","notes":"1「B选项」剩余价值是利润的本质，利润是针对全部预付资本而言的，利润是剩余价值的转化形式\n②「A、D选项」剩余价值总量等于利润总量剩余价值在分配过程中可能被分割为不同的形式，如产业利润、商业利润、利息、地租等，但这些形式的总和仍然等于剩余价值总量。每一部分仍属于剩余价值的范畴","tips":"C选项这种理解会掩盖资本主义剥削的本质，使人们误以为利润是资本自身创造的，而非对工人劳动的无偿占有，这正是马克思批判的“资本拜物教”的典型表现。","title":"第四章 · 资本主义的本质及规律","module":"马原"},{"chapter":"第四章","section":"多选","no":31,"stem":"在资本主义发展过程中，资本有机构成的不断提高，会不可避免地造成大批工人失业，形成相对过剩人口。相对过剩人口是（　　）","opts":{"A":"资本积累的必然产物","B":"资本有机构成提高的前提条件","C":"资本有机构成提高的直接结果","D":"相对于资本需求而过剩的人口"},"ans":"ACD","point":"资本积累","explain":"在资本主义生产过程中，资本有机构成呈现不断提高的趋势，这是由资本无限追逐剩余价值的本性决定的。资本有机构成提高，可变资本相对量减少，资本对劳动力的需求日益相对地减少，结果就不可避免地造成大批工人失业，形成相对过剩人口。相对过剩人口是劳动力供给超过了资本对它的需求形成的过剩人口。故A、C、D选项正确。B选项表述错误。该选项颠倒了两者的关系，资本有机构成提高是形成相对过剩人口的前提条件，相对过剩人口是资本有机构成提高的直接结果。","notes":"口，就是劳动力供给超过了资本的需要。这种过剩人口之所以是相对的，是因为他们并不是社会生产发展所绝对不需要的，而是由于不为资本价值增殖所需要，才成为“过剩”或“多余”的在资本主义发展过程中，相对过剩人口基本上有三种形式：第一种是流动的过剩人口，第二种是潜在的过剩人口，第三种是停滞的过剩人口经常性的庞大失业人口的存在，是资本主义的瘤疾。资产阶级政府通过各种干预措施能在一定程度上缓解失业，但不可能彻底消灭失业，而失业规模也不会一真扩大下去随着资本积累的扩张，资本对劳动力的需求相对减少","tips":"B选项属于因果关系颠倒，这也是干扰项惯用套路之一","title":"第四章 · 资本主义的本质及规律","module":"马原"},{"chapter":"第四章","section":"多选","no":32,"stem":"马克思在《资本论》第一卷论述道：“在一极是财富的积累，同时在另一极，即在把自己的产品作为资本来生产的阶级方面，是贫困、劳动折磨、受奴役、无知、粗野和道德堕落的积累。”马克思关于资本积累的理论（　　）","opts":{"A":"是剩余价值学说的重要组成部分","B":"揭露了资本主义制度下贫富两极分化的原因","C":"揭示了资本主义失业现象的本质","D":"深刻地阐明了资本主义制度必然走向灭亡的历史命运"},"ans":"ABCD","point":"资本积累","explain":"把剩余价值转化为资本，或者说，剩余价值的资本化，就是资本积累。资本积累的本质，就是资本家不断地利用无偿占有的工人创造的剩余价值来扩大自己的资本规模，从而进一步扩大和加强对工人的剥削和统治。随着资本积累和生产规模的扩大，社会财富日益集中到资产阶级手中，而社会财富的直接创造者即无产阶级则只占有少部分社会财富。这样必然加剧社会的两极分化，正如题干材料所述，即一极是财富越来越集中于少数人手中，另一极是多数人只拥有社会财富的较小部分。资本积累不但是社会财富占有两极分化的重要原因，而且是资本主义社会失业现象产生的根源。随着资本积累而产生的失业是由资本追逐剩余价值引起资本有机构成的提高所导致的。马克思关于资本积累的理论是剩余价值学说的重要组成部分，它揭露了资本主义制度下贫富两极分化的原因，揭示了资本主义失业现象的本质，深刻地阐明了资本主义制度必然走向灭亡的历史命运。A、B、C、D选项均正确。","notes":"把剩余价值转化为资本，或者说剩余价值的资本化，就是资本积累资本积累的源泉是剩余价值，资本积累规模的大小取决于资本家对工人的剥削程度、劳动生产率的高低、所用资本和所费资本之间的差额以及资本家预付资本的大小\n③「B、C选项」随着资本积累和生产规模的扩大，社会财富日益集中到资产阶级手中，而社会财富的直接创造者即无产阶级则只占有少部分社会财富。这样必然加剧社会的两极分化。而且是资本主义社会失业现象产生的根源资本积累是资本主义扩大再生产的源泉「D选项」资本积累的历史趋势是资本主义制度的必然灭亡和社会主义制度的必然胜利。随着资本积累的不断增长，资本主义基本矛盾日益加剧，资本主义最终会被新的更能适应社会化大生产要求的社会形态所取代","tips":"","title":"第四章 · 资本主义的本质及规律","module":"马原"},{"chapter":"第四章","section":"多选","no":33,"stem":"马克思指出：“连续性是资本主义生产的特征。”要保证资本主义生产的连续性，需要具备的条件是（　　）","opts":{"A":"三种资本职能形式在时间上继起","B":"三种资本职能形式在空间上同时并存","C":"商品资本循环顺利进行","D":"生产资本循环顺利进行"},"ans":"AB","point":"资本的循环周转与再生产","explain":"产业资本的运动必须具备两个基本前提条件，这就是：第一，产业资本的三种职能形式必须在空间上同时并存，也就是说，产业资本必须按照一定比例同时并存于货币资本、生产资本和商品资本三种形式中。第二，产业资本的三种职能形式必须在时间上继起，也就是说，产业资本循环的三种职能必须保持时间上的依次连续性。产业资本的连续循环是流通过程和生产过程的统一，也是它的所有三种循环形式的统一故A、B选项正确C、D选项都只讲了一种资本职能形式的循环，过于片面。","notes":"","tips":"","title":"第四章 · 资本主义的本质及规律","module":"马原"},{"chapter":"第四章","section":"多选","no":34,"stem":"某电商平台通过智能算法预测消费需求，将服装类商品的库存周转天数从行业平均90天压缩至30天，平台商家的年剩余价值率普遍提升30%一50%。这种“数据驱动的资本循环”模式，本质上是通过缩短生产时间与流通时间的间隔，实现预付资本的高效利用。这启示我们提高资本周转速度给资本所有者带来的好处有（　　）","opts":{"A":"提高剩余价值率","B":"增加年剩余价值量","C":"节省预付资本","D":"提高资本有机构成"},"ans":"BC","point":"资本的循环周转与再生产","explain":"资本是在运动中增殖的，资本周而复始、不断反复的循环，就叫资本的周转。如果每次资本周转带来的剩余价值一定，则资本周转越快，在一定时期内带来的剩余价值就越多。计算资本周转快慢一般以年为单位，每年资本周转次数越多，就意味着资本周转速度越快，一年中同样的资本投入产生的剩余价值量就越多，年剩余价值率就越高，或者维持同样大的规模，就可以用较少的资本投入，节省预付资本。题目中“将服装类商品的库存周转天数从行业平均90天压缩至30天，平台商家的年剩余价值率普遍提升30%一50%”说明加速资本周转可以提高年剩余价值率，增加年剩余价值量。“这种‘数据驱动的资本循环，模式，本质上是通过缩短生产时间与流通时间的间隔，实现预付资本的高效利用”说明加速资本周转可以节省预付资本。应选B、C。提高剩余价值率是针对一次资本循环而言的，资本周转速度对资本有机构成无直接必然影响，所以A、D选项错误。","notes":"剩余价值率是剩余价值与可变资本的比率，反映的是资本家对工人的剥削程度（单次周转）2「B选项」年剩余价值率是年剩余价值量与预付可变资本之比\n③「C选项」资本周转速度加快后，维持相同生产规模所需的预付资本减少（如库存积压减少）4「D选项」资本的技术构成决定资本的价值构成，技术构成的变化往往会引起价值构成的相应变化，而价值构成的变化通常反映技术构成的变化。这种由资本的技术构成决定并反映技术构成变化的资本价值构成，叫作资本的有机构成5「D选项」资本有机构成（c：v）反映不变资本与可变资本的比例，其变化主要由技术进步（如机器替代劳动力）驱动，而非资本周转速度","tips":"注意区分剩余价值率和年剩余价值率。","title":"第四章 · 资本主义的本质及规律","module":"马原"},{"chapter":"第四章","section":"多选","no":35,"stem":"2025年4月，美国政府逆世界潮流而动，对包括我国在内的几乎所有贸易伙伴出台所谓的“对等关税”，使原有成熟的全球供应链产业链被人为切断，以市场为导向的自由贸易规则被打破，各国经济发展受到严重干扰，我国第一时间采取了坚决有力的反制措施，结果使特斯拉零件断供、波音痛失中国订单、连美国儿童的圣诞玩具都因中国供应链中断告急，这主要是由于这些企业无法实现其生产过程中的（　　）","opts":{"A":"实物补偿","B":"价值补偿","C":"劳动补偿","D":"增殖补偿"},"ans":"AB","point":"资本的循环周转与再生产","explain":"社会再生产的核心问题是社会总产品的实现问题，即社会总产品的价值补偿和实物补偿问题。社会再生产顺利进行，要求生产中所耗费的资本在价值上得到补偿，同时要求两大部类内部各个产业部门之间和两大部类之间保持一定的比例关系。只有两大部类的生产不仅在规模上，而且在结构上保持一定比例，社会总产品的价值补偿和实物替换才能正常实现，社会再生产才能顺利进行。特斯拉“零件断供”、玩具企业“中国供应链中断”，直接表现为生产资料（零部件、原材料）无法通过市场交换获得，导致生产过程无法继续。这是实物形态的补偿失败，属于马克思所说的“两大部类之间的实物替换无法实现”。波音“痛失中国订单”，意味着其生产的飞机作为商品无法在市场上出售，凝结在商品中的价值（包括成本和利润）无法转化为货币。这是价值形态的补偿失败，即马克思强调的“商品资本无法转化为货币资本，价值实现链条断裂”。应选A、B。C选项劳动补偿是指劳动者通过工资购买生活资料，实现劳动力的再生产。材料中未涉及工人工资下降或生活资料短缺，与题干无关。D选项增殖补偿是指剩余价值的实现（即利润获得）。但“增殖补偿”的前提是“价值补偿”（商品先卖出才能谈利润），题干中企业面临的首要问题是价值无法实现（卖不掉或没原料生产），而非剩余价值分配问题。C、D为干扰项","notes":"①「A、B选项」社会生产是连续不断地进行的，这种连续不断重复的生产就是再生产。社会再生产的核心问题是社会总产品的实现问题，即社会总产品的价值补偿和实物补偿问题\n②「A、B选项」社会再生产的顺利进行，要求生产中所耗费的资本在价值上得到补偿，同时还要求实际生产过程中所耗费的生产资料和消费资料得到实物的替换（价值补偿+实物替换）","tips":"","title":"第四章 · 资本主义的本质及规律","module":"马原"},{"chapter":"第四章","section":"多选","no":36,"stem":"马克思在《资本论》第三卷分析资本主义竞争时指出：“不同生产部门由于资本有机构成和周转速度不同，会形成不同的利润率。但资本的本性是逐利的，这促使资本从利润率低的部门向利润率高的部门转移。”这种资本转移引发一系列连锁反应：“需求和供给会发生变动，最终导致不同部门的利润率平均化为一般利润率（平均利润率），而商品价值也随之转化为生产价格一一即成本价格加上按平均利润率计算的平均利润。”这表明利润转化为平均利润的过程，同时也是（　　）","opts":{"A":"资本有机构成提高的过程","B":"超额利润消失的过程","C":"资本在不同部门之间发生转移的过程","D":"资本家集团重新瓜分剩余价值的过程"},"ans":"CD","point":"利润和平均利润","explain":"随着资本主义经济的发展，资本家为了争夺更有利的投资场所，必然展开以资本转移为特征的不同生产部门之间的竞争。这种资本的自由转移，一直要持续到不同生产部门的利润率大致趋于平衡。这样，就在整个社会范围内形成了平均利润率。随着利润转化为平均利润，商品的价值也就转化为生产价格。平均利润和生产价格出现以后，等量资本带来等量利润，工人不只受直接雇佣他们的资本家的剥削，还受整个资产阶级的剥削，这也就是资本家集团重新瓜分剩余价值的过程。C、D是正确选项。为了追求超额利润，资本主义的个别企业会率先采用先进技术，提高劳动效率，使产品的个别劳动时间低于社会必要劳动时间，从而使商品的个别生产价格低于社会生产价格，但仍按社会生产价格出售，便能够获得超额利润。平均利润出现以后，竞争仍然存在，在竞争的外在压力和追求利润最大化的内在动力推动下，个别企业仍然会努力改进技术提高劳动生产率追求超额利润。因此，利润经过各部门利润平均化转化为平均利润的过程并非单个部门提高有机构成的过程，超额利润也不会消失。A、B是干扰项。","notes":"①「B选项」平均利润的形成并不会消除超额剩余价值，平均利润的形成是不同部门之间竞争的结果，而超额利润的出现是部门内部竞争的结果\n②「A选项」资本有机构成提高是技术进步和资本积累的结果，属于长期趋势，而非利润平均化的直接表现。题干强调资本转移导致利润平均化，不涉及技术层面变化，不是有机构成的变化3「B选项」超额剩余价值是指企业由于提高劳动生产率而使商品的个别价值低于社会价值的差额。在资本主义商品生产条件下，每个资本家总是力图不断改进技术，改善经营管理，提高劳动生产率，使其生产的商品的个别劳动时间少于社会必要劳动时间，个别价值低于社会价值，从而获得超额剩余价值","tips":"","title":"第四章 · 资本主义的本质及规律","module":"马原"},{"chapter":"第四章","section":"多选","no":37,"stem":"马克思说：“一切现实的危机的最终原因始终是：群众贫穷和群众的消费受到限制，而与此相对立，资本主义生产却竭力发展生产力，好像只有社会的绝对的消费能力才是生产力发展的界限。”这段论述表明（　　）","opts":{"A":"经济危机的发生与群众的贫穷及其消费能力受到限制有关","B":"经济危机的发生根本上在于资本主义的基本矛盾","C":"资本积累与无限扩大生产也是经济危机发生的原因","D":"社会的绝对的消费能力导致了经济危机的发生"},"ans":"ABC","point":"资本主义经济危机","explain":"生产相对过剩是资本主义经济危机的本质特征。相对过剩是指相对于劳动人民有支付能力的需求来说社会生产的商品显得过剩，而不是与劳动人民的实际需要相比的绝对过剩。资本主义经济危机爆发的根本原因是资本主义的基本矛盾，这种基本矛盾具体表现为两个方面：第一，生产无限扩大的趋势与劳动人民有支付能力的需求相对缩小的矛盾；第二，个别企业内部生产的有组织性和整个社会生产的无政府状态之间的矛盾。A选项“经济危机的发生与群众的贫穷及其消费能力受到限制有关”是正确的。经济危机的产生是资本家组织生产的产品相对于劳动人民有支付能力的需求而言过剩，也就是群众贫穷和群众的消费受到限制。C选项由于资本家为追求剩余价值不断扩大资本积累，使社会生产无限扩大，而有支付能力的需求相对狭小，也必然导致产品相对过剩的经济危机。A选项与C选项合起来说的就是B选项，阐述了经济危机的根本原因就是资本主义的基本矛盾。D选项“社会的绝对的消费能力导致了经济危机的发生”显然不对，错在不是绝对的消费能力（也就是无限的消费能力），而是劳动人民相对的消费能力降低导致了经济危机。","notes":"①「A选项」生产过剩是资本主义经济危机的本质特征，但是这种过剩是相对过剩，即相对于劳动人民有支付能力的需求来说社会生产的商品显得过剩，而不是与劳动人民的实际需要相比的绝对过剩\n②「B、C、D选项」生产资料资本主义私人占有和生产社会化之间的矛盾，是资本主义的基本矛盾。经济危机爆发的根本原因是资本主义的基本矛盾；这一基本矛盾具体表现在以下两个方面：其一，生产无限扩大的趋势与劳动人民有支付能力的需求相对缩小的矛盾；其二，单个企业内部生产的有组织性和整个社会生产的无政府状态之间的矛盾在资本主义发展相当长的时期内，由生产资料的私有制和雇佣劳动制度所决定，两大部类的生产都是在价值规律和剩余价值规律的作用下自发进行的，具有严重的盲目性，这就导致了两大部类生产在规模上和结构上经常处于失衡状态。这种失衡和脱节经常表现为生产过剩，以至于社会总产品的实现即实物替换和价值补偿难以顺利进行，最严重的就是引发经济危机经济危机实际上是资本主义条件下以强制的方式解决社会再生产的实现问题的途径，这种解决方式虽然最终也能够使社会再生产由失衡慢慢转变为平衡，却是以社会经济生活的严重混乱甚至瘫痪，以及社会资源和财富的极大浪费为代价的","tips":"","title":"第四章 · 资本主义的本质及规律","module":"马原"},{"chapter":"第四章","section":"多选","no":38,"stem":"伴随利润转化为平均利润，价值也就转化为生产价格。商品不再以价值而是以生产价格为基础进行交换，市场价格的变动不再以价值为中心，而是以生产价格为中心。商品按照生产价格而不是价值出售并不违背价值规律，而只是价值规律的实现形式发生了变化。这是因为（　　）","opts":{"A":"从个别部门来看，资本家获得的平均利润与本部门工人创造的剩余价值仍然一致","B":"从全社会来看，整个资本家阶级获得的利润总额与雇佣工人所创造的剩余价值总额是相等的","C":"从个别部门看，商品的生产价格同价值仍然一致","D":"从全社会来看，商品的生产价格总额和价值总额是相等的"},"ans":"BD","point":"工资与剩余价值的分配","explain":"生产价格是价值的转化形式，商品按照生产价格而不是价值出售并不违背价值规律，而是价值规律的实现形式发生了变化。虽然从个别部门来看，资本家获得的平均利润与本部门工人创造的剩余价值可能不一致，但从全社会来看，整个资本家阶级获得的利润总额与雇佣工人所创造的剩余价值总额是相等的；虽然从个别部门看，商品的生产价格同价值可能不一致，但从全社会来看，商品的生产价格总额和价值总额是相等的。生产价格随着商品价值的变化而变动，生产商品的社会必要劳动时间减少，生产价格就会降低；反之，生产价格就会提高。","notes":"①「B、D选项」生产价格是价值的转化形式，商品按照生产价格而不是价值出售并不违背价值规律，而是价值规律的实现形式发生了变化。虽然从个别部门来看，资本家获得的平均利润与本部门工人创造的剩余价值可能不一致，但从全社会来看，整个资本家阶级获得的利润总额与雇佣工人所创造的剩余价值总额是相等的；虽然从个别部门看，商品的生产价格同价值可能不一致，但从全社会来看，商品的生产价格总额和价值总额是相等的。生产价格随着商品价值的变化而变动，生产商品的社会必要劳动时间减少，生产价格就会降低；反之，生产价格就会提高（价值守恒）\n②「B、D选项」平均利润的形成是剩余价值在各部门资本家之间的重新分配，但剩余价值的总量并未改变，全社会所有部门的平均利润总和仍等于工人创造的剩余价值总额。这体现了剩余价值本质上是工人劳动的产物，未被创造或消灭，仅被重新分配","tips":"","title":"第四章 · 资本主义的本质及规律","module":"马原"},{"chapter":"第四章","section":"多选","no":39,"stem":"马克思通过分析剩余价值的生产、积累、流通以及分配过程，揭示了剩余价值的运动规律及作用，创立了剩余价值理论。正是由于唯物史观和剩余价值的发现，社会主义由空想变为科学。剩余价值理论是（　　）","opts":{"A":"马克思经济学说的核心内容和基石","B":"理解马克思主义政治经济学的枢纽","C":"为马克思的劳动价值论的创立奠定了基础","D":"无产阶级反对资产阶级、揭示资本主义制度剥削本质的锐利武器"},"ans":"AD","point":"剩余价值理论的意义","explain":"剩余价值理论深刻揭露了资本主义生产关系的剥削本质，阐明了资产阶级与无产阶级之间阶级斗争的经济根源，指出了无产阶级革命的历史必然性。剩余价值理论是马克思经济学说的核心内容和基石，是无产阶级反对资产阶级、揭示资本主义制度剥削本质的锐利武器。A、D选项是正确答案。马克思劳动价值论扬弃了英国古典政治经济学的观点，为剩余价值理论的创立奠定了基础。劳动二重性理论是“理解政治经济学的枢纽”。B、C选项都犯了张冠李戴的错误。","notes":"1「B、C选项」马克思劳动价值论扬弃了英国古典政治经济学的观点，为剩余价值理论的创立奠定了基础。劳动价值论（商品二因素、劳动二重性）是剩余价值理论的前提。劳动二重性理论是“理解政治经济学的枢纽”\n②「A、D选项剩余价值理论是马克思经济学说的核心内容和基石，是无产阶级反对资产阶级、揭示资本主义制度剥削本质的锐利武器。由于唯物史观和剩余价值理论的发现（即两大发现），社会主义由空想变为科学","tips":"","title":"第四章 · 资本主义的本质及规律","module":"马原"},{"chapter":"第四章","section":"多选","no":40,"stem":"恩格斯在《反杜林论》中提到：“资产阶级的平等要求，是为了消灭封建特权，但是当它实现了形式上的法律平等后，却在经济领域制造了更深刻的不平等。工人和资本家在法律上是平等的权利主体，但工人除了劳动力以外一无所有，资本家却掌握着生产资料和财富，这种财产上的鸿沟使得法律上的平等沦为掩盖剥削的遮羞布。”这说明尽管资产阶级宣布“法律面前人人平等”，但是（　　）","opts":{"A":"法律名义上的平等掩盖着事实上的不平等","B":"这种形式上的平等就是资本主义的本质","C":"它的实质是将劳资之间经济利益的不平等合法化","D":"这种平等的权利是建立在财产不平等基础之上的权利"},"ans":"ACD","point":"资本主义的民主制度及其本质","explain":"本题借用了恩格斯的论述“这种财产上的鸿沟使得法律上的平等为掩盖剥削的遮羞布”意在说明：尽管资本主义法律宣布人人具有平等的权利，但这是建立在财产不平等基础上的权利，因而这种平等实际上是把不平等叫作平等。资产阶级统治方法比奴隶主和封建主“高明”的地方在于，它将服从统治不仅放在义务之中，而且放在权利的名义之下。他们懂得只要资本主义私有制神圣不可侵犯，资本统治劳动的权利就万无一失。其实质是将劳资之间经济利益的不平等合法化。综上分析，正确答案是A、C、D选项。B选项与A选项冲突，形式上的平等是外在现象，形式上的平等就是资本主义的本质，也混淆了现象与本质的区别。","notes":"①「B选项」资本主义的本质是生产资料私有制和剥削关系，而非形式上的法律平等","tips":"","title":"第四章 · 资本主义的本质及规律","module":"马原"},{"chapter":"第五章","section":"单选","no":1,"stem":"列宁说：“马克思对资本主义所作的理论和历史的分析，证明了自由竞争产生生产集中，而生产集中发展到一定阶段就导致垒断。”这句话表明（　　）","opts":{"A":"生产集中的出现意味着垒断的形成","B":"垄断的目的是获得高额垄断利润","C":"垒断消除了自由竞争","D":"垄断是从自由竞争中形成的"},"ans":"D","point":"生产集中与垄断的形成","explain":"断是指少数资本主义大企业，为了获得高额利润，通过相互协议或联合，对一个或几个部门商品的生产、销售和价格进行操纵与控制。垄断是从自由竞争中形成的，是作为自由竞争的对立面产生的，故D选项正确。A选项表述错误，当生产集中发展到相当高的程度，垒断才会形成；B选项表述正确，但题干并未涉及断的目的，不符合题意；C选项表述错误，垄断非但不能消除竞争，反而使竞争变得更加复杂和激烈。","notes":"私人垄断资本主义是在生产集中和资本集中的基础上形成的生产集中是指生产资料、劳动力和商品的生产日益集中于少数大企业的过程，其结果是大企业在整个社会生产中所占的比重不断增加资本集中是指大资本吞并小资本，或由许多小资本合并成大资本的过程，其结果是越来越多的资本为少数大资本家所支配4「D选项」自由竞争引起生产集中和资本集中，生产集中和资本集中发展到一定阶段必然引起垄断，这是资本主义发展的客观规律所谓垄断，是指少数资本主义大企业为了获得高额利润，通过相互协议或联合，对一个或几个部门商品的生产、销售和价格进行操纵和控制","tips":"","title":"第五章 · 资本主义的发展及其趋势","module":"马原"},{"chapter":"第五章","section":"单选","no":2,"stem":"垒断价格是指垒断组织在销售或购买商品时，凭借其垒断地位规定的、旨在保证获取最大限度利润的市场价格。垄断价格的产生（　　）","opts":{"A":"完全否定了价值规律的作用","B":"使得社会生产的价值总量增加","C":"使得价值规律发挥作用的形式发生新的变化","D":"使得商品价格总额大于商品价值总额"},"ans":"C","point":"垄断利润和垄断价格","explain":"垄断资本的实质在于垄断利润，垄断利润是垄断资本家凭借其在社会生产和流通中的垄断地位而获得的超过平均利润的高额利润。垄断利润主要是通过垒断组织制定的垄断价格来实现的。垒断价格包括断高价和垄断低价两种形式。垒断价格的产生并没有否定价值规律，它是价值规律在垄断资本主义阶段作用的具体表现。故C选项正确。断价格的产生并没有否定价值规律。从全社会看，整个社会商品的价值仍然是由生产它们的社会必要劳动时间决定的，垒断价格不能增加也不能减少整个社会所生产的价值总量，商品的价格总额仍然等于商品的价值总额。A、B、D选项表述错误","notes":"价值规律起作用的形式（可以改变）：1）平均利润出现前，价格围绕商品价值上下波动2）平均利润出现后（价值转化为生产价格），价格围绕生产价格上下波动价值规律贯穿于商品经济的全部过程，它既支配商品生产，又支配商品流通。价值规律是在市场配置资源的过程中体现它的客观要求和作用的市场上价格的自由波动，垄断价格在一定时期内背离生产价格和价值能增加也不能减少整个社会所生产的价值总量，它只是对商品价值和剩余价值作了有利于断资本的再分配2）从全社会看，商商品的价格总额仍然等于商品的价值总额。所以，垄断价格的产生没有否定价值规律，只是改变了价值规律的作用形式","tips":"","title":"第五章 · 资本主义的发展及其趋势","module":"马原"},{"chapter":"第五章","section":"单选","no":3,"stem":"某垒断资本家投资汽车生产，生产一台汽车所耗费的生产资料为15万元，支付给工人的工资为5万元，假定市场的平均利润率为10%。那么，当销售价格定为30万元时，该汽车资本家获得每辆汽车的垄断利润为（　　）","opts":{"A":"8万元","B":"10万元","C":"6万元","D":"7万元"},"ans":"A","point":"垄断利润和垄断价格","explain":"生产资料为15万元，支付给工人的工资为5万元，即c=15万元，V=5万元，因此全部预付资本=15+5=20万元；平均利润率为10%，因此，平均利润=10%×20=2万元；销售价格定为30万元，即垒断价格=30万元。垒断利润=垄断价格-成本价格-平均利润=30-20-2=8万元。故A选项正确。B、C、D选项不符合题意。","notes":"垄断价格二成本价格十平均利润十断利润生产价格二生产成本+平均利润垄断高价和垄断低价都是旨在保证获取最大限度利润而规定的市场价格，二者之间不存在相抵的关系企业所生产的原材料等生产资料时规定的低于生产价格的价格","tips":"","title":"第五章 · 资本主义的发展及其趋势","module":"马原"},{"chapter":"第五章","section":"单选","no":4,"stem":"20世纪70年代的石油危机和滞胀困境中，私人断企业无法独立解决产能过剩与有效需求不足的矛盾，迫使资本主义国家通过财政补贴、国有化政策、宏观经济调控等手段直接干预经济。这种现象并非偶然，正如马克思早已揭示的：“生产资料的集中和劳动的社会化，达到了同它们的资本主义外壳不能相容的地步。这个外壳就要炸毁了。”这表明国家断资本主义的产生和发展，从根本上说是（　　）","opts":{"A":"国内市场竞争的结果","B":"国际竞争激化的结果","C":"垄断统治加强的结果","D":"资本主义基本矛盾发展的结果"},"ans":"D","point":"国家垒断资本主义的形成、主要形式和作用","explain":"国家断资本主义的形成和发展不是偶然的，它是科技进步和生产社会化程度进一步提高的产物，是资本主义基本矛盾即生产社会化和资本主义私人占有制之间的矛盾进一步尖锐化的必然结果。应选D。A、B、C选项都是资本主义基本矛盾深化和发展的具体表现，或者说是促成国家垒断资本主义产生和发展的具体因素，而不是根本原因，所以，A、B、C选项均不符合题意要求。","notes":"国家垄断资本主义是国家政权和私人垄断资本融合在一起的垄断资本主义维护垄断统治和获取高额垄断利润，而和国家政权相结合的一种垄断资本主义形式模块\n③「D选项」国家垄断资本主义是科技进步和生产社会化程度进一步提高的产物，是资本主义基本矛盾进一步尖锐化的必然结果：第一，社会生产力的发展，要求资本主义生产资料在更大范围内被支配，从而促进了国家垄断资本主义的产生；第二，经济波动和经济危机的深化，推动国家垄断资本主义的产生；第三，缓和社会矛盾、协调利益关系的需求，促使国家垄断资本主义的产生私人劳动和社会劳动的矛盾构成私有制基础上商品经济的基本矛盾，是商品经济的其他一切矛盾的基础生产资料资本主义私人占有和生产社会化之间的矛盾，是资本主义的基本矛盾","tips":"","title":"第五章 · 资本主义的发展及其趋势","module":"马原"},{"chapter":"第五章","section":"单选","no":5,"stem":"与第二次世界大战前的资本主义相比，当代资本主义在许多方面已经并正在发生着深刻的变化。正确分析这些新变化发生的原因，有利于我们科学而全面地认识当代资本主义社会。导致当代资本主义新变化发生的根本推动力量是（　　）","opts":{"A":"改良主义政党对资本主义制度的改革","B":"工人阶级争取自身权利的斗争","C":"科学技术革命和生产力的发展","D":"社会主义制度的优越性对资本主义的影响"},"ans":"C","point":"第二次世界大战后资本主义变化的主要表现、原因和实质","explain":"当代资本主义新变化的原因有很多。科学技术革命和生产力的发展，是资本主义变化的根本推动力量，本题应选C。工人阶级争取自身权利和利益的斗争，是推动资本主义变化的力量；社会主义制度初步显示的优越性对资本主义产生了一定影响；主张改良主义的政党对资本主义制度的改革，也对资本主义的变化发挥了重要作用。A、B、D选项不符合题意。A、B、D三项都是导致当代资本主义新变化的原因，但问最根本原因还是选C。","notes":"1「C选项」第二次世界大战后资本主义变化的原因和实质：首先，科学技术革命和生产力的发展，是资本主义发生变化的根本推动力量：其次，工人阶级争取自身权利和利益的斗争，是推动资本主义发生变化的重要力量；再次，社会主义制度初步显示的优越性对资本主义产生了重要影响；最后，主张改良主义的政党对资本主义制度的改革，也对资本主义发生变化起到了重要作用虽然第二次世界大战后资本主义发生了一些变化，但是并没有改变资本主义制度的本质，并没有克服资本主义的基本矛盾，也没有改变马克思主义关于资本主义的基本论断的科学性当代资本主义主要是指自第二次世界大战结束以来西方发达国家的国家断资本主义","tips":"","title":"第五章 · 资本主义的发展及其趋势","module":"马原"},{"chapter":"第五章","section":"单选","no":6,"stem":"进入21世纪以来，随着经济全球化的深入发展，新一轮科技革命和产业变革进入空前密集活跃期，社会化大生产在世界范围内更大规模、更广范围、更深层次展开，世界格局深度调整，资本主义又呈现出一些新变化新特征。当代资本主义最突出、最鲜明、最主要的特征是（　　）","opts":{"A":"科技创新加速资本主义生产方式变化","B":"国际金融资本的断","C":"社会阶级层级结构呈现复杂性、多样化","D":"发达资本主义国家推行霸权主义和强权政治"},"ans":"B","point":"当代资本主义变化的新特征","explain":"国际金融资本的垄断成为当代资本主义最突出、最鲜明、最主要的特征：一是金融垄断寡头化，二是金融垒断国际化，三是经济虚拟化、产业空心化。B选项正确。A、C、D选项也都是当代资本主义变化的新特征，但不是最突出、最鲜明、最主要的特征。","notes":"「B选项」国际金融资本的奎断成为当代资本主义最突出、最鲜明、最主要的特征（跨国银行摩根大通、汇丰银行、高盛银行等）进入21世纪以来，资本主义又呈现出一些新变化、新特征：1）科技创新加速资本主义生产方式变化2）国际金融断资本主义影响日益显现，国际金融资本的垄断成为当代资本主义最突出、最鲜明、最主要的特征3）社会阶级层级结构呈现复杂性、多样化的特征4）发达资本主义国家凭借经济、科技、文化传播等超级优势，在世界范围内推行霸权主义和强权政治","tips":"","title":"第五章 · 资本主义的发展及其趋势","module":"马原"},{"chapter":"第五章","section":"单选","no":7,"stem":"当代资本主义社会阶级层级结构呈现复杂性、多样化，在资产阶级内部层级结构中，最高层是（　　）","opts":{"A":"极少数国际金融垒断寡头阶层","B":"以能源、军工、高科技利益集团为主体的国际金融一产业垒断寡头阶层","C":"占据各产业垄断地位的产业垒断资本家阶层","D":"由经理资本家、食利者阶层、中小企业资本家等构成的一般资产阶级阶层"},"ans":"A","point":"当代资本主义变化的新特征","explain":"资产阶级内部层级结构日趋复杂。最高层是极少数国际金融垒断寡头阶层，A选项正确。在内部层级结构中，第二层是与前者联合，以能源、军工、高科技利益集团为主体的国际金融一产业垒断寡头阶层；第三层是占据各产业垒断地位的产业垄断资本家阶层；第四层是由经理资本家、食利者阶层、中小企业资本家等构成的一般资产阶级阶层。B、C、D选项不符合题意。","notes":"1「A选项」资产阶级内部层级结构日趋复杂。最高层是极少数国际金融垄断赛头阶层在当代资本主义生产关系中，社会阶层、阶级结构发生了新的变化：一是资本家的地位和作用已经发生很大变化。随着科技的发展和生产社会化程度的不断提高，大公司内部的资本所有权与控制权发生分离，拥有所有权的资本家一般不再直接经营和管理企业，而是靠手中拥有和掌握的企业股票等有价证券的利息收入为生，最终成为以剪息票为生的食利者；二是高级职业经理成为大公司经营活动的实际控制者；三是知识型和服务型劳动者的数量不断增加，劳动方式发生了新变化。从事体力劳动的蓝领工人越来越少，从事脑力劳动的白领工人不断增加，越来越多的工人在生产过程中从事监督者、调节者和操作者的工作，实现了从传统劳动方式向现代劳动方式的转变劳动者一般包括体力劳动者和脑力劳动者。在现代生产中，脑力劳动者的质量和数量日益具有决定性的意义，在高新技术领域，脑力劳动和体力劳动具有直接同一的趋势在高新技术产业中，脑力劳动和体力劳动的界限越来越模糊，两者不再是两种独立的劳动形式，而是越来越成为同一劳动过程中的两个方面（这个前提是在高新技术行业的领域，这个行业本身对于脑力水平的要求很高，而在从事脑力劳动的同时也消耗着体力，也在进行着体力劳动，例如导弹维修）","tips":"","title":"第五章 · 资本主义的发展及其趋势","module":"马原"},{"chapter":"第五章","section":"多选","no":8,"stem":"垄断是在自由竞争中形成的，是作为自由竞争的对立面产生的，但是，垒断并不能消除竞争，反而使竞争变得更加复杂和激烈。原因在于（　　）","opts":{"A":"垄断资本家仍然要获得更多的超额利润，不断扩大资本的积累","B":"垒断没有消除产生竞争的经济条件","C":"垄断组织必须不断增强自己的竞争实力，才能巩固自己的垄断地位","D":"任何断组织都不可能把包罗万象的社会生产包下来"},"ans":"BCD","point":"垄断条件下竞争的特点","explain":"垄断是在自由竞争中形成的，是作为自由竞争的对立面产生的，但是，垄断并不能消除竞争，反而使竞争变得更加复杂和激烈。原因在于：第一，垒断没有消除产生竞争的经济条件；第二，垄断必须通过竞争来维持；第三，任何垒断组织都不可能把包罗万象的社会生产包下来。应选B、C、D。在竞争目的上，自由竞争主要是为获得更多的利润或超额利润，不断扩大资本的积累，而垄断条件下的竞争则是为获取高额垄断利润，并不断巩固和扩大自己的垒断地位和统治权力。A选项表述错误。","notes":"1「B、C、D选项」奎断并不能消除竞争的原因：1)垄断没有消除产生竞争的经济条件（竞争是商品经济的一般规律。垄断产生以后，不但没有改变生产资料的资本主义私有制，反而又促进商品经济继续发展，所以不可能消除竞争）2）垄断必须通过竞争来维持3）社会生产是复杂多样的，任何垄断组织都不可能把包罗万象的社会生产全部包下来\n②「A选项」在竞争目的上，自由竞争主要是为获得更多的利润或超额利润，不断扩大资本的积累，而垄断条件下的竞争则是为获取高额奎断利润，并不断巩固和扩大自己的垄断地位和统治权力；总之，垄断条件下的竞争，不仅规模大、时间长、手段残酷、程度激烈，而且具有更大的破坏性","tips":"即使资本家不追求超额利润，只要资本主义私有制存在，竞争仍会因经济条件而产生。","title":"第五章 · 资本主义的发展及其趋势","module":"马原"},{"chapter":"第五章","section":"多选","no":9,"stem":"在资本主义社会里，银行垒断资本和工业断资本密切地融合在一起，产生了一种新型的垄断资本，即金融资本。在金融资本形成的基础上，产生了金融寡头。金融寡头操作、控制社会的主要方式有（　　）","opts":{"A":"通过“参与制”实现其在经济领域中的统治","B":"通过同政府的“个人联合”实现其对国家机器的控制","C":"通过政策咨询机构影响和左右内外政策","D":"通过新闻媒体实现国民思想意识的一元化"},"ans":"ABC","point":"金融资本与金融寡头","explain":"金融寡头是指操纵国民经济命脉，并在实际上控制国家政权的少数垒断资本家或垄断资本家集团。金融寡头在经济中的统治，主要是通过“参与制”（金融寡头通过掌握一定数量的股票来层层控制企业的制度）来实现的；在政治上对国家机器的控制主要是通过同政府的“个人联合”（亲自担任或指派代理人担任政府要职）来实现的。金融寡头还通过建立政策咨询机构来左右和影响内政外交政策。金融寡头掌握新闻媒体等来左右和影响内政外交与社会生活，但无法实现国民思想意识的一元化。所以D为干扰项。","notes":"金融资本=工业奎断资本+银行垄断资本；金融资本形成的主要途径包括金融联系、资本参与和人事参与(“金铲铲”)在金融资本形成的基础上，产生了金融赛头。金融赛头是指操纵国民经济命脉，并在实际上控制国家政权的少数垄断资本家或垄断资本家集团\n③「A、B、C选项」金融赛头实现统治的形式（“咨询人参”)：经济领域：参与制；所谓参与制，即金融赛头通过掌握一定数量的股票来层层控制企业的制度政治上：同政府的“个人联合”，如金融寡头直接把自己的代理人送进政府或议会内政外交社会生活：建立政策咨询机构；通过掌握新闻出版、广播电视等左右国家的内政外交及社会生活金融自由化与金融创新是金融奎断资本得以形成和壮大的重要制度条件","tips":"虽然金融赛头确实通过控制新闻、出版、广播、电视等媒体来影响舆论，但资本主义社会是建立在阶级对立基础上的，不可能实现全体国民思想意识的一元化，D选项表述太绝对。","title":"第五章 · 资本主义的发展及其趋势","module":"马原"},{"chapter":"第五章","section":"多选","no":10,"stem":"列宁在《帝国主义是资本主义的最高阶段》中深刻指出：“垒断正是“资本主义发展的最新阶段”的‘最新成就’。”垄断资本主义的基本经济特征包括（　　）","opts":{"A":"垒断组织在经济生活中起决定作用","B":"资本输出有了特别重要的意义","C":"在金融资本的基础上形成金融寡头的统治","D":"垄断使竞争趋于缓和"},"ans":"ABC","point":"垒断资本主义的基本经济特征","explain":"根据列宁的分析，垄断作为帝国主义最深厚的经济基础，垄断资本主义具有五个基本经济特征：断组织在经济生活中起决定作用；在金融资本的基础上形成金融寡头的统治；资本输出有了特别重要的意义；瓜分世界的资本家国际垄断同盟已经形成；最大资本主义大国已把世界上的领土瓜分完毕。应选A、B、C。断是作为自由竞争的对立物而产生的，但是，垄断没有消除竞争，而是凌驾于竞争之上，与竞争并存。垒断没有使竞争趋于缓和，由于垒断的统治，竞争反而更加激烈了。所以，D选项错误。","notes":"①「A、B、C选项」列宁指出，帝国主义具有五个基本特征：1）垄断组织在经济生活中起决定作用2）在金融资本的基础上形成金融寡头的统治3）资本输出有了特别重要的意义4）瓜分世界的资本家国际垄断同盟已经形成5）最大资本主义大国已把世界上的领土瓜分完毕垄断组织是指在一个经济部门或几个经济部门中，占据垄断地位的大企业联合。最简单的、初级的垄断组织形式是短期价格协定。常见的垄断组织有卡特尔、辛迪加、托拉斯和康采恩等。尽管垄断组织的形式多种多样，且不断发展变化，但是它们在本质上是一样的，即通过联合来操纵并控制商品生产和销售市场，操纵奎断价格，以搜取高额断利润\n③「D选项」奎断没有消除产生竞争的经济条件。垄断条件下的竞争，不仅规模大、时间长、手段残酷、程度激烈，而且具有更大的破坏性","tips":"","title":"第五章 · 资本主义的发展及其趋势","module":"马原"},{"chapter":"第五章","section":"多选","no":11,"stem":"断资本的实质在于获取垒断利润，垄断利润是垄断资本家凭借其在社会生产和流通中的断地位而获得的超过平均利润的高额利润。垒断资本所获得的高额利润，归根到底来自无产阶级和其他劳动人民创造的剩余价值。具体包括（　　）","opts":{"A":"对本国无产阶级和其他劳动人民剥削的加强","B":"通过控制市场获得一些其他企业特别是非垒断企业的利润","C":"通过加强对其他国家劳动人民的剥削和掠夺从国外获取利润","D":"通过资本主义国家政权进行有利于断资本的再分配"},"ans":"ABCD","point":"垄断利润和垄断价格","explain":"垒断利润的来源有：第一，来自对本国无产阶级和其他劳动人民剥削的加强；第二，通过控制市场获得一些其他企业特别是非垒断企业的利润；第三，通过加强对其他国家劳动人民的剥削和掠夺从国外获取利润；第四，通过资本主义国家政权进行有利于垄断资本的再分配，从而将劳动人民创造的国民收入的一部分变成垄断资本的收入，A、B、C、D选项均正确。","notes":"垄断资本所获得的高额利润，归根到底来自无产阶级和其他劳动人民所创造的剩余价值2②「A、B、C、D选项」垄断利润来源：1）劳动人民（全世界）2）非垄断企业3）垄断资本的再分配（如通过财政补贴、减免税收等）","tips":"","title":"第五章 · 资本主义的发展及其趋势","module":"马原"},{"chapter":"第五章","section":"多选","no":12,"stem":"国家运用法律手段规范市场秩序，限制垄断，保护竞争，维护社会公众的合法权益的主要类型包括（　　）","opts":{"A":"公众生活规制","B":"公共事业规制","C":"社会经济规制","D":"反托拉斯法"},"ans":"BCD","point":"国家垄断资本主义的形成、主要形式和作用","explain":"国家垄断资本主义的形式主要有五种：①国家所有并直接经营的企业；②国家与私人共有、合营企业；③国家通过多种形式参与私人垄断资本的再生产过程；④宏观调节；③微观规制，主要是国家运用法律手段规范市场秩序，限制垄断，保护竞争，维护社会公众的合法权益。其中微观规制主要有三种类型：一是反托拉斯法，二是公共事业规制，三是社会经济规制。故B、C、D选项正确。A选项不符合题意，该选项不属于微观规制的类型。","notes":"国家垄断资本主义是国家政权和私人垄断资本融合在一起的垄断资本主义国家断资本主义实质是私人垄断资本利用国家机器来为其发展服务的手段，是私人垄断资本为了维护垄断统治和获取高额垄断利润，而和国家政权相结合的一种垄断资本主义形式\n③「B、C、D选项」国家垄断资本主义的主要形式（五种形式）：第一种是国家所有并直接经营企业；第二种是国家与私人共有、合营企业；第三种是国家通过多种形式参与私人垄断资本的再生产过程，包括国家作为商品和劳务的采购者，向私人垄断企业大量订货、为私人垄断企业提供有保证的国家市场；第四种是宏观调节：主要是国家运用财政政策、货币政策等经济手段，对社会总供给和总需求进行调节;第五种是微观规制：主要是国家运用法律手段规范市场秩序、限制断、保护竞争，维护社会公众的合法权益：存在三种主要类型：反托拉斯法（反垄断法）、公共事业规制、社会经济规制","tips":"","title":"第五章 · 资本主义的发展及其趋势","module":"马原"},{"chapter":"第五章","section":"多选","no":13,"stem":"20世纪后期，西方国家普遍走上了金融自由化和金融创新的道路。金融自由化和金融创新是金融垒断资本得到形成和壮大的重要制度条件，推动着资本主义经济的金融化程度不断提高，其具体表现为（　　）","opts":{"A":"金融资本急剧膨胀","B":"制造业就业人数逐步增加","C":"金融业在国民经济中的地位大幅上升","D":"虚拟经济越来越脱离实体经济"},"ans":"ACD","point":"金融垒断资本的发展","explain":"金融垒断资本快速发展的表现有：第一，垄断资本主义的金融化程度不断提高。第二，金融业在国民经济中的地位大幅上升，金融资本在资本主义国家国民生产总值和利润总额中所占的比例越来越大。第三，随着实体经济的资本利润率下降，面对激烈竞争，实体经济部门不得不把利润的一部分投向金融领域，导致金融资本急剧膨胀。第四，虚拟经济越来越脱离实体经济。故A、C、D选项正确。B选项表述错误，制造业就业人数严重减少，以金融为核心的服务业就业人数逐步增加。","notes":"①「A、C、D选项」金融自由化和金融创新推动资本主义经济的金融化程度不断提高。在金融垄断资本的推动下，断资本主义的金融化程度不断提高，金融业在国民经济中的地位大幅上升，金融资本在资本主义国家国内生产总值和利润总额中所占的比例越来越大。随着实体经济的资本利润率下降，面对激烈竞争，实体经济部门不得不把利润的一部分投向金融领域，导致金融资本的急剧膨胀，制造业就业人数严重减少，以金融为核心的服务业就业人数逐步增加，虚拟经济越来越脱离实体经济金融自由化与金融创新是金融垄断资本得以形成和壮大的重要制度条件","tips":"","title":"第五章 · 资本主义的发展及其趋势","module":"马原"},{"chapter":"第五章","section":"多选","no":14,"stem":"习近平指出：“经济全球化确实带来了新问题。但我们不能就此把经济全球化一棍子打死，而是要适应和引导好经济全球化，消解经济全球化的负面影响，让它更好惠及每个国家、每个民族。”经济全球化对发展中国家的积极作用有（　　）","opts":{"A":"为发展中国家提供先进的技术和管理经验","B":"为发展中国家提供更多的就业机会","C":"推动发展中国家国际贸易发展","D":"促进发展中国家跨国公司的发展"},"ans":"ABCD","point":"经济全球化及其表现","explain":"经济全球化体现了社会化生产的要求，不仅发达国家从中受益，一些发展中国家在参与经济全球化进程中也得到了快速发展。经济全球化对发展中国家的积极作用主要表现在：第一，经济全球化为发展中国家提供先进的技术和管理经验。第二，经济全球化为发展中国家提供更多的就业机会。第三，经济全球化推动发展中国家国际贸易发展。第四，经济全球化促进发展中国家跨国公司的发展。故A、B、C、D选项正确。","notes":"经济全球化的动因：首先，科学技术的进步和生产力的发展为经济全球化提供了坚实的物质基础和根本的推动力其次，跨国公司的发展为经济全球化提供了适宜的企业组织形式（跨国公司在全球范围内利用各地的优势组织生产，大大地促进了各种生产要素在全球的流动和国际分工，并由此极大地推动了经济全球化进程)；最后，各国经济体制的变革和国际经济组织的发展是经济全球化的体制与组织保障（20世纪90年代以来，一些传统的计划经济国家纷纷放弃计划经济体制，转而向市场经济体制过渡）经济全球化的表现：生产全球化、贸易全球化、金融全球化\n③「A、B、C、D选项」经济全球化对发展中国家的积极作用主要表现在：第一，经济全球化为发展中国家提供先进技术和管理经验；第二，经济全球化为发展中国家提供更多的就业机会：第三，经济全球化推动发展中国家国际贸易的发展；第四，经济全球化促进发展中国家跨国公司的发展经济全球化也是一把“双刃剑”，它在促进经济发展的同时也带来了一些负面影响：第一，发达国家与发展中国家在经济全球化进程中的地位和收益不平等、不平衡第二，加剧了发展中国家资源短缺和环境污染；第三，一定程度上增加了经济风险","tips":"","title":"第五章 · 资本主义的发展及其趋势","module":"马原"},{"chapter":"第五章","section":"多选","no":15,"stem":"经济全球化是人类社会发展必经之路。开放合作是历史潮流，世界决不会也不应该退回到相互封闭、彼此分割的状态。面对经济全球化发展的历史必然性，面对国际范围内保护主义倾向抬头，国际经贸规则制定出现政治化、碎片化的风险挑战，必须认识到（　　）","opts":{"A":"以世界贸易组织为核心、以规则为基础的多边贸易体制不容破坏","B":"经济全球化一定程度上增加了经济风险，必然会导致国际金融危机","C":"贸易战、关税战没有赢家，保护主义没有出路","D":"推动经济全球化朝着更加开放、包容、普惠、均衡的方向发展，是国际社会共同责任"},"ans":"ACD","point":"经济全球化及其表现","explain":"经济全球化是人类社会发展必经之路。以世界贸易组织为核心、以规则为基础的多边贸易体制，为推动全球贸易发展、促进经济增长和可持续发展作出了重要贡献，必须得到维护。开放合作是历史潮流，世界决不会也不应该退回到相互封闭、彼此分割的状态。互利共赢是人心所向，以邻为的经济霸凌终将反噬自身。推动经济全球化朝着更加开放、包容、普惠、均衡的方向发展，是国际社会共同责任。国际金融危机不是经济全球化发展的必然产物，而是金融资本过度逐利、金融监管严重缺失的结果。B是干扰项。","notes":"1「B选项」国际金融危机不是经济全球化发展的必然产物，而是金融资本过度逐利、金融监管严重缺失的结果\n②「C选项」贸易战、关税战没有赢家，不能用“打赢贸易战”这类说法经济危机和金融危机不一样！金融危机指的是流动性危机，局限在资本市场投资机会范围；而经济危机则覆盖整个社会的金融与实体经济范围","tips":"A、C、D选项这一类常规意义认知说法，只要表述逻辑合理，主题跟材料不跑偏就放心选。","title":"第五章 · 资本主义的发展及其趋势","module":"马原"},{"chapter":"第五章","section":"多选","no":16,"stem":"第二次世界大战后，资本主义所有制发生了新的变化，这就是国家资本所有制形式形成并发挥重要作用，法人资本所有制崛起并成为居主导地位的资本所有制形式。法人资本所有制的基本特点是（　　）","opts":{"A":"国家作为出资人，拥有国有企业的所有权和控制权","B":"公司资本的所有权与控制权重新趋于合一","C":"各类法人取代个人或家族股东成为企业的主要出资人","D":"企业的股票高度集中于少数法人股东手中"},"ans":"BCD","point":"第二次世界大战后资本主义变化的主要表现、原因和实质","explain":"法人资本所有制是法人股东化的产物，其基本特点是：各类法人取代个人或家族股东成为企业的主要出资人，企业的股票高度集中于少数法人股东手中，法人股东直接参与公司治理，监督和制约管理阶层的经营行为，使公司资本的所有权与控制权重新趋于合一。法人资本所有制有两种形式：一种是企业法人资本所有制，另一种是机构法人资本所有制。法人资本所有制在性质上是一种基于资本雇佣劳动的垒断资本集体所有制，它仍体现着资本剥削雇佣劳动的关系，故B、C、D选项正确。A选项不符合题意，该选项是国家资本所有制的特点。国家资本所有制是指生产资料由国家占有并服务于垄断资本的所有制形式。其主要特点是，国家作为出资人，拥有国有企业的所有权和控制权，国有企业的重要职能是推行政府的社会政策和经济政策，为私人垒断资本的发展提供服务和保障。","notes":"①「A选项」国家资本所有制：指生产资料由国家占有并服务于垄断资本的所有制形式。就其性质而言，仍然是资本主义形式，体现着总资本家剥削雇佣劳动者的关系。国家资本所有制在整个资本主义经济中所占的比重并不大，但是由于主要存在于基础设施和公共事业部门，所以对整个社会经济的发展有着重要的影响国家资本所有制的主要特点是，国家作为出资人，拥有国有企业的所有权和控制权，国有企业的重要职能是推行政府的社会政策和经济政策法人资本所有制：是法人股东化的产物。法人资本所有制在性质上是一种基于资本雇佣劳动的奎断资本集体所有制，它体现了资本剥削雇佣劳动的关系第二次世界大战后，资本主义生产资料所有制发生了新的变化，这就是国家资本所有制形成并发挥重要作用；法人资本所有制崛起并成为居主导地位的资本所有制形式「B、C、D选项」法人资本所有制：是法人股东化的产物。它的基本特点是各类法人（企业法人和机构法人）取代个人或家族股东成为企业的主要出资人，企业的股票高度集中于少数法人股东之手，法人股东凭借手中集中化的控股权干预甚至直接参与公司治理，监督和制约管理阶层的经营行为，使公司资本的所有权与控制权重新趋于合一","tips":"","title":"第五章 · 资本主义的发展及其趋势","module":"马原"},{"chapter":"第五章","section":"多选","no":17,"stem":"伴随着生产力发展、科技进步及阶级关系调整，当代资本主义社会的劳资关系和分配关系发生了很大变化。其中资本家及其代理人为缓和劳资关系所采取的激励制度有（　　）","opts":{"A":"职工参与决策制度","B":"职工终身雇佣制度","C":"职工选举管理制度","D":"职工持股制度"},"ans":"ABD","point":"第二次世界大战后资本主义变化的主要表现、原因和实质","explain":"随着生产力的发展、技术进步以及国内外形势的变化，当代资本主义在许多方面已经并正在发生着变化。这表现为资本主义生产资料所有制的变化；劳资关系和分配关系的变化；社会阶级、阶层结构的变化；经济调节机制和经济危机形态的变化；政治制度的变化。其中资本家及其代理人为缓和劳资关系所采取的激励制度有：职工参与决策、终身雇佣、职工持股，A、B、D选项为正确答案。C选项“职工选举管理制度”在资本主义社会的企业里是不存在的，因为资本主义企业普遍采用的是聘用管理者制度，所以C选项错误。","notes":"①「A、B、D选项」当代资本主义国家的劳资关系和分配关系的变化：职工参与决策，终身雇佣，职工持股；建立并实施了普及化、全民化的社会福利制度\n②「C选项」资本主义国家没有也不可能建立职工选举管理者制度，因为资本主义企业普遍采用的是聘用管理者制度，尽管工会可参与集体谈判（如工资协商），但管理层任命权仍掌握在资本家手中","tips":"","title":"第五章 · 资本主义的发展及其趋势","module":"马原"},{"chapter":"第五章","section":"多选","no":18,"stem":"第二次世界大战之后，当代资本主义在所有制关系、劳资关系、分配关系、调节机制、政治制度等众多方面出现了新的变化，当代资本主义发生的这些变化从根本上说（　　）","opts":{"A":"是在资本主义制度基本框架内的变化","B":"改变了导致财富占有两极分化的制度基础","C":"没有克服资本主义的基本矛盾","D":"是人类社会发展一般规律和资本主义经济规律作用的结果"},"ans":"ACD","point":"第二次世界大战后资本主义变化的主要表现、原因和实质","explain":"首先，当代资本主义发生的变化从根本上说是人类社会发展一般规律和资本主义经济规律作用的结果。其次，当代资本主义发生的变化是在资本主义制度基本框架内的变化，并不意味着资本主义生产关系的根本性质发生了变化。从当代资本主义发展的实际情况来看，生产资料私有制仍然是资本主义的基本经济制度，资本追逐剩余价值的本性并没有改变，改变的只是获取剩余价值的方式和方法。资本主义国家政府虽然重视对经济的协调，但仍然难以防止和克服金融危机和经济危机。这一切表明，当代资本主义的新变化并没有改变资本主义制度的本质，并没有克服资本主义的基本矛盾，也没有改变马克思主义关于资本主义的基本论断的科学性。故A、C、D选项正确。B选项表述错误。社会福利制度缓和了资本主义分配关系的矛盾，但并没有改变导致财富占有两极分化的制度基础。","notes":"①「B选项」资本主义私有制仍是财富两极分化的根源。尽管社会福利制度缓解了部分贫困，但资本收益增速远超劳动收入增长","tips":"","title":"第五章 · 资本主义的发展及其趋势","module":"马原"},{"chapter":"第五章","section":"多选","no":19,"stem":"新一轮科技革命极大地提高了劳动生产率，开辟了生产力发展新空间，推动资本主义生产方式向数字化、智能化方向发展。其具体表现是（　　）","opts":{"A":"推动资本积累方式从国际金融垒断资本积累向产业资本积累转变","B":"形成了以去工业化、经济虚拟化、金融化为主要特征的产业结构模式","C":"数字劳动在生产中的地位愈加突出","D":"数字经济、智能经济、共享经济成为近年来全球经济发展的新形态"},"ans":"BCD","point":"当代资本主义变化的新特征","explain":"新一轮科技革命，极大地提高了劳动生产率，开辟了生产力发展新空间，推动资本主义生产方式向数字化、智能化方向发展。一是产业结构的调整。形成了以去工业化、经济虚拟化、金融化为主要特征的产业结构模式，一般制造业占比逐渐下降，高新技术产业和金融业所占比重日趋上升。二是生产组织和劳动形式的变化。数据成为一种新的生产要素，在大数据、云计算、物联网、区块链等前沿技术群驱动下，发挥三是新经济形态的出现。随着信息革命的深入发展，以数据资源为关键要素，以现代信息网络为主要载体，以信息通信技术融合应用、全要素数字化转型为重要推动力的数字经济、智能经济、共享经济等，已成为近年来全球经济发展的新形态。B、C、D是正确选项。A选项表述错误。资本主义生产方式新变化体现在有效降低信息获取、资源匹配和商品交换成本，有力推动物质财富的创造和积累的同时，也推动资本积累方式从一般产业资本积累向国际金融断资本积累转变。","notes":"①「B、C、D选项」进入21世纪以来，资本主义又呈现出一些新变化新特征。例如，科技创新加速资本主义生产方式变化：一是产业结构的调整。形成了以去工业化、经济虚拟化、金融化为主要特征的产业结构模式，一般制造业占比逐渐下降，高新技术产业和金融业所占比重日趋上升：二是生产组织和劳动形式的变化。数据成为一种新的生产要素；三是新经济形态的出现（数字经济、智能经济、共享经济等）\n②「A选项」资本主义生产方式新变化在推动资本积累方式从一般产业资本积累向国际金融垄断资本积累转变。国际金融资本的垄断成为当代资本主义最突出、最鲜明、最主要的特征","tips":"A选项顺序颠倒，应当是从一般产业资本积累向国际金融奎断资本积累转变。颠倒顺序也是常见干扰项挖坑方式之一。","title":"第五章 · 资本主义的发展及其趋势","module":"马原"},{"chapter":"第五章","section":"多选","no":20,"stem":"21世纪以来，以美国为首的发达资本主义国家重拾冷战思维，制造阵营对立，奉行零和博奔，凭借在金融、技术、文化等领域的霸权地位，维护不公正的国际秩序和不合理的全球治理体系。美国等发达资本主义国家在世界范围内推行霸权主义和强权政治的表现有（　　）","opts":{"A":"利用强大的金融资本控制国际经济活动，盘剥发展中国家","B":"利用文化产业体系和传播媒介垄断权，输出资本主义价值观","C":"利用知识产权和信息技术垄断，制造各种“鸿沟”","D":"利用集团政治操纵国际组织、干涉国际事务，进行全方位制裁"},"ans":"ABCD","point":"当代资本主义变化的新特征","explain":"美国等发达资本主义国家凭借经济、科技、文化传播等超级优势，在世界范围内推行霸权主义和强权政治。一是利用强大的金融资本控制国际投资、国际生产、国际流通、国际交换、国际贸易、国际市场，对发展中国家进行最大限度的经济盘剥和压榨，获得金融资本对于社会生产甚至社会生活的绝对统治地位：二是利用强大的世界文化产业体系和传播媒介垄断权，推行文化市场化和商业化运作，打着自由、民主、平等、人权等幌子，输出、渗透资本主义价值观和“西式民主文化”，直接严重威胁民族国家的文化认同和文化主权，撕裂价值观的共同基础；三是利用知识产权和信息技术垄断，制造“信息鸿沟”“数字鸿沟”“技术鸿沟”，构建“信息帝国主义”和“数字帝国主义”；四是利用集团政治操纵国际组织、干涉国际事务，把自己的意志和所谓规则强加于人，对他国进行政治、经济、科技等全方位制裁，逆历史潮流而动，破坏全球和平与稳定。A、B、C、D都是正确选项","notes":"","tips":"这一类非明确固定知识点记忆类题目，还是主要判断选项表述是否符合材料语义且本身说法是否合乎客观事实即可。","title":"第五章 · 资本主义的发展及其趋势","module":"马原"},{"chapter":"第五章","section":"多选","no":21,"stem":"当今世界，正在经历一场百年未有之大变局，国际格局和国际体系深刻调整，全球治理体系深刻变革，国际力量对比正在发生近代以来最具革命性的变化，世界进入新的动荡变革期。资本主义社会问题加速积累，资本主义国家内部的矛盾和冲突日益明显。具体表现在（　　）","opts":{"A":"经济发展“失调”","B":"政治体制“失灵”","C":"社会融合机制“失效”","D":"意识形态领域“失控”"},"ans":"ABC","point":"2008年国际金融危机以来资本主义的矛盾与冲突","explain":"由美国次贷危机引发的2008年国际金融危机是自20世纪30年代大萧条以来最为严重的全球性经济危机。在这场危机的影响下，西方国家的经济生活、政治生活和民生等各方面都出现了各种问题。第一，经济发展“失调”。第二，政治体制“失灵”。第三，社会融合机制“失效”。这些现象背后的深层次原因和根源，归根结底还在于资本主义制度本身，在于资本主义的基本矛盾。故A、B、C选项正确。D选项不符合事实，发达资本主义国家意识形态不仅没有“失控”，相反利用强大的世界文化产业体系和传播媒介断权，推行文化市场化和商业化运作，打着自由、民主、平等、人权等幌子，输出、渗透资本主义价值观和“西式民主文化”，直接严重威胁民族国家的文化认同和文化主权，撕裂价值观的共同基础。","notes":"当今世界，正在经历一场百年未有之大变局，世界进入新的动荡变革期。资本主义社会问题加速积累，资本主义国家内部的矛盾和冲突日益明显，主要体现在：1）经济发展失调。具体表现为：一是虚拟经济与实体经济发展失衡；二是福利风险增加；三是债务负担沉重2）政治体制失灵。一是西式选举往往难以选贤；二是政党利益可能凌驾于国家利益之上；三是民主陷阱会阻碍国家治理；四是传统精英政治走向衰落，大众政治与精英政治的对立日趋严重，民粹主义思潮泛起，西方精英政治陷入困境3）社会融合机制失效。一是社会极端思潮抬头；二是社会流动性退化；三是社会矛盾激化，“群体性事件”增多\n②「D选项」发达资本主义国家凭借经济、科技、文化传播等超级优势，在世界范围内推行霸权主义和强权政治：1）利用强大的金融资本控制国际投资、国际生产2）利用强大的世界文化产业体系和传播媒介垄断权，推行文化市场化和商业化运作，打着自由、民主、平等，人权等幌子输出，渗透资本主义价值观和“西式民主文化”，直接严重威胁民族国家的文化认同和文化主权，撕裂价值观的共同基础义”和“数字帝国主义”4）利用集团政治操纵国际组织、干涉国际事务，把自己的意志和所谓规则强加于人，对他国进行政治、经济、科技等全方位制裁，逆历史潮流而动，破坏全球和平与稳定","tips":"","title":"第五章 · 资本主义的发展及其趋势","module":"马原"},{"chapter":"第五章","section":"多选","no":22,"stem":"马克思说：“随着大工业的发展，资产阶级赖以生产和占有产品的基础本身也就从它脚下被挖掉了，它首先产生的是它自己的掘墓人，资产阶级的灭亡和无产阶级的胜利是同样不可避免的。”这段话表明资本主义的内在矛盾决定了资本主义必然被社会主义所代替，其依据在于（　　）","opts":{"A":"资本主义基本矛盾“包含着现代的一切冲突的萌芽”","B":"资本积累推动资本主义基本矛盾不断激化并最终否定资本主义自身","C":"国家垄断资本主义是资本社会化的更高形式，将成为社会主义的前奏","D":"资本主义社会存在着资产阶级和无产阶级两大阶级之间的矛盾和斗争"},"ans":"ABCD","point":"资本主义为社会主义所代替的历史必然性","explain":"资本主义的内在矛盾决定了资本主义必然被社会主义所代替。首先，资本主义基本矛盾“包含着现代的一切冲突的萌芽”。其次，资本积累推动资本主义基本矛盾不断激化并最终否定资本主义自身。资本的不断积累为否定资本主义制度自身准备了物质条件。资本的不断积累必然提高生产的社会化程度，在客观上导致生产的集中和资本的集中，使资本的社会化占有成为可能。再次，国家垄断资本主义是资本社会化的更高形式，将成为社会主义的前奏。最后，资本主义社会存在着资产阶级和无产阶级两大阶级之间的矛盾和斗争。故A、B、C、D选项都正确。","notes":"1「A、B、C、D选项」资本主义的内在矛盾决定了资本主义必然被社会主义所代替：首先，资本主义基本矛盾“包含着现代的一切冲突的萌芽”；其次，资本积累推动资本主义基本矛盾不断激化并最终否定资本主义自身；再次，国家垄断资本主义是资本社会化的更高形式，将成为社会主义的前奏；最后，资本主义社会存在着资产阶级和无产阶级两大阶级之间的矛盾和斗争当今世界，虽然资本主义制度通过自我调节还能为生产力的发展提供一定的空间，但社会主义取代资本主义是历史的必然趋势","tips":"","title":"第五章 · 资本主义的发展及其趋势","module":"马原"},{"chapter":"第五章","section":"多选","no":23,"stem":"习近平总书记明确指出：“资本主义最终消亡、社会主义最终胜利，必然是一个很长的历史过程。我们要深刻认识资本主义社会的自我调节能力，充分估计到西方发达国家在经济科技军义向社会主义的过渡必然是一个复杂的、长期的历史过程，这是因为（　　）","opts":{"A":"任何社会形态的存在都有绝对稳定性","B":"资本主义的发展具有不平衡性","C":"资本主义社会具有一定的自我调节能力","D":"当代资本主义的发展还显示出生产关系对生产力容纳的空间"},"ans":"BCD","point":"资本主义为社会主义所代替的历史必然性","explain":"资本主义必然为社会主义所代替，并不意味着资本主义社会将在短期内自行消亡。资本主义向社会主义的过渡必然是一个复杂的、长期的历史进程。首先，任何社会形态的存在都有相对稳定性，从产生到衰亡都要经过相当长的时间跨度。其次，资本主义发展的不平衡性决定了过渡的长期性。从世界范围来看，资本主义向社会主义过渡必将是一个从个别国家逐步向更多国家扩展的相当长的历史过程。最后，资本主义社会具有一定的自我调节能力。当代资本主义的发展，还显示出生产关系对生产力容纳的空间，说明资本主义为社会主义所代替尚需长期的过程。故B、C、D选项正确。A选项不符合题意。任何社会形态的存在都有相对稳定性，而不是绝对稳定性。","notes":"1「A选项」任何社会形态的存在都有相对稳定性，而不是绝对稳定性","tips":"","title":"第五章 · 资本主义的发展及其趋势","module":"马原"},{"chapter":"第六章","section":"单选","no":1,"stem":"1920年底，苏维埃俄国击退外国武装干涉者，取得了国内战争的胜利，1921年初转入和平经济建设时期。这时，国民经济已濒临崩溃，国内发生严重的经济和政治危机。在这种形势下，列宁深感如不改变政策将会失去广大群众，丢掉阶级基础。1921年3月，俄共（布）召开十大，毅然决定从战时共产主义政策过渡到实行以发展商品经济为主要特征的新经济政策。新经济政策的主要特征是（　　）","opts":{"A":"发展商品经济","B":"企业全部国有化","C":"指令性计划经济","D":"推行农业集体化"},"ans":"A","point":"社会主义在苏联的实践","explain":"1921年，苏俄面临严重的经济危机和政治危机，战时共产主义政策引发了广大农民、工人和士兵的不满。为了缓解危机，恢复经济，巩固苏维埃政权，列宁决定实行新经济政策。新经济政策以发展商品经济为主要特征，主要内容包括：以粮食税代替余粮收集制，允许私人经营中小企业，实行自由贸易等。新经济政策的实施，调动了广大人民群众的生产积极性，促进了苏俄经济的恢复和发展，巩固了工农联盟和苏维埃政权，符合题干中1921年苏俄面临的情况。应选A。企业全部国有化是战时共产主义政策的特征，所以B选项错误。指令性计划经济体制是斯大林时期逐渐形成的经济体制模式，它强调国家对经济的全面计划和控制，通过指令性计划来安排生产、分配和消费等各个环节。这一体制形成于20世纪20年代末30年代初，所以C选项不符合题意。农业集体化运动也是斯大林时期开展的，从1929年开始大规模推行，目的是将个体小农经济改造为大规模的集体农庄经济，以适应工业化的需要。这一运动与1921年苏俄面临的经济和政治危机及当时采取的政策调整无关，所以D选项不符合题意。","notes":"①「A选项」新经济政策主要特征：发展商品经济（宽松、刺激经济发展）战时共产主义政策主要特征：取消商品货币关系（严格、非常时期）新经济政策：1920年底，苏维埃俄国击退外国武装干涉者，取得了国内战争的胜利，1921年初转入和平经济建设时期。这时，国民经济已濒临崩溃，国内发生严重的经济和政治危机。在这种形势下，列宁深感如不改变政策将会失去广大群众、丢掉阶级基础。1921年3月，俄共（布）召开十大，毅然决定从战时共产主义政策过渡到实行以发展商品经济为主要特征的新经济政策新经济政策主要内容有：用粮食税制取代余粮收集制，允许私人自由贸易，恢复商品货币关系，允许私人小工业企业发展，采取一些国家资本主义的形式来发展生产。这一决定表明，列宁的社会主义建设思想发生了重大转变，对俄国这样一个小农经济占优势的国家如何走向社会主义又有了新的认识，标志着列宁正在探索一条符合俄国国情的建设社会主义的道路\n③「D选项」苏联农业合作化是在20世纪30年代前中期完成的，苏联模式也是在这个时期形成的","tips":"","title":"第六章 · 社会主义的发展及其规律","module":"马原"},{"chapter":"第六章","section":"单选","no":2,"stem":"在俄国社会主义革命取得胜利的初期，特别是实行新经济政策期间，列宁对苏维埃俄国如何建设社会主义进行了深刻的理论思考，他说：“对俄国来说，根据书本争论社会主义纲领的时代也已经过去了，我深信已经一去不复返了。今后只能根据经验来谈论社会主义。”列宁对马克思主义的重大贡献，也是他留给后人的最宝贵的思想遗产是（　　）","opts":{"A":"提出了社会主义可能在一国或数国首先胜利的理论","B":"强调无产阶级专政是实现社会主义的必经阶段","C":"领导了俄国十月革命，建立了世界上第一个社会主义国家","D":"努力把马克思主义基本原理同俄国的具体实际相结合，探索出一条适合俄国国情的社会主义道路"},"ans":"D","point":"社会主义在苏联的实践","explain":"在俄国十月革命取得胜利的初期，特别是实行新经济政策期间，列宁对苏维埃俄国如何建设社会主义进行了深刻的理论思考，提出了许多精辟的论述。列宁努力把马克思主义基本原理同俄国的具体实际相结合，探索出一条适合俄国国情的社会主义道路。这是列宁对马克思主义的重大贡献，也是他留给后人的最宝贵的思想遗产。D选项正确。A选项提出了社会主义可能在一国或数国首先胜利的理论，这是对马克思主义革命理论的重大突破，为俄国十月革命的胜利提供了理论依据，但这只是列宁众多贡献中的一个方面，不能完全涵盖其最宝贵的思想遗产，具有一定的片面性。B选项强调无产阶级专政是实现社会主义的必经阶段，这是马克思主义的重要原则之一，列宁在实践中坚持和发展了这一理论，但它只是列宁思想体系中的一部分，不能等同于他留给后人的最宝贵的思想遗产。C选项领导了俄国十月革命，建立了世界上第一个社会主义国家，这是列宁的伟大功绩，但这更多的是实践层面的成就，而题干强调的是思想遗产，虽然十月革命与列宁的思想密切相关，但该选项没有直接体现出列宁在思想理论方面对马克思主义的重大发展和独特贡献，具有较强的干扰性。","notes":"①「A选项」列宁总结当时变化了的新情况，深刻论述了社会主义革命可以首先在一个或者几个国家获得胜利。1915年，他在《论欧洲联邦口号》一文中明确指出：经济和政治发展的不平衡是资本主义的绝对规律。由此就应得出结论：社会主义可能首先在少数甚至在单独一个资本主义国家内获得胜利（一国胜利论）\n②「D选项」1921年新经济政策的提出标志着列宁正在探索一条符合俄国国情的建设社会主义的道路\n③「C选项」第一次建立无产阶级政权尝试：巴黎公社；第一次建立起无产阶级政府：十月革命","tips":"C选项可以首先排除，十月革命是列宁的伟大实践成就，但题目问的是“理论贡献”和“思想遗产”建立社会主义国家属于实践范畴。真题很多时候都可以通过分析材料问法和选项语义去排除一些选项。","title":"第六章 · 社会主义的发展及其规律","module":"马原"},{"chapter":"第六章","section":"单选","no":3,"stem":"习近平总书记指出：“实现社会主义现代化是一个阶梯式递进、不断发展进步的历史过程，制定和实施五年规划，能够在把握方向、明确奋斗目标的前提下，一步一步坚定走，一个阶段一个阶段向前推进，从而不断积小胜为大胜，保证党和国家事业行稳致远。”五年规划将宏伟蓝图分解为一个个阶段性目标和具体任务，通过持续的努力“积小胜为大胜”，最深刻地印证了关于社会主义建设过程的基本论断是（　　）","opts":{"A":"社会主义革命可以在资本主义链条最薄弱的环节率先取得胜利","B":"经济文化相对落后的国家建设社会主义必然具有长期性和艰巨性","C":"社会主义社会的基本矛盾是非对抗性的，可以通过改革不断解决","D":"社会主义的发展道路因各国国情不同而必然呈现出多样性的特点"},"ans":"B","point":"社会主义建设过程的长期性","explain":"题干材料的核心在于强调社会主义现代化是一个“阶梯式递进”的“历史过程”，需要通过五年规划“一步一步坚定走”“一个阶段一个阶段向前推进”。这直接对应“经济文化相对落后的国家建设社会主义，更具有历史长期性”的论断。五年规划正是基于对这种长期性的充分认识，避免急于求成，通过分阶段、可持续的规划来稳步推进建设。B选项正确。A选项论述的是社会主义革命发生条件的理论（列宁的一国胜利论），与题干聚焦的“社会主义建设过程”的主题不符。C选项阐述的是社会主义社会基本矛盾的性质和解决方式，虽然与社会主义改革相关，但并非题干材料中“阶梯式递进”“长期过程”所直接指向的关于建设“长期性”的核心论断。D选项阐述的是材料强调的是中国自身发展的历时性过程，而非与其他国家道路的共时性比较。","notes":"","tips":"题干强调实现社会主义现代化是一个阶梯式递进、不断发展进步的历史过程。B选项精准反映了题干中“阶梯式递进、不断发展进步”和“积小胜为大胜”的核心理念，强调了社会主义建设的长期性和艰巨性。","title":"第六章 · 社会主义的发展及其规律","module":"马原"},{"chapter":"第六章","section":"单选","no":4,"stem":"恩格斯在《资本论》第一卷出版时的书评里说过，一些读者可能会以为自己将从这本书里得知共产主义的千年王国到底是什么样子，谁指望得到这种乐趣，谁就大错特错了。这提示我们坚持以马克思主义为指导，最重要的是（　　）","opts":{"A":"坚持马克思主义对于研究未来社会制度的科学方法","B":"坚持马克思主义经典作家给我们提供的各国社会主义发展道路的方案","C":"坚持苏联社会主义的模式","D":"把马克思主义当成永恒真理"},"ans":"A","point":"探索适合本国国情的发展道路","explain":"根据材料中“一些读者可能会以为他将从这本书里得知共产主义的千年王国到底是什么样子，谁指望得到这种乐趣，谁就大错特错了”提示我们坚持以马克思主义为指导，最重要的是坚持马克思主义对于研究未来社会制度的科学方法。A选项正确。马克思主义经典作家并没有给我们提供各国社会主义发展道路的现成方案。以科学的态度对待马克思主义，是要运用其科学的世界观和方法论解决现实的问题，而不是要背诵和重复其具体结论和词句，更不是把马克思主义当成一成不变的教条。B、C、D选项都不符合题意。","notes":"①「B选项」马克思主义经典作家并没有给我们提供各国社会主义发展道路的现成方案。马克思主义不是教条，而是方法。如果选项中出现“现成答案”“现成理想方案”“规定了具体制度、具体方案”等，多为干扰项\n②「A选项」空想社会主义的局限性恰恰在于对未来社会作了过于详尽的细节描绘。马克思、恩格斯立足于揭示未来社会的一般特征，而不对各种细节作具体描绘经典作家的个别提法可能会随着时代的变迁而过时，但马克思主义的基本立场、观点、方法具有穿越时空的普遍意义和永恒价值","tips":"题干中恩格斯的书评强调马克思没有提供“共产主义的千年王国”的蓝图，这本身就表明马克思主义不是一套固定的、永恒的真理体系，而是科学的研究方法。","title":"第六章 · 社会主义的发展及其规律","module":"马原"},{"chapter":"第六章","section":"单选","no":5,"stem":"1871年爆发的巴黎公社革命，是第一国际精神的产儿，是无产阶级夺取政权的第一次伟大尝试。马克思高度评价巴黎公社的意义，认为“公社的原则是永存的”。马克思、恩格斯总结巴黎公社经验，指出：无产阶级革命取得成功并保持胜利果实的首要条件是（　　）","opts":{"A":"建立无产阶级的新型国家","B":"要有革命的武装无产阶级","C":"政权是为人民服务的机关","D":"必须建立无产阶级政党"},"ans":"B","point":"第一国际与巴黎公社","explain":"巴黎公社仅存在了72天，就在国内外敌对势力的联合镇压下失败了。马克思高度评价巴黎公社的意义，认为公社的原则是永存的。马克思、恩格斯总结巴黎公社经验，指出无产阶级革命取得成功并保持胜利果实的首要条件是要有革命的武装，应选B。必须打碎旧的国家机器，建立无产阶级的新型国家；无产阶级政权是为人民服务的机关；必须建立无产阶级政党，发挥党的政治领导作用。这些也是马克思总结的巴黎公社的经验，但不合题干要求。A、C、D选项不符合题意。","notes":"①「B选项」马克思、恩格斯总结巴黎公社经验，指出无产阶级革命取得成功并保持胜利果实的首要条件是要有革命的武装；必须打碎旧的国家机器，建立无产阶级的新型国家；无产阶级政权是为人民服务的机关：必须建立无产阶级政党，发挥党的政治领导作用巴黎公社用以防止国家机关工作人员由社会公仆变为社会主人的两项措施：一是规定所有公职人员无论职位高低，实行全面的选举制和撤换制：二是取消高薪制，规定任何工作人员年薪不得超过熟练工模块人的工薪水平1871年爆发的巴黎公社革命，是第一国际精神的产儿，是无产阶级夺取政权的第一次伟大尝试（并不是第一国际发动和领导的）第一次建立无产阶级政权尝试：巴黎公社；第一次建立起无产阶级政府：十月革命","tips":"","title":"第六章 · 社会主义的发展及其规律","module":"马原"},{"chapter":"第六章","section":"多选","no":6,"stem":"空想社会主义产生于16世纪初期，到19世纪上半叶达到顶峰。代表人物有法国的圣西门、傅立叶和英国的欧文。空想社会主义的局限性主要表现在空想社会主义者（　　）","opts":{"A":"只看到了资本主义必然灭亡的命运，却未能揭示资本主义必然灭亡的经济根源","B":"要求埋葬资本主义，却看不到埋葬资本主义的力量","C":"憧憬取代资本主义的理想社会，却找不到通往理想社会的现实道路","D":"虽然是科学的思想体系，却没有提供启发工人觉悟的材料"},"ans":"ABC","point":"空想社会主义的产生、发展和局限性","explain":"19世纪上半叶，空想社会主义发展到顶峰，代表人物有法国的圣西门、傅立叶和英国的欧文。空想社会主义的局限性主要表现在：空想社会主义者只看到了资本主义必然灭亡的命运，却未能揭示资本主义必然灭亡的经济根源；他们要求埋葬资本主义，却看不到埋葬资本主义的力量；他们憧憬取代资本主义的理想社会，却找不到通往理想社会的现实道路。这种时代的局限性说明，空想社会主义不成熟的理论，是同不成熟的资本主义生产状况、不成熟的阶级状况相适应的。A、B、C选项正确。空想社会主义提供了启发工人觉悟的极为宝贵的材料，但它不是科学的思想体系。D选项错误。","notes":"托马斯·莫尔于1516年发表的《乌托邦》是空想社会主义的开山之作空想社会主义思潮经历了三个历史发展阶段，即16一17世纪的早期空想社会主义、18世纪的空想平均共产主义、19世纪初期批判的空想社会主义19世纪上半叶，空想社会主义发展到顶峰，以圣西门、傅立叶、欧文为代表的19世纪初期批判的空想社会主义是科学社会主义的直接思想来源空想社会主义在理论上的贡献主要表现在两个方面：第一，他们对资本主义旧制度的辛辣批判，包含着许多切中要害的见解。第二，他们对社会主义新制度的描绘，闪烁着诸多天才的火花「A、B、C选项」空想社会主义理论缺陷主要表现在：第一，看到了资本主义必然灭亡的命运，却未能揭示资本主义必然灭亡的经济根源；第二，要求埋葬资本主义，却看不到埋葬资本主义的力量；第三，憧憬取代资本主义的理想社会，却找不到通往理想社会的现实道路马克思、恩格斯在新的历史条件下创立了唯物史观和剩余价值学说（即两大发现），从而超越了空想社会主义，创立了科学社会主义。1848年2月，马克思、恩格斯为世界上第一个无产阶级政党“共产主义者同盟”所写的党纲《共产党宣言》发表，标志着科学社会主义的问世","tips":"D选项明显错误，名字都叫“空想”，怎么能是“科学”的呢？","title":"第六章 · 社会主义的发展及其规律","module":"马原"},{"chapter":"第六章","section":"多选","no":7,"stem":"19世纪初期以圣西门、傅立叶、欧文为代表的空想社会主义是科学社会主义的直接思想来源。19世纪三大空想社会主义者的学说虽然“含有十分虚幻和空想的性质，但他们终究是属于一切时代最伟大的智士之列的，他们天才地预示了我们现在已经科学地证明了其正确性的无数真理”。空想社会主义与科学社会主义的根本区别在于（　　）","opts":{"A":"历史观不同","B":"对资本主义制度的态度不同","C":"实现理想的途径不同","D":"依靠的社会力量不同"},"ans":"ACD","point":"空想社会主义的产生、发展和局限性","explain":"空想社会主义虽然在批判资本主义制度和对未来社会的设想上作出伟大贡献，但它与科学社会主义存在原则区别。首先，历史观不同，他们受唯心史观的限制，不能认识历史发展的规律，必然陷入空想；其次，他们设想用和平的方法，即呼吁有产者援助的方法来实现自己的理想计划；第三，他们把无产阶级看作受苦最深的阶级予以同情，但却未把其作为建立新制度的社会依靠力量。因此，A、C、D是正确选项。B选项恰好是空想社会主义者的主要贡献，并为马克思、恩格斯所批判继承，构成科学社会主义的直接思想来源。因此B是干扰项。①「A选项」空想社会主义者（如圣西门、傅立叶）的学说建立在唯心史观基础上，认为社会进步依赖“理性”或“天才人物”的推动，例如欧文试图通过道德感化资本家实现社会改良。而科学社会主义以唯物史观为基石②「C、D选项」空想社会主义者主张通过和平改良（如示范社区实验）或依赖富人良心发现实现理想社会。例如，欧文在美国建立“新和谐公社”，但因脱离现实条件失败。科学社会主义则强调阶级斗争和无产阶级革命，认为必须通过暴力推翻资产阶级统治，建立无产阶级专政革命性是马克思主义的内在品质，是马克思主义的人民性、实践性和发展性的应有之义和必然要求；同时要牢记，马克思主义的革命性是建立在科学性基础上的，是与科学性高度统一的空想社会主义者对资本主义旧制度的辛辣批判，包含着许多切中要害的见解","notes":"","tips":"很多同学会觉得A选项书本上没学过，所以很难选择出来，其实仔细思索一下就能轻松判定，空想社会主义肯定是在马克思主义之前，那时当然没有唯物史观。","title":"第六章 · 社会主义的发展及其规律","module":"马原"},{"chapter":"第六章","section":"多选","no":8,"stem":"1926一1927年初，邓小平在莫斯科中山大学留学一年。此时正值列宁的新经济政策在莫斯科和整个苏联燎原般发展，国家经济全面开花，市场上商品丰富、品类繁多，商店、饭馆、咖啡馆随处可见。邓小平到中山大学第一天就收到了一大堆日用品，一日三餐也非常丰富。在此期间，邓小平还认真阅读和摘抄了苏联领导人关于新经济政策的许多论述。这一段经历对邓小平后来思考建设“有中国特色的社会主义”具有一定的启示。邓小平与列宁在如何建设社会主义的探索中有许多相通之处，主要有（　　）","opts":{"A":"优先发展重工业，快速实现从农业国到工业国的转变","B":"把大力发展生产力、提高劳动生产率放在首要地位","C":"学习和利用资本主义的文明成果","D":"在多种经济成分并存的条件下，利用商品、货币和市场发展经济"},"ans":"BCD","point":"社会主义在苏联的实践","explain":"列宁在社会主义建设上做的最有意义的探索就是创造性地开辟了一条有计划地利用商品货币关系建设社会主义的新道路，提出了新经济政策：废除余粮收集政策，实施实物税。停止配给制度，允许商品买卖。放松了贸易限制，鼓励外资企业投资，将资金与技术引进俄国。停止以没收的方式进行资本主义改造，改以租借和租让的方式，在一定范围内允许个体私营经济的存在。为邓小平建设社会主义的探索提供了借鉴。邓小平提出要以本国国情为出发点，探索社会主义建设新道路；社会主义本质是解放发展生产力，消灭剥削，消除两极分化，达到共同富裕；要借鉴资本主义世界一切适合本国国情的文明成果。在多种经济成分并存的条件下，利用商品、货币和市场发展经济。所以B、C、D选项是邓小平与列宁在建设社会主义的探索中的相通之处。A选项是斯大林的经济思想，可以排除。","notes":"①「B、C、D选项」在俄国社会主义革命取得胜利的初期，特别是实行新经济政策期间，列宁对苏维埃俄国如何建设社会主义进行了深刻的理论思考，提出了许多精辟的论述：首先，把建设社会主义作为一个长期探索、不断实践的过程；其次，把大力发展生产力、提高劳动生产率放在首要地位；再次，在多种经济成分并存的条件下，利用商品、货币和市场发展经济；最后，利用资本主义建设社会主义。列宁能够正视国情，面对一系列新情况和新问题，不拘泥于书本上已有的结论，而是“根据经验来谈论社会主义”（不能说是经验主义）2「A选项」优先发展重工业，快速实现从农业国到工业国的转变是斯大林的经济思想，讲的是苏联模式：苏联农业合作化是在20世纪30年代前中期完成的，苏联模式也是在这个时期形成的（列宁1924年逝世）真题思维点技脑海里一定要清晰重大历史事件的时间年份，千扰项极其容易在时间线上做文章。","tips":"","title":"第六章 · 社会主义的发展及其规律","module":"马原"},{"chapter":"第六章","section":"多选","no":9,"stem":"纵观全球，实现现代化是许多国家和民族的共同追求，但通往现代化的道路不止一条。中国通过一系列五年规划，成功探索出了一条不同于西方模式的现代化路径。这条道路既坚持社会主义根本方向，又吸收人类文明有益成果；既发挥政府战略规划作用，又激发市场主体活力；既追求经济发展，又促进社会公平正义。中国实践的成功，打破了“现代化=西方化”的迷思，展现了社会主义制度的生机活力。中国五年规划的实践及其成就，在理解社会主义发展道路的多样性上为我们提供的启示是（　　）","opts":{"A":"各国的生产力发展状况和社会发展阶段不同，决定了其现代化道路必然各具特色","B":"一个国家的历史文化传统深刻影响着其发展道路的选择与具体形态","C":"时代条件的变迁和实践的深入，会不断赋予社会主义发展道路新的内涵与形式","D":"社会主义发展道路的多样性主要体现在具体政策层面，其基本经济政治制度必须统一"},"ans":"ABC","point":"社会主义发展道路多样性的原因","explain":"中国作为最大的发展中国家，其独特的现代化路径印证了生产力水平和发展阶段是塑造道路特色的根本因素。中国道路深深植根于中华优秀传统文化，印证了历史文化传统是造成发展道路多样性的重要条件。中国五年规划内容的演进印证了时代发展和实践深化会不断为发展道路注入新内涵。A、B、C选项是正确答案。D选项错误，此选项片面理解了多样性的范畴。它承认政策层面的多样性，但主张“基本经济政治制度必须统一”。这与社会主义发展道路多样性的原理不符。多样性不仅体现在政策层面，也体现在基本制度的具体实现形式、体制架构等方面。各国国情不同，其社会主义基本制度的具体表现形式也必然有所不同。将“根本方向一致”（如坚持社会主义）等同于“基本制度必须统一”，是一种错误的理解。","notes":"1「A、B、C选项」社会主义发展道路多样性的原因在于：第一，各个国家的生产力发展状况和社会发展阶段决定了社会主义发展道路具有不同的特点；第二，历史文化传统的差异性是造成不同国家社会主义发展道路多样性的重要条件。各个国家或民族的历史文化传统，是其进行活动的既定前提和基础；第三，时代和实践的不断发展，是造成社会主义发展道路多样性的现实原因","tips":"不同社会主义国家在基本经济政治制度上存在差异。例如，中国实行社会主义市场经济体制，而古巴则保持了较为传统的计划经济模式。各国国情不同，其社会主义基本制度的具体表现形式也必然有所不同。","title":"第六章 · 社会主义的发展及其规律","module":"马原"},{"chapter":"第六章","section":"多选","no":10,"stem":"习近平指出：“当代中国的伟大社会变革，不是简单延续我国历史文化的母版，不是简单套用马克思主义经典作家设想的模板，不是其他国家社会主义实践的再版，也不是国外现代化发展的翻版。”这启示我们，中国特色社会主义（　　）","opts":{"A":"实现了科学社会主义基本原则与当代中国实际的有机结合","B":"既根植于中国大地、反映了中国人民意愿，又适应了中国和时代发展进步要求","C":"实现了科学社会主义基本原则与中华优秀传统文化的有机结合","D":"既坚持了科学社会主义基本原则，又具有鲜明的民族特色和时代特色"},"ans":"ABCD","point":"科学社会主义基本原则与中国特色社会主义","explain":"中国特色社会主义是根植于中国大地、反映中国人民意愿、适应中国和时代发展进步要求的科学社会主义，它实现了科学社会主义基本原则与当代中国实际、中华优秀传统文化的有机结合。中国特色社会主义既坚持了科学社会主义基本原则，又具有鲜明的民族特色和时代特色。A、B、C、D选项正确。","notes":"1「A、B、C、D选项」中国特色社会主义是根植于中国大地、反映中国人民意愿、适应中国和时代发展进步要求的科学社会主义，它实现了科学社会主义基本原则与当代中国实际、中华优秀传统文化的有机结合。中国特色社会主义既坚持了科学社会主义基本原则，又具有鲜明的民族特色和时代特色中国特色社会主义写出了科学社会主义的“新版本”。当代中国的伟大社会变革，不是简单延续我国历史文化的母版，不是简单套用马克思主义经典作家设想的模板，不是其他国家社会主义实践的再版，也不是国外现代化发展的翻版","tips":"","title":"第六章 · 社会主义的发展及其规律","module":"马原"},{"chapter":"第六章","section":"多选","no":11,"stem":"马克思、恩格斯创立了科学社会主义理论，并提出了正确对待科学社会主义基本原则的科学态度。他们一方面强调这些原则的正确性，另一方面又反对将这些原则当作一成不变的教条。他们在《共产党宣言》1872年德文版序言中指出：“不管最近25年来的情况发生了多大的变化，这个《宣言》中所阐述的一般原理整个说来直到现在还是完全正确的.这些原理的实际运用，正如《宣言》中所说的，随时随地都要以当时的历史条件为转移。”这启示我们（　　）","opts":{"A":"必须始终坚持科学社会主义基本原则，反对任何背离科学社会主义基本原则的错误倾向","B":"坚持科学社会主义基本原则不能动摇，它提供了解决特殊问题的具体方案","C":"要善于把科学社会主义基本原则与本国实际和时代特征相结合，创造性地回答和解决革命、建设、改革中的重大问题","D":"紧跟时代和实践的发展，在不断总结新鲜经验中进一步丰富和发展科学社会主义基本原则"},"ans":"ACD","point":"正确把握科学社会主义基本原则","explain":"题干中“他们一方面强调这些原则的正确性，另一方面又反对将这些原则当作一成不变的教条”启示我们：第一，必须始终坚持科学社会主义基本原则，反对任何背离科学社会主义基本原则的错误倾向。第二，要善于把科学社会主义基本原则与本国实际和时代特征相结合，创造性地回答和解决革命、建设、改革中的重大问题。第三，紧跟时代和实践的发展，在不断总结新鲜经验中进一步丰富和发展科学社会主义基本原则。A、C、D选项是正确答案。科学社会主义基本原则揭示的是一般性规律，而不是向人们提供解决特殊问题的具体方案，B为干扰项。","notes":"「B选项」马克思主义经典作家并没有给我们提供各国社会主义发展道路的现成方案。马克思主义不是教条，而是方法。如果选项中出现“现成答案”“现成理想方案”“规定了具体制度、具体方案”等，多为干扰项","tips":"","title":"第六章 · 社会主义的发展及其规律","module":"马原"},{"chapter":"第六章","section":"多选","no":12,"stem":"．社会主义是一项薪新的事业，其建设必然是一个不断探索的长期过程。在经济文化相对落后的国家建设社会主义，更具有历史长期性。这是由于（　　）","opts":{"A":"生产力发展状况的制约","B":"经济基础和上层建筑发展状况的制约","C":"国际环境的严峻挑战","D":"马克思主义执政党对社会主义发展道路的探索和对社会主义建设规律的认识"},"ans":"ABCD","point":"社会主义建设过程的长期性","explain":"社会主义是一项薪新的事业，其建设必然是一个不断探索的长期过程。在经济文化相对落后的国家建设社会主义，更具有历史长期性。第一，生产力发展状况的制约。第二，经济基础和上层建筑发展状况的制约。第三，国际环境的严峻挑战。第四，马克思主义执政党对社会主义发展道路的探索和对社会主义建设规律的认识，需要一个长期的过程。因此，对于经济文化相对落后的国家建设社会主义的长期性，我们必须有充分的估计。A、B、C、D都是正确选项。","notes":"1「A、B、C、D选项」社会主义建设长期性的原因主要有：1）生产力发展状况的制约2）经济基础和上层建筑发展状况的制约3）国际环境的严峻挑战4）马克思主义执政党对社会主义发展道路的探索和对社会主义建设规律的认识，需要一个长期的过程社会主义发展道路多样性的原因在于：1）各个国家的生产力发展状况和社会发展阶段决定了社会主义发展道路具有不同的特点2）历史文化传统的差异性是造成不同国家社会主义发展道路多样性的重要条件。各个国家或民族的历史文化传统，是其进行活动的既定前提和基础3）时代和实践的不断发展，是造成社会主义发展道路多样性的现实原因社会主义在发展过程中，由于各国国情的特殊性，即经济、政治、文化的差异性，生产力发展水平的不同，无产阶级政党自身成熟程度的不同，阶级基础与群众基础的构成状况的不同，革命传统不同，以及历史和现实的、国内和国际的各种因素交互作用，社会主义的发展道路必然呈现出多样性的特点","tips":"","title":"第六章 · 社会主义的发展及其规律","module":"马原"},{"chapter":"第六章","section":"多选","no":13,"stem":"列宁在谈到向社会主义转变时指出：“一切民族都将走向社会主义，这是不可避免的，但是一切民族的走法却不会完全一样，在民主的这种或那种形式上，在无产阶级专政的这种或那种形态上，在社会生活各方面的社会主义改造的速度上，每个民族都会有自己的特点。”决定社会主义发展道路必然具有多样性的原因有（　　）","opts":{"A":"各国经济、政治、文化的差异性","B":"各国生产力发展水平的不同","C":"各国无产阶级政党自身成熟程度的不同","D":"各国阶级基础与群众基础的构成状况的不同"},"ans":"ABCD","point":"社会主义发展道路多样性的原因","explain":"社会主义在发展过程中，由于各国国情的特殊性，即经济、政治、文化的差异性，生产力发展水平的不同，无产阶级政党自身成熟程度的不同，阶级基础与群众基础的构成状况的不同，革命传统不同，以及历史和现实的、国内和国际的各种因素交互作用，社会主义的发展道路必然呈现出多样性的特点。A、B、C、D选项均正确。","notes":"","tips":"","title":"第六章 · 社会主义的发展及其规律","module":"马原"},{"chapter":"第六章","section":"多选","no":14,"stem":"纵观社会主义的发展历程，可以看到一个突出特点，即社会主义是在实践中开拓前进、不断发展的。对此正确的认识是（　　）","opts":{"A":"社会主义是亿万人民群众的伟大实践","B":"实践探索中出现的某种曲折会改变社会主义的前进趋势","C":"社会主义在实践中开拓前进必须遵循客观规律","D":"以自信担当、开拓奋进的姿态走向社会主义光明未来"},"ans":"ACD","point":"社会主义在实践中开拓前进","explain":"纵观社会主义的发展历程，可以看到一个突出特点，即社会主义是在实践中开拓前进、不断发展的。第一，在实践中开拓前进是社会主义事业发展的必然要求。社会主义是亿万人民群众的伟大实践。第二，社会主义在实践中开拓前进必须遵循客观规律。社会主义在实践中开拓前进必须遵循人类社会发展规律、社会主义建设规律、共产党执政规律。第三，以自信担当、开拓奋进的姿态走向社会主义光明未来。A、C、D是正确选项社会主义实践是一个不断探索的过程，实践探索中出现的某种曲折并不改变社会主义的前进趋势，推进社会主义实践发展必须有开拓奋进的精神状态。B选项是干扰项。","notes":"1「B选项」实践探索中出现某种曲折并不改变社会主义的前进趋势。事物的发展是前进性与曲折性的统一。前途是光明的，道路是曲折的添真题思维点拔历史趋势。社会主义代替资本主义是人类社会发展的客观规律，这一趋势不会因暂时的曲折而改变。例如20世纪80年代末90年代初，苏联解体、苏共垮台、东欧剧变，世界社会主义遭受严重挫折，但社会主义并没有灭亡，反而焕发出蓬勃生机活力，社会主义在经历曲折后依然能够继续前进。","tips":"","title":"第六章 · 社会主义的发展及其规律","module":"马原"},{"chapter":"第七章","section":"单选","no":1,"stem":"恩格斯在《共产主义者和卡尔·海因岑》中写道：“共产主义不是教义，而是运动。它不是从原则出发，而是从事实出发。共产主义者不是把某种哲学作为前提，而是把迄今为止的全部历史，特别是这一历史目前在文明各国造成的实际结果作为前提。”这说明在预见未来共产主义社会的基本特征上（　　）","opts":{"A":"无法从资本主义社会中寻找灵感","B":"现实中的社会主义社会与共产主义社会从社会性质上看存在根本差别","C":"要对各种细节进行具体描绘","D":"从社会主义社会中应该比从资本主义社会中得到的启示更多、更直接、更有教益"},"ans":"D","point":"预见未来社会的方法论原则","explain":"预见未来共产主义社会的基本特征，既从资本主义社会中寻找灵感，更从社会主义社会的建设与发展中寻找启示。因此，在对未来共产主义社会的认识上，从社会主义社会中得到的启示应该比从资本主义社会中得到的启示更多、更直接、更有教益。D选项正确。预见未来共产主义社会的基本特征，要从资本主义社会中寻找灵感。A选项错误。现实中的社会主义社会是共产主义社会的初级阶段，虽然它距离未来社会的高级阶段即典型的共产主义社会尚远，但从社会性质上来说是一致的。B选项错误。马克思、恩格斯在展望未来社会时，总是只限于指出未来社会发展的方向、原则和基本特征，而把具体情形留给后来的实践去回答。C选项错误。","notes":"①「C选项」空想社会主义的局限性恰恰在于对未来社会作了过于详尽的细节描绘。马克思、恩格斯立足于揭示未来社会的一般特征，而不对各种细节作具体描绘\n②「B选项」现实中的社会主义社会是共产主义社会的初级阶段，虽然它距离未来社会的高级阶段即典型的共产主义社会尚远，但从社会性质上来说是一致的\n③「A选项」马克思和恩格斯正是通过对资本主义社会的深入分析，才揭示了其内在矛盾和发展规律，进而提出了共产主义理论。资本主义经济的发展为马克思主义的产生提供了经济、社会历史条件","tips":"题干中批判了海因岑将共产主义看作抽象结论的做法，强调共产主义是“运动”，是历史发展的必然结果。这表明他重视从现实的社会主义运动中取经验。模块马","title":"第七章 · 共产主义崇高理想及其最终实现","module":"马原"},{"chapter":"第七章","section":"单选","no":2,"stem":"马克思认为，到了共产主义社会，人摆脱了自然经济条件下对“人的依赖关系”，也摆脱了商品经济条件下对“物的依赖性”，实现了人的“自由个性”的发展。这种人的发展（　　）","opts":{"A":"主要是体力和智力得到发展","B":"是全体社会成员的发展","C":"是只有一部分人的发展","D":"仍然要以牺牲某些个人的发展为代价"},"ans":"B","point":"共产主义社会的基本特征","explain":"共产主义社会中人的自由而全面的发展指的是全体社会成员的发展，即每一个人的发展。应选B。共产主义社会中人的自由而全面的发展指的是每一个人的发展，而不是只有一部分人的发展。这种发展，不仅体力和智力得到发展，各方面的才能和工作能力得到发展，而且人的社会联系和社会交往也得到发展。那时，在人与人之间形成了事实上的平等，整个社会是和谐的，社会发展与个人发展实现了真正的统一，社会发展不再以牺性某些个人的发展为代价。A、C、D选项表述错误。","notes":"和谐是矛盾的一种特殊表现形式，和谐不代表没有矛盾，矛盾存在于一切事物中，存在于一切事物发展过程的始终。共产主义社会也有矛盾\n②「B、C、D选项」共产主义社会中人的自由而全面的发展指的是全体社会成员的发展，或每一个人的发展，而不是只有一部分人的发展。那时，在人与人之间形成了事实上的平等，整个社会是和谐的，社会发展与个人发展实现了真正的统一，社会发展不再以牺牲某些个人的发展为代价。共产主义是人类解放的实现，那时人类将最终从支配他们生活和命运的异己力量中解放出来，实现从必然王国向自由王国的飞跃，开始自觉地创造自己的历史共产主义社会的根本特征，马克思主义追求的根本价值目标：实现人的自由而全面的发展共产主义社会的基本特征：物质财富极大丰富，消费资料按需分配，社会关系高度和谐，人们精神境界极大提高，实现每个人自由而全面的发展，人类从必然王国向自由王国飞跃","tips":"","title":"第七章 · 共产主义崇高理想及其最终实现","module":"马原"},{"chapter":"第七章","section":"单选","no":3,"stem":"坚持和发展中国特色社会主义是中华民族通向共产主义的必由之路。要正确认识和把握共产主义远大理想与中国特色社会主义共同理想的关系。两者从范围上看是（　　）","opts":{"A":"最终理想与阶段性理想的关系","B":"最高纲领与最低纲领的关系","C":"全人类理想与全体中国人民理想的关系","D":"抽象理想与具体理想的关系"},"ans":"C","point":"共产主义远大理想与中国特色社会主义共同理想","explain":"坚持和发展中国特色社会主义是中华民族通向共产主义的必由之路。从范围上看，两者是全人类理想与全体中国人民理想的关系。C选项正确。共产主义远大理想与中国特色社会主义共同理想的关系，从时间上看，两者是最终理想与阶段性理想的关系，A选项不符合题意。从层次上看，两者是最高纲领与最低纲领的关系，B选项不符合题意。共产主义远大理想和中国特色社会主义共同理想都不是抽象的，共产主义远大理想是有着丰富内涵和科学依据的，是在对人类社会发展规律深刻认识基础上得出的科学结论；中国特色社会主义共同理想是立足中国国情，在实践中不断丰富和发展的具体目标，二者都是有着现实基础和实践指向的，并非抽象与具体的关系。D选项不合题意。","notes":"共产主义远大理想与中国特色社会主义共同理想的关系：1）从时间上看，远大理想与共同理想的关系是最终理想与阶段性理想的关系2）从层次上看，远大理想与共同理想的关系是最高纲领与最低纲领的关系3）从范围来看，远大理想与共同理想的关系也是全人类理想与全体中国人民理想的关系","tips":"","title":"第七章 · 共产主义崇高理想及其最终实现","module":"马原"},{"chapter":"第七章","section":"多选","no":4,"stem":"从历史上看，人们对未来社会的设想，往往源于对现实问题的思考与批判。正因为阶级社会特别是资本主义社会中存在着剥削和压迫，人们才设想未来社会没有剥削和压迫；正因为现实中有种种苦难，才诱发人们渴望未来的新世界没有苦难，并促使人们思考现实苦难的实质及根源。相对于空想社会主义而言，马克思、恩格斯对资本主义批判的高明之处在于他们（　　）","opts":{"A":"看到了资本主义社会的弊端","B":"揭示了资本主义弊端产生的根源","C":"揭示出资本主义发展中自我否定的力量","D":"发现资本主义的矛盾运动中孕育着的新社会因素，并以此对未来社会特点作出预见"},"ans":"BCD","point":"预见未来社会的方法论原则","explain":"马克思、恩格斯对资本主义批判的高明之处在于，他们不是只看到资本主义社会的弊端，而是进一步揭示出弊端的根源，揭示出资本主义发展中自我否定的力量，发现资本主义的矛盾运动中孕育着的新社会因素，并以此对未来社会特点作出预见。应选B、C、D。马克思、恩格斯虽然也看到了资本主义社会的端，但空想社会主义者也看到这一点，这并非他们对资本主义批判的高明之处。A选项是干扰项。","notes":"托马斯·莫尔于1516年发表的《乌托邦》是空想社会主义的开山之作空想社会主义思潮经历了三个历史发展阶段，即16一17世纪的早期空想社会主义、18世纪的空想平均共产主义、19世纪初期批判的空想社会主义19世纪上半叶，空想社会主义发展到最高阶段，以圣西门、傅立叶、欧文为代表的19世纪初期批判的空想社会主义是科学社会主义的直接思想来源空想社会主义在理论上的贡献主要表现在两个方面：第一，他们对资本主义旧制度的辛辣批判，包含着许多切中要害的见解。第二，他们对社会主义新制度的描绘，闪烁着诸多天才的火花5「B、C、D选项空想社会主义理论缺陷主要表现在：第一，看到了资本主义必然灭亡的命运，却未能揭示资本主义必然灭亡的经济根源；第二，要求埋葬资本主义，却看不到埋葬资本主义的力量；第三，憧憬取代资本主义的理想社会，却找不到通往理想社会的现实道路","tips":"","title":"第七章 · 共产主义崇高理想及其最终实现","module":"马原"},{"chapter":"第七章","section":"多选","no":5,"stem":"恩格斯强调：“我们是不断发展论者，我们不打算把什么最终规律强加给人类。关于未来社会组织方面的详细情况的预定看法吗？您在我们这里连它们的影子也找不到。”在展望未来社会的问题上，是否坚持科学的立场、观点、方法是（　　）","opts":{"A":"能否正确预见未来的基本前提","B":"能否正确把握社会发展方向的重要保障","C":"马克思主义与空想社会主义的根本区别","D":"能否准确预测未来社会具体情形的关键"},"ans":"ABC","point":"预见未来社会的方法论原则","explain":"在展望未来社会的问题上，是否坚持科学的立场、观点、方法，是能否正确预见未来的基本前提，是能否正确把握社会发展方向的重要保障，也是马克思主义与空想社会主义的根本区别。应选A、B、C。马克思、恩格斯在展望未来社会时，总是只限于指出未来社会发展的方向、原则和基本特征，而把具体情形留给后来的实践去回答。D选项表述错误。","notes":"「D选项」空想社会主义的局限性恰恰在于对未来社会作了过于详尽的细节描绘。马克思、恩格斯立足于揭示未来社会的一般特征，而不对各种细节作具体描绘在展望未来社会的问题上，是否坚持科学的立场、观点、方法是能否正确预见未来的基本前提，是能否正确把握社会发展方向的重要保障，也是马克思主义与空想社会主义的根本区别","tips":"","title":"第七章 · 共产主义崇高理想及其最终实现","module":"马原"},{"chapter":"第七章","section":"多选","no":6,"stem":"马克思主义经典作家站在科学的立场上，提出并自觉运用了预见未来社会的方法论原则。这些科学方法论原则主要有（　　）","opts":{"A":"在揭示人类社会发展一般规律的基础上指明社会发展的方向","B":"在剖析资本主义社会旧世界的过程中阐发未来新世界的特点","C":"在社会主义社会发展中不断深化对未来共产主义社会的认识","D":"立足于揭示未来社会的一般特征，而不对各种细节作具体描绘"},"ans":"ABCD","point":"预见未来社会的方法论原则","explain":"在展望未来社会的问题上，是否坚持科学的立场、观点、方法是能否正确预见未来的基本前提，也是马克思主义与空想社会主义的根本区别。马克思主义经典作家站在科学的立场上，提出并自觉运用了预见未来社会的方法论原则。这些科学方法论原则主要有：第一，在揭示人类社会发展一般规律的基础上指明社会发展的方向；第二，在剖析资本主义社会旧世界的过程中阐发未来新世界的特点；第三，在社会主义社会发展中不断深化对未来共产主义社会的认识；第四，立足于揭示未来社会的一般特征，而不对各种细节作具体描绘。应选A、B、C、D。","notes":"","tips":"","title":"第七章 · 共产主义崇高理想及其最终实现","module":"马原"},{"chapter":"第七章","section":"多选","no":7,"stem":"马克思主义经典作家揭示了共产主义社会的基本特征，各国马克思主义者在自身的实践中不断深化对这些特征的认识。共产主义社会的基本特征有（　　）","opts":{"A":"政府计划配置资源，消除阶级对立","B":"物质财富极大丰富，消费资料按需分配","C":"社会关系高度和谐，人们精神境界极大提高","D":"实现每个人自由而全面的发展，人类从必然王国向自由王国飞跃"},"ans":"BCD","point":"共产主义社会的基本特征","explain":"马克思主义经典作家揭示了共产主义社会的基本特征，各国马克思主义者在自身的实践中不断深化高度和谐，人们精神境界极大提高；三是实现每个人自由而全面的发展，人类从必然王国向自由王国飞跃。应选B、C、D。在共产主义社会，由于生产力高度发达，生产资料归全社会所有，社会生产将按照自然的、合理的方式进行组织和调节，而不是简单的计划经济体制。计划经济体制是特定历史阶段的经济运行方式，共产主义社会的经济运行更强调根据社会需要和资源状况进行灵活、高效的配置，且人们的劳动自觉性和创造性得到充分发挥，不需要依靠传统的计划指令来强制安排生产。A选项为干扰项。","notes":"「D选项」共产主义社会的根本特征，马克思主义追求的根本价值目标：实现人的自由而全面的发展\n②「B、C选项」共产主义社会的基本特征：物质财富极大丰富，消费资料按需分配，社会关系高度和谐，人们精神境界极大提高，实现每个人自由而全面的发展，人类从必然王国向自由王国飞跃\n③「A选项」政府计划配置资源不符合共产主义特征：共产主义社会实行生产资料公有制，资源配置不依赖政府行政计划。政府作为阶级统治工具将随阶级消亡而失去存在意义4「A选项」国家不是从来就有的（是历史的）它是社会发展到一定历史阶段的产物，是阶级矛盾不可调和的产物。国家的实质是一个阶级统治另一个阶级的工具","tips":"","title":"第七章 · 共产主义崇高理想及其最终实现","module":"马原"},{"chapter":"第七章","section":"多选","no":8,"stem":"社会主义运动的实践，特别是社会主义国家的兴起和不断发展，已经并正在用事实证明着共产主义理想实现的必然性。共产主义理想一定会实现的依据是（　　）","opts":{"A":"人们对美好社会的向往","B":"人类社会发展规律","C":"无产阶级的革命斗争","D":"资本主义社会的基本矛盾发展"},"ans":"BD","point":"实现共产主义是历史发展的必然","explain":"共产主义理想一定会实现，是以人类社会发展规律以及资本主义社会的基本矛盾发展为依据的。社会主义运动的实践，特别是社会主义国家的兴起和不断发展，已经并正在用事实证明着共产主义理想实现的必然性。B、D选项正确。人们对美好社会的向往是一种主观愿望，虽然对社会发展有一定推动作用，但不能作为共产主义理想一定会实现的客观依据。不同的人对美好社会的理解和向往各不相同，且这种向往本身并不能直接决定社会发展的必然趋势。A选项是干扰项。无产阶级的革命斗争是实现共产主义的重要手段和动力，但不是共产主义一定会实现的根本依据。无产阶级革命斗争的开展是基于社会发展规律和资本主义基本矛盾等客观因素，它是推动社会变革的具体行动，而不是决定共产主义必然实现的内在依据。C选项是干扰项。","notes":"","tips":"A选项类似的唯心主义类错误是真题干扰项惯用的命题思路。此题关键是C选项很多同学误选，需注意革命斗争是实现手段，不是实现依据。斗争也有胜有败，巴黎公社就失败了，好比考研是读研的手段，不一定是读研的依据。依据更偏向理论、规律层面的东西，而非实践手段。","title":"第七章 · 共产主义崇高理想及其最终实现","module":"马原"},{"chapter":"第七章","section":"多选","no":9,"stem":"马克思主义不仅从社会形态更替规律上对共产主义理想实现的必然性作了一般性的历史观论证，而且通过对资本主义社会的科学批判“病理解剖”作了具体实证的阐明。在深入研究资本主义社会，特别是研究资本主义的经济运动之后，马克思（　　）","opts":{"A":"揭示了资本主义生产方式的特点，论证了资本主义发展自我否定的趋势","B":"揭示了生产社会化与生产资料资本主义私人占有之间的基本矛盾，论证了资本主义的历史暂时性","C":"揭示了资本主义剥削的秘密与资本主义的非正义性，论证了工人阶级推翻旧世界、建设新世界的历史使命","D":"揭示了工人阶级和资产阶级斗争的发展规律和趋势，论证了工人阶级解放斗争胜利的必然性"},"ans":"ABCD","point":"实现共产主义是历史发展的必然","explain":"马克思主义不仅从社会形态更替规律上对共产主义理想实现的必然性作了一般性的历史观论证，而且通过对资本主义社会的科学批判与“病理解剖”作了具体实证的阐明。马克思深入研究资本主义社会，特别是研究资本主义的经济运动，揭示了资本主义生产方式的特点，论证了资本主义发展自我否定的趋势；揭示了生产社会化与生产资料资本主义私人占有之间的基本矛盾，论证了资本主义的历史暂时性；揭示了资本主义剥削的秘密与资本主义的非正义性，论证了工人阶级推翻旧世界、建设新世界的历史使命；揭示了工人阶级和资产阶级斗争的发展规律和趋势，论证了工人阶级解放斗争胜利的必然性。A、B、C、D选项均正确。","notes":"","tips":"作用、意义、具体举措类题目的选项只要表述逻辑合理，符合材料主题范围，说不出明确错误那就选上。","title":"第七章 · 共产主义崇高理想及其最终实现","module":"马原"},{"chapter":"第一章","section":"单选","no":1,"stem":"毛泽东在1938年党的六届六中全会上指出：“没有抽象的马克思主义，只有具体的马克思主义·…马克思主义的中国化，使之在其每一表现中带着中国的特性，即是说，按照中国的特点去应用它。”这一论述标志着（　　）","opts":{"A":"“马克思主义的中国化”这一命题的正式提出","B":"马克思列宁主义基本原理同中国具体实际进行“第二次结合”","C":"毛泽东思想实现了马克思主义中国化时代化的第一次历史性飞跃","D":"党把马克思列宁主义确立为指导思想"},"ans":"A","point":"马克思主义中国化时代化的提出","explain":"1938年，毛泽东在党的六届六中全会上作了《论新阶段》的报告，强调：“没有抽象的马克思主义，只有具体的马克思主义………马克思主义的中国化，使之在其每一表现中带着中国的特性，即是说，按照中国提出。A选项正确。B选项马克思列宁主义基本原理同中国具体实际进行“第二次结合”是在社会主义革命和建设时期。C选项毛泽东思想实现了马克思主义中国化时代化的第一次历史性飞跃是在毛泽东思想形成之后。D选项党把马克思列宁主义确立为指导思想是在党成立之时。","notes":"①「A选项」关于中共六届六中全会（1938年9月11日）的知识点总结：1）在六届六中全会上，毛泽东作《论新阶段》政治报告，第一次提出“马克思主义中国化”的科学命题。它源于对中国革命进程中正反两个方面的实践经验的科学总结2）中共六届六中全会是一次具有重大历史意义的会议。毛泽东后来指出：“六中全会是决定中国之命运的。”全会基本纠正了王明的右倾错误，进一步巩固了毛泽东在全党的领导地位，统一了全党的思想和步调，推动了各项工作迅速发展马克思主义与中国实际的“第一次结合”是指马克思主义与新民主主义革命结合。第一次结合的理论成果是毛泽东思想\n③「B选项」马克思主义与中国实际的“第二次结合”是指马克思主义与中国社会主义建设相结合。毛泽东提出这一任务但没有完成4「C选项」马克思主义中国化时代化三次飞跃：一飞：毛泽东思想二飞：中国特色社会主义理论体系三飞：习近平新时代中国特色社会主义思想","tips":"中国共产党自成立之日起就将马克思列宁主义确立为指导思想，而非1938年，学史纲，脑海里必须清楚重大历史事件的时间线，避免一团乱。","module":"毛概","title":"第一章 · 毛泽东思想及其历史地位"},{"chapter":"第一章","section":"单选","no":2,"stem":"毛泽东同志把辩证唯物主义和历史唯物主义运用于无产阶级政党的全部工作，在中国革命和建设的长期艰苦斗争中形成了具有中国共产党人鲜明特色的立场、观点、方法，体现为（　　）","opts":{"A":"理论联系实际、密切联系群众、批评与自我批评","B":"土地革命、武装斗争、根据地建设","C":"统一战线、武装斗争、党的建设","D":"实事求是、群众路线、独立自主"},"ans":"D","point":"毛泽东思想活的灵魂","explain":"党的十一届六中全会通过的《中国共产党中央委员会关于建国以来党的若干历史问题的决议》指出，毛泽东思想的活的灵魂，是贯穿于上述各个理论组成部分的立场、观点和方法，它们有三个基本方面，即实事求是、群众路线、独立自主。D选项正确。A选项理论联系实际、密切联系群众、批评与自我批评是党的三大优良作风；B选项土地革命、武装斗争、根据地建设构成“工农武装割据”思想；C选项统一战线、武装斗争、党的建设是中国革命胜利的三大法宝。","notes":"①「D选项」党的十一届六中全会通过的《中国共产党中央委员会关于建国以来党的若干历史问题的决议》指出，毛泽东思想的活的灵魂，是贯穿于上述各个理论组成部分的立场、观点和方法，它们有三个基本方面，即实事求是、群众路线、独立自主\n②「C选项」毛泽东于1939年10月撰写的《《共产党人》发刊词》，总结中国共产党成立以来的历史经验，指出统一战线、武装斗争、党的建设是中国共产党在中国革命中战胜敌人的三个主要法宝\n③「C选项」三大法宝的关系：毛泽东指出，统一战线和武装斗争是中国革命的两个基本特点，是战胜敌人的两个基本武器。统一战线是实行武装斗争的统一战线，武装斗争是统一战线的中心支柱，实质上为工人阶级领导的农民战争。党的组织则是掌握统一战线和武装斗争这两个武器以实行对敌冲锋陷阵的英勇战士\n④「B选项」中国革命走农村包围城市、武装夺取政权的道路，根本在于处理好土地革命、武装斗争、农村革命根据地建设三者之间的关系：土地革命是中国革命的基本内容：武装斗争是中国革命的主要形式，是农村根据地建设和土地革命的强有力保证：农村革命根据地是中国革命的战略阵地，是进行武装斗争和开展土地革命的依托「A选项」党在领导新民主主义革命过程三大优良作风（1945年中共七大）：1）理论联系实际（放在首位）2）密切联系群众3）批评与自我批评","tips":"","module":"毛概","title":"第一章 · 毛泽东思想及其历史地位"},{"chapter":"第一章","section":"单选","no":3,"stem":"党的十一届六中全会通过的《关于建国以来党的若干历史问题的决议》对毛泽东同志的历史功过作出了全面评价，明确指出：“毛泽东同志是伟大的马克思主义者，是伟大的无产阶级革命家、战略家和理论家。他虽然在‘文化大革命’中犯了严重错误，但是就他的一生来看，他对中国革命的功绩远远大于他的过失。他的功绩是第一位的，错误是第二位的。”决议同时强调：“因为毛泽东同志晚年犯了错误，就企图否认毛泽东思想的科学价值，否认毛泽东思想对我国革命和建设的指导作用，这种态度是完全错误的。”基于上述决议精神，下列对毛泽东同志历史地位与毛泽东思想关系的理解，最准确的是（　　）","opts":{"A":"功绩为主，错误为次，其晚年错误不影响毛泽东思想科学体系的真理性","B":"功过分明，错误难免，其晚年错误属于探索革命和建设中的失误，需历史地看待","C":"功绩卓著，错误严重，其晚年错误与毛泽东思想科学体系无直接关联","D":"功绩第一，错误第二，其晚年错误是在坚持和发展毛泽东思想过程中犯的"},"ans":"A","point":"中国共产党和中国人民宝贵的精神财富","explain":"A选项最全面、准确地概括了决议的核心精神。它首先肯定了“功绩为主，错误为次”的基本结论，进而明确指出“其晚年错误不影响毛泽东思想科学体系的真理性”。这完全符合决议将毛泽东同志晚年的错误与毛泽东思想的科学体系严格区分开来的原则。毛泽东思想是被实践证明了的关于中国革命和建设的正确理论原则和经验总结，是党的集体智慧的结晶，毛泽东同志晚年的错误不属于毛泽东思想的内容。A选项正确。B选项“功过分明，错误难免”，并非决议的正式表述和严谨结论。决议的正式表述是“功绩是第一位的，错误是第二位的”。毛泽东同志晚年的错误是在探索中国社会主义建设道路过程中出现的，并不是在探索革命道路中出现的。C选项“功绩卓著，错误严重，其晚年错误与毛泽东思想科学体系无直接关联”：前半部分“功绩卓著，错误严重”的定性是准确的，但后半句“无直接关联”的表述不够严谨。决议指出，毛泽东同志晚年的错误正是“违反了他自己正确的东西”，即偏离了毛泽东思想的科学轨道。因此，错误与科学体系是“背离”的关系，说“无直接关联”弱化了这种背离的性质。D选项“功绩第一，错误第二，其晚年错误存在严重误导。决议明确指出，毛泽东同志晚年的错误，特别是“文化大革命”的严重错误，是“全局性的、长时间的“左’倾严重错误”，这些错误不是在坚持和发展毛泽东思想的过程中产生的，恰恰是背离了毛泽东思想科学原理的结果。","notes":"因为毛泽东同志晚年犯了错误，就企图否认毛泽东思想的科学价值，否认毛泽东思想对我国革命和建设的指导作用，这种态度是完全错误的\n②「A选项」毛泽东思想不等于毛泽东的思想：第一，毛泽东思想是一个科学体系，毛泽东晚年所犯的错误不属于毛泽东思想的科学体系第二，毛泽东思想是集体智慧的结晶，毛泽东的思想仅仅是指毛泽东一个人的思想","tips":"","module":"毛概","title":"第一章 · 毛泽东思想及其历史地位"},{"chapter":"第一章","section":"单选","no":4,"stem":"毛泽东同志强调：“我们中华民族有同自己的敌人血战到底的气概，有在自力更生的基础上光复旧物的决心，有自立于世界民族之林的能力”。我们党从中国实际出发，依靠党和人民力量进行革命、建设、改革的必然结论是（　　）","opts":{"A":"改革创新","B":"独立自主","C":"实事求是","D":"爱国奉献"},"ans":"B","point":"毛泽东思想活的灵魂","explain":"毛泽东的论述强调我们党从中国实际出发，依靠党和人民力量进行革命、建设、改革的必然结论是独立自主。中国共产党在领导革命、建设、改革的长期实践中，历来坚持独立自主开拓前进道路，这种独立自主的探索和实践精神，这种坚持走自己的路的坚定信心和决心，是我们党全部理论和实践的立足点，也是党和人民事业不断从胜利走向胜利的根本保证，A选项改革创新是时代精神的核心；C选项实事求是是中国共产党人认识世界、改造世界的根本要求：D选项爱国是民族精神的核心。","notes":"以爱国主义为核心的民族精神和以改革创新为核心的时代精神，都是中国精神的重要组成部分。二者紧密关联，都是中华民族赖以生存和发展的精神支撑1981年《关于建国以来党的若干历史问题的决议》客观评价了社会主义改造运动，确立毛泽东同志的历史地位，坚持和发展毛泽东思想（核心)，科学评价了毛泽东与毛泽东思想、科学概括了毛泽东思想的科学内涵和主要内容，指出毛泽东思想活的灵魂是实事求是、群众路线、独立自主","tips":"此题需要从材料中获取关键信息。材料中“自力更生”“自立于”等关键词也可以明显看出是强调“独立自主”。","module":"毛概","title":"第一章 · 毛泽东思想及其历史地位"},{"chapter":"第一章","section":"多选","no":5,"stem":"马克思主义中国化同时包含着马克思主义时代化的意蕴。我们党自成立以来，始终坚持把国化时代化是（　　）","opts":{"A":"为了应对国际共产主义运动低潮的挑战","B":"传承中华优秀传统文化的必然选择","C":"马克思主义理论本身发展的内在要求","D":"解决中国实际问题的客观需要"},"ans":"BCD","point":"马克思主义中国化时代化的提出","explain":"马克思主义中国化时代化，就是立足中国国情和时代特点，坚持把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合，深入研究和解决中国革命、建设、改革不同历史时期的实际问题，真正搞懂面临的时代课题，不断吸收新的时代内容，科学回答时代提出的重大理论和实践课题，创造新的理论成果。因此，推进马克思主义中国化时代化，是传承中华优秀传统文化的必然选择，是马克思主义理论本身发展的内在要求，是解决中国实际问题的客观需要。选B、C、D。马克思主义中国化时代化使马克思主义在中国落地生根与国际共产主义运动遭遇低潮挑战并不构成因果关系。A选项为干扰项。","notes":"马克思主义中国化时代化就是立足中国国情和时代特点，坚持把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合，深入研究和解决中国革命、建设、改革不同历史时期的实际问题。这是立足中国国情，跟国际无关洛真题思维点技马克思主义中国化时代化的核心驱动力来自中国内部实际需要，而非外部环境变化。中国共产党在推进马克思主义中国化时代化过程中，始终把解决中国实际问题放在首位，而不是被动应对国际形势变化。把“国内”与“国际”相混清也是真题干扰项常见命题思路之一","tips":"","module":"毛概","title":"第一章 · 毛泽东思想及其历史地位"},{"chapter":"第一章","section":"多选","no":6,"stem":"东汉史学家班固在《汉书》中称赞河间献王刘德“修学好古，实事求是”；唐代学者颜师古将“实事求是”注为“务得事实，每求真是也”；清代学者阮元说：“余之说经，推明古训，实事求是而已，非敢立异也。”马克思、恩格斯没有直接用过“实事求是”这个词汇。1941年，毛泽东在《改造我们的学习》一文中，首次用“实事求是”一词生动概括了马克思主义世界观和方法论，并在领导中国革命和建设过程中，实际上将其确立为党的思想路线。由此可知（　　）","opts":{"A":"毛泽东运用中国人民喜闻乐见的民族语言来阐述马克思主义，使其植根于中华优秀传统文化的土壤之中","B":"实事求是是一切真正的马克思主义者必须坚持的正确认识路线","C":"毛泽东倡导的“实事求是”只适用于中国革命和社会主义建设特定时期","D":"找到了马克思主义这个新的思想武器，并不意味着就能够自然而然地解决中国革命所面临的问题"},"ans":"ABD","point":"马克思主义中国化时代化的内涵；毛泽东思想活的灵魂","explain":"中华优秀传统文化“实事求是”一词源自东汉时期的《汉书》，代代传承发展到现在，说明“实事求是”作为一种治学态度和治学方法，在中国源远流长，马克思、恩格斯虽没有直接用过“实事求是”这个词汇，但毛泽东运用中国人民喜闻乐见的民族语言来阐述马克思主义，使其植根于中华优秀传统文化的土壤之中，首次用“实事求是”概括了马克思主义世界观和方法论，并将其确立为党的思想路线。这也意味着找到了马克思主义这个薪新的思想武器，并不意味着就能够自然而然地解决中国革命所面临的问题，还有一个如何把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合的问题。应选A、B、D。毛泽东同志把辩证唯物主义和历史唯物主义运用于无产阶级政党的全部工作，在中国革命和建设的长期艰苦斗争中形成了具有中国共产党人鲜明特色的立场、观点、方法，体现为实事求是、群众路线、独立自主三个基本方面。这是毛泽东思想活的灵魂。毛泽东思想是我们党的宝贵精神财富，将长期指导我们的行动，并不只适用于中国革命和社会主义建设特定时期。C选项是干扰项。","notes":"毛泽东思想活的灵魂：实事求是，群众路线，独立自主；其中实事求是是毛泽东思想的基本点，是毛泽东思想的精髓邓小平理论的活的灵魂、邓小平理论的精髓是解放思想、实事求是","tips":"C选项“只适用”明显表述过于绝对化，“实事求是”作为毛泽东思想的精髓，是中国化马克思主义的重要组成部分，它不仅适用于革命时期，也适用于建设、改革和新时代。","module":"毛概","title":"第一章 · 毛泽东思想及其历史地位"},{"chapter":"第一章","section":"多选","no":7,"stem":"以毛泽东同志为主要代表的中国共产党人，坚持马克思列宁主义必须与中国革命具体实际相结合的基本原则，在探索中国革命新道路的具体实践中，逐步认识和把握中国革命发展的客观规律，成功把党的工作重点由城市转入农村，开辟了农村包围城市、武装夺取政权的革命道路。在这一过程中，毛泽东同志同一度在党内盛行的多种错误倾向进行了斗争，这些错误倾向有（　　）","opts":{"A":"把马克思主义教条化","B":"把共产国际决议神圣化","C":"把苏联模式神圣化","D":"把苏联经验神圣化"},"ans":"ABD","point":"毛泽东思想形成发展的历史条件","explain":"以毛泽东同志为主要代表的中国共产党人，坚持马克思列宁主义必须与中国革命具体实际相结合的基本原则，在探索中国革命新道路的具体实践中，在同党内一度盛行的把马克思主义教条化、把共产国际决议和苏联经验神圣化错误倾向的斗争中，逐步认识和把握中国革命发展的客观规律，成功把党的工作重点由城市转入农村，开辟了农村包围城市、武装夺取政权的革命道路。A、B、D是正确选项。苏联模式又称斯大林模式，是苏联建设社会主义的一种模式，而题干未涉及社会主义建设。C选项是干扰项。真题思维点拔此题需要从材料中获取关键信息，材料中已经说明了探索中国革命道路这一过程，自然是在社会主义建设时期之前，而苏联模式又称斯大林模式，是苏联建设社会主义的一种模式，但题干未涉及社会主义建设。学史纲，脑海里必须清楚重大历史事件的时间线，避免一团乱。","notes":"","tips":"","module":"毛概","title":"第一章 · 毛泽东思想及其历史地位"},{"chapter":"第一章","section":"多选","no":8,"stem":"在土地革命战争后期和抗日战争时期，毛泽东思想得到系统总结和多方面展开而达到成熟。下列毛泽东的科学著作中，写于这个时期的有（　　）","opts":{"A":"《星星之火，可以燎原》","B":"《反对本本主义》","C":"《新民主主义论》","D":"《论联合政府》"},"ans":"CD","point":"毛泽东思想形成发展的过程","explain":"毛泽东思想的形成和发展大体上经历了马克思主义与中国实际的初步结合、毛泽东思想的基本形成、毛泽东思想的成熟和毛泽东思想的继续发展这样几个阶段。这期间，毛泽东撰写了大量的科学著作。其中，特别需要掌握毛泽东思想形成和成熟时期的代表著作。在毛泽东思想成熟时期，即土地革命战争后期和抗日战争时期，毛泽东的重要著作有：《实践论》《矛盾论》《《共产党人》发刊词》《中国革命和中国共产党》《新民主主义论》《论联合政府》等。本题涉及毛泽东思想成熟时期的重要著作，因此，四个选项中，C选项和D选项符合题意要求。在毛泽东思想基本形成时期，即土地革命战争前中期，毛泽东的重要著作有：《中国的红色政权为什么能够存在？》《井冈山的斗争》《星星之火，可以燎原》《反对本本主义》等。A选项、B选项是毛泽东思想基本形成时期的代表著作。","notes":"毛泽东思想的萌芽：关于新民主主义革命基本思想的提出，标志着毛泽东思想开始萌芽茅，时期为党的创立和大革命阶段；其主要代表作：1925年《中国社会各阶级分析》、1927年《湖南农民运动考察报告》\n②「A、B选项」毛泽东思想的初步形成：毛泽东在土地革命战争时期提出并深入阐述的农村包围城市武装夺取政权的思想，对红军和农村革命根据地的建立、巩固和发展发挥着根本指导作用，标志着毛泽东思想的初步形成。这一期间主要代表作为：1928年《中国的红色政权为什么能够存在？》、1928年《井冈山的斗争》、1930年《星星之火，可以燎原》1930年《反对本本主义》等\n③「C、D选项」毛泽东思想的成熟：在遵义会议至抗日战争时期：毛泽东对新民主主义革命理论作了系统的阐述，实现了马克思主义与中国革命实践相结合的历史性飞跃，标志着毛泽东思想得到多方面展开而趋于成熟。这一时期主要代表作为：《《共产党人）发刊词》《中国革命和中国共产党》《新民主主义论》《改造我们的学习》《论联合政府》等","tips":"","module":"毛概","title":"第一章 · 毛泽东思想及其历史地位"},{"chapter":"第一章","section":"多选","no":9,"stem":"毛泽东同志是马克思主义中国化的伟大开拓者。在党的六届六中全会上，他首次明确提出“马克思主义的中国化”命题，并深刻指出：“马克思主义必须和我国的具体特点相结合并通过一定的民族形式才能实现。”此后，他撰写《矛盾论》《实践论》等哲学著作，为马克思主义中国化奠定了坚实的哲学基础；系统阐述新民主主义革命理论，实现了马克思主义与中国实际相结合的第一次历史性飞跃。下列选项中，属于毛泽东同志对马克思主义中国化所作出的开创性贡献的是（　　）","opts":{"A":"首次明确提出“马克思主义中国化”的重大命题和任务","B":"深刻论证了马克思主义中国化的内在必然性与现实必要性","C":"系统构建了中国特色社会主义理论体系的整体框架","D":"开辟了通过调查研究实现理论联系实际的正确途径"},"ans":"ABD","point":"马克思主义中国化时代化的提出","explain":"1938年，毛泽东在党的六届六中全会作《论新阶段》报告，正式提出了“马克思主义的中国化”这一命题，这是具有里程碑意义的开创之举。毛泽东深刻阐述了马克思主义必须与中国具体实际相结合的道理，论证了离开中国特点来谈马克思主义只是抽象的空洞的马克思主义，从而阐明了马克思主义中国化的极端重要性。毛泽东大力倡导并身体力行调查研究，在《反对本本主义》中提出“没有调查，没有发言权”，在查研究”这一根本途径和方法。应选A、B、D。C选项“系统构建了中国特色社会主义理论体系的整体框架”错误。中国特色社会主义理论体系是在改革开放和社会主义现代化建设新时期逐步形成和发展的，其开创者是邓小平同志。毛泽东同志关于社会主义建设的探索是宝贵的，但并未“系统构建”中国特色社会主义理论体系的框架。这是将不同历史时期的理论成果混淆了。","notes":"②「D选项」关于《反对本本主义》的知识点总结：1）阐明了坚持辩证唯物主义的思想路线即坚持理论与实际相结合的原则的极端重要性的重要思想（这是独立自主思想的最初的明确表述）3）表现了毛泽东开辟新道路、创造新理论的革命首创精神\n③「C选项」中国特色社会主义理论体系，是在认真总结我国社会主义建设正反两方面的历史经验、科学判断党和国家发展所处历史方位的基础上形成并不断发展的。邓小平理论是中国特色社会主义理论体系的开篇之作，因此，邓小平理论的形成过程也就是中国特色社会主义理论体系的形成过程","tips":"","module":"毛概","title":"第一章 · 毛泽东思想及其历史地位"},{"chapter":"第一章","section":"多选","no":10,"stem":"我们只拥护‘正确的毛泽东思想’，而不是拥护错误的毛泽东思想。这种说法也是有错误的。”“这种说法”之所以错误，是因为（　　）","opts":{"A":"没有把毛泽东与党的其他领导人对毛泽东思想的贡献区分开","B":"没有把毛泽东思想与中国特色社会主义理论体系区分开","C":"没有把毛泽东思想与毛泽东的思想区分开","D":"没有把毛泽东晚年的错误与毛泽东思想的科学体系区分开"},"ans":"CD","point":"中国共产党和中国人民宝贵的精神财富","explain":"毛泽东思想是马克思主义在中国的运用与发展，是关于中国革命与建设的正确的理论原则与经验总结，是党的集体智慧的结晶。邓小平指出“有些同志说，我们只拥护‘正确的毛泽东思想，而不是拥护错误的毛泽东思想。”这就是要我们将毛泽东晚年所犯的错误同经过长期历史考验形成为科学理论的毛泽东思想区别开来，把毛泽东思想与毛泽东的思想区分开，只有这样才能完整准确地理解毛泽东思想、坚持和发展毛泽东思想。应选C、D。1979年时还没有中国特色社会主义理论这一理论成果。题干材料中也未提党的其他领导人对毛泽东思想的贡献。所以A、B选项不是材料表明的意思。","notes":"毛泽东思想不等于毛泽东的思想：第一，毛泽东思想是一个科学体系，毛泽东晚年所犯的错误不属于毛泽东思想的科学体系；第二，毛泽东思想是集体智慧的结晶，毛泽东的思想仅指毛泽东一个人的思想","tips":"","module":"毛概","title":"第一章 · 毛泽东思想及其历史地位"},{"chapter":"第一章","section":"多选","no":11,"stem":"毛泽东同志是我们党党的建设理论的奠基人。他明确提出要把党的建设作为一项“伟大的工程”来推进，并且成功领导实施了这一伟大工程。这体现在他（　　）","opts":{"A":"在马克思主义政党史上第一次科学地阐明了党的建设同党的政治路线的关系","B":"着重强调要从思想上建党，创造了通过批评与自我批评进行思想教育的整风形式","C":"概括形成了党的“三大作风”，成为中国共产党区别于其他任何政党的显著标志","D":"在探索跳出历史周期率的深刻思考中，给出了第一个答案，那就是“让人民来监督政府”"},"ans":"ABCD","point":"毛泽东思想的主要内容","explain":"毛泽东同志是我们党党的建设理论的奠基人。他在马克思主义政党史上第一次科学地阐明了党的建设同党的政治路线的关系，揭示了党的建设的基本规律，为加强党的建设指明了方向；着重强调要从思想上建党，创造了通过批评与自我批评进行思想教育的整风形式；创造性地运用民主集中制原则正确处理党内关系、维护党的团结统一；概括形成了党的“三大作风”，成为中国共产党区别于其他任何政党的显著标志；在探索跳出历史周期率的深刻思考中，给出了第一个答案，那就是“让人民来监督政府”，等等。新中国成立后，毛泽东同志积极探索执政党建设规律，强调要始终保持谦虚谨慎、戒骄戒躁、艰苦奋斗的作风，高度警惕并着力防范党员干部腐化变质，坚决惩治腐败等，积累了执政条件下党的建设的初步经验。","notes":"①「A选项」毛泽东在马克思主义政党史上第一次科学地阐明了党的建设同党的政治路线的关系，揭示了党的建设的基本规律，为加强党的建设指明了方向\n②「D选项」关于跳出历史周期率的问题，毛泽东在延安的窑洞里给出了第一个答案，即“让人民来监督政府”。经过百年奋斗特别是党的十八大以来新的实践，党又给出了第二个答案，即自我革命。全面从严治党是新时代党的自我革命的伟大实践，开辟了百年大党自我革命的新境界。勇于自我革命，是中国共产党区别于其他政党的显著标志，也是我们党最大的优势、最鲜明的品格\n③「B、C选项」中共七大总结党的建设的历史经验，把党在长期奋斗中形成的优良传统作风概括为三大作风，即理论和实践相结合的作风，和人民群众紧密地联系在一起的作风，自我批评的作风","tips":"","module":"毛概","title":"第一章 · 毛泽东思想及其历史地位"},{"chapter":"第二章","section":"单选","no":1,"stem":"毛泽东指出，解决中国一切革命问题的最基本的根据是（　　）","opts":{"A":"正确分析中国社会的阶级状况","B":"正确分析中国社会的经济结构","C":"认清中国社会的特殊国情","D":"认清中国社会的主要矛盾"},"ans":"C","point":"近代中国国情和中国革命的时代特征","explain":"1939年12月，毛泽东在《中国革命和中国共产党》中强调了认清中国国情的重要性。他说认清中国社会的性质，就是说，认清中国的国情，乃是认清一切革命问题的基本的根据，我们已经明白了中国社会的性质，亦即中国的特殊的国情，这是解决中国一切革命问题的最基本的根据。因此，C选项正确。况、主要矛盾等方面。也就是说“中国的特殊国情”，即“中国社会的性质”与中国社会的经济结构、阶级状况、主要矛盾等，是整体与局部的关系。中国社会的经济结构、阶级状况或主要矛盾等，都是“中国的特殊国情”，即反映“中国社会的性质”的某个具体方面的，都不是“中国的特殊国情”的全部。因此，A、B、D选项不符合题意。","notes":"中国社会的性质，就是说，认清中国的国情，乃是认清一切革命问题的基本根据。”","tips":"中国是一个半殖民地半封建社会，这一特殊国情决定了中国革命的特殊性。只有首先认清这一基本国情，才能进一步分析中国社会的主要矛盾、阶级状况、经济结构等具体问题，从而制定正确的革命路线和策略。","module":"毛概","title":"第二章 · 新民主主义革命理论"},{"chapter":"第二章","section":"单选","no":2,"stem":"1939年毛泽东在《中国革命和中国共产党》一文中，第一次提出了（　　）","opts":{"A":"新民主主义革命的总路线","B":"新民主主义的基本纲领","C":"新民主主义革命的科学概念","D":"新民主主义革命的正确道路"},"ans":"C","point":"","explain":"新民主主义革命的总路线应选C。1948年，毛泽东在晋绥干部会议上的讲话中完整地论述了新民主主义革命的总路线。1940年，毛泽东在《新民主主义论》中，阐述了新民主主义的政治、经济和文化。1945年，他在党的七大所作的政治报告《论联合政府》中，进一步把新民主主义的政治、经济和文化与党的基本纲领联系起来，进行了具体阐述，形成了新民主主义的基本纲领。在领导农村革命根据地的斗争实践中，毛泽东相继写下了《中国的红色政权为什么能够存在？》《井冈山的斗争》《星星之火，可以燎原》等文章，提出了“工农武装割据”思想，初步形成了农村包围城市的革命道路理论。A、B、D选项均不符合题意。","notes":"①「C选项」《中国革命和中国共产党》（1939年）：1）第一次提出新民主主义以及新民主主义革命这两个科学概念，指出所谓新民主主义革命，就是在无产阶级领导之下的人民大众的反帝反封建的革命（“晋绥完整加官资”）2第一次全面系统论述中国两半社会性质问题，提出革命的对象、革命的动力。强调认清中国国情乃是认清一切革命问题的基本依据\n②「A选项」《在晋绥干部会议上的讲话》（1948年）：1）第一次完整地论述了新民主主义革命的总路线和总政策（无产阶级领导的，人民大众的，反对帝国主义、封建主义和官僚资本主义的革命）2）提出了土地改革的总路线3）第一次把官僚资本主义、官僚资产阶级列为中国革命的对象和敌人，第一次有了“三大对象、三座大山、三大敌人”的说法\n③「B选项」《新民主主义论》（1940年）：1）指出中国革命必须分两步走：民主革命，社会主义革命2）阐述了新民主主义的政治、经济和文化纲领，论述了新民主主义共和国的国体、政体。1945年，在党的七大所作的政治报告《论联合政府》中，进一步把新民主主义的政治、经济和文化与党的基本纲领联系起来，进行了具体阐述，形成了新民主主义的基本纲领4④「D选项」新民主主义革命的“正确道路”通常指“农村包围城市、武装夺取政权”的革命道路。毛泽东思想的初步形成这一期间代表作为：1928年《中国的红色政权为什么能够存在？》、1928年《井冈山的斗争》、1930年《星星之火，可以燎原》、1930年《反对本本主义》等。","tips":"","module":"毛概","title":"第二章 · 新民主主义革命理论"},{"chapter":"第二章","section":"单选","no":3,"stem":"1925年毛泽东在《中国社会各阶级的分析》中指出，中国过去一切革命斗争成效甚少，其基本原因是（　　）","opts":{"A":"没有找到革命的新道路","B":"没有扩大民主主义的宣传","C":"没有到群众中做实际的调查","D":"没有团结真正的朋友以攻击真正的敌人"},"ans":"D","po
