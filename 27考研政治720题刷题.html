tes":"团结奋斗是中国共产党和中国人民最显著的精神标识\n②「D选项」促进中华儿女大团结，是新时代爱国统一战线的历史责任统战工作的本质要求是大团结大联合，解决的就是人心和力量问题。统一战线的工作对象为党外人士，重点是其中的代表人士。统一战线是做人的工作，搞统一战线是为了壮大共同奋斗的力量统战工作的关键是要坚持求同存异，发扬“团结一批评一一团结”的优良传统，在尊重多样性中寻求一致性，找到最大公约数、画出最大同心圆统一战线是党领导的统一战线。党的领导是统一战线最鲜明的特征，坚持党的领导是统一战线最核心最根本的问题。加强新时代统一战线工作，根本在于坚持党的领导","tips":"","module":"习思想","title":"第八章 · 发展全过程人民民主"},{"chapter":"第八章","section":"多选","no":10,"stem":"中国治理之所以取得举世瞩目的成就，很重要的一条经验就是，在中国共产党领导下走中国特色社会主义政治发展道路，坚持和发展全过程人民民主。有事好商量，众人的事情由众人商量，找到全社会意愿和要求的最大公约数，是人民民主的真谛。全过程人民民主不仅有完整的制度程序，而且有完整的参与实践，是广泛的、真实的、管用的。这是因为全过程人民习近平新时代中国特色社会主义思想概论民主是（　　）","opts":{"A":"全体人民共同持续参与、全面覆盖的民主体系","B":"真真切切落实到国家政治生活和社会生活各方面、为全体人民真真切切感知和认同的民主体系","C":"具有显著的实践优越性的民主体系","D":"具有超阶级性的“普世民主”体系"},"ans":"ABC","point":"全过程人民民主是最广泛、最真实、最管用的民主","explain":"A选项全体人民共同持续参与、全面覆盖的民主体系体现全过程人民民主的广泛性；B选项真真切切落实到国家政治生活和社会生活各方面、为全体人民真真切切感知和认同的民主体系体现全过程人民民主的真实性；C选项具有显著的实践优越性的民主体系体现全过程人民民主的管用性。A、B、C是正确选项。D选项错误，马克思主义认为，民主具有阶级性和历史性，不存在超阶级的“普世民主”。西方自由民主是资本主义经济基础的上层建筑，服务于资产阶级利益；全过程人民民主是社会主义制度的内在要求，是人民群众在党的领导下创造的新型民主形态。题干强调“在中国共产党领导下走中国特色社会主义政治发展道路”，已明确民主的社会主义性质。","notes":"「D选项」“普世价值”丰“共同价值”，例如民主就是是全人类共同价值之一。考研政治没有“普世我国全过程人民民主实现了过程民主和成果民主、程序民主和实质民主、直接民主和间接民主、人民民主和国家意志相统一，是全链条、全方位、全覆盖的民主，是最广泛、最真实、最管用的社会主义民主（三全三最）","tips":"","module":"习思想","title":"第八章 · 发展全过程人民民主"},{"chapter":"第八章","section":"多选","no":11,"stem":"在我国，人民通过人民代表大会行使国家权力，各级人大都由民主选举产生，对人民负责，受人民监督；各级国家行政机关、监察机关、审判机关、检察机关都由人大产生，对人大负责，受人大监督。毛泽东同志曾形象地说：“我们的主席、总理，都是由全国人民代表大会产生出来的，一定要服从全国人民代表大会，不能跳出如来佛的手掌。”这充分说明人民代表大会制度是（　　）","opts":{"A":"我国的根本政治制度","B":"广大人民群众最直接的政治参与的制度保障","C":"坚持党的领导、人民当家作主、依法治国有机统一的根本政治制度安排","D":"实现我国全过程人民民主的重要制度载体"},"ans":"ACD","point":"加强人民当家作主制度保障","explain":"人民代表大会制度是我国的根本政治制度，是符合我国国情和实际、体现社会主义国家性质、保证人民当家作主、保障实现中华民族伟大复兴的好制度，能够将坚持党的领导、人民当家作主、依法治国有机统一起来，也是实现我国全过程人民民主的重要制度载体。应选A、C、D。广大人民群众最直接的政治参与主要在基层，最直观的当家作主感受也主要在基层。人民通过人民代表大会行使国家权力，各级人大都由民主选举产生，这是一种间接民主。B是干扰项。","notes":"","tips":"","module":"习思想","title":"第八章 · 发展全过程人民民主"},{"chapter":"第八章","section":"多选","no":12,"stem":"保证和支持人民当家作主，通过依法选举、让人民的代表来参与国家生活和社会生活的管理是十分重要的，通过选举以外的制度和方式让人民参与国家生活和社会生活的管理也是十分重要的。人民通过选举、投票行使权利和人民内部各方面在重大决策之前进行充分协商，尽可能就共同性问题取得一致意见，这两种民主形式（　　）","opts":{"A":"不是相互替代、相互否定的，而是相互补充、相得益彰的","B":"共同构成了中国社会主义民主政治的制度特点和优势","C":"都是中国社会主义民主政治中独特的、独有的、独到的民主形式","D":"都是实践全过程人民民主的重要形式"},"ans":"ABD","point":"全面发展协商民主","explain":"人民通过选举、投票行使权利和人民内部各方面在重大决策之前进行充分协商，尽可能就共同性问题取得一致意见，这两种民主形式不是相互替代、相互否定的，而是相互补充、相得益彰的，共同构成了中国社会主义民主政治的制度特点和优势。体现了我国的全过程人民民主是过程民主和成果民主的统一、是程序民主和实质民主的统一、是直接民主和间接民主的统一、是人民民主和国家意志的统一。应选A、B、D。协商民主是中国社会主义民主政治中独特的、独有的、独到的民主形式。C选项表述错误。","notes":"1「C选项」协商民主是中国社会主义民主政治的特有形式和独特优势有事好商量，众人的事情由众人商量，找到全社会意愿和要求的最大公约数，是人民民主的真谛\n③「A、B选项」人民通过选举、投票行使权利（即选举民主）和人民内部各方面在重大决策之前进行充分协商，尽可能就共同性问题取得一致意见（即协商民主），这两种民主形式不是相互替代、相互否定的，而是相互补充、相得益彰的，共同构成了中国社会主义民主政治的制度特点和优势","tips":"","module":"习思想","title":"第八章 · 发展全过程人民民主"},{"chapter":"第八章","section":"多选","no":13,"stem":"从城乡社区里的村（居）民议事会、村（居）民论坛、民主愿谈会、民主听证会到党代表、人大代表、政协委员联合进社区，广大人民群众在火热的基层生活中，摸索创造了一个又一个充满烟火气的民主实现形式。人民群众通过这些民主实践，围绕涉及自身利益的实际问题进行广泛协商，利益得到协调，矛盾有效化解。基层民主的建立和发展（　　）","opts":{"A":"保障了基层群众广泛、直接、有效行使民主权利","B":"彰显了人民当家作主的广泛性、真实性、有效性","C":"直接决定了国家重大方针政策的制定","D":"为我国社会长期稳定提供了重要政治基础和制度保障"},"ans":"ABD","point":"积极发展基层民主","explain":"基层民主的建立和发展，保障了基层群众广泛、直接、有效行使民主权利，彰显了人民当家作主的广泛性、真实性、有效性。人民群众通过这些民主实践，围绕涉及自身利益的实际问题进行广泛协商，利益得到协调，矛盾有效化解，为我国社会长期稳定提供了重要政治基础和制度保障。应选A、B、D。基层民主主要处理基层事务，国家重大政策由国家层面的民主程序决定，基层民主是参与途径之一，但不能直接决定，所以C选项错误。","notes":"①「C选项」基层民主主要处理基层事务，国家重大政策由国家层面的民主程序决定，基层民主是参与途径之一，但不能直接决定\n②「A、B选项」广大人民群众最直接的政治参与主要在基层，最直观的当家作主感受也主要在基层。发展基层民主，是实现人民有效政治参与的重要渠道，是人民当家作主的有效途径，是社会主义民主最广泛的实践","tips":"","module":"习思想","title":"第八章 · 发展全过程人民民主"},{"chapter":"第八章","section":"多选","no":14,"stem":"浙江省杭州市临安区在辖区内村社打造“民生议事堂”平台，通过村民、干部、乡贤等多方代表现场协商，将民意转化为对策建议和服务项目，全面推进基层工作，着力提升村社基层民主水平。发展基层民主，完善基层群众自治制度是（　　）","opts":{"A":"社会主义民主政治建设的基础","B":"我国根本政治制度的核心内容","C":"保障人民当家作主最直接的形式","D":"全过程人民民主的重要体现"},"ans":"ACD","point":"积极发展基层民主","explain":"基层民主是全过程人民民主的重要体现。完善基层群众自治制度，是社会主义民主政治建设的基础，是保障人民当家作主最直接的形式。“民生议事堂”是广大人民在火热的基层生活中，探索创造了一个充满烟火气的民主实现形式。人们通过这些接地气、聚人气的民主实践，使全过程人民民主在基层得到充分实现。应选A、C、D。我国的根本政治制度是人民代表大会制度，其核心是“人民通过人民代表大会行使国家权力”。而基层民主（如村居民自治、“民生议事堂”等）属于基层群众自治制度，是我国的基本政治制度之一","notes":"①「B选项」我国的根本政治制度是人民代表大会制度，其核心是“人民通过人民代表大会行使国家权力”\n②「C选项」广大人民群众最直接的政治参与主要在基层，最直观的当家作主感受也主要在基层。发展基层民主，是实现人民有效政治参与的重要渠道，是人民当家作主的有效途径，是社会主义民主最广泛的实践。完善基层群众自治制度，是社会主义民主政治建设的基础，是保障人民当家作主最直接的形式我国的基本政治制度包括中国共产党领导的多党合作和政治协商制度、民族区域自治制度以及基层群众自治制度","tips":"","module":"习思想","title":"第八章 · 发展全过程人民民主"},{"chapter":"第八章","section":"多选","no":15,"stem":"中华民族是有着五千多年文明史的伟大民族。我国各民族共同开拓了祖国的辽阔疆域，共同缔造了统一的多民族国家，共同书写了辉煌的中国历史，共同创造了灿烂的中华文化，共同培育了伟大的民族精神。中华民族共同体的形成和发展是人心所向、大势所趋、历史必然。铸牢中华民族共同体意识是（　　）","opts":{"A":"维护各民族根本利益的必然要求","B":"实现中华民族伟大复兴的必然要求","C":"巩固和发展平等团结互助和谐社会主义民族关系的必然要求","D":"党的民族工作开创新局面的必然要求"},"ans":"ABCD","point":"铸牢中华民族共同体意识","explain":"中华民族共同体的形成是中华民族历史发展的必然结果。事实充分说明，对中华民族形成起决定作用的是对中华民族共同体的认同，而不是种族、血缘、地域、宗教等因素。只有铸牢中华民族共同体意识，才能构建起维护国家统一和民族团结的坚固思想长城，推动各民族共同维护好国家安全和社会稳定；只有铸牢中华民族共同体意识，才能增进各民族对中华民族的自觉认同，夯实我国民族关系发展的思想基础，推动中华民族成为认同度更高、凝聚力更强的命运共同体。铸牢中华民族共同体意识是维护各民族根本利益的必然要求，是实现中华民族伟大复兴的必然要求，是巩固和发展平等团结互助和谐社会主义民族关系的必然要求，是党的民族工作开创新局面的必然要求。应选A、B、C、D。","notes":"民族团结是我国各族人民的生命线，中华民族共同体意识是民族团结之本，是新时代党的民族工作的主线，也是民族地区各项工作的主线，对中华民族形成起决定作用的是对中华民族共同体的认同","tips":"具体作用意义政策类表述，符合材料主题且表述无明显错误就可以选，不用管自己有没有见过它。","module":"习思想","title":"第八章 · 发展全过程人民民主"},{"chapter":"第八章","section":"多选","no":16,"stem":"《中华人民共和国民族团结进步促进法》已由中华人民共和国第十四届全国人民代表大会第四次会议于2026年3月12日通过，《民族团结促进法》将“铸牢中华民族共同体意识”置于核心地位。下列选项中，属于该法为“铸牢中华民族共同体意识”所明确要求的举措有（　　）","opts":{"A":"引导各族人民牢固树立休戚与共、荣与共、生死与共、命运与共的共同体理念","B":"统筹推进经济、政治、文化、社会、生态文明建设，全面实现各民族共同繁荣发展","C":"坚持增进共同性、尊重和包容差异性的重要原则，促进各民族守望相助、和谐共处","D":"消除各民族在语言、风俗、宗教信仰等方面存在的差异性，促进民族融合"},"ans":"ABC","point":"铸牢中华民族共同体意识","explain":"《中华人民共和国民族团结促进法》总则第三条明确规定，铸牢中华民族共同体意识“应当引导各族人民牢固树立休戚与共、荣辱与共、生死与共、命运与共的共同体理念”。总则第四条规定，推进中华民族共同体建设“应当统筹经济、政治、文化、社会和生态文明建设，全面实现各民族共同繁荣发展”，这是铸牢意识的重要物质与社会基础。总则第六条明确规定“国家坚持增进共同性、尊重和包容差异性”，这是处理民族关系、铸牢意识的基本方法论和原则。A、B、C是正确选项。D选项错误。铸牢中华民族共同体意识是在尊重差异、包容多样的基础上增进共同性，而非“消除差异性”。我国法律保障各民族使用和发展自己的语言文字、保持或改革风俗习惯的自由。该项表述违背了民族政策的基本原则，也脱离了实际情况。","notes":"","tips":"尊重差异、包容多样，目的是增进共同性，而非消除各民族在长期历史发展中形成的语言、风俗等合理差异。其余具体作用意义政策类表述，符合材料主题且表述无明显错误就可以选。","module":"习思想","title":"第八章 · 发展全过程人民民主"},{"chapter":"第八章","section":"多选","no":17,"stem":"在制定实施五年规划的长期实践中，我们党创造积累了丰富经验，包括坚持党中央集中统一领导，坚持从实际出发，坚持全国一盘棋，坚持发扬民主、集思广益，坚持规划法定原则等。《中华人民共和国国家发展规划法》经十四届全国人民代表大会第四次会议表决通过，于3月12日正式施行。制定出台国家发展规划法是（　　）","opts":{"A":"实现党中央战略擎画的有力保障","B":"完善以宪法为核心的中国特色社会主义法律体系的内在要求","C":"推进国家治理体系和治理能力现代化的重大举措","D":"践行全过程人民民主的生动范例"},"ans":"ABCD","point":"全过程人民民主是全链条、全方位、全覆盖的民主；全面依法治国","explain":"制定出台《国家发展规划法》，对我国发展具有深远意义：一是实现党中央战略璧画的有力保障。该法将党领导规划工作的成熟经验与系列重要论述制度化、法治化，构筑起将宏伟蓝图转化为发展实绩的坚实法治基础，确保全国上下围绕新时代使命任务团结奋进，保障第二个百年奋斗目标如期实现。二是完善以宪法为核心的中国特色社会主义法律体系的内在要求。该法细化和落实宪法关于国家发展规划的规定，促进相关法律间的衔接协调，从而在法治轨道上全面建设社会主义现代化国家。三是推进国家治理体系和治理能力现代化的重大举措。该法明确国家发展规划的战略导向作用，规定其他规划、政策、资源需协同保障规划实施，推动有效市场与有为政府更好结合，将制度优势持续转化为发展优势。四是践习近平新时代中国特色社会主义思想概论行全过程人民民主的生动范例。该法以法治形式固定规划编制实施中反映民意、汇集众智、接受人民监督的成熟机制，保障人民群众的知情权、参与权、监督权，凝聚推进中国式现代化的磅力量。应选A、B、C、D。","notes":"","tips":"具体作用意义政策类表述，符合材料主题且表述无明显错误就可以选，不用管自己有没有见过它。","module":"习思想","title":"第八章 · 发展全过程人民民主"},{"chapter":"第十章","section":"单选","no":1,"stem":"2025年12月31日，习近平总书记发表二O二六年新年贺词，他指出：“我们以文化滋养精神家园。文博热、非遗热不断升温，世界遗产再添新员，悟空和哪吒风靡全球，古韵国风成为习近平新时代中国特色社会主义思想概论年轻人眼中的‘顶流审美'。文旅市场人气火爆，‘城超’‘村超’热闹非凡，冰雪运动点燃冬日激情。传统与现代交融，中华文化绽放更加灿烂的光芒。”这启示我们建设社会主义文化强国，推动社会主义文化繁荣兴盛，关键在于（　　）","opts":{"A":"坚定中国特色社会主义文化自信","B":"繁荣发展文化事业和文化产业","C":"传承和弘扬中华优秀传统文化","D":"着力提升全社会文明程度"},"ans":"A","point":"坚定中国特色社会主义文化自信","explain":"文化自信是更基础、更广泛、更深厚的自信，是一个国家、一个民族发展中最基本、最深沉、最持久的力量。建设社会主义文化强国，推动社会主义文化繁荣兴盛，关键在于坚定中国特色社会主义文化自信。文化自信是文化繁荣发展的基础和前提。只有对自身文化价值和文化生命力充满信心，才能以更加主动的姿态推动文化发展。题干中“植根博大精深的中华文明”对答案也有提示，应选A。繁荣发展文化事业和文化产业，传承和弘扬中华优秀传统文化，着力提升全社会文明程度这些都是建设社会主义文化强国，推动社会主义文化繁荣兴盛的具体举措，而非推动文化繁荣的关键因素。B、C、D选项不符合题意。","notes":"①「A选项」我们说要坚定中国特色社会主义道路自信、理论自信、制度自信，说到底是要坚定文化自信，文化自信是更基础、更广泛、更深厚的自信，是一个国家、一个民族发展中最基本、最深沉、最持久的力量（“三更三最”)\n②「A选项」建设社会主义文化强国，推动社会主义文化繁荣兴盛，关键在于坚定中国特色社会主义文化自信我们坚定文化自信的底气在于：1）中华优秀传统文化是我们坚定文化自信的深厚基础2）党带领人民在伟大斗争中孕育的革命文化和社会主义先进文化是我们坚定文化自信的坚强基石。革命文化、社会主义先进文化以马克思主义为指导，与中华优秀传统文化一脉相承（不可以说中华优秀传统文化与马克思主义理论一脉相承）3）中国特色社会主义伟大实践是我们坚定文化自信的现实基础","tips":"","module":"习思想","title":"第十章 · 建设社会主义文化强国"},{"chapter":"第十章","section":"单选","no":2,"stem":"已有1500多年历史的龙门石窟，是重要的世界文化遗产。2025年5月19日，习近平来到这里，察看石窟整体布局风貌和代表性窟、造像，同现场的文物保护工作者亲切交流。他强调，要把这些中华文化瑰宝保护好、传承好、传播好。游客们见到总书记，都十分欣喜，纷纷向总书记问好。习近平不时同大家交流，特别鼓励小朋友们多到实地寻溯中华文化，从小树立文化自信。我们坚定文化自信的深厚基础是（　　）","opts":{"A":"中国革命文化","B":"社会主义先进文化","C":"中国特色社会主义伟大实践","D":"中华优秀传统文化"},"ans":"D","point":"坚定中国特色社会主义文化自信","explain":"中华优秀传统文化是我们坚定文化自信的深厚基础。中华文化博大精深、源远流长，中华文明是世界上唯一没有中断的文明。中华民族创造的优秀传统文化是民族的根脉，根植在中国人内心，形成了中国人看待世界、看待社会、看待人生的独特价值体系、文化内涵和精神品质，这是我们区别于其他国家和民族的根本特征，也铸就了中华民族一以贯之的文化自信。题干中“要把这些中华文化瑰宝保护好、传承好、传播好”也在提示应选D。","notes":"","tips":"","module":"习思想","title":"第十章 · 建设社会主义文化强国"},{"chapter":"第十章","section":"单选","no":3,"stem":"文化关乎国本、国运，文化兴则国运兴，文化强则民族强。当今世界百年未有之大变局加速演进，文化越来越成为综合国力竞争的重要力量；中华民族伟大复兴进入关键时期，文化越来越成为强国建设、民族复兴的强大支撑。决定社会主义文化事业前途命运的关键是（　　）","opts":{"A":"坚持百花齐放、百家争鸣的重要方针","B":"坚持用中国道理总结好中国经验，把中国经验提升为中国理论","C":"坚持为人民服务、为社会主义服务的根本方向","D":"坚持对优秀传统文化进行创造性转化、创新性发展"},"ans":"C","point":"坚持中国特色社会主义文化发展道路","explain":"社会主义文化事业的本质是人民性和社会主义属性的统一。“为人民服务”体现了文化的价值立场（以人民为中心），“为社会主义服务”体现了文化的政治方向（坚持社会主义道路）。这一根本方向是由中国共产党的性质、社会主义制度的本质决定的，是文化事业沿着正确轨道发展的“指南针”。应选C。A选项百花齐放、百家争鸣是繁荣社会主义文化的基本方针；B选项坚持用中国道理总结好中国经验，把中国经验提升为中国理论是坚定文化自信的首要任务；D选项优秀传统文化创造性转化、创新性发展是传承弘扬中华优秀传统文化的具体路径（属于文化发展的方法层面），其目的是服务于社会主义文化建设，而非决定文化事业的根本性质。A、B、D选项均不符合题意，","notes":"中国特色社会主义文化发展道路，是推动社会主义文化繁荣兴盛的唯一正确道路\n②「C选项」坚持“二为”关键方向、“双百”方针，坚持为人民服务、为社会主义服务的根本方向，是决定社会主义文化事业前途命运的关键。坚持百花齐放、百家争鸣，是繁荣发展社会主义文化的重要方针","tips":"","module":"习思想","title":"第十章 · 建设社会主义文化强国"},{"chapter":"第十章","section":"单选","no":4,"stem":"党的二十届三中全会通过的《中共中央关于进一步全面深化改革、推进中国式现代化的决定》立足强国建设、民族复兴的战略高度，着眼续中华文脉、推动文化繁荣的重大使命，聚焦建设社会主义文化强国，提出深化文化体制机制改革重大任务，明确改革路径和具体举措，为新时代新征程文化改革发展提供了根本遵循、指明了前进方向。深化文化体制机制改革的中心环节是（　　）","opts":{"A":"激发全民族文化创新创造活力","B":"提升文化服务和文化产品供给能力","C":"传承中华优秀传统文化","D":"提升国家文化软实力和中华文化影响力"},"ans":"A","point":"坚持中国特色社会主义文化发展道路","explain":"创新创造是文化的生命所在，是文化的本质特征。中国特色社会主义文化发展道路是改革创新之习近平新时代中国特色社会主义思想概论路，必须在全社会营造鼓励文化创造的良好氛围，让蕴藏于人民中的文化创造活力得到充分发挥，激发全民族文化创新创造活力是深化文化体制机制改革的中心环节。应选A。B选项提升文化服务和文化产品供给能力是文化体制改革的重要目标之一，但属于“结果导向”而非“中心环节”；C选项传承中华优秀传统文化是文化发展的基础和使命，但属于改革的具体内容而非核心环节；D选项提升国家文化软实力和中华文化影响力是文化体制改革的战略目标，体现改革的外部效应。","notes":"①「A选项」激发全民族文化创新创造活力。创新创造是文化的生命所在，是文化的本质特征。激发全民族文化创新创造活力是深化文化体制机制改革的中心环节\n②「C选项」传承中华优秀传统文化是文化发展的基础和使命\n③「D选项」提升国家文化软实力和中华文化影响力是文化体制改革的战略目标","tips":"","module":"习思想","title":"第十章 · 建设社会主义文化强国"},{"chapter":"第十章","section":"单选","no":5,"stem":"做好党的新闻舆论工作，事关旗帜和道路，事关贯彻落实党的理论和路线方针政策，事关顺利推进党和国家各项事业，事关全党全国各族人民凝聚力和向心力，事关党和国家前命运。新形势下，做好新闻舆论工作的关键是（　　）","opts":{"A":"发展新兴媒体","B":"做大做强舆论阵地","C":"管好用好互联网","D":"讲好中国故事、传播好中国声音"},"ans":"C","point":"积极塑造主流舆论新格局","explain":"互联网是意识形态工作的主阵地、主战场、最前沿，管好用好互联网是新形势下做好新闻奥论工作的关键。习近平总书记多次讲过，过不了互联网这一关，就过不了长期执政这一关。这里最关键的，就是必须把党管宣传、党管意识形态、党管媒体、党管互联网原则落实到位，提升信息化条件下文化领域治理能力，在思想上、精神上、文化上筑牢党的执政基础和群众基础。应选C。A选项发展新兴媒体是适应媒介变革的重要手段，但属于技术层面的布局。新兴媒体需服务于主流舆论的传播，若缺乏阵地意识，可能导致舆论分散化。B选项表述有误，我们要做大做强主流舆论阵地。D选项讲好中国故事、传播好中国声音，这是新闻舆论工作的重要使命，属于对外传播范畴。A、B、D选项均不符合题意。","notes":"关于新闻舆论工作的常见知识点总结：1）新闻舆论工作处在意识形态斗争前沿，是治国理政、定国安邦的大事2）新闻舆论工作有鲜明的意识形态属性，坚持正确的政治方向是做好新闻舆论工作的第一位要求3）党性原则是新闻舆论工作的根本原则，坚持党性原则最根本的是坚持党对新闻舆论工作的领导。新闻观是新闻舆论工作的灵魂4）互联网是意识形态工作的主阵地、主战场、最前沿，管好用好互联网是新形势下做好新闻舆论工作的关键5）讲好中国故事、传播好中国声音，这是新闻舆论工作的重要使命","tips":"","module":"习思想","title":"第十章 · 建设社会主义文化强国"},{"chapter":"第十章","section":"单选","no":6,"stem":"随着文化素养、文化水准的提高，人们对文化服务和文化产品质量的要求更高了。目前，全国已建成公共图书馆超3300个，文化馆和博物馆超1万家；所有公共图书馆、文化馆（站）、美术馆、综合文化站和90%以上博物馆免费开放。保障人民文化权益、改善人民生活品质、补齐文化发展短板的重要途径是（　　）","opts":{"A":"大力发展文化产业，推动文化消费升级","B":"实现文化建设数字化赋能、信息化转型","C":"发展文化事业、提升公共文化服务水平","D":"在创造性转化和创新性发展中续中华文脉"},"ans":"C","point":"繁荣发展文化事业和文化产业","explain":"题干中“公共图书馆、文化馆免费开放”是文化事业的典型体现，其公益性直接保障人民文化权益；“建成超3300个图书馆、超1万家文化馆”，体现通过事业发展补齐城乡、区域文化资源不均衡的短板，符合“改善生活品质”的目标。应选C。A选项大力发展文化产业，推动文化消费升级侧重满足个性化消费需求，属于“改善生活品质”的延伸层面，但不直接解决基本权益保障和短板补齐问题。题干中“免费开放”的公共设施属于文化事业而非产业，此选项混淆了二者功能。B选项实现文化建设数字化赋能、信息化转型是提升文化服务效率的手段，但题干未强调“技术升级”，而是聚焦“设施覆盖”和“服务普惠”。D选项在创造性转化和创新性发展中续中华文脉侧重文化传承，但题干未涉及“传统文化传承”。A、B、D选项不符合题意。","notes":"繁荣发展文化事业和文化产业，是满足人民精神文化需求，保障人民文化权益的基本途径要把满足人民精神文化需求作为文艺和文艺工作的出发点和落脚点衡量文化产业发展质量和水平，最重要的不是看经济效益，而是看能不能提供更多既能满足人民文化需求、又能增强人民精神力量的文化产品。要坚持把社会效益放在首位、社会效益和经济效益相统一","tips":"文化产业以市场机制为主，追求经济效益，而题干强调公益性文化设施的普惠性，属于文化事业领域，C选项更匹配。","module":"习思想","title":"第十章 · 建设社会主义文化强国"},{"chapter":"第十章","section":"单选","no":7,"stem":"一个大国发展兴盛，必然要求文化传播力、文明影响力大幅提升，实现软实力和硬实力相得益彰。文化软实力集中体现了一个国家基于文化而具有的凝聚力和生命力，以及由此产生的吸引力和影响力。一个国家的文化软实力，从根本上说，取决于（　　）","opts":{"A":"文化产品出口规模和国际市场占有率","B":"核心价值观的生命力、凝聚力、感召力","C":"历史文化遗产的数量和保护完整度","D":"国民平均受教育年限和科学文化素质水平"},"ans":"B","point":"不断提升国家文化软实力和中华文化影响力","explain":"文化软实力集中体现了一个国家基于文化而具有的凝聚力和生命力，以及由此产生的吸引力和影响力。一个国家的文化软实力，从根本上说，取决于核心价值观的生命力、凝聚力、感召力。文化软实力的实质是价值观的影响力，对内，它通过价值观整合社会共识，增强民族凝聚力；对外，它通过价值观的吸引力塑造国家形象，提升国际话语权。应选B。A选项文化产品出口规模和国际市场占有率将“文化软实力的表象”等同于“根本决定因素”。C选项历史文化遗产的数量和保护完整度将“文化资源存量”等同于“文化软实力的核心”。单纯强调“数量和保护”忽视了文化软实力的动态性（如当代价值观的创新）和功能性（如凝聚国民共识），属于“资源决定论”的片面思维。D选项国民平均受教育年限和科学文化素质水平是文化软实力的支撑要素，但属于工具性变量，而非决定性因素。A、C、D选项不符合题意。","notes":"①「B选项」文化软实力集中体现了一个国家基于文化而具有的凝聚力和生命力，以及由此产生的吸引力和影响力。一个国家的文化软实力，从根本上说，取决于其核心价值观的生命力、凝聚力、感召力新时代新的文化使命：在新的起点上继续推动文化繁荣、建设文化强国、建设中华民族现代文明核心价值观是文化软实力的灵魂、文化软实力建设的重点。这是决定文化性质和方向的最深层次要素核心价值观是一个社会评判是非曲直的价值标准。对一个民族、一个国家来说，最持久、最深层的力量是全社会共同认可的核心价值观。核心价值观是一个国家的重要稳定器习近平新时代中国特色社会主义思想概论","tips":"","module":"习思想","title":"第十章 · 建设社会主义文化强国"},{"chapter":"第十章","section":"多选","no":8,"stem":"党的十八大以来，以习近平同志为核心的党中央将意识形态工作作为党的一项极端重要的工作，就意识形态领域许多方向性、战略性问题作出部署，着力解决意识形态领域党的领导弱化问题，使我国意识形态领域形势发生了全局性、根本性转变。马克思主义是我们立党立国、兴党兴国的根本指导思想。坚持马克思主义在意识形态领域指导地位的制度是（　　）","opts":{"A":"坚持和加强党对宣传思想文化工作全面领导的本质要求","B":"发展社会主义先进文化的有力保障","C":"中国特色社会主义制度体系的一项根本制度","D":"坚持和巩固我国社会主义制度、保证我国文化建设正确方向的必然要求"},"ans":"ABCD","point":"坚持马克思主义在意识形态领域指导地位的根本制度","explain":"马克思主义是我们立党立国、兴党兴国的根本指导思想。坚持马克思主义在意识形态领域指导地位的制度是中国特色社会主义制度体系的一项根本制度，是坚持和加强党对宣传思想文化工作全面领导的本质要求，是发展社会主义先进文化的有力保障。坚持马克思主义在意识形态领域指导地位的根本制度是历史的结论。坚持马克思主义在意识形态领域指导地位的根本制度，是坚持和巩固我国社会主义制度、保证我国文化建设正确方向的必然要求。A、B、C、D是正确选项。","notes":"意识形态关乎旗帜、关乎道路、关乎国家政治安全，决定文化前进方向和发展道路，意识形态工作是为国家立心、为民族立魂的工作坚持马克思主义在意识形态领域指导地位的制度是中国特色社会主义制度体系的一项根本制度，马克思主义是社会主义意识形态的旗帜和灵魂","tips":"具体作用意义政策类表述，符合材料主题且表述无明显错误就可以选，不用管自己有没有见过它。","module":"习思想","title":"第十章 · 建设社会主义文化强国"},{"chapter":"第十章","section":"多选","no":9,"stem":"中国式现代化是物质文明和精神文明相协调的现代化，既要通过经济体制改革，解放和发展社会生产力，实现物质富裕，也要通过文化体制改革，激发文化生命力、创造力，实现精神富足。当今世界百年未有之大变局加速演进，文化越来越成为综合国力竞争的重要力量；中华民族伟大复兴进入关键时期，文化越来越成为强国建设、民族复兴的强大支撑。在新的历史起点上深化文化体制机制改革是（　　）","opts":{"A":"担负新的文化使命的必然要求","B":"丰富人民精神文化生活的内在要求","C":"加快适应信息技术迅猛发展新形势的迫切需要","D":"提升国家文化软实力和中华文化影响力的时代要求"},"ans":"ABCD","point":"繁荣发展文化事业和文化产业","explain":"在新的历史起点上深化文化体制机制改革、推动文化繁荣兴盛，事关中国式现代化建设全局，事关国家长治久安、民族永续发展。第一，深化文化体制机制改革，是担负新的文化使命的必然要求。在新的起点上继续推动文化繁荣、建设文化强国、建设中华民族现代文明，是我们在新时代新的文化使命。必须通过改革进一步破解深层次体制机制障碍，激发文化创新创造活力，为推动文化繁荣、建设文化强国提供强大动力和制度保障。第二，深化文化体制机制改革，是丰富人民精神文化生活的内在要求。这些年，我国文艺创作生产能力大幅提升，各种文化产品和服务供给数量高速增长，文化供给的主要矛盾已由“够不够”转向“好不好”。这就要求我们进一步深化改革，加快建立有利于优质文化产品服务不断涌现的体制机制，更好地丰富人民精神世界、增强人民精神力量。第三，深化文化体制机制改革，是加快适应信息技术迅猛发展新形势的迫切需要。要推进文化体制机制全方位改革，推进工作理念、内容、形式、方法、手段全方位创新，把互联网思维和信息技术应用系统贯穿到宣传思想文化工作中，实现全面彻底的数字化赋能、信息化转型。第四，深化文化体制机制改革，是提升国家文化软实力和中华文化影响力的时代要求。无论是推动文明交流互鉴，还是应对国际文化竞争，都要求我们深化改革，完善国际传播体制机制，构建具有鲜明中国特色的战略传播体系，不断提升国家文化软实力和中华文化影响力，以真正在国际文化激荡中站稳脚跟。A、B、C、D都是正确选项。","notes":"","tips":"具体作用意义政策类表述，符合材料主题且表述无明显错误就可以选，不用管自己有没有见过它。","module":"习思想","title":"第十章 · 建设社会主义文化强国"},{"chapter":"第十章","section":"多选","no":10,"stem":"2024年10月28日，中央政治局以“建设文化强国”为题进行第十七次集体学习。在主持学习时，习近平总书记特别指出，文化与科技相生相促。要探索文化和科技融合的有效机制，用互联网思维和信息技术改进文化创作生产流程，推动“硬件”和“软件”全面升级。文化与科技的融合产生的影响是（　　）","opts":{"A":"催生了新的文化业态，有力延伸了文化产业链","B":"在坚持把经济效益放在首位的基础上，实现经济效益和社会效益相统一习近平新时代中国特色社会主义思想概论","C":"实现文化建设数字化赋能、信息化转型，把文化资源优势转化为文化发展优势","D":"集聚大量创新人才，培育发展新质生产力"},"ans":"ACD","point":"繁荣发展文化事业和文化产业","explain":"习近平总书记2020年9月在湖南考察时深刻指出：“文化和科技融合，既催生了新的文化业态、延伸了文化产业链，又集聚了大量创新人才，是朝阳产业，大有前途。”党的二十届三中全会《决定》提出：“探索文化和科技融合的有效机制，加快发展新型文化业态。”探索文化和科技融合的有效机制，用现代科技激活中华传统文化中的优秀基因并赋予其新的时代内涵，实现文化建设的数字化赋能、信息化转型，把文化资源优势转化为文化发展优势，进而实现技术的革命性突破、生产要素的创新性配置、产业的深度转型升级，从而催生出新产业、新模式、新动能，带动全要素生产率大幅提升，这符合新质生产力“高科技、高效能、高质量”的特征。应选A、C、D。文化建设要坚持把社会效益放在首位、社会效益和经济效益相统一，B选项错误。","notes":"①「B选项」衡量文化产业发展质量和水平，最重要的不是看经济效益，而是看能不能提供更多既能满足人民文化需求又能增强人民精神力量的文化产品。要坚持把社会效益放在首位、社会效益和经济效益相统一","tips":"具体作用意义政策类表述，符合材料主题且表述无明显错误就可以选，不用管自己有没有见过它。","module":"习思想","title":"第十章 · 建设社会主义文化强国"},{"chapter":"第十章","section":"多选","no":11,"stem":"2025年5月19日，习近平总书记在洛阳考察时指出，“文旅融合前景广阔，要推动文旅产业高质量发展，真正打造成为支柱产业、民生产业、幸福产业”。2026年2月9日至10日，习近平总书记在北京考察并看望慰问基层干部群众时的讲话时再次强调：“积极发展现代服务业，用好丰富的文化资源，促进文商旅体展融合发展。”文旅融合的意义在于（　　）","opts":{"A":"促进经济结构优化升级，培育新的经济增长点","B":"推动中华优秀传统文化创造性转化、创新性发展","C":"扩大中华文化影响力，取代西方文化在国际上的主导地位","D":"满足人民日益增长的美好生活需要，提升社会文明程度"},"ans":"ABD","point":"繁荣发展文化事业和文化产业","explain":"文旅融合作为服务业与文化产业的交叉领域，能带动消费升级、扩大内需，推动经济高质量发展，通过文旅融合，将文化资源转化为可感知、可参与的产品，推动中华优秀传统文化创造性转化、创新性发展。文旅融合提供更高质量的精神文化产品，提高人民生活品质，同时通过文化浸润促进社会文明，提升社会文明程度。应选A、B、D。体”“倡导文明交流互鉴”的外交理念冲突；我国文化发展的目标是“增强文化软实力和中华文化影响力”，而非“取代他国文化”，此选项混淆了“文化影响力提升”与“文化霸权”的本质区别。","notes":"①「C选项」我国文化发展的目标是“增强文化软实力和中华文化影响力”，而非“取代他国文化”，我们不搞“文化霸权”","tips":"断选项表述是否合理，其余作用意义类说法说不出错误且与题目主旨相符合就可以放心选。习近平新时代中国特色社会主义思想概论","module":"习思想","title":"第十章 · 建设社会主义文化强国"},{"chapter":"第十章","section":"多选","no":12,"stem":"文化遗产是辉煌灿烂中华文明的有力见证，是老祖宗留给我们的宝贵财富。中国是文明古国、文化大国，正在以中国式现代化全面推进强国建设、民族复兴伟业，保护文化遗产有着十分重要而特殊的意义。保护传承文化遗产是（　　）","opts":{"A":"弘扬中华优秀传统文化、铸牢中华民族共同体意识的文化基础","B":"提供公共文化服务、加强社会主义精神文明建设的有力支撑","C":"维护人类文明多样性、扩大中华文化国际影响力的重要前提","D":"建设文化强国、担负起新时代的文化使命的必然要求"},"ans":"ABCD","point":"传承发展中华优秀传统文化","explain":"第一，保护传承文化遗产，是弘扬中华优秀传统文化、铸牢中华民族共同体意识的文化基础。文化遗产是人们的“记忆所系之处”，保护文化遗产就是守护中华民族精神生生不息的根脉，就是增进全体人民的认同感、归属感、安全感，就是维护国家的凝聚力和向心力。第二，保护传承文化遗产，是提供公共文化服务、加强社会主义精神文明建设的有力支撑。留存至今的文化遗产虽走过沧桑岁月却始终历久弥新，其所蕴含的思想观念、人文精神、道德规范、艺术传统等，对于当代人在社会教育、道德养成、文化认同、安顿身心等方面发挥着重要作用。第三，保护传承文化遗产，是维护人类文明多样性、扩大中华文化国际影响力的重要前提。加强文化遗产保护传承，传播更多承载中华文化、展现中国精神的价值符号和文化产品，有利于更好地向世界展示绚丽多彩的中华文明，让中华文明同世界各国人民创造的丰富多彩的文明一道，为人类提供正确的精神指引和强大的精神动力。第四，保护传承文化遗产，是建设文化强国、担负起新时代的文化使命的必然要求。我们要建设的文化强国，是建立在强大的文化自信基础之上的。无论是发展文化事业、文化产业，还是进行文学创作、艺术创造，都需要文化遗产为其提供资源和滋养。只有精心守护好文化遗产，推动其有效利用，才能为发展文化生产力注入积极力量，为文化强国建设蓄势赋能。本题应选A、B、C、D。","notes":"","tips":"具体作用意义政策类表述，符合材料主题且表述无明显错误就可以选，不用管自己有没有见过它。","module":"习思想","title":"第十章 · 建设社会主义文化强国"},{"chapter":"第十章","section":"多选","no":13,"stem":"这些年，从敦煌文化保护研究工作持续推进，到中华文明探源工程、革命文物保护利用工程、“考古中国”、国家文化公园等重大工程和项目深入实施；从《复兴文库》、《儒藏》“精华编”中国部分、《中国历代绘画大系》编纂出版，到中国国家版本馆、中国考古博物馆等文化殿堂相继落成…文化种子“藏之名山、传之后世”的美好愿景，正在新时代的中国变成现实。要在创造性转化和创新性发展中续中华文脉，就要做到（　　）","opts":{"A":"高扬中华民族的文化主体性，把历经沧桑留下的中华文明瑰宝呵护好、弘扬好、发展好","B":"秉持敬畏历史、热爱文化之心，全盘吸收中华传统文化的精神内涵","C":"坚持保护第一、合理利用和最小干预原则，推动文化遗产系统性保护和统一监管","D":"健全文化遗产保护传承体制机制，加快完善法规制度体系"},"ans":"ACD","point":"","explain":"传承发展中华优秀传统文化“高扬文化主体性”的实践体现，A选项正确。“保护第一、合理利用、最小干预”是文化遗产保护的基本原则。题干中“中华文明探源工程”“革命文物保护”等均体现系统性保护理念，C选项正确。健全体制机制和法规制度是文化遗产保护的制度保障。题干中“国家文化公园”“中国国家版本馆”等重大工程的落地，离不开制度支撑，D选项正确。B选项错误，“全盘吸收”违背马克思主义辩证否定观，忽视传统文化的时代局限性。","notes":"「B选项」对待传统观念应持批判继承的态度，而非全盘否定。对待传统文化必须采取“取其精华、去其糟粕”的科学态度\n②「B选项」中国式现代化借鉴吸收一切人类优秀文明成果为正确表述（文化有好有坏，但可以吸收借鉴一切文明成果）","tips":"“全盘吸收”表述太绝对，绝对化表述选项都要当心，是干扰项常用挖坑套路之一","module":"习思想","title":"第十章 · 建设社会主义文化强国"},{"chapter":"第十章","section":"多选","no":14,"stem":"一个大国发展兴盛，必然要求文化传播力、文明影响力大幅提升，实现软实力和硬实力相得益彰。文化软实力集中体现了一个国家基于文化而具有的凝聚力和生命力，以及由此产生的吸引力和影响力。要加快构建中国话语和中国叙事体系，讲好中国故事、传播好中国声音。要不断提升国家文化软实力和中华文化影响力的举措包括（　　）","opts":{"A":"推进国际传播格局重构，创新开展网络外宣，构建多渠道、立体式对外传播格局","B":"更加主动地宣介中国主张、传播中华文化、展示中国形象","C":"广泛开展形式多样的国际人文交流合作","D":"更加积极主动地学习借鉴人类一切优秀文明成果，创造一批熔铸古今、汇通中外的文化成果"},"ans":"ABCD","point":"不断提升国家文化软实力和中华文化影响力","explain":"要不断提升国家文化软实力和中华文化影响力。推进国际传播格局重构，创新开展网络外宣，构建多渠道、立体式对外传播格局。更加主动地宣介中国主张、传播中华文化、展示中国形象。广泛开展形式多样的国际人文交流合作。更加积极主动地学习借鉴人类一切优秀文明成果，创造一批熔铸古今、汇通中外的文化成果，A、B、C、D选项均正确。盗真题思维点拔具体作用意义政策类表述，符合材料主题且表述无明显错误就可以选，不用管自己有没有见过它。","notes":"","tips":"","module":"习思想","title":"第十章 · 建设社会主义文化强国"},{"chapter":"第十一章","section":"单选","no":1,"stem":"习近平总书记指出：“民之所忧，我必念之；民之所盼，我必行之。”党的十八大以来，以习近平同志为核心的党中央把让人民群众过上更加美好的生活作为治国理政的头等大事，注重加强普惠性、基础性、兜底性民生建设，着力解决人民群众急难愁盼问题，不断增强人民群众的获得感、幸福感、安全感。保障和改善民生的重中之重是（　　）","opts":{"A":"解决人民群众最关心最直接最现实的利益问题","B":"坚持人人尽责、人人享有，让所有劳动者在推动发展中分享发展成果","C":"坚守底线、突出重点、完善制度、引导预期","D":"坚持尽力而为、量力而行"},"ans":"A","point":"坚持在发展中增进民生福证","explain":"题干中“着力解决人民群众急难愁盼问题”已经提示了解决人民群众最关心最直接最现实的利益问题是保障和改善民生的重中之重。应选A。B选项坚持人人尽责、人人享有，让所有劳动者在推动发展中分享发展成果，是保障和改善民生的重要原则。C选项坚守底线、突出重点、完善制度、引导预期，是保障和改善民生的工作思路。D选项坚持尽力而为、量力而行是保障和改善民生的重要方针。B、C、D选项与题干要求不符，故排除。","notes":"关于民生的常见知识点总结：1）民生是老百姓最关心的问题，涉及分配、就业、教育、医疗、住房、社会保障等方面。民生事关人民的生存生活生计，事关民心所向、民情所系、民意所指，决定党的事业成败和国家命运兴衰2）增进民生福社是坚持立党为公、执政为民的本质要求3）增进民生福社是社会主义生产的根本目的4）发展是解决民生问题的“总钥匙”，民生是发展的“指南针”5）就业是最基本的民生，是劳动者赖以生存和发展的基础。解决好就业问题，是民生改善的“温度计”。就业是最大的民生工程、民心工程、根基工程，必须抓紧抓实抓好","tips":"材料中“着力解决人民群众急难愁盼问题”这句话就能轻松推断出只有A选项最衔接。","module":"习思想","title":"第十一章 · 以保障和改善民生为重点加强社会建设"},{"chapter":"第十一章","section":"单选","no":2,"stem":"到2035年建成健康中国是中共中央作出的一项战略决策，“十五五”是实现这一目标的关键时期，必须统筹谋划、加紧推进，力求取得决定性进展。我国是社会主义国家，是人口规模巨大、城乡区域差距仍然较大的发展中国家。建设健康中国，必须坚持从我国国情出发，随着形势发展变化，卫生与健康工作需要优化完善一些具体政策举措，但在根本问题上必须始终头脑清醒、保持战略定力。这里所说的必须保持清醒和定力的“根本问题”，指的是（　　）","opts":{"A":"是否坚持公立医院在医疗服务体系中的主体地位","B":"是否将医疗卫生工作的重点完全放在农村和基层","C":"是否持续扩大基本医疗保险的覆盖范围和报销比例","D":"是否坚持走中国特色社会主义卫生与健康发展道路"},"ans":"D","point":"推进健康中国建设","explain":"材料明确指出，建设健康中国必须看到“我国是社会主义国家，是人口规模巨大、城乡区域差距仍然较大的发展中国家”，这是基于我国社会主义国家性质和发展中大国国情提出的根本方向。虽然具体的政策举措（如医保报销比例、资源布局等）可以也应当随着形势变化而优化调整，但关乎发展道路和方向的“根本问题”不能动摇。选项D直接对应了这一核心论断。A、B、C三项均是卫生与健康工作领域的重要具体政策或举措，属于可以在实践中“优化完善”的范畴，但并非材料所强调的、需要始终保持战略定力的“根本问题”。A、B、C都不符合题意。","notes":"","tips":"","module":"习思想","title":"第十一章 · 以保障和改善民生为重点加强社会建设"},{"chapter":"第十一章","section":"单选","no":3,"stem":"党的二十届三中全会坚持尽力而为、量力而行的原则，聚焦人民最关心最直接最现实的利益问题，着力健全保障和改善民生制度体系，推动人民对美好生活的向往不断化为现实。其中改善民生福社、实现共享发展最重要最直接的方式，也是防止两极分化，促进共同富裕的基础性制度是（　　）","opts":{"A":"社会保障制度","B":"收入分配制度","C":"社会治理制度","D":"就业促进制度"},"ans":"B","point":"完善分配制度","explain":"收入分配制度是改善民生福证、实现共享发展最重要最直接的方式，也是防止两极分化、促进共同富裕的基础性制度。应选B。社会保障制度是保障人民生活、调节社会分配的一项基本制度，主要起到兜底和保障作用；社会治理制度对于维护社会稳定、促进社会和谐有着重要意义，但并非改善民生福补、促进共同富裕的基础性制度；就业促进制度是推动实现高质量充分就业的重要保障，就业是民生之本，能为改善民生提供基础，但直接调节收入分配、防止两极分化的作用不如收入分配制度直接和关键。所以A、C、D选项均不符合题意。","notes":"①「B选项」收入分配制度是改善民生福让、实现共享发展最重要最直接的方式，也是防止两极分化、促进共同富裕的基础性制度要继续深化收入分配制度改革，进一步优化收入分配结构，构建初次分配、再分配、第三次分配协调配套的制度体系。发挥初次分配的基础性作用，努力提高劳动报酬在初次分配中的比重：1）初次分配：第一次收入分配。初次分配注重效率，是按社会生产要素的贡献进行的分配2）再分配：在初次分配结果的基础上，政府通过税收、社保、转移支付等，使各收入主体之间实现现金或实物转移的一种收入再次分配过程，也是对要素收入进行再次调节的过程3）第三次分配：建立在自愿性的前提下，以募资、自行捐助等公益慈善方式对社会资源和物质财富进行的分配","tips":"","module":"习思想","title":"第十一章 · 以保障和改善民生为重点加强社会建设"},{"chapter":"第十一章","section":"单选","no":4,"stem":"党的十八大以来，党中央坚持把就业工作摆在治国理政的突出位置，强化就业优先政策，健全就业促进机制。同时要看到，就业工作仍面临不少突出矛盾和问题。劳动者有就业意愿，企业有用工需求，如何破解“有活没人干、有人没活干”并存的结构性矛盾？解答好这一问题，也是提高就业质量的重要一环。促进高质量充分就业要着力解决结构性就业矛盾。解决这一矛盾，关键在于（　　）","opts":{"A":"充分发挥市场在人力资源配置中的决定性作用","B":"加快塑造素质优良、总量充裕、结构优化、分布合理的现代化人力资源","C":"支持和规范发展新就业形态","D":"解决制约提升就业质量、扩大就业容量、优化就业结构的卡点堵点问题习近平新时代中国特色社会主义思想概论"},"ans":"B","point":"实施就业优先战略","explain":"结构性矛盾的核心是人力资源供给与需求的结构性失衡。“素质优良”对应技能与岗位需求不匹配，如“有人没活干”因技能不足；“结构优化、分布合理”对应劳动力区域、行业分布与产业布局不匹配，如“有活没人干”因劳动力地域错配。人力资源供需不匹配，是当前我国就业领域面临的主要矛盾。因此，解决这一矛盾，关键在于加快塑造素质优良、总量充裕、结构优化、分布合理的现代化人力资源。应选B。","notes":"①「B选项」人力资源供需不匹配，是当前我国就业领域面临的主要矛盾","tips":"此题大多数同学会在B、D选项犹豫，因为材料中已经说明了“结构性矛盾”，而B、D选项都包含“优化结构”，但题干强调破解“有活没人干、有人没活干”的结构性矛盾，其本质是人力资源供需在技能、区域、行业等方面的不匹配，D选项不涉及“人力资源”。","module":"习思想","title":"第十一章 · 以保障和改善民生为重点加强社会建设"},{"chapter":"第十一章","section":"多选","no":5,"stem":"治国有常，利民为本。民生是老百姓最关心的问题，涉及分配、就业、教育、医疗、住房、社会保障等方面。谋划“十五五”时期经济社会发展，要不忘初心，把造福人民作为根本价值取向，坚持在发展中保障和改善民生，稳步推动共同富裕。增进民生福社是（　　）","opts":{"A":"坚持立党为公、执政为民的本质要求","B":"全面建成小康社会的底线任务","C":"社会主义生产的根本目的","D":"全面建设社会主义现代化国家的应有之义"},"ans":"ACD","point":"民生是人民幸福之基","explain":"治国有常，利民为本。民生是老百姓最关心的问题，涉及分配、就业、教育、医疗、住房、社会保障等方面。增进民生福证是坚持立党为公、执政为民的本质要求。增进民生福是社会主义生产的根本目的。增进民生福证是全面建设社会主义现代化国家的应有之义。必须始终坚持把实现人民对美好生活的向往作为现代化建设的出发点和落脚点，不断增进民生福证，努力使人民生活更加幸福美好。应选A、C、D。全面建成小康社会的底线任务是打赢脱贫攻坚战，消除绝对贫困，这一任务已经完成，不符合题干“谋划“十五五”时期经济社会发展”的要求。B是干扰项，","notes":"①「B选项」打赢脱贫攻坚战，消除绝对贫困，是全面建成小康社会的底线任务，是必须抓紧抓好的第一民生工程\n②「A、C、D选项」增进民生福社是坚持立党为公、执政为民的本质要求，是社会主义生产的根本目的，也是全面建设社会主义现代化国家的应有之义","tips":"","module":"习思想","title":"第十一章 · 以保障和改善民生为重点加强社会建设"},{"chapter":"第十一章","section":"多选","no":6,"stem":"党的十八大以来，通过努力，我国居民人均可支配收入实际增长超八成，2025年，全国居民人均可支配收入为43377元，形成超过4亿人口的世界上最大规模中等收入群体，城乡、地区和不同群体居民收入差距总体上趋于缩小。同时也要看到，我国在收入分配领域面临的深层次矛盾和问题还不少，党的二十届三中全会深刻把握“做大蛋糕”与“分好蛋糕”的辩证关系，作出一系列完善收入分配的制度安排，构建初次分配、再分配、第三次分配协调配套的制度体系，具体措施包括（　　）","opts":{"A":"提高居民收入在国民收入分配中的比重，提高劳动报酬在初次分配中的比重","B":"完善劳动者工资决定、合理增长、支付保障机制，健全按要素分配政策制度","C":"完善税收、社会保障、转移支付等再分配调节机制","D":"支持发展公益慈善事业"},"ans":"ABCD","point":"完善分配制度","explain":"构建初次分配、再分配、第三次分配协调配套的制度体系，提高居民收入在国民收入分配中的比重，提高劳动报酬在初次分配中的比重。完善劳动者工资决定、合理增长、支付保障机制，健全按要素分配政策制度。完善税收、社会保障、转移支付等再分配调节机制。支持发展公益慈善事业。规范收入分配秩序，规范财富积累机制，多渠道增加城乡居民财产性收入，形成有效增加低收入群体收入、稳步扩大中等收入群体规模、合理调节过高收入的制度体系。应选A、B、C、D。习近平新时代中国特色社会主义思想概论","notes":"","tips":"","module":"习思想","title":"第十一章 · 以保障和改善民生为重点加强社会建设"},{"chapter":"第十一章","section":"多选","no":7,"stem":"就业，一头连着经济脉动，一头连着万家灯火。在2025年4月底召开的部分省区市“十五五”时期经济社会发展座谈会上，习近平总书记提出“多措并举稳就业、稳企业、稳市场、稳预期，有效稳住经济基本盘”的重要要求。“稳就业”居首，意味着经济发展越是承压前行，越要千方百计稳住就业。将“稳就业”放在“四稳”之首，是因为就业是（　　）","opts":{"A":"新时代加强社会建设的重要着力点","B":"最基本的民生，关系到亿万劳动者及其家庭的切身利益","C":"民生改善的“温度计”，对国家长治久安具有重要支撑作用","D":"劳动者赖以生存和发展的基础、共享经济发展成果的基本条件"},"ans":"BCD","point":"实施就业优先战略","explain":"就业是最基本的民生，是劳动者赖以生存和发展的基础、共享经济发展成果的基本条件，关系到亿万劳动者及其家庭的切身利益。解决好就业问题，是民生改善的“温度计”，对国家长治久安具有重要支撑作用。实施就业优先战略，把就业摆在经济社会发展优先位置，突出就业作为基本民生的重要作用，有利于不断扩大就业容量、创造和增加收入、改善人民生活品质。应选B、C、D。健全和完善社会保障体系是新时代加强社会建设的重要着力点，A选项表述错误。","notes":"①「B、C、D选项」就业是最基本的民生，是劳动者赖以生存和发展的基础。解决好就业问题，是民生改善的“温度计”。就业是最大的民生工程、民心工程、根基工程，必须抓紧抓实抓好\n②「A选项健全和完善社会保障体系是新时代加强社会建设的重要着力点社会保障是保障和改善民生、维护社会公平、增进人民福社的基本制度保障，是促进经济社会发展、实现广大人民群众共享改革发展成果的重要制度安排，发挥着民生保障安全网、收入分配调节器、经济运行减震器的作用，是治国安邦的大问题中国特色的社会保障体系，是在坚持社会主义原则、立足中国实际、总结我国社会保障实践经验、学习借鉴国外有益经验的基础上建立起来的","tips":"","module":"习思想","title":"第十一章 · 以保障和改善民生为重点加强社会建设"},{"chapter":"第十一章","section":"多选","no":8,"stem":"2026年1月20日，习近平总书记在省部级主要领导干部学习贯彻党的二十届四中全会精神专题研讨班开班式上指出：“经济发展和社会发展相辅相成，必须协调并进。要把改善民生作为促进社会发展的重点，在发展经济的同时稳步提高人民生活品质。”这要求我们在把握民生与发展的关系时必须认识到（　　）","opts":{"A":"发展是改善民生的物质基础，是解决一切民生问题的前提","B":"持续不断地改善民生，能够调动社会生产积极性，为发展创造稳定预期和强大内需","C":"只要经济保持持续快速发展，所有的民生问题就会迎刃而解","D":"必须形成改善民生与促进发展有机统一、相互促进的长效机制"},"ans":"ABD","point":"坚持在发展中增进民生福祉","explain":"“发展是解决民生问题的‘总钥匙’”，发展是改善民生的物质基础和根本途径，没有发展，改善民生就是“无源之水”。“把改善民生作为促进社会发展的重点”，阐述了民生改善对发展的积极反作用，即通过解决后顾之忧、调动积极性、扩大内需来促进发展。“经济发展和社会发展相辅相成，必须协调并进”证明了必须形成改善民生与促进发展有机统一、相互促进的长效机制。应选A、B、D。C选项表述绝对化且片面。它割裂了发展与民生的有机联系，将“发展”简单等同于经济增长，并错误地认为经济增长会自动、必然地解决所有民生问题。实际上，民生问题的解决不仅需要物质基础，还需要通过合理的制度安排、政策引导和持续投入，主动作为、精准施策。发展成果不会自动普惠共享，忽视民生关切反而可能制约可持续发展。","notes":"「A选项」发展是解决民生问题的“总钥匙”，民生是发展的“指南针”。发展是改善民生的物质基础，是解决一切民生问题的前提","tips":"“所有的民生问题就会迎刃而解”表述过于绝对。多选题要小心表述比较绝对的选项。其余具体作用意义政策类表述，符合材料主题且表述无明显错误就可以选，不用管自己有没有见过它。","module":"习思想","title":"第十一章 · 以保障和改善民生为重点加强社会建设"},{"chapter":"第十一章","section":"多选","no":9,"stem":"2026年3月6日下午，习近平总书记在看望参加全国政协十四届四次会议的农工党、九三学社、医药卫生界、社会福利和社会保障界委员，并参加联组会，听取意见和建议时强调：“到2035年建成健康中国是中共中央作出的一项战略决策，“十五五”是实现这一目标的关键时期，必须统筹谋划、加紧推进，力求取得决定性进展。”扎实推进健康中国建设的原因在于（　　）","opts":{"A":"卫生健康事业在经济社会发展中处于基础性地位","B":"拥有健康的人民意味着拥有更强大的综合国力和可持续发展能力","C":"适应我国社会主要矛盾的变化，满足人民日益增长的美好生活需要","D":"人民健康是社会文明进步的基础，是民族昌盛和国家富强的重要标志"},"ans":"ABCD","point":"推进健康中国建设","explain":"人民健康是社会文明进步的基础，是民族昌盛和国家富强的重要标志，是促进人的全面发展的必然要求。卫生健康事业在经济社会发展中处于基础性地位，拥有健康的人民意味着拥有更强大的综合国力和可持续发展能力。把保障人民健康放在优先发展的战略位置，扎实推进健康中国建设，是适应我国社会主要矛盾变化、满足人民美好生活需要的要求，也是实现经济社会更高质量、更有效率、更加公平、更可持续、更为安全发展的基础。A、B、C、D都是正确选项","notes":"1「B、C、D选项」人民健康是社会文明进步的基础，是民族昌盛和国家富强的重要标志，是促进人的全面发展的必然要求。人民健康是社会主义现代化的重要标志2「A选项」卫生健康事业在经济社会发展中处于基础性地位，拥有健康的人民意味着拥有更强大的综合国力和可持续发展能力推进健康中国建设，要把保障人民健康放在优先发展的战略位置","tips":"","module":"习思想","title":"第十一章 · 以保障和改善民生为重点加强社会建设"},{"chapter":"第十一章","section":"多选","no":10,"stem":"当前，我国社会保障体系建设取得历史性成就，但仍面临结构性就业矛盾凸显、“应保尽保”尚未完全实现、医保基金长期保持平衡面临压力、人口老龄化日趋严峻等诸多现实挑战，驱待以顶层设计与系统改革破解难题，推动社会保障事业高质量发展。“十五五”规划纲对健全社会保障体系作出系统部署，为筑牢民生底线、夯实发展根基提供了清晰路径。明确把高质量充分就业作为经济社会发展的优先目标，构建就业友好型发展方式。提出完善社保关系转移接续政策，有解决灵活就业人员、新就业形态人员参保难题，提出健全多层次医疗保障体系，解决看病难、看病贵问题。由此可见构建覆盖全民、统筹城乡、公平统一、安全规范、可持续的多层次社会保障体系是（　　）","opts":{"A":"实现发展成果普惠共享、促进社会公平正义的基础性制度安排","B":"筑牢民生底线、夯实发展根基的关键举措","C":"民生保障的安全网、收入分配的调节器、经济运行的减震器","D":"稳定社会预期、激发消费活力、促进劳动力合理流动的重要保障"},"ans":"ABCD","point":"健全社会保障体系","explain":"“十五五”规划纲要对健全社会保障体系作出系统部署，为筑牢民生底线、夯实发展根基提供了清晰路径。明确把高质量充分就业作为经济社会发展的优先目标，构建就业友好型发展方式。提出完善社保关系转移接续政策，有助于解决灵活就业人员、新就业形态人员参保难题，推动社保覆盖从“制度全覆盖”向“人群全覆盖”升级。提出健全多层次医疗保障体系，有助于解决看病难、看病贵问题。由此可见社会保障是治国安邦的大问题，是民生保障的安全网、收入分配的调节器、经济运行的减震器。构建覆盖全民、统筹城乡、公平统一、安全规范、可持续的多层次社会保障体系，是实现发展成果普惠共享、促进社会公平正义的基础性制度安排，更是筑牢民生底线、夯实发展根基的关键举措。这一体系不仅有助于织密织牢民生保障网，让人民群众共享改革发展成果，更能稳定社会预期、激发消费活力、促进劳动力合理流动，为经济高质量发展注入持久动力，实现民生保障与经济发展的良性互动。A、B、C、D都是正确选项。","notes":"健全和完善社会保障体系是新时代加强社会建设的重要着力点\n②「A、B、C、D选项」社会保障是保障和改善民生、维护社会公平、增进人民福社的基本制度保障，是促进经济社会发展、实现广大人民群众共享改革发展成果的重要制度安排，发挥着民生保障安全网、收入分配调节器、经济运行减震器的作用，是治国安邦的大问题习近平新时代中国特色社会主义思想概论中国特色的社会保障体系，是在坚持社会主义原则、立足中国实际、总结我国社会保障实践经验、学习借鉴国外有益经验的基础上建立起来的","tips":"","module":"习思想","title":"第十一章 · 以保障和改善民生为重点加强社会建设"},{"chapter":"第十一章","section":"多选","no":11,"stem":"社会治理是国家治理的重要组成部分，安全稳定的社会环境能为经济社会高质量发展保驾护航。当前，我国社会治理体系不断完善，但仍面临诸多挑战，特别是在错综复杂的国际国内形势下，我国经济社会发展的风险触点多、燃点低、传导快，各类风险跨界性、关联性、穿透性显著增强，给社会治理带来新的严峻挑战，驱待以理念革新、制度创新、技术赋能推动治理范式转型，为经济社会发展筑牢安全稳定屏障。为营造稳定有序的发展环境提供了清晰指引，“十五五”规划纲要对完善社会治理体系作出系统部署有（　　）","opts":{"A":"明确坚持系统治理、依法治理、综合治理、源头治理，完善共建共治共享的社会治理制度","B":"提出夯实基层社会治理根基，发挥人民群众主体作用，引导各方有序参与社会治理","C":"提出加强新经济组织、新社会组织、新就业群体党的建设，进一步扩大党的组织覆盖和工作覆盖","D":"明确畅通和规范群众诉求表达、利益协调、权益保障通道，深入推动矛盾纠纷源头化解、多元化解、有序化解配套i习近平新时代中国特色社会主义思想概论"},"ans":"ABCD","point":"加强和创新社会治理","explain":"“十五五”规划纲要对完善社会治理体系作出系统部署，为营造稳定有序的发展环境提供了清晰指引。明确坚持系统治理、依法治理、综合治理、源头治理，完善共建共治共享的社会治理制度，有助于推进社会治理现代化。提出夯实基层社会治理根基，有助于发挥人民群众主体作用，引导各方有序参与社会治理。提出加强新经济组织、新社会组织、新就业群体党的建设，进一步扩大党的组织覆盖和工作覆盖。明确畅通和规范群众诉求表达、利益协调、权益保障通道，深入推动矛盾纠纷源头化解、多元化解、有序化解。A、B、C、D都是正确选项。","notes":"","tips":"具体作用意义政策类表述，符合材料主题且表述无明显错误就可以选，不用管自己有没有见过它。","module":"习思想","title":"第十一章 · 以保障和改善民生为重点加强社会建设"},{"chapter":"第十二章","section":"单选","no":1,"stem":"“十四五”时期，我国可再生能源装机占比由40%提升至60%左右，建成全球最大、最完整的新能源产业链；资源利用效率持续提高，扣除原料用能和非化石能源消费量后，单位国内生产总值能耗累计下降约15.4%，单位国内生产总值二氧化碳排放累计下降约12.4%；环境质量持续改善，2025年全国地级及以上城市PM2.5平均浓度降至28微克／立方米，优良天数比例达89.3%，地表水优良水质断面比例达91.4%，均为有监测记录以来最好水平。这表明解决生态环境问题的治本之策是（　　）","opts":{"A":"绿色低碳发展","B":"统筹山水林田湖草沙系统治理","C":"完善生态文明制度体系","D":"加快推动产业结构调整"},"ans":"A","point":"加快形成绿色生产方式和生活方式","explain":"绿色低碳发展是解决生态环境问题的治本之策，强调从发展方式的根本变革入手（如能源结构、产业结构、资源利用方式的系统性转型），解决生态环境问题的根源（传统高耗能、高污染发展模式）。题干中“可再生能源占比、产业结构优化、资源利用效率提升”均是绿色低碳发展的具体体现，印证了其作为“治本之策”的根本性和全面性。应选A。B选项统筹山水林田湖草沙系统治理聚焦生态系统治理的实践层面，是解决生态环境问题的具体手段，而非“治本之策”；C选项完善生态文明制度体系属于“生态文明建设的制度保障”；D选项加快推动产业结构绿色转型是绿色低碳发展的组成部分，但仅为发展方式变革的一个方面，不能完整概括“治本之策”的全局性。B、C、D选项不符合题意。","notes":"关于生态环境的常见知识点总结：1）生态文明建设是重大经济问题，也是关系党的使命宗旨的重大政治问题、关系民生福补的重大社会问题。良好的生态环境是最公平的公共产品，是最普惠的民生福社2）我们党把生态文明建设作为关系中华民族永续发展的根本大计，摆在全局工作的突出位置3）我国生态环境保护结构性、根源性、趋势性压力尚未根本缓解4）「C选项」要加快推动发展方式绿色低碳转型，坚持把绿色低碳发展作为解决生态环境问题的治本之策5）生态环境问题，归根到底是资源过度开发、粗放利用、奢侈消费造成的","tips":"","module":"习思想","title":"第十二章 · 建设社会主义生态文明"},{"chapter":"第十二章","section":"单选","no":2,"stem":"党的十八大以来，我国森林面积和蓄积量持续“双增长”，荒漠化和沙化土地面积持续“双缩减”，是全球增绿最多最快的国家，天蓝地绿水清已经成为常态。2026年3月，我国颁布生态环境法典，这对于建设美丽中国具有重大意义，这主要表现在这部法典（　　）","opts":{"A":"首次明确绿色是中国式现代化的底色","B":"进一步筑牢了美丽中国建设的法治基石","C":"首次明确了“绿水青山就是金山银山”的法律地位","D":"取代了所有单行的环境保护法律法规"},"ans":"B","point":"用最严格制度最严密法治保护生态环境","explain":"2026年3月30日，党和国家领导人来到北京市昌平区百善镇参加首都义务植树活动，习近平总书记指出：“我国颁布生态环境法典，进一步筑牢了美丽中国建设的法治基石。”这精准地指出了生态环境法典在法治保障层面的根本性作用。应选B。首次明确“绿色是中国式现代化的鲜明底色”这一重要论断的官方文件是《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》，A选项错误；C选项中的理念早已深入人心并体现在多项政策法律中，并非简单取代。","notes":"","tips":"明显C选项我们在生活中已经熟知，肯定不是今年首次才提出，可以轻松排除。D选项中“取代”一词也可以轻松排除，生态环境法典作为“法治基石”，完全逻辑合理，优先猜B选项。","module":"习思想","title":"第十二章 · 建设社会主义生态文明"},{"chapter":"第十二章","section":"单选","no":3,"stem":"气候行动有效性根植于各国实际，需要尊重各国不同起点、发展阶段和国情能力，在可持续发展和减贫框架下推进公正转型。绿色转型是应对气候变化的必由之路，也是经济社会发展的新引擎。各方在绿色转型中必须落到实处的是（　　）","opts":{"A":"“绿水青山就是金山银山”的发展理念","B":"山水林田湖草沙一体化保护和系统治理原则","C":"共同但有区别的责任原则","D":"生态兴则文明兴、生态衰则文明衰的历史观"},"ans":"C","point":"共建清洁美丽世界","explain":"应对生态环境挑战，必须摒弃“单边主义”“极端利已主义”“甩锅推责”，打造多元共治的全球生态治理体系。坚持共同但有区别的责任原则。发达国家和发展中国家处于不同发展阶段，在环境问题上的历史责任和现实能力存在差异。这与题干“尊重各国不同起点、发展阶段和国情能力”直接呼应，应选C。A选项“绿水青山就是金山银山的发展理念”强调生态保护与经济发展的辩证关系，这是中国自己的生态文明理念，并不对应各国实际。B选项“山水林田湖草沙一体化保护和系统治理原则”聚焦国内生态治理实践，而题干强调“各方在绿色转型中”（国际合作视角），也是范围不匹配。D选项“生态兴则文明兴、生态衰则文明衰的历史观”是绿色转型的理论依据，主要阐述生态与文明的关系，但非直接指导生态治理实践的“原则”。","notes":"①「C选项」绿色转型要坚持以人为本，坚持科学治理，坚持多边主义，坚持共同但有区别的责任原则","tips":"材料“各方在绿色转型中”（已经显现国际合作视角），更多是强调多元共治、全球合作，只有C选项最匹配。习近平新时代中国特色社会主义思想概论","module":"习思想","title":"第十二章 · 建设社会主义生态文明"},{"chapter":"第十二章","section":"多选","no":4,"stem":"生态文明建设是重大经济问题，也是关系党的使命宗旨的重大政治问题、关系民生福证的重大社会问题。党的十八大以来，我们党把生态文明建设摆在全局工作的突出位置，从思想、法律、体制、组织、作风上全面发力，谋划开展了一系列根本性、开创性、长远性工作。实现了（　　）","opts":{"A":"由重点整治到系统治理的重大转变","B":"由被动应对到主动作为的重大转变","C":"由全球环境治理参与者到引领者的重大转变","D":"由实践探索到科学理论指导的重大转变"},"ans":"ABCD","point":"把生态文明建设摆在全局工作的突出位置","explain":"生态文明建设是重大经济问题，也是关系党的使命宗旨的重大政治问题、关系民生福的重大社会问题。党的十八大以来，我们党把生态文明建设摆在全局工作的突出位置，从思想、法律、体制、组织、作风上全面发力，谋划开展了一系列根本性、开创性、长远性工作。从解决突出生态环境问题入手，注重点面结合、标本兼治，实现由重点整治到系统治理的重大转变；坚持转变观念、压实责任，不断增强全党全国推进生态文明建设的自觉性主动性，实现由被动应对到主动作为的重大转变；紧跟时代、放眼世界，承担大国责任、展现大国担当，实现由全球环境治理参与者到引领者的重大转变；不断深化对生态文明建设规律的认识，形成习近平生态文明思想，实现由实践探索到科学理论指导的重大转变。A、B、C、D都是正确选项。","notes":"①「A、B、C、D选项」十八大以来，我们在生态文明建设中实现了由重点整治到系统治理的重大转变由被动应对到主动作为的重大转变、由全球环境治理参与者到引领者的重大转变、由实践探索到科学理论指导的重大转变（“四个重大转变”）","tips":"","module":"习思想","title":"第十二章 · 建设社会主义生态文明"},{"chapter":"第十二章","section":"多选","no":5,"stem":"《中华人民共和国国民经济和社会发展第十五个五年规划纲要》提出：坚持环保为民，全面落实精准科学依法治污，更加注重源头治理，强化减污降碳协同、多污染物控制协同、区域治理协同，加快推动环境质量改善由量变到质变，深入打好蓝天、碧水、净土保卫战。持续深入打好蓝天、碧水、净土保卫战，是全面推进美丽中国建设的重要战役。要持续深入打好蓝天、碧水、净土保卫战，是因为（　　）","opts":{"A":"我国生态文明建设已进入重点整治，解决突出生态环境问题的新阶段","B":"良好生态环境是最公平的公共产品，是最普惠的民生福祉","C":"人与自然是生命共同体，保护自然就是保护人类","D":"良好生态环境可以支撑经济高质量发展"},"ans":"BCD","point":"生态兴则文明兴","explain":"习近平总书记强调，生态环境问题直接关系民生福祉，蓝天白云、清水绿岸是最基本的公共产品，解决生态环境问题是满足人民对美好生活向往的重要内容。打好污染防治攻坚战的直接目标是改善生态环境质量，回应人民群众对优美环境的需求。B选项符合题意。人与自然是生命共同体，保护生态环境就是保护人类自身的生存和发展基础。打好保卫战的底层逻辑是遵循自然规律，避免因生态破坏导致文明危机，因此C选项是题干举措的理论依据。污染防治攻坚战不仅是治理环境问题，更是推动绿色转型、实现高质量发展的重要抓手。打好保卫战是推动生产生活方式绿色变革的关键举措，服务于高质量发展目标，因此D选项也符合题意。A选项判断不符合我国生态文明建设的最新阶段特征，党的十八大以来，我国从解决突出生态环境问题入手，注重点面结合、标本兼治，已经实现由重点整治到系统治理的重大转变当前我国生态文明建设已进入以实现生态环境质量改善由量变到质变的关键时期。题干对此也有提示","notes":"","tips":"我们在生态文明建设中已经实现了由重点整治到系统治理的重大转变，A选项类似的完成时态说法多仔细判断一下。","module":"习思想","title":"第十二章 · 建设社会主义生态文明"},{"chapter":"第十二章","section":"多选","no":6,"stem":"习近平总书记指出：“处理好发展和保护的关系，是一个世界性难题，也是人类社会发展面临的永恒课题。”绿水青山就是金山银山。十年来，长江经济带交出一份含绿量更高、含金量更足的清晰答卷一一优良水质比例从67%提升到96.5%，与此同时，地区生产总值翻了一番多，占全国比重从42.2%提升到47.3%。从42.2%到47.3%，足足5个百分点的增长，长江更美了，长江经济带的活力更足了。“绿水青山就是金山银山”理念（　　）","opts":{"A":"阐明了经济发展与生态环境保护之间的关系","B":"揭示了保护生态环境就是保护生产力、改善生态环境就是发展生产力的道理","C":"指明了实现发展和保护协同共生的新路径","D":"诠释了宁可不要经济发展，也要先保护环境的决心"},"ans":"ABC","point":"绿水青山就是金山银山","explain":"“绿水青山就是金山银山”，这是重要的发展理念，也是推进现代化建设的重大原则。这一理念，阐明了经济发展与生态环境保护之间的关系，揭示了保护生态环境就是保护生产力、改善生态环境就是发展生产力的道理，指明了实现发展和保护协同共生的新路径。A、B、C是正确选项。发展经济不能对资源和生态环境竭泽而渔，但生态环境保护也不是舍弃经济发展而缘木求鱼，而是要坚持在发展中保护、在保护中发展。D选项表述错误。","notes":"1「D选项」新时代，我国经济已由高速增长阶段转向高质量发展阶段，生态环境的支撑作用越来越明显。必须要处理好高质量发展和高水平保护的关系","tips":"D选项是对文字字面意思绝对化放大曲解，是要坚持在发展中保护、在保护中发展，而不是绝对的偏废一方。","module":"习思想","title":"第十二章 · 建设社会主义生态文明"},{"chapter":"第十二章","section":"多选","no":7,"stem":"2005年8月15日，习近平同志到浙江安吉余村考察调研，以充满前瞻性的战略眼光，首次提出“绿水青山就是金山银山”。习近平同志对当时余村关停污染环境的矿山，开始搞生态旅游的做法表示肯定，指出“我们过去讲既要绿水青山，又要金山银山，实际上绿水青山就是金山银山”。2005年8月24日，习近平同志在《浙江日报》发表《绿水青山也是金山银山》一文，深刻阐述了“绿水青山”和“金山银山”的辩证统一关系，从战略高度指明了绿色变革的发展路径，强调“如果能够把这些生态环境优势转化为生态农业、生态工业、生态旅游等生态经济的优势，那么绿水青山也就变成了金山银山。”这一论述说明了（　　）","opts":{"A":"绿水青山既是自然财富、生态财富，又是社会财富、经济财富","B":"绿水青山可带来金山银山，但金山银山却买不到绿水青山","C":"人类发展活动必须尊重自然、顺应自然、保护自然，才能征服自然","D":"处理好绿水青山和金山银山的关系，关键在人，关键在思路"},"ans":"ABD","point":"绿水青山就是金山银山","explain":"绿水青山既是自然财富、生态财富，又是社会财富、经济财富。巍巍高山、范茫草原、茂密森林、碧海蓝天、洁净沙滩、湖泊湿地、冰天雪地等都是大自然的慷慨馈赠，也是人类永续发展的最大本钱。绿水青山可带来金山银山，但金山银山却买不到绿水青山。处理好绿水青山和金山银山的关系，关键在人，关键在思路。坚持生态优先、绿色发展，把生态环境优势转化为生态农业、生态工业、生态旅游等生态经济优势，绿水青山就变成了金山银山。A、B、D是正确选项习近平总书记指出：“人类发展活动必须尊重自然、顺应自然、保护自然，否则就会遭到大自然的报复，这个规律谁也无法抗拒。”“绿水青山就是金山银山”理念从根本上实现了从“征服自然”向“人与自然和谐共生”的重大转变，强调始终尊重自然、顺应自然、保护自然，站在人与自然和谐共生的高度谋划发展。C选项表述错误。","notes":"马克思认为，应当合理地调节人与自然之间的物质变换，在最无愧于和最适合人类本性的条件下进行这种物质变换。人在自然面前不是被动的、无能为力的，而是能动的、积极的，但人的能动作用不能脱离自然规律的轨道去盲目发挥，否则势必遭到大自然的报复和惩罚","tips":"","module":"习思想","title":"第十二章 · 建设社会主义生态文明"},{"chapter":"第十二章","section":"多选","no":8,"stem":"《中华人民共和国国民经济和社会发展第十五个五年规划纲要》在“健全绿色发展政策体系”中，部署了完善生态补偿机制、探索生态产品价值实现渠道等任务。这些制度创新是践行“绿水青山就是金山银山”理念的关键路径，因为它们有助于（　　）","opts":{"A":"让保护修复生态环境获得合理回报，使“绿水青山”的守护者受益","B":"将优良生态蕴含的旅游、康养、碳汇等价值转化为现实的经济收入","C":"从根本上改变GDP至上的政绩观，使绿色发展成为地方政府的自觉行动","D":"确保不同区域、不同群体在生态保护过程中实现同步富裕"},"ans":"ABC","point":"绿水青山就是金山银山","explain":"本题考查“绿水青山就是金山银山”理念的实践转化机制，即如何通过具体的制度设计（生态补习近平新时代中国特色社会主义思想概论偿、生态产品价值实现），让良好的生态环境（绿水青山）能够产生经济效益（金山银山），从而激励保护行为、推动绿色发展。A选项正确。生态补偿机制的核心就是通过财政转移支付、市场交易等方式，对为保护生态环境付出代价或作出贡献的地区、企业和个人给予合理补偿，这直接让“守护者”受益，解决了“谁保护谁吃亏”的问题。B选项正确。探索生态产品价值实现渠道，如发展生态旅游、森林康养、经营林业碳汇项目等，正是将生态环境本身所具有的间接使用价值、非使用价值转化为可以直接交易、带来收入的市场产品，是“变现”绿水青山的关键。C选项正确。将生态保护成效纳入政绩考核，建立体现生态文明要求的考核评价体系，并与生态补偿等经济利益挂钩，能够从根本上引导地方政府摒弃单纯追求GDP增速的旧观念，将绿色发展内化为自觉追求。共同富裕是全体人民共同富裕，是人民群众物质生活和精神生活都富裕，不是同步富裕，也不是同等富裕。生态保护过程中，因资源赋、功能定位、发展基础不同，不同区域和群体实现富裕的路径、速度和程度会有所差异。制度设计旨在提供公平的机会和合理的回报，促进协调发展，而非确保“同步”富裕。故D选项表述不准确。","notes":"②「D选项」共同富裕是中国特色社会主义的本质要求，是中国式现代化的重要特征。实现共同富裕不仅是经济问题而且是关系党的执政基础的重大政治问题。共同富裕是全体人民共同富裕，是人民群众物质生活和精神生活都富裕，不是少数人的富裕，也不是整齐划一的平均主义，不是所有人都同时富裕，也不是所有地区同时达到一个富裕水准。促进共同富裕，要把握好鼓励勤劳创新致富、坚持基本经济制度、尽力而为量力而行、坚持循序渐进的原则","tips":"","module":"习思想","title":"第十二章 · 建设社会主义生态文明"},{"chapter":"第十二章","section":"多选","no":9,"stem":"2026年3月，《中华人民共和国生态环境法典》经全国人大会议表决通过。作为继民法典习近平新时代中国特色社会主义思想概论之后我国第二部以“法典”命名的基本法律，它系统整合了现行生态环境法律制度，并在治理理念、体系构建上实现了多项开创性突破。下列选项中，属于该法典首次作出规定或实现的重大突破的有（　　）","opts":{"A":"开创性地设立“绿色低碳发展”编，将应对气候变化、碳达峰碳中和等国家战略全面纳入法治轨道","B":"首次实现了生态环境治理逻辑从“分要素、分环节”的碎片化管理向“全过程、全地域、全要素”系统治理的根本转变","C":"废止了现行的生态环境的单行法，成为我国第一部以“法典”命名的基本法律","D":"首次将“生态环境分区管控制度”“生态环境保护督察制度”写入法律"},"ans":"ABD","point":"用最严格制度最严密法治保护生态环境","explain":"本题考查《中华人民共和国生态环境法典》在治理理念、体系架构、法律制度等方面的开创性贡献，重点识别其相较于过去生态环境领域立法实践的“首次”与“根本性转变”。A选项正确。题目明确指出，法典“开创性地设立‘绿色低碳发展编，这在世界环境法典编纂史上具有前瞻意义”，这确实是我国及世界环境法典编纂中的重大创新，首次将绿色低碳发展以独立编章形式系统、完整地纳入国家基本法律。B选项正确。文章引用专家观点指出，法典“标志着我国生态环境治理逻辑实现了从‘分要素、分环节、分部门’的碎片化管理，向‘全过程、全地域、全要素’系统治理的历史性转变”。这是治理范式上的首次根本性革新。D选项正确。题目指出，法典明确“国家建立健全生态环境分区管控制度”“生态环境保护督察制度”写入法律，并将“三线一单”成果“法定化、规范化”。这是该套行之有效的环境空间管控政策首次在法律层面获得系统性、权威性的确认，是源头预防制度的重大突破。C选项错误。《中华人民共和国生态环境法典》采用“适度法典化”编纂模式。对现行立法分类处理，形成“法典+单行法”的双法源格局。我国第一部以“法典”命名的基本法律是《中华人民共和国民法典》，于2020年通过，2021年施行。生态环境法典是第二部。此选项为事实性错误，是典型干扰项。","notes":"","tips":"题干都已经告诉了这是作为继民法典之后我国第二部以“法典”命名的基本法律，C选项事实错误。","module":"习思想","title":"第十二章 · 建设社会主义生态文明"},{"chapter":"第十二章","section":"多选","no":10,"stem":"第十四届全国人民代表大会第四次会议通过的生态环境法典开创性地设立“绿色低碳发展”编，这在世界环境法典编纂史上具有前瞻意义。“绿色低碳发展”编中，“应对气候变化”专章格外引人关注。法典积极落实“碳达峰碳中和”战略，将碳排放总量和强度双控制度、全国碳排放权交易市场、全国温室气体自愿减排交易市场等关键制度上升为法律。中国将碳达峰碳中和作为国家战略，广泛深入开展碳达峰行动（　　）","opts":{"A":"是中国破解资源环境约束突出问题、实现可持续发展的内在要求","B":"是中国顺应技术进步趋势、推动经济结构转型升级的必然选择","C":"是中国满足人民群众日益增长的优美生态环境需求、促进人与自然和谐共生的迫切需要","D":"是中国担当大国责任、推动构建人类命运共同体的主动作为"},"ans":"ABCD","point":"加快形成绿色生产方式和生活方式","explain":"本题考查“推动绿色发展，促进人与自然和谐共生”中“碳达峰碳中和”战略的重大意义。需从国内可持续发展的内在要求、经济转型的必然选择、满足人民需求的迫切需要、参与全球治理的大国担当四个维度全面理解其必要性。A选项正确。我国资源环境约束趋紧，推进碳达峰碳中和有助于倒逼节约资源、保护环境，是破解发展难题、实现中华民族永续发展的内在需要。B选项正确。实现“双碳”目标必须依靠技术创新和产业升级，这将催生绿色低碳新产业、新模式、新动能，是推动经济高质量发展、构建现代化经济体系的必然选择。C选项正确。随着社会发展，人民对清新空气、清洁水源、优美环境的要求越来越高。推动“双碳”工作、改善生态环境质量，直接关系民生福让，是满足人民日益增长的优美生态环境需要的迫切任务。D选项正确。气候变化是全人类面临的共同挑战。中国作为负责任大国，主动实施“双碳”战略，积极参与和引领全球气候治理，彰显了推动构建人类命运共同体的责任与担当。","notes":"","tips":"具体作用意义政策类表述，符合材料主题且表述无明显错误就可以选，不用管自己有没有见过它。","module":"习思想","title":"第十二章 · 建设社会主义生态文明"},{"chapter":"第十二章","section":"多选","no":11,"stem":"2026年3月12日，《中华人民共和国生态环境法典》由中华人民共和国第十四届全国人民代表大会第四次会议通过，自2026年8月15日起施行。这是继民法典之后，我国第二部以“法典”命名的基本法律，编纂生态环境法典是为了（　　）","opts":{"A":"保护生态环境，防治污染和其他公害，保障公众健康和生态环境权益","B":"维护生态安全，推动绿色低碳发展","C":"建设生态文明，全面推进美丽中国建设","D":"加快推进人与自然和谐共生的现代化，实现中华民族永续发展"},"ans":"ABCD","point":"用最严格制度最严密法治保护生态环境","explain":"本题考查编纂《中华人民共和国生态环境法典》的根本目的和综合宗旨。题目内容直接引用法典总则第一条，需要考生理解该条款所蕴含的多层次、系统化的立法目标。本题A、B、C、D四个选项，完整、准确地对应了法典总则第一条所阐述的立法目的链条：A选项对应“为了保护生态环境，防治污染和其他公害，保障公众健康和生态环境权益”，体现了直接的保护目标和人本关怀；B选项对应“维护生态安全，推动绿色低碳发展”，体现了保障国家生存发展的基础安全和推动发展方式转型；C选项对应“建设生态文明，全面推进美丽中国建设”，体现了国家发展的宏伟战略和长远愿景；D选项对应“加快推进人与自然和谐共生的现代化，实现中华民族永续发展”，体现了现代化建设道路的特色和民族复兴的终极追求。这四个选项层层递进，从具体到宏观，共同构成了编生态环境法典的完整目的体系，因此A、B、C、D选项均正确。添真题思维点具体作用意义政策类表述，符合材料主题且表述无明显错误就可以选，不用管自己有没有见过它。习近平新时代中国特色社会主义思想概论","notes":"","tips":"","module":"习思想","title":"第十二章 · 建设社会主义生态文明"},{"chapter":"第十三章","section":"单选","no":1,"stem":"2014年4月15日，习近平在中央国家安全委员会第一次会议上首次提出总体国家安全观，强调必须坚持总体国家安全观，走出一条中国特色国家安全道路。总体国家安全观中放在首要位置的是（　　）","opts":{"A":"经济安全","B":"军事安全","C":"政治安全","D":"文化安全"},"ans":"C","point":"总体国家安全观是新时代国家安全工作的基本遵循","explain":"总体国家安全观以政治安全为根本，坚持把政治安全放在首要位置，完善政治安全工作体系，提高防范化解政治安全风险的能力和水平，实现政治安全、人民安全、国家利益至上有机统一。应选C。总体国家安全观以经济安全为基础，以军事、科技、文化、社会安全为保障，A、B、D是干扰项。","notes":"国家安全是民族复兴的根基，社会稳定是国家强盛的前提（科技自立自强是国家强盛之基、安全之要）\n②「C选项」总体国家安全观以人民安全为宗旨，以政治安全为根本，坚持把政治安全放在首要位置。以经济安全为基础，以军事、科技、文化、社会安全为保障，以促进国际安全为依托做到统筹外部安全和内部安全、国土安全和国民安全、传统安全和非传统安全、自身安全和共同安全，统筹维护国家安全和塑造国家安全，着力解决国家安全工作不平衡不充分的问题\n④「C选项」维护政治安全的重要性：构建统筹各领域安全的新安全格局，必须把维护政治安全作为应对各领域安全风险挑战的首要任务\n③「C选项」把维护政治安全放在首要位置的原因：政治安全是国家安全的根本。政治安全涉及国家主权、政权、制度和意识形态的稳固，是一个国家最根本的需求，是一切国家生存和发展的基础条件。政治安全决定和影响着国家的经济安全、军事安全、社会安全等各个领域的安全。没有政治安全的保障，其他领域的安全就无从谈起，其他领域的安全问题最终也会反映到维护政治安全上来政治安全是维护人民安全和国家利益的根本保证，人民安全居于中心地位，国家利益至上是实现政治安全和人民安全的要求和原则。要把三者统一起来，确保实现党的长期执政、人民安居乐业、国家长治久安","tips":"","module":"习思想","title":"第十三章 · 维护和塑造国家安全"},{"chapter":"第十三章","section":"单选","no":2,"stem":"总体国家安全观的关键在于“总体”，突出强调“大安全”理念。“大安全”理念（　　）","opts":{"A":"聚焦“国之大者”，涵盖诸多重点领域","B":"强调每个领域的所有风险都纳入国家安全风险","C":"追求绝对安全、安全泛化","D":"没有明确边界"},"ans":"A","point":"","explain":"总体国家安全观是新时代国家安全工作的基本遵循“，，，，盖诸多重点领域，是新形势下对国家生存和可持续发展的维护。应选A。“大安全”不是每个领域的所有风险都纳入国家安全风险，更不是追求绝对安全、安全泛化。中国维护国家安全，是有明确边界的，与美国泛化国家安全概念，大搞制裁脱钩、威逼诈，有本质区别。B、C、D是干扰项。","notes":"①「A选项」总体国家安全观关键在“总体”，突出的是“大安全”理念。涵盖政治、军事、国土、经济、金融、文化、社会、科技、网络等诸多领域","tips":"","module":"习思想","title":"第十三章 · 维护和塑造国家安全"},{"chapter":"第十三章","section":"多选","no":3,"stem":"当前，世界之变、时代之变、历史之变正以前所未有的方式展开。人类社会面临和平还是战争、繁荣还是衰退、团结还是对抗的关键块择，又一次站在历史的十字路口。面对外部环境变化带来的不利影响加深、内部风险挑战增多的复杂形势，中国统筹中华民族伟大复兴战略全局与世界百年未有之大变局，国家安全形势保持总体稳定、稳中有进，与亚太国家共同维护地区和平和发展，为动荡不安的世界注入可靠的稳定性。2025年5月，中国在此背景下发布《新时代的中国国家安全》白皮书，旨在全面阐释新时代中国国家安全工作的创新理念、生动实践和建设成果，充分展现中国（　　）","opts":{"A":"众志成城抵御外部遏制打压、维护国家利益的必胜信心","B":"统筹高质量发展和高水平安全的坚定决心","C":"依靠传统安全手段应对非传统安全挑战的战略雄心","D":"构建持久和平、普遍安全世界的不变初心"},"ans":"ABD","point":"国家安全是民族复兴的根基","explain":"中国发布《新时代的中国国家安全》白皮书，旨在全面阐释新时代中国国家安全工作的创新理念、生动实践和建设成果，充分展现中国众志成城抵御外部遏制打压、维护国家利益的必胜信心，统筹高质量发展和高水平安全的坚定决心，构建持久和平、普遍安全世界的不变初心，分享经验做法，推动构建人类命运共同体。A、B、D选项是正确答案。新时代中国国家安全强调“传统安全与非传统安全并重”，倡导统筹发展和安全、坚持系统观念，反对单一依赖传统安全手段。C选项违背“总体国家安全观”的这一要求。","notes":"做到统筹外部安全和内部安全、国土安全和国民安全、传统安全和非传统安全、自身安全和共同安全，统筹维护国家安全和塑造国家安全，着力解决国家安全工作不平衡不充分的问题\n②「C选项」新时代中国国家安全强调“传统安全与非传统安全并重”，倡导统筹发展和安全、坚持系统观念，反对单一依赖传统安全手段","tips":"我们学的是“总体国家安全观”，那么必然将传统安全和非传统安全统等考虑，而非单纯依靠传统安全手段。其余具体作用意义政策类表述，符合材料主题且表述无明显错误就可以选，不用管自己有没有见过它。","module":"习思想","title":"第十三章 · 维护和塑造国家安全"},{"chapter":"第十三章","section":"多选","no":4,"stem":"2014年4月15日，在中央国家安全委员会第一次全体会议上，习近平总书记创造性提出总体国家安全观。总体国家安全观是新中国成立以来第一个被确立为国家安全工作指导思想的重大战略思想，是习近平新时代中国特色社会主义思想的重要组成部分，是当代中国对世界的重要思想理论贡献。总体国家安全观强调，以新安全格局保障新发展格局，必须统筹（　　）","opts":{"A":"发展和安全","B":"外部安全和内部安全、国土安全和国民安全","C":"传统安全和非传统安全、自身安全和共同安全","D":"维护和塑造国家安全"},"ans":"ABCD","point":"总体国家安全观是新时代国家安全工作的基本遵循","explain":"2014年4月15日，在中央国家安全委员会第一次全体会议上，习近平总书记创造性提出总体国家安全观。总体国家安全观强调，统筹发展和安全，统筹外部安全和内部安全、国土安全和国民安全、传统安全和非传统安全、自身安全和共同安全，统筹维护和塑造国家安全，以新安全格局保障新发展格局。应选A、B、C、D。","notes":"做到统筹外部安全和内部安全、国土安全和国民安全、传统安全和非传统安全、自身安全和共同安全，统筹维护国家安全和塑造国家安全，着力解决国家安全工作不平衡不充分的问题关于发展与安全的常见知识点总结：1）统筹发展和安全，是党和国家的一项基础性工作，是我们党治国理政的一个重大原则2）发展和安全是两件大事。发展解决的是动力问题，是推动国家和民族续绵延的根本支撑，安全解决的是保障问题，是确保国家和民族行稳致远的坚强柱石。高质量发展是第一要务，不发展是最大的不安全习近平新时代中国特色社会主义思想概论3）发展具有基础性、根本性，是解决安全问题的总钥匙，发展就是最大的安全。安全是发展的条件和保障，没有国家安全，发展取得的成果也可能毁于一旦4）发展和安全是一体之两翼、驱动之双轮，必须同步推进（以发展促安全、以安全保发展）5）牢牢守住安全发展这条底线是构建新发展格局的重要前提和保障6）发展是党执政兴国的第一要务，要正确认识和处理改革、发展、稳定的关系。改革是动力，发展是目的，稳定是前提。把不断改善人民生活作为处理改革、发展、稳定关系的重要结合点","tips":"","module":"习思想","title":"第十三章 · 维护和塑造国家安全"},{"chapter":"第十三章","section":"多选","no":5,"stem":"进入新时代，中国明确把统筹发展和安全作为治国理政的重大原则之一，纳入经济社会发展全局考虑，既一以贯之抓好高质量发展这个“第一要务”，又办好保证国家安全这个“头等大事”，把发展和安全统一起来，共同谋划、一体部署、相互促进。推动发展和安全动态平衡、相得益彰，要充分认识到（　　）","opts":{"A":"高质量发展是第一要务，不发展是最大的不安全","B":"高水平安全是发展的前提，没有高水平安全就没有高质量发展","C":"发展具有基础性、根本性，是解决安全问题的总钥匙","D":"牢牢守住安全发展这条底线是构建新发展格局的重要前提和保障"},"ans":"ABCD","point":"统筹发展和安全","explain":"高质量发展是第一要务，不发展是最大的不安全。把高质量发展作为新时代的硬道理，在不断壮大物质技术基础上谋求安全。高水平安全是发展的前提，没有高水平安全就没有高质量发展。中国始终从国家发展的总体格局中把握国家安全的历史使命，通过明底线、防风险，营造有利于经济社会发展的良好环境，保障经济社会发展的成果。发展具有基础性、根本性，是解决安全问题的总钥匙，发展就是最大的安全。以新安全格局保障新发展格局。牢牢守住安全发展这条底线是构建新发展格局的重要前提和保障。只有以新安全格局保障新发展格局，才能把国家发展建立在更加安全、更为可靠的基础之上。A、B、C、D选项都是正确答案。","notes":"","tips":"","module":"习思想","title":"第十三章 · 维护和塑造国家安全"},{"chapter":"第十三章","section":"多选","no":6,"stem":"构建统筹各领域安全的新安全格局，必须把维护政治安全作为应对各领域安全风险挑战的首要任务。政治安全是国家安全的根本。维护政治安全包括（　　）","opts":{"A":"毫不动摇维护国土安全习近平新时代中国特色社会主义思想概论","B":"毫不动摇坚持和巩固党的领导和长期执政地位","C":"毫不动摇坚持和完善中国特色社会主义制度","D":"毫不动摇坚持和巩固马克思主义在意识形态领域的指导地位"},"ans":"BCD","point":"把维护政治安全放在首要位置","explain":"政治安全涉及国家主权、政权、制度和意识形态的稳固，是一个国家最根本的需求，是一切国家生存和发展的基础条件。维护政权安全，就是要毫不动摇坚持和巩固党的领导和长期执政地位。维护制度安全，就是要毫不动摇坚持和完善中国特色社会主义制度。制度稳则国家稳，社会主义制度是我国的根本制度，中国特色社会主义制度所具有的显著优势是抵御风险挑战、维护国家安全的根本保证。维护意识形态安全，就是要毫不动摇坚持和巩固马克思主义在意识形态领域的指导地位，不断巩固全党全国人民团结奋斗的共同思想基础。应选B、C、D。维护国土安全是维护重点领域国家安全。国土安全是立国之基，老祖宗留下来的领土一寸也不能丢，我们决不会坐视领土完整受到侵犯。A选项不符合题意。","notes":"1「B、C、D选项」维护政治安全的主要内容：1）维护政权安全，就是要毫不动摇地坚持和巩固党的领导和长期执政地位2）维护制度安全，就是要毫不动摇地坚持和完善中国特色社会主义制度。制度稳则国家稳，社会主义制度是我国的根本制度，中国特色社会主义制度所具有的显著优势是抵御风险挑战、维护国家安全的根本保证3）维护意识形态安全，就是要毫不动摇地坚持和巩固马克思主义在意识形态领域的指导地位，不断巩固全党全国人民团结奋斗的共同思想基础构建统筹等各领域安全的新安全格局，维护重点领域国家安全是主阵地、主战场\n③「A选项」维护国土安全：国土安全是立国之基，老祖宗留下来的领土一寸也不能丢，我们决不会坐视领土完整受到侵犯维护经济安全：经济安全是国家安全的基础，在风云变幻的世界经济大潮中，能不能驾驭好我国经济这艘大船，是对我们党的重大考验维护社会安全：社会安全与人民群众切身利益关系最密切，是人民群众安全感的晴雨表，是社会安定的风向标。习近平总书记指出：平安是老百姓解决温饱后的第一需求，是极重要的民生，也是最基本的发展环境","tips":"","module":"习思想","title":"第十三章 · 维护和塑造国家安全"},{"chapter":"第十四章","section":"单选","no":1,"stem":"在新的征程上，开创国防和军队现代化新局面，必须全面推进政治建军、改革强军、科技强军、人才强军、依法治军，加快把人民军队建设成为世界一流军队，以更强大的能力、更可靠的手段捍卫国家主权、安全、发展利益。人民军队的立军之本是（　　）","opts":{"A":"改革强军","B":"科技强军","C":"依法治军","D":"政治建军"},"ans":"D","point":"坚持政治建军、改革强军、科技强军、人才强军、依法治军","explain":"政治建军是人民军队的立军之本。D选项是正确答案。改革是决定人民军队发展壮大、制胜未来的关键一招。科技是核心战斗力，是军事发展中最活跃、最具革命性的因素。军事科技的每一次突破，都极大提升了军队的作战能力，一流军队要求一流科技。依法治军是我们党建军治军的基本方式。全面加强军事治理是治军理念和方式的一场深刻变革，必须着力构建现代军事治理体系，以高水平治理推动我军高质量发展。A、B、C是干扰项","notes":"新时代的强军目标是建设一支听党指挥、能打胜仗、作风优良的人民军队，把人民军队建设成为世界一流军队：1）听党指挥是灵魂，决定军队建设的政治方向。坚持党对人民军队的绝对领导是人民军队永远不变的军魂。实践证明，听党指挥是人民军队建设的首要，是人民军队的命脉所在2）能打胜仗是核心，反映军队的根本职能和军队建设的根本指向。能打仗、打胜仗是军队的根本价值所在3）作风优良是保证，关系军队的性质、宗旨、本色。在长期实践中，人民军队形成了一整套光荣传统和优良作风，这是人民军队的鲜明特色和政治优势，也是人民军队战无不胜、攻无不克的重要保证\n②「D选项」坚持党对人民军队的绝对领导，是马克思主义建党建军的一条基本原则，党对人民军队的绝对领导，是建军之本、强军之魂，政治建军是人民军队的立军之本习近平新时代中国特色社会主义思想概论\n③「A选项」改革是决定人民军队发展壮大、制胜未来的关键一招（看到“关键一招”就联想改革）4「B选项」科技是核心战斗力，是军事发展中最活跃、最具革命性的因素。人才是推动人民军队高质量发展、赢得军事竞争和未来战争主动的关键因素5「C选项」依法治军是我们党建军治军基本方式","tips":"","module":"习思想","title":"第十四章 · 建设巩固国防和强大人民军队"},{"chapter":"第十四章","section":"单选","no":2,"stem":"党在新时代的强军目标，是深刻总结我们党建军治军的成功经验，适应国际战略形势和国家安全环境发展的重大变化，着眼于解决军队建设所面临的突出矛盾和问题作出的战略决策。人民军队永远不变的军魂是（　　）","opts":{"A":"坚持党对人民军队的绝对领导","B":"能打仗、打胜仗","C":"一整套光荣传统和优良作风","D":"一体化国家战略体系和能力"},"ans":"A","point":"坚持党对人民军队的绝对领导","explain":"党对人民军队的绝对领导，是建军之本、强军之魂。人民军队是党缔造的，一诞生便与党紧紧地联系在一起，始终在党的领导下行动和战斗。听党指挥是灵魂，决定军队建设的政治方向。坚持党对人民军队的绝对领导是人民军队永远不变的军魂。应选A。能打胜仗是核心，反映军队的根本职能和军队建设的根本指向。能打仗、打胜仗是军队的根本价值所在。作风优良是保证，关系军队的性质、宗旨、本色。在长期实践中，人民军队形成了一整套光荣传统和优良作风，这是人民军队的鲜明特色和政治优势，也是人民军队战无不胜、攻无不克的重要保证。巩固提高一体化国家战略体系和能力，是党中央把握强国强军面临的新形势新任务新要求，着眼于更好统筹发展和安全、更好统筹经济建设和国防建设作出的战略部署。B、C、D是干扰项。","notes":"","tips":"","module":"习思想","title":"第十四章 · 建设巩固国防和强大人民军队"},{"chapter":"第十四章","section":"多选","no":3,"stem":"党的十八大以来，以习近平同志为核心的党中央把强军兴军融入强国复兴进程，谋篇布局、前瞻运筹、深远经略，对全面推进国防和军队现代化作出战略安排。党的十九届五中全会进一步充实了国防和军队现代化的目标任务和发展步骤，明确提出确保2027年实现建军一百年奋斗目标。这形成了国防和军队现代化新“三步走”战略安排，“十五五”时期要如期实现建军一百年奋斗目标、高质量推进国防和军队现代化，必须（　　）","opts":{"A":"坚持好、运用好、发展好政治建军这个重要法宝，毫不动摇坚持和加强党对军队绝对领导","B":"要加强革命化专业化人才队伍建设，坚持不解用党的创新理论铸魂育人","C":"要实现军队国家化，增强政府的科学决策能力","D":"要大力传承和弘扬我党我军优良传统，推进新时代强军文化建设"},"ans":"ABD","point":"全面推进国防和军队现代化的战略安排","explain":"完成“十五五”时期国防和军队现代化目标任务，归根到底要靠各级党组织来领导和推进。要全面加强我军党的领导和党的建设，把各级党组织建设得更加坚强有力。要加强革命化专业化人才队伍建设，坚持不解用党的创新理论铸魂育人，打牢官兵听党话、跟党走的思想根基，确保现代化武器装备掌握在革命化人才队伍手中。要大力传承和弘扬我党我军优良传统，推进新时代强军文化建设，加强先进典型培养和激励，让红色基因代代相传，让新风正气更加充盈，把部队建设和战斗力基础打得更加牢靠。A、B、D是正确选项C选项“军队国家化”主张军队脱离政党领导，这违背了“党对人民军队的绝对领导”这一根本原则和中国特色社会主义政治制度，与“加强党的领导”的要求完全相反。削弱党组织职能，会动摇党的执政根基，瓦解军队的战斗力和凝聚力，非但不能形成“发展优势”，反而会导致混乱和削弱。","notes":"①「C选项」“军队国家化”主张军队脱离政党领导，这违背了“党对人民军队的绝对领导”这一根本原则和中国特色社会主义政治制度，与“加强党的领导”的要求完全相反","tips":"“军队国家化”为错误表述，我军是党绝对领导下的人民军队，不存在“军队国家化”的说法，其余具体作用意义政策类表述，符合材料主题且表述无明显错误就可以选。","module":"习思想","title":"第十四章 · 建设巩固国防和强大人民军队"},{"chapter":"第十五章","section":"单选","no":1,"stem":"党的十八大以来，以习近平同志为核心的党中央继承和发展我们党关于“一国两制”的科学理论，系统阐发了新时代坚持和完善“一国两制”的基本立场和重大原则，对马克思主义国家学说作出了新贡献。“一国两制”的根本宗旨是（　　）","opts":{"A":"维护国家主权、安全、发展利益，保持香港、澳门长期繁荣稳定","B":"推动两岸经济社会融合发展，深化两岸同胞血脉联系","C":"坚持“九二共识”、反对“台独”，推进祖国和平统一进程","D":"扩大对外开放，促进内地与港澳在国际竞争中优势互补"},"ans":"A","point":"准确把握“一国两制”的科学内涵","explain":"“一国两制”的根本宗旨是维护国家主权、安全、发展利益，保持香港、澳门长期繁荣稳定。正确答案为A选项。B、C两选项聚焦于台湾问题，属于“和平统一、一国两制”对台方针的内容，与“一国两制”在港澳的实践无直接关联；D选项是“一国两制”实践对国家发展的积极影响之一，但并非根本宗旨。","notes":"关于“一国两制”的常见知识点总结：1）“一国两制”是一项基本国策，“一国两制”立足中国国情，顺应时代潮流，观照人民福社，把原则性和灵活性、现实性和长远性、一致性和差异性统一起来2）“一国两制”伟大构想，最早是针对台湾问题提出来的，首先运用于解决香港和澳门问题3）“一国两制”的根本宗旨是维护国家主权、安全、发展利益，保持香港、澳门长期繁荣稳定4）“一国两制”方针是一个完整的体系。维护国家主权、安全、发展利益是“一国两制”方针的最高原则，在这个前提下，香港、澳门保持原有的资本主义制度长期不变，享有高度自治权。“一国”是实行“两制”的前提和基础（“一国”是根，“一国”是本），“两制”从属和派生于“一国”，并统一于“一国”之内。“一国”与“两制”并非等量齐观、比肩并列，国家的主体必须实行社会主义制度政权必须掌握在爱国者手中，这是世界通行的政治法则。依法治港治澳，是全面依法治国的应有之义，是全面准确贯彻“一国两制”方针的必由之路。宪法和基本法共同构成特别行政区的宪制基础。宪法是国家根本大法，是特别行政区制度的法律渊源","tips":"","module":"习思想","title":"第十五章 · 坚持“一国两制”和推进祖国完全统一"},{"chapter":"第十五章","section":"单选","no":2,"stem":"“一国两制”方针是一个完整的体系。维护国家主权、安全、发展利益是“一国两制”方针的最高原则，在这个前提下，香港、澳门保持原有的资本主义制度长期不变，享有高度自治权。坚持中央全面管治权和保障特别行政区高度自治权相统一。事关国家主权、安全、发展利益，事关香港、澳门长期繁荣稳定的根本原则是（　　）","opts":{"A":"坚持社会主义制度主体地位","B":"“爱国者治港”“爱国者治澳","C":"坚持中央与地方分权制衡","D":"坚持“港人治港”“澳人治澳”完全自治"},"ans":"B","point":"","explain":"准确把握“一国两制”的科学内涵政权必须掌握在爱国者手中，这是世界通行的政治法则。香港、澳门作为中国的特别行政区，治理者必须是习近平新时代中国特色社会主义思想概论坚定的爱国者，才能切实维护国家主权、安全、发展利益，保障港澳长期繁荣稳定。应选B。主义制度，香港、澳门保持资本主义制度，但这是制度安排而非“根本原则”，题干强调的是“治港治澳”的政治原则，因此不选。C选项坚持中央与地方分权制衡违背“一国两制”下中央与特别行政区的关系。特别行政区的高度自治权来自中央授权，并非“分权制衡”。中央全面管治权与特区高度自治权是统一的，而非相互制衡。C选项错误。“港人治港”“澳人治澳”是高度自治，而非“完全自治”，且必须在“爱国者”的前提下。“完全自治”违背国家主权原则，D选项错误。","notes":"","tips":"","module":"习思想","title":"第十五章 · 坚持“一国两制”和推进祖国完全统一"},{"chapter":"第十五章","section":"单选","no":3,"stem":"新时代党解决台湾问题的总体方略内涵丰富、逻辑严密、系统完备，深刻回答了推进祖国统一的一系列重大理论和实践问题，是我们党对台大政方针的继承发展和集大成。全面贯彻新时代党解决台湾问题的总体方略，实现统一的政治基础是（　　）","opts":{"A":"坚持推动两岸关系和平发展、融合发展","B":"坚持团结台湾同胞、争取台湾民心","C":"坚持一个中国原则和“九二共识”","D":"坚持决不承诺放弃使用武力"},"ans":"C","point":"坚持贯彻新时代党解决台湾问题的总体方略","explain":"全面贯彻新时代党解决台湾问题的总体方略，必须坚持一个中国原则和“九二共识”，这是统一的政治基础，C选项是正确答案。坚持推动两岸关系和平发展、融合发展，这是统一的实践途径；坚持团结台湾同胞、争取台湾民心，这是统一的根本动力；坚持决不承诺放弃使用武力，这是统一的战略支撑。A、B、D不符合题意","notes":"坚持贯彻新时代党解决台湾问题的总体方略（10个坚持）：1）必须坚持党中央对对台工作的集中统一领导，这是统一的根本保证2）坚持在中华民族伟大复兴进程中推进祖国统一，这是统一的历史方位3）坚持在祖国大陆发展进步基础上解决台湾问题，这是统一的战略思路4）坚持“和平统一、一国两制”基本方针，这是统一的大政方针5）坚持一个中国原则和“九二共识”，这是统一的政治基础6）坚持推动两岸关系和平发展、融合发展，这是统一的实践途径7）坚持团结台湾同胞、争取台湾民心，这是统一的根本动力8）坚持粉碎“台独”分裂图谋，这是统一的必然要求9）坚持反对外部势力干涉，这是统一的外部条件10）坚持决不承诺放弃使用武力，这是统一的战略支撑（下列每题给出的四个选项中，至少有两个选项是符合题目要求的，多选、少","tips":"","module":"习思想","title":"第十五章 · 坚持“一国两制”和推进祖国完全统一"},{"chapter":"第十五章","section":"多选","no":4,"stem":"2026年4月10日，习近平总书记会见中国国民党主席郑丽文。这是国共两党领导人时隔10年再次会面。习近平总书记指出：“大陆和台湾同属一个中国，中国是中华民族的共同家园。两岸同胞要守护好、建设好这个共同家园。”建设好这个共同家园（　　）","opts":{"A":"根本在于坚持“九二共识”、反对“台独”","B":"核心是认同两岸同属一个中国","C":"基础是尊重不同的社会制度","D":"目标是要让两岸同胞过上更美好的生活习近平新时代中国特色社会主义思想概论"},"ans":"ABD","point":"实现祖国完全统一是中华民族伟大复兴的必然要求","explain":"4月10日，习近平在北京会见郑丽文主席率领的中国国民党访问团时强调，无论国际形势、台海局势如何变化，中华民族伟大复兴的大趋势不会改变，两岸同胞走亲走近、走到一起的大潮流不会改变。大陆和台湾同属一个中国，中国是中华民族的共同家园。两岸同胞要守护好、建设好这个共同家园，根本在于坚持“九二共识”、反对“台独”，核心是认同两岸同属一个中国。家和万事兴。只要是有利于两岸关系和平发展的主张我们都欢迎，只要是有利于两岸关系和平发展的事我们都会尽力去做。发展两岸关系的目标，是要让两岸同胞过上更美好的生活。我们将继续秉持两岸一家亲理念，积极为台湾同胞办实事、做好事、解难事。应选A、B、D。社会制度不同，不是搞分裂的借口，也不是建设共同家园的基础。相反，两岸同胞应超越社会制度差异，共同维护民族大义和家园完整。因此，C选项与材料核心观点不符，属于干扰项。","notes":"台湾问题是中国内政和内战遗留问题台湾问题与香港问题、澳门问题的性质不同。香港、澳门问题是历史上殖民主义侵略遗留下来的问题，台湾问题是国内战争遗留下来的问题，属于中国内政，不容许外国干涉\n③「C选项」“一国两制”方针是一个完整的体系。维护国家主权、安全、发展利益是“一国两制”方针的最高原则，在这个前提下，香港、澳门保持原有的资本主义制度长期不变，享有高度自治权。“一国”是实行“两制”的前提和基础（“一国”是根，“一国”是本），“两制”从属和派生于“一国”并统一于“一国”之内。“一国”与“两制”并非等量齐观、比肩并列，国家的主体必须实行社会主义制度","tips":"社会制度不同，不是搞分裂的借口，两岸关系的核心是认同两岸同属一个中国，是认同而非尊重差异，两岸关系的关键在于认同一个中国原则，而非强调制度差异的合理性。","module":"习思想","title":"第十五章 · 坚持“一国两制”和推进祖国完全统一"},{"chapter":"第十五章","section":"多选","no":5,"stem":"2026年4月10日上午，中共中央总书记习近平在北京会见郑丽文主席率领的中国国民党访问团。习近平强调，两岸同胞都期盼台海和平安宁，期盼两岸关系改善发展，期盼生活更加美好，这是国共两党不可推卸的责任，也是携手合作的动力。我们愿在坚持“九二共识”、反对“台独”的共同政治基础上，同包括中国国民党在内的台湾各政党、团体和社会各界人士一道，加强交流对话，为两岸谋和平、为同胞谋福、为民族谋复兴，把两岸关系的未来牢牢掌握在中国人自己手中。为此习近平就两岸关系发展提出的意见是（　　）","opts":{"A":"坚持以正确认同促进心灵契合","B":"坚持以和平发展守护共同家园","C":"坚持以交流融合增进民生福证","D":"坚持以团结奋斗实现中华民族伟大复兴"},"ans":"ABCD","point":"实现祖国完全统一是中华民族伟大复兴的必然要求","explain":"4月10日上午，中共中央总书记习近平在北京会见郑丽文主席率领的中国国民党访问团。习近平就两岸关系发展提出四点意见：第一，坚持以正确认同促进心灵契合；第二，坚持以和平发展守护共同家园；第三，坚持以交流融合增进民生福社；第四，坚持以团结奋斗实现中华民族伟大复兴。A、B、C、D都是正确选项。真题思维点技具体作用意义政策类表述，符合材料主题且表述无明显错误就可以选，不用管自己有没有见过它。习近平新时代中国特色社会主义思想概论","notes":"","tips":"","module":"习思想","title":"第十五章 · 坚持“一国两制”和推进祖国完全统一"},{"chapter":"第十六章","section":"单选","no":1,"stem":"2026年开年，习近平主席在密集的元首外交中多次指出：“当今世界变乱交织，单边霸凌行径严重冲击国际秩序。”这一重大判断，科学揭示了我们所处时代的根本特征是（　　）","opts":{"A":"世界多极化格局已经最终形成","B":"和平与发展不再是时代主题","C":"世界百年未有之大变局加速演进","D":"全球化进程已经发生根本逆转"},"ans":"C","point":"当今世界百年未有之大变局加速演进","explain":"题干材料中习近平主席对国际形势的深刻论述，“当今世界变乱交织“直接对应了“当今世界百年未有之大变局加速演进”这一重大判断。应选C。A选项“已经最终形成”表述绝对且不符合事实，世界多极化仍是一个发展趋势；B选项错误，和平与发展仍然是时代主题，虽然面临挑战；D选项“根本逆转”过于绝对，全球化进程在曲折中前行，并未发生根本逆转。","notes":"","tips":"世界格局仍在动态变化中，而非“已经最终形成”，和平与发展仍是时代主题，全球化仍在继续，只观事实，很容易作为干扰项出现。","module":"习思想","title":"第十六章 · 中国特色大国外交和推动构建人类命运共同体"},{"chapter":"第十六章","section":"单选","no":2,"stem":"面对变乱交织的世界，习近平主席在元首外交中展现出深邃的历史视野和坚定的战略定力，强调大国要带头讲平等、讲法治、讲合作、讲诚信，引领中美关系大船穿越风浪，推进中俄更深层次战略协作。这些外交实践鲜明体现了中国特色大国外交的核心理念，其牢牢把握的主线是（　　）","opts":{"A":"发挥联合国在处理国际事务中的主导地位","B":"服务民族复兴、促进人类进步","C":"与所有国家建立军事同盟关系","D":"输出中国模式和发展道路"},"ans":"B","point":"大国关系","explain":"材料中习近平主席的外交言行，展现了中国特色大国外交的视野与担当。这表明中国特色大国外交“牢牢把握服务民族复兴、促进人类进步这条主线”。A选项是中国作为大国应尽的职责之一，但非外交工作的核心主线；C选项错误，中国坚持不结盟政策；D选项错误，中国坚持不干涉内政，不对外输出模式。","notes":"①「C选项」中国始终奉行不结盟政策，中国从未与所有国家建立军事同盟关系，而是坚持“和平共处五项原则”，发展全球伙伴关系网络\n②「C选项」推动构建新型国际关系，就是要秉持相互尊重、公平正义、合作共赢原则，走出一条对话而不对抗、结伴而不结盟的国与国交往新路发展道路”。推动构建人类命运共同体，不是以一种制度代替另一种制度，也不是以一种文明代替另一种文明路”“所有国家”“照搬照抄”等说法为错误选项","tips":"C、D选项可以通过知识点储备排除，材料并未提及有关联合国相关的信息，更多是围绕中国特色大国外交的视野与担当，所以优先选择B选项。","module":"习思想","title":"第十六章 · 中国特色大国外交和推动构建人类命运共同体"},{"chapter":"第十六章","section":"单选","no":3,"stem":"2026年2月4日，习近平与美国总统特朗普通电话时，习近平主席以“大船”比喻中美关系，强调要“继续引领中美关系这艘大船穿越风浪、平稳前行”，并坚持“不冲突不对抗、相互尊重、合作共赢”的原则。这生动诠释了中国推动构建的新型国际关系，其核心原则是（　　）","opts":{"A":"对话而不对抗、结伴而不结盟","B":"意识形态优先、价值观划线","C":"零和博奔、赢者通吃","D":"建立封闭排他的小圈子"},"ans":"A","point":"推动构建人类命运共同体的价值基础和重要依托","explain":"习近平主席对中美关系的论述，完美诠释了“推动构建新型国际关系”的内涵。考点明确指出，新型国际关系就是要“走出一条对话而不对抗、结伴而不结盟的国与国交往新路”，其原则是“相互尊重、公平正义、合作共赢”。应选A。B、C、D三项都是中国所反对的旧式国际关系思维或做法","notes":"①「A选项」推动构建新型国际关系，就是要秉持相互尊重、公平正义、合作共赢原则，走出一条对话而不对抗、结伴而不结盟的国与国交往新路\n②「B选项」搞意识形态划线、阵营分割、集团对抗，结局必然是世界遭殃\n③「C、D选项」地球足够大，容得下中美各自和共同发展，“要坚持互利互惠，不玩零和博奔，不搞你输我赢。”中国始终主张“共商共建共享”的全球治理观，反对建立排他性的小圈子","tips":"零和博奔指的是一种严格的竞争关系。在这种情境下，参与各方的利益完全对立，一方的收益必然意味着另一方的等量损失，所有参与者的得失相加总和永远为零。简单来说，这是一种“你输我赢”或“损人利己”的局面，整个系统的总利益并不会增加，只是财富或资源在不同参与者之间进行了重新分配。","module":"习思想","title":"第十六章 · 中国特色大国外交和推动构建人类命运共同体"},{"chapter":"第十六章","section":"多选","no":4,"stem":"2026年1月16日上午，国家主席习近平在北京人民大会堂接受18位驻华大使递交国书。习近平指出：“今天的世界，百年变局加速演进，国际形势变乱交织，全球性挑战更加突出。分裂对抗、零和博奔注定没有出路，让世界重回丛林法则不得人心，同球共济、团结合作才是唯一正确选择。我提出全球治理倡议，旨在推动构建更加公正合理的全球治理体系。”这表明中国（　　）","opts":{"A":"始终站在历史正确一边，以人民之心为心、以天下之利为利","B":"致力于同各国一道推动构建人类命运共同体","C":"秉持共商共建共享的全球治理观","D":"致力于建立以中国为核心的国际新秩序"},"ans":"ABC","point":"中国必须有自己特色的大国外交","explain":"材料中“同球共济、团结合作才是唯一正确选择”“以天下之利为利”的表述，深刻体现了中国外交胸怀天下、命运与共的立场，超越了狭隘的国家利益观，始终站在历史正确的一边，致力于为人类谋进步、为世界谋大同，A选项正确。提出“全球治理倡议”，推动构建更加公正合理的全球治理体系，是“推动构建人类命运共同体”这一总目标下的具体实践和关键路径，旨在携手各国应对全球性挑战，建设更美好的世界，B选项正确。“秉持共商共建共享的全球治理观”是中国参与和改善全球治理的一贯原则和鲜明主张。材料中强调反对“丛林法则”，倡导“团结合作”，其内在要求就是全球事务由各国“共商”，治理体系由各国“共建”，治理成果由各国“共享”，这直接支撑了“推动构建更加公正合理的全球治理体系”的目标。C选项正确。D选项错误，此选项是对中国外交理念的严重曲解。中国始终坚持和平共处五项原则，倡导国际关系民习近平新时代中国特色社会主义思想概论主化，主张国家无论大小一律平等。中国明确表示“不寻求领导地位，不搞势力范围”，全球治理体系改革的方向是更加“公正合理”，而非建立任何国家（包括中国）“为核心”的秩序。这体现了中国反对霸权主义和强权政治的坚定立场。","notes":"","tips":"中国始终主张国际关系民主化，反对建立以任何单一国家为核心的国际秩序。分裂对抗、零和博奔注定没有出路，让世界重回丛林法则不得人心。很多时政多选题会穿插一个常规知识点错误，只要能排除掉，其他选项说不出错误就可以放心选，重点还是要积累干扰项特征，而非死记硬背所有押题时政。","module":"习思想","title":"第十六章 · 中国特色大国外交和推动构建人类命运共同体"},{"chapter":"第十六章","section":"多选","no":5,"stem":"2026年新年伊始，国际形势愈发复杂严峻，国际社会迫切需要稳定性和方向感。在此背景下，多国领导人密集访华，其中既有西方国家领导人，也有全球南方国家政要，国际舆论感慨“中方几乎每天都铺着红地毯”。动荡形势下，各方纷纷把目光投向中国，以实际行动深化对华交流合作，展现的是对中国作用、中国机遇的高度重视与信任。事实清晰表明（　　）","opts":{"A":"中国与世界的关系正在朝着更加积极的方向发展","B":"中国的国际影响力、创新引领力、道义感召力显著提升","C":"中国的发展道路和治理模式获得了日益广泛的国际认同","D":"中国作为负责任大国的格局与担当"},"ans":"ABCD","point":"我国国际影响力、感召力、塑造力显著提升","explain":"题干描述多国领导人密集访华、深化对华合作，是“中国与世界的关系正在朝着更加积极的方向发展”的直接证据。这体现了中国与各国互动频繁、合作加深的积极态势。国际社会在动荡时期“把目光投向中国”，寻求稳定与合作，直接印证了中国“国际影响力、感召力”的提升；“创新引领力、道义感召力”则是这种影响力在发展和价值层面的具体体现，符合新时代中国外交的成就描述。各方以实际行动深化对华合作，其背后往往包含着对中国发展成就、治理效能（即“发展道路和治理模式”）在一定程度上的认可、借鉴或重视。这种“向东看”的趋势，反映了中国模式吸引力和认同度的上升，也彰显了一个负责任大国的格局与担当。A、B、C、D选项均正确。","notes":"","tips":"具体作用意义政策类表述，符合材料主题且表述无明显错误就可以选。","module":"习思想","title":"第十六章 · 中国特色大国外交和推动构建人类命运共同体"},{"chapter":"第十六章","section":"多选","no":6,"stem":"2026年4月14日上午，国家主席习近平在北京人民大会堂会见来华访问的阿联酋阿布扎比王储哈立德。双方围绕当前中东和海湾地区形势交换了意见。习近平强调了中方劝和促谈的原则立场，重申将继续为此发挥建设性作用。习近平就维护和促进中东和平稳定提出的主张是（　　）","opts":{"A":"坚持和平共处原则","B":"坚持国家主权原则","C":"坚持国际法治原则","D":"坚持统筹发展和安全"},"ans":"ABCD","point":"当今世界百年未有之大变局加速演进，构建人类命运共同体","explain":"2026年4月14日上午，国家主席习近平在北京人民大会堂会见来华访问的阿联酋阿布扎比王储哈立德。习近平就维护和促进中东和平稳定提出四点主张：一是坚持和平共处原则。中东海湾国家唇齿相依，是搬不走的邻居。要支持中东海湾国家改善关系，推动构建共同、综合、合作、可持续的中东和海湾地区安全架构，筑牢和平共处的根基。二是坚持国家主权原则。主权是各国特别是广大发展中国家安身立命的依托，不容侵犯。中东海湾国家主权、安全和领土完整应当得到切实尊重，各国人员、设施、机构安全应当得到切实维护。三是坚持国际法治原则。维护国际法治权威，不能“合则用、不合则弃”，不能让世界倒回丛林法则。要坚定维护以联合国为核心的国际体系、以国际法为基础的国际秩序、以联合国宪章宗旨和原则为基础的国际关系基本准则。四是坚持统筹发展和安全。安全是发展的前提，发展是安全的保障。各方都应该为中东海湾国家发展营造良好环境、注入正能量。A、B、C、D选项均正确。","notes":"","tips":"属于今年具体时政知识点，做到熟悉了解即可。","module":"习思想","title":"第十六章 · 中国特色大国外交和推动构建人类命运共同体"},{"chapter":"第十六章","section":"多选","no":7,"stem":"2026年5月14日上午，国家主席习近平在北京人民大会堂同来华进行国事访问的美国总统特朗普举行会谈。习近平强调，中方致力于中美关系稳定、健康、可持续发展。我同特朗普总统赞同将构建“中美建设性战略稳定关系”作为中美关系新定位，将为未来3年乃至更长时间的中美关系提供战略指引，相信会受到两国人民和国际社会的欢迎。“建设性战略稳定”应该是（　　）","opts":{"A":"合作为主的积极稳定","B":"竞争有度的良性稳定","C":"分歧可控的常态稳定","D":"和平可期的持久稳定"},"ans":"ABCD","point":"大国关系","explain":"2026年5月14日上午，国家主席习近平在北京人民大会堂同来华进行国事访问的美国总统特朗普举行会谈。习近平强调，中方致力于中美关系稳定、健康、可持续发展。我同特朗普总统赞同将构建“中美建设性战略稳定关系”作为中美关系新定位，将为未来3年乃至更长时间的中美关系提供战略指引，相信会受到两国人民和国际社会的欢迎。“建设性战略稳定”应该是合作为主的积极稳定，应该是竞争有度的良性稳定，应该是分歧可控的常态稳定，应该是和平可期的持久稳定。“中美建设性战略稳定关系”不是一句口号，而应该是相向而行的行动。应选A、B、C、D。","notes":"","tips":"大国关系是国际政治与国际关系中最重要的关系。以习近平同志为核心的党中央，在“大国是关键”的外交布局上“稳中求进”，首倡“新型大国关系”。突出表现为中美关系，其内涵一是不冲突、不对抗，二是相互尊重，三是合作共赢。此知识点在2022年考研政治第33题考过。这次习近平主席同特朗普总统赞同将构建“中美建设性战略稳定关系”作为中美关系新定位，将为未来3年乃至更长时间的中美关系提供战略指引，这种关系的新定位及其内涵大概率会在今年试卷的第16题或第33题里考查大家。","module":"习思想","title":"第十六章 · 中国特色大国外交和推动构建人类命运共同体"},{"chapter":"第十七章","section":"单选","no":1,"stem":"2012年11月，习近平在十八届中共中央政治局常委同中外记者见面时指出，我们党领导人民已经取得举世瞩目的成就，我们完全有理由因此而自豪，但我们决不会躺在过去的功劳簿上。我习近平新时代中国特色社会主义思想概论们仍然面临着许多艰巨任务和严峻挑战，“打铁还需自身硬”。新时代党的建设的鲜明主题是（　　）","opts":{"A":"全面从严治党","B":"加强党的政治建设","C":"加强党的先进性和纯洁性建设","D":"加强党的执政能力建设"},"ans":"A","point":"打铁必须自身硬","explain":"党要管党、从严治党，是党的建设的一贯要求和根本方针。全面从严治党是党永葆生机活力、走好新的赶考之路的必由之路，是新时代党的建设的鲜明主题。应选A。坚持党要管党、全面从严治党，以加强党的长期执政能力建设、先进性和纯洁性建设为主线，以党的政治建设为统领，B、C、D选项不符合题意。","notes":"1「A选项」党要管党、从严治党，是党的建设的一贯要求和根本方针。全面从严治党是党永葆生机活力、走好新的赶考之路的必由之路，是新时代党的建设的鲜明主题，是新时代党的自我革命的伟大实践，开辟了百年大党自我革命的新境界全面从严治党，核心是加强党的领导，基础在全面，关键在严，要害在治。全面从严治党，就是要克服党组织软弱散特别是腐败问题，始终保持党的先进性纯洁性习近平新时代中国特色社会主义思想概论腐败是危害党的生命力和战斗力的最大毒瘤，是党长期执政面临的最大威胁。反腐败是最彻底的自我革命，是全面从严治党的“必答题”坚持标本兼治开展反腐败斗争：标本兼治是新时代推进反腐败斗争的鲜明特征，既以治标遇制腐败势头，更注重治本夯实防腐的基础。反腐倡廉的核心是制度制约和监督权力","tips":"","module":"习思想","title":"第十七章 · 全面从严治党"},{"chapter":"第十七章","section":"单选","no":2,"stem":"从严治党是我们党的一贯方针，坚持从严治党取得了巨大成绩，但一些问题仍屡禁不绝。全面从严治党的核心是（　　）","opts":{"A":"反腐败斗争","B":"坚持思想建党、理论强党","C":"加强党的领导","D":"党的制度建设"},"ans":"C","point":"坚定不移全面从严治党","explain":"从严治党是我们党的一贯方针，坚持从严治党取得了巨大成绩，但一些问题仍屡禁不绝。全面从严治党，核心是加强党的领导，基础在全面，关键在严，要害在治。开展反腐败斗争，坚决割除滋生在党的肌体上的毒瘤，是我们党永葆政治本色、始终具有强大战斗力和凝聚力的关键。A选项不符合题意。思想建设是党的基础性建设，坚持思想建党、理论强党，坚持加强马克思主义武装，使全党始终保持统一的思想、坚定的意志、协调的行动、强大的战斗力，是党的事业发展的重要法宝。B选项不符合题意。法规制度带有根本性、全局性、稳定性、长期性。要把制度建设贯穿到党的各项建设之中，D选项不符合题意。","notes":"","tips":"","module":"习思想","title":"第十七章 · 全面从严治党"},{"chapter":"第十七章","section":"单选","no":3,"stem":"把党的建设作为一项伟大工程来推进，并且始终坚持党要管党、从严治党的原则和方针，是我们党的一大创举，也是立党立国、兴党强国的一大法宝。党的根本性建设是（　　）","opts":{"A":"思想建设","B":"政治建设","C":"组织建设","D":"作风建设"},"ans":"B","point":"把党的政治建设摆在首位","explain":"党的政治建设是党的根本性建设。把政治建设纳入党的建设总体布局并摆在首位，是新时代我们党对马克思主义党建理论的重大创新，体现了我们党对共产党执政规律的深刻认识，应选B。思想建设是党的基础性建设，大力加强党的组织体系和干部队伍建设，是为实现新时代党的历史使命提供坚强组织保证，加强作风建设，是为不断厚植党执政的群众基础。A、C、D选项不符合题意。","notes":"①「B选项」把党的政治建设摆在首位的理论和实践依据：1）党的政治建设是党的根本性建设2）旗帜鲜明讲政治是我们党作为马克思主义政党的根本要求3）从全面从严治党的实践看，党的政治建设决定党的建设方向和效果。不抓党的政治建设或背离党的政治建设指引的方向，党的其他建设就难以取得预期成效保证全党服从中央，维护党中央权威和集中统一领导，是党的政治建设的首要任务。团结统一是党的生命，是党的力量所在发挥党的政治建设的统领性作用，必须把准政治方向、站稳政治立场、营造良好政治生态、提高政治能力。政治方向是党生存发展第一位的问题，必须发挥政治指南针作用4「D选项」作风问题核心是党同人民群众的关系问题。加强纪律建设是全面从严治党的治本之策","tips":"","module":"习思想","title":"第十七章 · 全面从严治党"},{"chapter":"第十七章","section":"单选","no":4,"stem":"在党的建设总体布局中，政治建设是“灵魂”和“根基”，是管总、管根本的，对党的其他建设具有统领提携、纲举目张的作用。党的政治建设的首要任务是（　　）","opts":{"A":"坚定政治信仰，坚持用党的科学理论武装头脑","B":"坚持和加强党的全面领导，完善党的领导体制，改进党的领导方式","C":"保证全党服从中央，维护党中央权威和集中统一领导","D":"提高各级各类组织和党员干部的政治能力"},"ans":"C","point":"把党的政治建设摆在首位","explain":"习近平总书记在党的十九大报告中明确指出，“党的政治建设的首要任务是保证全党服从中央，维护党中央权威和集中统一领导”。这是由党的性质、宗旨和使命决定的，是党的政治建设的根本要求。C选项是正确答案。A选项坚定政治信仰是党的政治建设的重要内容，属于思想根基层面的要求；B选项坚持和加强党的全面领导是党的建设的根本目标，体现政治建设的实践导向；D选项提高政治能力是党的政治建设的关键环节，聚焦党员干部的能力提升。","notes":"","tips":"","module":"习思想","title":"第十七章 · 全面从严治党"},{"chapter":"第十七章","section":"单选","no":5,"stem":"习近平曾经讲到，红军过草地的时候，伙夫同志一起床，不问今天有没有米煮饭，却先问向南走还是向北走。这旨在说明党生存发展第一位的问题是（　　）","opts":{"A":"理想信念的坚定","B":"团结统一","C":"政治方向","D":"政治生态"},"ans":"C","point":"把党的政治建设摆在首位","explain":"红军过草地时，伙夫首要关注“向南走还是向北走”（即革命方向问题），这一细节深刻表明：政治方向是党生存发展第一位的问题，直接关系革命的前途命运。方向错了，行动越积极，偏离目标越远。党的历史经验反复证明，政治方向是党生存发展第一位的问题，关乎党的事业兴衰成败。正如习近平总书记强调，“方向决定前途，道路决定命运”，必须始终坚持正确政治方向不动摇。应选C。理想信念是精神支柱，如红军凭借信念战胜困难），但题干聚焦“方向选择”而非理想信念。团结统一是党的力量源泉，如长征中军民一心、党内纠正路线分歧，但“向南或向北”本质是路线方向之争，而非单纯的团结问题。政治生态涉及党内风气、纪律等，如反对山头主义、维护中央权威，但题干未体现党内关系或作风问题，核心是路线方向的根本性执择，与政治生态无直接关联。A、B、D是干扰项。","notes":"「C选项」党的历史经验反复证明，政治方向是党生存发展第一位的问题，关乎党的事业兴衰成败。正如习近平总书记强调，“方向决定前途，道路决定命运”，必须始终坚持正确政治方向不动摇","tips":"此题通过分析题干信息“先问向南走还是向北走”也能轻松判断是在谈论方向问题。","module":"习思想","title":"第十七章 · 全面从严治党"},{"chapter":"第十七章","section":"单选","no":6,"stem":"2012年12月，习近平主持召开中央政治局会议，审议通过“中央八项规定”，从调查研究、会议活动等8个方面为加强党的作风建设立下规矩。中央八项规定是党中央徙木立信之举，是新时代管党治党的标志性措施。从此，一场激浊扬清的作风之变在金党上下涤荡，在神州大地回响，作风问题的核心是（　　）","opts":{"A":"标本兼治反腐败的问题","B":"官僚主义和形式主义问题","C":"党同人民群众的关系问题","D":"拜金主义和享乐主义问题"},"ans":"C","point":"以严的基调强化正风肃纪","explain":"作风问题的核心是党同人民群众的关系问题。中国共产党的根本宗旨是全心全意为人民服务，作风建设的本质是保持党同人民群众的血肉联系。中央八项规定聚焦整治形式主义、官僚主义、享乐主义和奢靡之风（即“四风”），其根本目的是破除脱离群众的不良作风，确保党始终同人民心连心、同呼吸、共命运。C选项是正确答案。A选项标本兼治反腐败的问题开展反腐败斗争，坚决割除滋生在党的肌体上的毒瘤，是我们党永葆政治习近平新时代中国特色社会主义思想概论本色、始终具有强大战斗力和凝聚力的关键。但作风问题与腐败问题密切相关却不等同。作风问题侧重思想态度和工作方式，如脱离群众、敷衍塞责，反腐败更侧重权力滥用和违纪违法，二者分属党的建设不同范畴。值观扭曲的问题，其根源仍在于脱离群众、淡化宗旨意识，因此不属于核心问题","notes":"①「C选项」作风问题核心是党同人民群众的关系问题。加强纪律建设是全面从严治党的治本之策全面从严治党，核心是加强党的领导，基础在全面，关键在严，要害在治。全面从严治党，就是要克服党组织软弱散特别是腐败问题，始终保持党的先进性纯洁性\n③「A选项」腐败是危害党的生命力和战斗力的最大毒瘤，是党长期执政面临的最大威胁。反腐败是最彻底的自我革命，是全面从严治党的“必答题”4「A选项」坚持标本兼治开展反腐败斗争：标本兼治是新时代推进反腐败斗争的鲜明特征，既以治标制腐败势头，更注重治本夯实防腐的基础。反腐倡廉的核心是制度制约和监督权力","tips":"","module":"习思想","title":"第十七章 · 全面从严治党"},{"chapter":"第十七章","section":"单选","no":7,"stem":"习近平强调：“要站在事关党长期执政、国家长治久安、人民幸福安康的高度，把全面从严治党作为党的长期战略、永恒课题，始终坚持问题导向，保持战略定力，发扬彻底的自我革命精神，永远吹冲锋号，把严的基调、严的措施、严的氛围长期坚持下去，把党的伟大自我革命进行到底。”全面从严治党的治本之策是（　　）","opts":{"A":"加强党的制度建设","B":"加强党的纪律建设","C":"加强党的组织建设","D":"加强党的作风建设"},"ans":"B","point":"以严的基调强化正风肃纪","explain":"党的纪律建设是全面从严治党的治本之策。习近平总书记强调，“纪律是管党治党的‘戒尺，也是党员、干部约束自身行为的标准和遵循。”加强纪律建设，就是要把纪律规矩挺在前面，用严明的纪律管全党、治全党，使纪律真正成为带电的“高压线”，从根本上防止党员干部破纪违法，确保党的团结统一和肌体健康。应选B。制度建设是全面从严治党的根本之策、长远之策，组织建设是党的建设的重要基础，侧重解决党组织和党员队伍的结构性问题，属于“治吏”范畴，而非直接针对全党行为规范的“治本”之策。加强党的作风建设侧重解决党群关系、工作态度等表层问题，需通过纪律建设固化成果，因此属于治标与治本结合的范畴，而非单独治本之策。A、C、D选项不符合题意。","notes":"","tips":"","module":"习思想","title":"第十七章 · 全面从严治党"},{"chapter":"第十七章","section":"单选","no":8,"stem":"2025年1月6日，在二十届中央纪委四次全会上，习近平总书记指出：“进入新时代，面对党内党风廉政建设和反腐败斗争的突出问题，我们坚持有腐必反、有贪必肃，不断纯洁干部队伍，维护了党的形象，巩固了红色江山，赢得了确保党不变质、不变色、不变味的历史主动，赢得了党团结带领全体人民为强国建设、民族复兴伟业共同奋斗的历史主动。”我们党最彻底的自我革命是（　　）","opts":{"A":"扎实开展党纪学习教育","B":"健全全面从严治党体系","C":"锻造坚强组织、建设过硬队伍","D":"反腐败"},"ans":"D","point":"坚持标本兼治开展反腐败斗争","explain":"习近平总书记指出，反腐败是最彻底的自我革命。腐败是危害党的生命力和战斗力的最大毒瘤，反腐败斗争关系民心这个最大的政治，是保持党同人民群众血肉联系的关键所在。党的十八大以来，以习近平同志为核心的党中央以“得罪千百人、不负十四亿”的使命担当祛治乱，开展史无前例的反腐败斗争，不敢腐、不能腐、不想腐一体推进，“打虎”“拍蝇”“猎狐”多管齐下，反腐败斗争取得压倒性胜利并全面巩固，彰显了党勇于自我革命的坚定决心。应选D。A选项党纪学习教育是推进党的自我革命的重要举措，旨在强化党员纪律意识，但属于思想建设层面的基础性工作，并非最彻底的自我革命实践。B选项健全全面从严治党体系是新时代党的建设的重大创新，涵盖党的政治建设、思想建设、组织建设、作风建设、纪律建设等各方面，是党进行自我革命的制度保障和顶层设计，但“体系”本身不等于“最彻底的革命行动”。C选项锻造坚强组织、建设过硬队伍是党的建设的重要基础，通过选贤任能、强基固本提升党的凝聚力战斗力，属于自我革命的具体路径，但未直接触及腐败这一最具颠覆性的问题。A、B、C是干扰项。","notes":"①「D选项」腐败是危害党的生命力和战斗力的最大毒瘤，是党长期执政面临的最大威胁。反腐败是最彻底的自我革命，是全面从严治党的“必答题”\n②「D选项」坚持标本兼治开展反腐败斗争：标本兼治是新时代推进反腐败斗争的鲜明特征，既以治标遇制腐败势头，更注重治本夯实防腐的基础。反腐倡廉的核心是制度制约和监督权力","tips":"","module":"习思想","title":"第十七章 · 全面从严治党"},{"chapter":"第十七章","section":"单选","no":9,"stem":"党的十八大以来，我们坚定不移推进全面从严治党，取得一系列理论创新、实践创新、制度创新成果，构建起全面从严治党体系，开辟了百年大党自我革命新境界。同时也要看到，党内存在的思想不纯、组织不纯、作风不纯等突出问题尚未得到根本解决，反腐败斗争形势依然严峻复杂，而且新情况新问题不断涌现，党面临的“四大考验”“四种危险”将长期存在。全面从严治党永远在路上，党的自我革命永远在路上，不断进行自我革命，把新时代党的建设新的伟大工程推向前进的有效途径是（　　）","opts":{"A":"健全全面从严治党体系","B":"锻造坚强组织、建设过硬队伍","C":"正风肃纪反腐","D":"自我监督和人民监督相结合"},"ans":"A","point":"以伟大自我革命引领伟大社会革命","explain":"全党必须永葆赶考的清醒和坚定，以健全全面从严治党体系为有效途径，不断把新时代党的建设新的伟大工程推向前进。应选A。推进党的自我革命要以锻造坚强组织、建设过硬队伍为重要着力点，以正风肃纪反腐为重要抓手，以自我监督和人民监督相结合为强大动力，B、C、D均为干扰项。","notes":"要以伟大自我革命引领伟大社会革命，以伟大社会革命促进伟大自我革命。以伟大自我革命引领伟大社会革命是新时代中国特色社会主义发展的显著特点\n②「B、C、D选项」推进党的自我革命要以锻造坚强组织、建设过硬队伍为重要着力点，以正风肃纪反腐为重要抓手，以自我监督和人民监督相结合为强大动力3「A选项」全党必须永葆赶考的清醒和坚定，以健全全面从严治党体系为有效途径，不断把新时代党的建设新的伟大工程推向前进","tips":"","module":"习思想","title":"第十七章 · 全面从严治党"},{"chapter":"第十七章","section":"多选","no":10,"stem":"全面从严治党是新时代党的自我革命的伟大实践，开辟了百年大党自我革命的新境界。新征程上，我们要始终推进党的自我革命。一个饱经沧桑而初心不改的党，才能基业常青；一个铸就辉煌仍勇于自我革命的党，才能无坚不摧。百年栉风沐雨、淬火成钢，特别是新时代十几年革命性锻造，中国共产党更加坚强有力、更加充满活力。勇于自我革命是（　　）","opts":{"A":"我们党跳出历史周期率问题的第二个答案","B":"中国共产党区别于其他政党的显著标志","C":"我们党最大的优势、最鲜明的品格","D":"实现党自我净化、自我完善、自我革新、自我提高的有效武器"},"ans":"ABCD","point":"党的自我革命是跳出历史周期率的第二个答案","explain":"跳出历史周期率问题，是关系党千秋伟业的一个重大问题。毛泽东在延安的窑洞里给出了第一个答案，这就是“让人民来监督政府”。经过百年奋斗特别是党的十八大以来新的实践，党又给出了第二个答案，这就是自我革命。全面从严治党是新时代党的自我革命的伟大实践，开辟了百年大党自我革命的新境界。勇于自我革命，是中国共产党区别于其他政党的显著标志，也是我们党最大的优势、最鲜明的品格。勇于自我革命就要同一切影响党的先进性、弱化党的纯洁性的问题作坚决斗争，实现自我净化、自我完善、自我革新、自我提高。A、B、C、D选项都符合题意。习近平新时代中国特色社会主义思想概论","notes":"关于自我革命的常见知识点总结：1）跳出历史周期率问题，毛泽东在延安的窑洞里给出了第一个答案，这就是“让人民来监督政府”。经过百年奋斗特别是党的十八大以来新的实践，党又给出了第二个答案，这就是自我革命。全面从严治党是新时代党的自我革命的伟大实践，开辟了百年大党自我革命的新境界2）腐败是危害党的生命力和战斗力的最大毒瘤，是党长期执政面临的最大威胁。反腐败是最彻底的自我革命，是全面从严治党的“必答题”3）勇于自我革命，是中国共产党区别于其他政党的显著标志，也是我们党最大的优势、最鲜明的品格","tips":"","module":"习思想","title":"第十七章 · 全面从严治党"},{"chapter":"第十七章","section":"多选","no":11,"stem":"全面建设社会主义现代化国家、全面推进中华民族伟大复兴，关键在党。我们党作为世界上最大的马克思主义执政党，要始终赢得人民拥护、巩固长期执政地位，必须时刻保持解决大党独有难题的清醒和坚定，坚持和加强党的全面领导和党中央集中统一领导，贯彻落实新时代党的建设总要求，用系统思维、科学方法推进管党治党内容全涵盖、对象全覆盖、责任全链条、制度全贯通。新时代党的建设的要求是（　　）","opts":{"A":"以党的政治建设为统领、党的各项建设同向发力综合发力","B":"以党中央关于党的建设的重要思想、关于党的自我革命的重要思想为根本遵循","C":"进一步健全要素齐全、功能完备、科学规范、运行高效的全面从严治党体系","D":"要以伟大社会革命引领伟大自我革命，以伟大自我革命促进伟大社会革命配套课程"},"ans":"ABC","point":"以伟大自我革命引领伟大社会革命","explain":"新时代党的建设是以党的政治建设为统领、党的各项建设同向发力综合发力的系统工程，必须以党中央关于党的建设的重要思想、关于党的自我革命的重要思想为根本遵循，坚持和加强党的全面领导和党中央集中统一领导，贯彻落实新时代党的建设总要求，用系统思维、科学方法推进管党治党内容全涵盖、对象全覆盖、责任全链条、制度全贯通，进一步健全要素齐全、功能完备、科学规范、运行高效的全面从严治党体系。习近平强调，要以伟大自我革命引领伟大社会革命，以伟大社会革命促进伟大自我革命，确保党在新时代坚持和发展中国特色社会主义的历史进程中始终成为坚强领导核心。D选项错误。","notes":"「D选项」要以伟大自我革命引领伟大社会革命，以伟大社会革命促进伟大自我革命。以伟大自我革命引领伟大社会革命是新时代中国特色社会主义发展的显著特点：1）党的自我革命是党在改造客观世界的同时改造主观世界的过程，通过自我净化、自我完善、自我革新、自我提高，保持党的先进性和纯洁性2）伟大社会革命是中国共产党团结带领全国各族人民谋求民族复兴的伟大社会实践，是“以生产力和生产关系的矛盾运动为基础，不仅仅是一种破除旧的政治上层建筑的社会运动，更是一种新的社会建设运动。”提，只能说以伟大自我革命引领伟大社会革命，不能反过来新时代党的建设是以党的政治建设为统领、党的各项建设同向发力综合发力的系统工程，必须以党中央关于党的建设的重要思想、关于党的自我革命的重要思想为根本遵循","tips":"","module":"习思想","title":"第十七章 · 全面从严治党"}]</script>
<script>
(function(){
  "use strict";
  var DATA = JSON.parse(document.getElementById("quizData").textContent);
  var STORE_KEY = "politics-quiz-720";
  var THEME_KEY = "politics-site-theme";
  var $ = function(id){ return document.getElementById(id); };

  var MODULE_TITLES = {
    "马原": "马克思主义基本原理",
    "毛概": "毛泽东思想和中国特色社会主义理论体系概论",
    "习思想": "习近平新时代中国特色社会主义思想概论"
  };

  var state = {
    module: null,         // 当前模块
    chapter: null,        // null = 本模块全部章节
    type: "all",          // 浏览用题型筛选
    deck: [],
    pos: 0,
    picked: [],
    records: load(),      // 全站答题记录
    session: null,        // 抽卡轮次
    explainOpen: null
  };
  state.module = modulesInData()[0] || null;

  function qkey(q){ return q.module + "|" + q.chapter + "|" + q.section + "|" + q.no; }

  function load(){
    try{
      var raw = JSON.parse(localStorage.getItem(STORE_KEY));
      if(raw && typeof raw === "object" && !Array.isArray(raw)) return migrate(raw);
    }catch(e){}
    return {};
  }
  // 旧记录键是 chapter|section|no，补上模块前缀
  function migrate(raw){
    var out = {};
    Object.keys(raw).forEach(function(k){
      var parts = String(k).split("|");
      out[parts.length >= 4 ? k : "马原|" + k] = raw[k];
    });
    return out;
  }
  function save(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state.records)); }catch(e){}
  }

  function modulesInData(){
    var list = [], seen = {};
    DATA.forEach(function(q){
      if(q.module && !seen[q.module]){ seen[q.module] = 1; list.push(q.module); }
    });
    return list;
  }

  function chaptersInData(){
    var list = [], seen = {};
    DATA.forEach(function(q){
      if(q.module !== state.module) return;
      if(!seen[q.chapter]){ seen[q.chapter] = 1; list.push(q.chapter); }
    });
    return list;
  }

  function chapterPool(){
    return DATA.filter(function(q){
      return q.module === state.module && (!state.chapter || q.chapter === state.chapter);
    });
  }
  function questions(){
    var list = chapterPool();
    if(state.type !== "all") list = list.filter(function(q){ return q.section === state.type; });
    return list;
  }

  function buildDeck(){
    state.deck = questions().slice();
    if(state.pos >= state.deck.length) state.pos = Math.max(0, state.deck.length - 1);
  }

  function current(){
    if(state.session) return state.session.items[state.session.pos] || null;
    return state.deck[state.pos];
  }

  function isAnswered(q){
    if(state.session){
      var entry = state.session.entries[qkey(q)];
      return !!entry;
    }
    return !!state.records[qkey(q)];
  }
  function answerOf(q){
    if(state.session) return state.session.entries[qkey(q)] || null;
    return state.records[qkey(q)] || null;
  }

  function verdictOf(q, picked){
    return picked.slice().sort().join("") === q.ans.split("").sort().join("");
  }

  function el(tag, cls, text){
    var node = document.createElement(tag);
    if(cls) node.className = cls;
    if(text != null) node.textContent = text;
    return node;
  }

  /* ---------- 顶部与统计 ---------- */

  function renderChips(){
    var mhost = $("moduleChips");
    mhost.innerHTML = "";
    modulesInData().forEach(function(m){
      var mb = el("button", m === state.module ? "active" : "", m);
      mb.type = "button";
      mb.title = MODULE_TITLES[m] || m;
      mb.onclick = function(){
        if(state.session) return;
        state.module = m;
        state.chapter = null; state.pos = 0; state.picked = [];
        buildDeck(); renderChips(); render();
      };
      mhost.appendChild(mb);
    });
    mhost.querySelectorAll("button").forEach(function(b){ b.disabled = !!state.session; });

    var host = $("chapterChips");
    host.innerHTML = "";
    var all = el("button", state.chapter === null ? "active" : "", "全部");
    all.type = "button";
    all.onclick = function(){
      if(state.session) return;
      state.chapter = null; state.pos = 0; state.picked = [];
      buildDeck(); renderChips(); render();
    };
    host.appendChild(all);
    chaptersInData().forEach(function(ch){
      var b = el("button", ch === state.chapter ? "active" : "", ch);
      b.type = "button";
      b.title = (DATA.filter(function(q){ return q.module === state.module && q.chapter === ch; })[0] || {}).title || ch;
      b.onclick = function(){
        if(state.session) return;
        state.chapter = ch; state.pos = 0; state.picked = [];
        buildDeck(); renderChips(); render();
      };
      host.appendChild(b);
    });
    Array.prototype.forEach.call($("typeChips").children, function(b){
      b.classList.toggle("active", b.dataset.type === state.type);
      b.disabled = !!state.session;
    });
    host.querySelectorAll("button").forEach(function(b){ b.disabled = !!state.session; });
    $("drawBtn").disabled = !!state.session;
    $("quitBtn").hidden = !state.session;
  }

  function renderStats(){
    if(state.session){
      var done = Object.keys(state.session.entries).length;
      var right = Object.keys(state.session.entries).filter(function(k){ return state.session.entries[k].ok; }).length;
      var total = state.session.items.length;
      $("statDone").textContent = done;
      $("statTotal").textContent = total;
      $("statRight").textContent = right;
      $("statRate").textContent = done ? Math.round(right / done * 100) + "%" : "—";
      $("statBar").style.width = total ? (done / total * 100) + "%" : "0";
      return;
    }
    var all = chapterPool();
    var d = 0, r = 0;
    all.forEach(function(q){
      var rec = state.records[qkey(q)];
      if(rec){ d++; if(rec.ok) r++; }
    });
    $("statDone").textContent = d;
    $("statTotal").textContent = all.length;
    $("statRight").textContent = r;
    $("statRate").textContent = d ? Math.round(r / d * 100) + "%" : "—";
    $("statBar").style.width = all.length ? (d / all.length * 100) + "%" : "0";
  }

  /* ---------- 题目卡片 ---------- */

  function render(){
    var host = $("cardHost");
    host.innerHTML = "";
    renderStats();
    $("pageTitle").textContent = state.chapter ? chapterTitle(state.chapter) : (MODULE_TITLES[state.module] || "考研政治刷题");
    var q = current();
    if(!q){
      host.appendChild(el("div", "empty", "当前筛选下没有题目。"));
      return;
    }
    var rec = answerOf(q);
    var card = el("article", "card");

    var meta = el("div", "card-meta");
    meta.appendChild(el("span", "tag" + (q.section === "多选" ? " multi" : ""), q.section + "选择题"));
    var counter = state.session
      ? "第 " + (state.session.pos + 1) + " / " + state.session.items.length + " 题 · 本轮"
      : "第 " + (state.pos + 1) + " / " + state.deck.length + " 题";
    meta.appendChild(el("span", "", counter));
    meta.appendChild(el("span", "muted", q.chapter));
    if(q.section === "多选") meta.appendChild(el("span", "muted", "至少选两项"));
    card.appendChild(meta);

    var stem = el("p", "stem");
    stem.appendChild(el("span", "no", q.no + "."));
    stem.appendChild(document.createTextNode(q.stem));
    card.appendChild(stem);

    var opts = el("div", "opts");
    var picked = rec ? rec.picked.slice() : state.picked.slice();
    "ABCD".split("").forEach(function(k){
      var body = q.opts[k];
      if(body == null) return;
      var b = el("button", "opt");
      b.type = "button";
      b.appendChild(el("b", "", k));
      b.appendChild(el("span", "", body));
      if(picked.indexOf(k) >= 0) b.classList.add("picked");
      if(rec){
        var isRight = q.ans.indexOf(k) >= 0;
        if(isRight) b.classList.add("right");
        else if(picked.indexOf(k) >= 0) b.classList.add("wrong");
        b.disabled = true;
      }
      b.onclick = function(){ choose(k); };
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(rec){
      var v = el("div", "verdict " + (rec.ok ? "ok" : "bad"));
      v.appendChild(el("b", "", rec.ok ? "✓ 正确" : "✗ 错误"));
      v.appendChild(el("span", "", "你的选择"));
      v.appendChild(el("span", "ans", rec.picked.join("") || "—"));
      v.appendChild(el("span", "", "正确答案"));
      v.appendChild(el("span", "ans", q.ans));
      card.appendChild(v);
    }

    var actions = el("div", "actions");
    var explainBtn = el("button", "", "看解析");
    explainBtn.type = "button";
    explainBtn.onclick = function(){ openInfo("explain", q); };
    actions.appendChild(explainBtn);

    if(q.section === "多选" && !rec){
      var submit = el("button", "primary", "提交答案");
      submit.type = "button";
      submit.onclick = function(){ submitMulti(q); };
      actions.appendChild(submit);
    }
    if(q.notes){
      var noteBtn = el("button", "info-btn", "刷题笔记");
      noteBtn.type = "button";
      noteBtn.onclick = function(){ openInfo("notes", q); };
      actions.appendChild(noteBtn);
    }
    if(q.tips){
      var tipBtn = el("button", "info-btn", "真题思维点拨");
      tipBtn.type = "button";
      tipBtn.onclick = function(){ openInfo("tips", q); };
      actions.appendChild(tipBtn);
    }

    actions.appendChild(el("span", "spacer"));
    var backBtn = el("button", "", "← 上一题");
    backBtn.type = "button";
    backBtn.disabled = state.session ? state.session.pos === 0 : state.pos === 0;
    backBtn.onclick = function(){ go(-1); };
    actions.appendChild(backBtn);
    var isLast = state.session
      ? state.session.pos + 1 >= state.session.items.length
      : state.pos + 1 >= state.deck.length;
    var next = el("button", "primary", isLast ? (state.session ? "查看本轮结果" : "回到第一题") : "下一题 →");
    next.type = "button";
    next.onclick = function(){ go(1); };
    actions.appendChild(next);
    card.appendChild(actions);

    host.appendChild(card);

    if($("sheet").classList.contains("open")) renderSheet();
  }

  function chapterTitle(ch){
    var q = DATA.filter(function(x){ return x.module === state.module && x.chapter === ch; })[0];
    return q ? (q.title || ch) : ch;
  }

  function openInfo(kind, q){
    var body = $("modalBody");
    body.innerHTML = "";
    var title = "答案解析";
    if(kind === "explain"){
      var line = el("p", "answer-line", "正确答案");
      line.appendChild(el("b", "", q.ans));
      body.appendChild(line);
      if(q.point){
        var pt = el("p", "point");
        pt.appendChild(el("span", "", "考点"));
        pt.appendChild(document.createTextNode(q.point));
        body.appendChild(pt);
      }
      (q.explain || "").split(/\n+/).forEach(function(para){
        if(para.trim()) body.appendChild(el("p", "explain-body", para.trim()));
      });
    } else if(kind === "notes"){
      title = "刷题笔记";
      (q.notes || "").split(/\n+|(?=\d{1,2}）)/).forEach(function(para){
        if(para.trim()) body.appendChild(el("p", "explain-body", para.trim()));
      });
    } else {
      title = "真题思维点拨";
      (q.tips || "").split(/\n+/).forEach(function(para){
        if(para.trim()) body.appendChild(el("p", "explain-body", para.trim()));
      });
    }
    $("modalTitle").textContent = title;
    $("modal").classList.add("open");
    $("modalBackdrop").classList.add("open");
    document.body.classList.add("modal-open");
  }

  function closeInfo(){
    $("modal").classList.remove("open");
    $("modalBackdrop").classList.remove("open");
    document.body.classList.remove("modal-open");
  }

  function storeAnswer(q, picked){
    var ok = verdictOf(q, picked);
    if(state.session){
      state.session.entries[qkey(q)] = { picked: picked, ok: ok };
    }
    state.records[qkey(q)] = { picked: picked, ok: ok, ts: Date.now() };
    save();
  }

  function choose(k){
    var q = current();
    if(!q || isAnswered(q)) return;
    if(q.section === "单选"){
      state.picked = [];
      storeAnswer(q, [k]);
      state.explainOpen = null;
      render();
      return;
    }
    var at = state.picked.indexOf(k);
    if(at >= 0) state.picked.splice(at, 1);
    else state.picked.push(k);
    render();
  }

  function submitMulti(q){
    if(state.picked.length < 2){
      var tip = document.querySelector(".hint");
      if(!tip){
        tip = el("p", "hint", "多选题至少选两项，再点「提交答案」。");
        tip.style.cssText = "margin:14px 0 0;font-size:12px;color:var(--bad)";
        var acts = document.querySelector(".actions");
        acts.parentNode.insertBefore(tip, acts);
      }
      return;
    }
    var picked = state.picked.slice();
    state.picked = [];
    storeAnswer(q, picked);
    state.explainOpen = null;
    render();
  }

  function go(step){
    closeInfo();
    if(state.session){
      var s = state.session;
      if(step > 0 && s.pos + 1 >= s.items.length){
        s.done = true;
        renderResult();
        return;
      }
      var next = s.pos + step;
      if(next < 0 || next >= s.items.length) return;
      s.pos = next;
      state.picked = [];
      state.explainOpen = null;
      render();
      return;
    }
    var n = state.deck.length;
    if(!n) return;
    if(step < 0 && state.pos === 0) return;
    state.pos = (state.pos + step + n) % n;
    state.picked = [];
    state.explainOpen = null;
    render();
  }

  /* ---------- 抽卡 ---------- */

  function openDraw(){
    var pool = chapterPool();
    var singles = pool.filter(function(q){ return q.section === "单选"; }).length;
    var multis = pool.filter(function(q){ return q.section === "多选"; }).length;
