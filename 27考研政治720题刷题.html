<style>
:root{
  --bg:#f1efeb;--panel:#fffefa;--paper:#fffefb;--ink:#302b31;--muted:#8a7e85;
  --line:#e6e0df;--accent:#A32B2B;--soft:#f4e6ed;--green:#427967;
  --ok:#2f5540;--ok-bg:#e7efe9;--bad:#A32B2B;--bad-bg:#f7e5e4;
  --serif:"Songti SC","Noto Serif CJK SC","SimSun",serif;
  color-scheme:light;
}
body[data-theme=dark]{
  --bg:#18191f;--panel:#23232c;--paper:#25252e;--ink:#ece4e9;--muted:#ada1ab;
  --line:#3b3742;--accent:#dda2bd;--soft:#3c2c39;--green:#94b7a6;
  --ok:#94b7a6;--ok-bg:#22322b;--bad:#ef9eba;--bad-bg:#3a262d;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font:14px "Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  line-height:1.7;
  background-image:linear-gradient(var(--line) 1px,transparent 1px);
  background-size:100% 34px;background-attachment:fixed;
}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:8px 12px;white-space:nowrap;transition:border-color .15s,color .15s,background .15s,transform .08s}
button:hover:not(:disabled){border-color:var(--accent)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{cursor:default}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);border-color:var(--accent);color:#fff}
body[data-theme=dark] .primary{color:#241a20}
.muted{color:var(--muted)}
.small{font-size:11px}
[hidden]{display:none!important}

.wrap{max-width:820px;margin:0 auto;padding:22px 18px 48px}
.top{display:flex;align-items:flex-end;gap:14px;margin-bottom:16px}
.eyebrow{font-size:10px;letter-spacing:1.6px;font-weight:700;color:var(--accent);display:block;margin-bottom:6px}
h1{font:700 25px/1.35 var(--serif);margin:0;letter-spacing:-.3px}
.top .spacer{flex:1}
#themeBtn{font-size:11px;padding:6px 10px}

.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font-size:12px;padding:6px 11px;border-radius:20px}
.chips button.active{background:var(--soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.controls .spacer{flex:1}

.stats{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);margin-bottom:14px}
.stats b{color:var(--ink);font-weight:700}
.bar{height:4px;border-radius:4px;background:var(--line);overflow:hidden;flex:1;min-width:90px}
.bar i{display:block;height:100%;background:var(--green);width:0;transition:width .25s}

.card{
  background:var(--paper);border:1px solid var(--line);border-radius:14px;
  padding:26px 28px 22px;box-shadow:0 1px 0 rgba(0,0,0,.03),0 12px 32px -24px rgba(0,0,0,.35);
}
.card-meta{display:flex;align-items:center;gap:9px;font-size:11px;color:var(--muted);margin-bottom:16px;flex-wrap:wrap}
.tag{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--soft);color:var(--accent);letter-spacing:.5px}
.tag.multi{background:#eef1e9;color:var(--green)}
body[data-theme=dark] .tag.multi{background:#2a352f;color:var(--green)}
.stem{font:19px/1.95 var(--serif);margin:0 0 20px;text-align:justify}
.stem .no{color:var(--accent);font-weight:700;margin-right:6px}

.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
  padding:11px 13px;border-radius:10px;background:transparent;
  font:16.5px/1.8 var(--serif);white-space:normal;overflow-wrap:anywhere;
}
.opt b{
  flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);
  display:grid;place-items:center;font:700 12px/1 "Microsoft YaHei",sans-serif;margin-top:3px;
  color:var(--muted);transition:all .15s;
}
.opt:hover:not(:disabled) b{border-color:var(--accent);color:var(--accent)}
.opt.picked{background:var(--soft);border-color:var(--accent)}
.opt.picked b{background:var(--accent);border-color:var(--accent);color:#fff}
body[data-theme=dark] .opt.picked b{color:#241a20}
.opt.right{background:var(--ok-bg);border-color:var(--ok)}
.opt.right b{background:var(--ok);border-color:var(--ok);color:#fff}
body[data-theme=dark] .opt.right b{color:#16211c}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt.wrong b{background:var(--bad);border-color:var(--bad);color:#fff}
body[data-theme=dark] .opt.wrong b{color:#2b1a1f}
.opt:disabled{opacity:1}

.verdict{margin:18px 0 0;padding:11px 14px;border-radius:10px;font-size:13px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.verdict.ok{background:var(--ok-bg);color:var(--ok)}
.verdict.bad{background:var(--bad-bg);color:var(--bad)}
.verdict b{font-size:15px}
.verdict .ans{font-family:var(--serif);font-size:16px;letter-spacing:2px}

.actions{display:flex;align-items:center;gap:8px;margin-top:18px}
.actions .spacer{flex:1}
#explainBtn{border-style:dashed;color:var(--accent)}
#explainBtn:hover{background:var(--soft)}

.explain{margin-top:18px;border-top:1px dashed var(--line);padding-top:16px}
.explain h2{font:700 13px/1 "Microsoft YaHei",sans-serif;letter-spacing:1.5px;color:var(--accent);margin:0 0 12px}
.answer-line{font-size:13px;margin:0 0 10px;color:var(--muted)}
.answer-line b{font:700 18px/1 var(--serif);letter-spacing:2px;color:var(--ink);margin-left:4px}
.point{font-size:13px;margin:0 0 12px}
.point span{
  font-size:10px;font-weight:700;letter-spacing:1px;color:var(--accent);
  background:var(--soft);border-radius:4px;padding:2px 6px;margin-right:7px;vertical-align:2px;
}
.explain-body{font:16px/1.95 var(--serif);text-align:justify;margin:0;color:var(--ink)}
.explain-body + .explain-body{margin-top:9px}

.empty{text-align:center;color:var(--muted);padding:48px 10px;font-size:13px}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:20px;font-size:11px;color:var(--muted)}
.foot a{color:var(--accent);text-decoration:none}
.foot a:hover{text-decoration:underline}
.kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:10px;background:var(--panel)}

@media (max-width:640px){
  .wrap{padding:16px 12px 40px}
  h1{font-size:20px}
  .controls .spacer{display:none}
  .card{padding:20px 16px 18px;border-radius:12px}
  .stem{font-size:17.5px}
  .opt{font-size:15.5px;padding:10px 10px}
  .actions{flex-wrap:wrap}
  #nextBtn{margin-left:auto}
}
</style>

<script id="quizData" type="application/json">[{"chapter":"第一章","section":"单选","no":1,"stem":"“社会主义是拼出来、干出来、拿命换来的，不仅过去如此，新时代也是如此。”习近平总书记的重要论断，揭示了中国人民一路砥砺奋进的秘诀。2026年1月20日，习近平总书记在省部级主要领导干部学习贯彻党的二十届四中全会精神专题研讨班开班式上的讲话再次强调“新征程是新的长征”。要大力弘扬建党精神、长征精神、斗争精神，勇于挺身而出、迎难而上，善于战风险、迎挑战、克难关。这形象说明了物质与精神的关系是（　　）","opts":{"A":"精神是物质的本质，物质是精神的外在表现形式","B":"物质与精神相互依存、相互转化","C":"物质决定精神，精神对物质具有反作用","D":"精神可以脱离物质独立存在，并决定物质世界的发展方向"},"ans":"C","point":"物质与意识的辩证关系","explain":"建党精神、长征精神等“精神”源于工人阶级的“长期奋斗”（物质实践），体现精神是物质的反映，由物质决定。弘扬建党精神、长征精神等，从而“勇于挺身而出、迎难而上，善于战风险、迎挑战、克难关”，体现精神对物质实践的能动指导作用。C选项完全符合马克思主义“物质第一性、意识第二性，意识反作用于物质”的基本原理。A选项“精神是物质的本质，物质是精神的外在表现形式”颠倒物质与精神的关系，属于唯心主义（如客观唯心主义认为“精神是世界本质”)；B选项“物质与精神相互依存、相互转化”错误，精神依赖于物质，不能说物质依赖于精神；D选项“精神可以脱离物质独立存在，并决定物质世界的发展方向”也是典型的唯心主义：直接否定物质对精神的根源性，认为精神是独立实体。A、B、D都是干扰项。"},{"chapter":"第一章","section":"单选","no":2,"stem":"法国哲学家拉美特利明确把哲学划分为唯物主义和唯心主义两大基本派别，他把唯物主义比作“牢固坚实的橡树”，把唯心主义比作“脆弱的芦苇”。下列选项中，前后两端分别体现哲学两大基本派别的是（　　）","opts":{"A":"世界是上帝意志的创造物一存在即是被感知","B":"人类历史是理念的展开一思维的发展是历史的动力","C":"天有常道矣，地有常数矣一心皆具是理，心即理也","D":"人是一种聪明的机器一人的本质是社会关系的总和"},"ans":"C","point":"唯物主义和唯心主义；可知论和不可知论；辩证法和形而上学","explain":"天有常道矣，地有常数矣的意思是天有一定的运行规律，地有一定的运行法则，属于唯物主义；心皆具是理，心即理也，属于唯心主义，C选项符合题意。世界是上帝意志的创造物属于客观唯心主义；存在即是被感知，这夸大了意识的作用，属于主观唯心主义，A选项不符合题意。人类历史是理念的展开、思维的发展是历史的动力，都是唯心主义，B选项不符合题意。人是一种聪明的机器，属于机械唯物主义；人的本质是社会关系的总和，是马克思主义的唯物论，D选项不符合题意。"},{"chapter":"第一章","section":"单选","no":3,"stem":"每当鲜花盛开的季节，赏花者纷至沓来。某公园用“你欣赏花的美丽，花欣赏你的高度”“把花朵留在枝头，让美丽留在心灵”等宣传语，代替“禁止折花”“摘花可耻”等警示语，营造人与自然和谐相处的环境，违规摘花的游客明显减少。该现象反映的哲学道理是（：）","opts":{"A":"观念的东西同物质的东西是具有同一性的","B":"人的思想观念决定了人的行为结果","C":"思想观念具有能动性，不受制于客观现实","D":"人脑是思想智慧的源泉"},"ans":"A","point":"物质与意识的辩证关系","explain":"在题干中，公园用更具人文关怀的宣传语营造了更好的环境，使得游客对花和环境有了更积极的认识，从而减少了违规摘花行为。这说明了物质决定意识，意识又反作用于物质，物质与意识具有同一性。人的思想观念属于意识范畴，意识对人的行为具有指导作用，但它只是影响行为的一个重要因素，并非决定因素。B选项错误。思想观念作为意识，是对客观现实的反映，它不能脱离客观现实而独立存在。C选项错误。人脑是思想意识的物质器官，但不是意识的源泉，D选项错误。"},{"chapter":"第一章","section":"单选","no":4,"stem":"智能原生技术正引领着深刻的技术与社会变革。它将人工智能（AI）内化为系统设计的底层逻辑与能力中枢，驱动着从技术架构、业务流程到价值创造方式的全方位重塑。可以说，AI不仅是一种新工具，还在孕育新业态。比如，近年来兴起的AI大模型、自动驾驶、具身智能等产业，很大程度上重构了技术研发路径、产业应用场景及商业服务模式。近期大火的AI漫剧，更是颠覆了行业生产逻辑。依托越来越强大的AIGC（人工智能生成内容）技术，一个人仅凭脑子里的创意，就能以很低的成本打造出爆款产品，这在过去几乎不可想象。由此可见伴随智能原生技术的发展，以AI为代表的人工智能（　　）","opts":{"A":"成为具有独立自我意识与自由意志的能动主体","B":"仍然是人类智能的物化，是对人脑思维运行机制的模拟与延伸","C":"成为能够脱离人类进行自主价值判断与创造的独立思维体","D":"成为可以完全超越并最终取代人类意识与主观能动性的高级存在"},"ans":"B","point":"物质与意识的辩证关系","explain":"无论人工智能外在表现如何复杂、如何“颠覆”生产逻辑，其根本属性仍然是“人类智能的物化是对人脑思维运行机制的模拟与延伸”。“人类智能的物化”意指，AI所展现出的“智能”，根源在于人类将自身的智力活动（如学习、推理、创造）通过编程、算法和数据等形式，对象化、固化到了机器和软件之中。它是人类智能劳动的结晶，而非机器自生的智慧。“对人脑思维运行机制的模拟与延伸”意指，AI的运行原理是对人脑信息处理模式（如神经网络、模式识别）的模仿和工程化实现。AIGC能基于“创意”生成产品，正是对人类联想、组合、风格化等创造性思维过程的模拟。它作为工具，极大地延伸和拓展了人类的认知与实践能力。AI是“新工具”，能孕育“新业态”，但并未获得独立意识，无法担当实践主体。应选B。A选项错误，此选项是典型的“强人工智能”或“意识赋予论”观点，与唯物史观相。马克思主义哲学认为，意识是人脑的机能和属性，是社会实践的产物，具有社会性。当前的AI，无论其如何“智能原生”，都是基于算法和数据的计算系统，不具备自我意识、情感体验和自由意志。其行为是程序执行的结果，而非出于自主意愿。C选项错误，此选项夸大了AI的“自主性”。“自主价值判断与创造”是以情感、信念、伦理观和社会关系为基础的高阶意识活动。而AI的“创造”（如生成漫剧）是基于海量数据模式和算法规则的计算结果，缺乏真正的意图、价值理解和原创性动机。它无法像人类一样基于对意义的理解进行价值扶择和发自内心的创造。D选项错误，此选项是“技术奇点论”或“人类主体性消解论”的极端观点。AI由人类创造、定义和控制，其发展始终服务于人类的目的。人类意识具有机器无法复制的社会性、历史性和超越性。AI可以极大增强人类的能力，但“取代”人类意识既无理论依据，也非技术发展的必然或应然方向。工具无法取代其创造者和使用者本身。"},{"chapter":"第一章","section":"单选","no":5,"stem":"近年来，远离大海的西北某地转变发展思路，开发利用当地丰富的宜渔盐碱水土资源，解决了水温控制、生物盐碱度适应、蟹苗运输、水体循环利用等技术难题，营造出类似海水养殖的环境，发展海产品养殖，实现了“海鲜陆养”。金秋时节，青蟹、海虾等“海鲜”大批量上市。“海鲜陆养”的哲学启示在于（　　）","opts":{"A":"观念创新是实践创新的源泉和动力","B":"只有努力改造规律，才能获得实践的成功","C":"只要充分发挥主观能动性，就能把握客观规律","D":"意识不仅反映客观存在，而且指导实践能动地改造世界"},"ans":"D","point":"主观能动性和客观规律性的辩证统一","explain":"西北某地转变发展思路，开发利用盐碱水土资源，营造出类似海水养殖的环境，实现了“海鲜陆养”，说明意识不仅反映客观存在，而且可以通过实践把观念的东西变成现实的东西，指导人们能动地改造世界，D选项正确。实践创新的源泉和动力是社会实践，A选项错误。开发利用当地丰富的宜渔盐碱水土资源，解决了技术难题，营造出类似海水养殖的环境，实现了“海鲜陆养”说明规律是客观的，不以人的意志为转移，人们可以根据规律发生作用的条件和形式利用规律，改造客观世界，造福人类，但不能说改造客观规律，B选项错误。尊重客观规律是发挥主观能动性的前提。西北某地成功探索在盐碱水中养殖海鲜说明人类只有遵循自然规律，才能正确发挥主观能动性，但只要充分发挥主观能动性，不一定就能把握客观规律，C选项错误。"},{"chapter":"第一章","section":"单选","no":6,"stem":"与屏幕里的仿生机器人互动，沉浸式感受“梦之海星球”幻想世界，打卡科幻生活节和科幻市集。·在北京石景山区首钢园举行的2025中国科幻大会上，一系列互动场景令参观者“燃”起对科幻的热情。科幻照入现实，科幻产业的创新潜力和发展效益因此愈发显现。科幻小说作家刘慈欣在大会开幕式上直言：“当载人航天器划破天际，当量子计算机解开混沌，这些“现实土壤’正滋养着比科幻更科幻的未来。”从量子科学、脑机接口到6G网络，前沿技术在我国持续涌现，充满未来感的发展实践为科幻创作插上想象的翅膀。这表明（，）","opts":{"A":"科幻根源于人的主观想象","B":"意识对客观存在的反映是自觉的和创造性的","C":"意识来源于客观存在，与客观存在相符合、相一致","D":"意识反映客观存在的方式是人自由选择的，与意识的内容无关"},"ans":"B","point":"物质与意识的辩证关系","explain":"科幻照入现实，科幻产业的创新潜力和发展效益因此愈发显现，前沿技术在我国持续涌现，充满未来感的发展实践为科幻创作插上想象的翅膀，说明意识对客观存在的反映是自觉的和创造性的，B选项正确。任何意识包括幻想都是对客观存在的反映，实践为科幻创作插上想象的翅膀，A选项错误。意识来源于客观存在，但意识与客观存在不一定是相符合、相一致的，正确的意识才与客观存在相符合、相一致，C选项错误。意识反映客观存在的形式具有主观性，但并非由人完全自由选择，与意识的内容无关的，也会受客观条件的制约，D选项错误。"},{"chapter":"第一章","section":"单选","no":7,"stem":"从空翻到快跑，从进厂上岗到助人爬山，近年来，具身智能机器人的精彩表现让人目不暇接。2025年，“具身智能”被首次写入《政府工作报告》。这种被喻为“有了物理身体的智能”，相比善于思考的语言大模型，更强调与现实世界的动态交互。具身智能的出现对哲学意识论的意义是（　　）","opts":{"A":"否定了意识对物质的能动性","B":"根本改变了人类意识活动中的主体性","C":"降低了人在意识活动中的主体性","D":"表明意识活动与其他物质形式的同一性"},"ans":"D","point":"物质与意识的辩证关系","explain":"马克思主义意识论认为，意识是人脑的机能和属性，是物质世界长期发展的产物，是特殊的物质反映形式。具身智能作为人类智能（意识）的物化（即通过技术手段将人类的设计思想、算法模型赋予物理实体），使得原本“无形”的意识活动（思考、决策、规划）能够通过机器人这个“物理身体”与客观世界进行实体交互和改造。这生动地展示了人类高度复杂的意识活动，能够通过技术中介，转化为可感知、可观测的物质运动形式，从而在实践层面印证了“意识活动”与“其他物质运动形式”之间并非截然对立，而是具有深刻的内在联系和同一性。这体现了物质世界的统一性和意识对物质的依赖性。D选项正确。A选项错误，具身智能恰恰是人类意识能动性的卓越体现和物化成果。人类将自己的意识（设计目标、算法逻辑）对象化到机器人系统中，使其能自主适应和改造环境，这非但没有“否定”，反而强有力地证明了意识具有目的性、计划性和创造性，能够通过实践反作用于物质世界。B选项错误。具身智能是人类创造和使用的工具，它扩展和增强了人类认识世界、改造世界的能力，但并未“根本改变”意识活动的主体。意识的主体始终是人，机器人不具备自我意识、情感和价值判断。它执行的是人类预设或赋予的程序，其“智能”是人类智能的延伸，而非独立的主体。C选项错误，工具的强大并不意味着使用者地位的降低。正如汽车跑得比人快，并未降低人在交通中的主体地位一样，具身智能作为更强大的工具，恰恰需要人类更高水平的意识活动（如创造性设计、伦理规划、全局掌控）来驾驭和运用。因此，它没有降低人的主体性，反而对人在意识活动中的规划、监督、决策等主体性能力提出了更高要求。"},{"chapter":"第一章","section":"单选","no":8,"stem":"在物理学中，测量高铁的运行速度需要以地面为静止参考系，研究行星轨道需要以恒星作为相对稳定的坐标原点。正如恩格斯所言：“运动应当从它的反面即从静止找到它的量度。”从哲学角度看，这里的“静止”之所以能成为运动的量度，是因为静止是（　　）","opts":{"A":"运动的根本属性和存在方式","B":"过去运动的结果和未来运动的出发点","C":"运动的原因和根据","D":"运动的基础和承担者"},"ans":"B","point":"物质的根本属性和运动着的物质的基本存在形式","explain":"物质和运动是密不可分的，物质是运动的基础、载体、承担者，运动是物质的根本属性、固有属性、存在方式。运动和静止也是密不可分的，是对立统一关系、绝对相对关系、相互渗透关系。静止是运动的特殊状态，是局部的、有条件的、暂时的，它既是过去运动的结果，又是未来运动的出发点、起点，是运动量度的依据或参照系，故应选B。马克思主义认为，运动是物质的根本属性和存在方式，而非静止。静止是运动的特殊状态，不能反过来说静止是运动的属性。运动的根本原因是事物内部的矛盾性。静止是运动的结果，而非原因。运动的承担者与主体是物质，静止作为运动的状态，不能成为运动的基础或承担者。A、C、D表述错误。"},{"chapter":"第一章","section":"单选","no":9,"stem":"当前，世界百年变局加速演进，国际形势波谲云诡。把坚持稳中求进工作总基调作为科学的方法论，是在实践中不断深化对经济工作规律性认识的必然结论。2025年4月25日，中央政治局召开会议，分析研究当前经济形势和经济工作，强调要坚持稳中求进工作总基调，明确提出“坚定不移办好自己的事，坚定不移扩大高水平对外开放，着力稳就业、稳企业、稳市场、稳预期，以高质量发展的确定性应对外部环境急剧变化的不确定性”。“稳中求进”这一论断包含的哲学道理是（　　）","opts":{"A":"静止是绝对的、无条件的，运动是相对的、有条件的","B":"绝对运动是相对静止的前提","C":"相对静止中包含绝对运动","D":"静止不变是实现运动发展的根源"},"ans":"C","point":"物质的根本属性和运动着的物质的基本存在形式","explain":"马克思主义认为，绝对运动与相对静止是辩证统一的。“稳中求进”中的“稳”指相对静止（如稳定就业、稳定市场预期），体现物质运动在一定条件下的稳定状态；“进”指绝对运动（如推动高质量发展），体现物质运动的无条件性和变动性。“稳”并非绝对静止，而是包含着“进”的因素，体现了“静中有动”一一相对静止中必然包含绝对运动。应选C。马克思主义明确指出，运动是绝对的、无条件的（如外部环境的急剧变化、经济结构的动态调整），静止是相对的、有条件的（如“稳”依赖于政策调控、市场机制等条件）。A选项错误。题干强调“稳中求进”，即通过“稳”（相对静止）为“进”（绝对运动）提供基础，更突出相对静止对绝对运动的支撑作用。B选项的表述忽略了静止的条件性，且与“稳中求进”的实践逻辑（以稳促进）不符。运动发展的根源是事物内部的矛盾性（如经济系统中供给与需求的矛盾），而非静止。D选项错误。"},{"chapter":"第一章","section":"单选","no":10,"stem":"李大钊在一篇文章中写道：“一现在的铃，无限的过去未来皆遥相呼应。这就是过去未来皆是现在的道理。这就是‘今’最可宝贵的道理。”对此话理解最贴切的是（　　）","opts":{"A":"过去和未来都是现在的表象","B":"现在的努力，是激活历史和创造未来的关键","C":"过去现在未来时时流转是社会历史发展的规律","D":"过去未来与现在共处于时间的统一体中，没有界限"},"ans":"B","point":"物质的根本属性和运动着的物质的基本存在形式","explain":"“过去未来皆遥相呼应。这就是过去未来皆是现在的道理。这就是“今”最可宝贵的道理”表明现在连接着过去和未来，现在的努力，是激活历史和创造未来的关键，B选项符合题意。事物是发展变化的，过去是现在之前，未来是现在之后，认为二者都是现在的表象的说法是错误的，A选项排除。生产关系适应生产力、上层建筑适应经济基础的规律是社会历史发展的规律，C选项错误。在宏观世界之中，过去、现在和未来是有着明确的界限的，此时此刻就是现在，而在此之前就是过去，在此之后则是未来，D选项错误。"},{"chapter":"第一章","section":"单选","no":11,"stem":"“元宇宙”是一个平行于现实世界的虚拟世界，拥有完整运行的社会和经济系统。现实中的人能以数字化身的形式进入“元宇宙”，进行娱乐、社交、消费、内容创作等，并获得无限接近真实的体验。现代科技的运用、发展与整合，为“元宇宙”的实现提供了可能。这表明（　　）","opts":{"A":"未来人类会生活在现实世界和“元宇宙”中，成为现实与数字的两栖物种","B":"“元宇宙”的存在说明物质依赖于意识，虚拟世界也具有客观实在性","C":"“元宇宙”是对现实社会的一种能动反映，人不能脱离现实而完全生活在虚拟世界中","D":"随着科技的发展，“元宇宙”将取代现实世界，意识将成为世界的又一本原"},"ans":"C","point":"物质的根本属性和运动着的物质的基本存在形式","explain":"“元宇宙”是一个平行于现实世界的虚拟世界，拥有完整运行的社会和经济系统，现实中的人能以数字化身的形式进入其中。这表明“元宇宙”是人们基于现实世界，通过意识的能动作用创造出来的，是对现实社会的一种能动反映。同时，人是现实社会中的人，“元宇宙”中的活动和体验也是基于现实的，人不能脱离现实而完全生活在虚拟世界中，C选项正确。虽然未来人类可能会更多地参与到“元宇宙”中，但说“成为现实与数字的两栖物种”过于绝对。人本质上是生活在现实世界中的，“元宇宙”只是基于现实世界通过科技手段构建的虚拟世界，人不能脱离现实世界而完全成为所谓的“两栖物种”，目前“元宇宙”的发展还不足以让人完全脱离现实生活，所以A选项错误。物质是不依赖于人的意识，并能为人的意识所反映的客观实在，客观实在性是物质的唯一特性，物质决定意识，意识依赖于物质，而不是物质依赖于意识。“元宇宙”作为虚拟世界，是人们通过科技手段创造出来的，是对现实世界的一种模拟和反映，它不具有客观实在性，客观实在性是现实世界中物质的属性，所以B选项错误。“元宇宙”是科技发展的产物，是对现实世界的一种虚拟呈现，它不可能取代现实世界，也不能改变物质是世界本原的事实，意识不能成为世界的又一本原，所以D选项错误。"},{"chapter":"第一章","section":"单选","no":12,"stem":"2026年1月20日，省部级主要领导干部学习贯彻党的二十届四中全会精神专题研讨班开班。开局之年的“第一课”，习近平总书记特别强调了一个词——“适配度”：““十五五’刚刚开局，大家都在谋划推进，要注意算投入产出账，提高适配度，既不能无视短板，也不能过于超前、造成浪费。”要注意算投入产出账，提高适配度，这是因为（　　）","opts":{"A":"真理既具有绝对性又有相对性","B":"发展是前进性与曲折性的统一","C":"发展是渐进性与飞跃性的统一","D":"偶然性中包含着必然"},"ans":"C","point":"量变质变规律","explain":"“无视短板”意味着忽视了通过持续努力、补齐短板所必需的、踏实的“渐进”性积累（量变过程）；而“过于超前、造成浪费”则意味着企图跳过或无视必要的渐进积累阶段，去追求不切实际的、急躁冒进的“飞跃”（质变）。总书记强调“提高适配度”，正是要求我们尊重客观规律，在谋划推进工作时，要将发展的渐进性（稳扎稳打、补齐短板）与飞跃性（在条件成熟时推动升级和突破）有机统一起来，精准地把握推动工作、配置资源的节奏、力度和分寸，在合适的“度”上实现发展。应选C。A选项“真理既具有绝对性又有相对性”属于真理观的范畴，讨论的是认识（真理）本身的属性问题。题干强调的是在实践工作中如何把握分寸、讲求实效的“方法论”，即“怎么去做”才能符合实际，而非探讨我们的认识或规划本身是绝对正确还是相对正确的真理属性问题。B选项发展是前进性与曲折性的统一描述的是发展的“趋势和道路”问题，即事物发展总方向是前进的，但道路是曲折的。题干中“无视短板”和“过于超前”主要涉及的是发展“节奏和程度”的把握是否“适度”，而非强调发展过程中会遇到挫折或迁回。虽然发展过程本身具有曲折性，但题干论述的重点不在于此。D选项偶然性中包含着必然讨论的是必然规律通过大量偶然事件表现出来。题干内容聚焦于如何主动地、有意识地进行规划和资源配置，以达到最佳效果，并未涉及偶然现象及其与必然规律的关系。这是无关原理的牵强附会。"},{"chapter":"第一章","section":"单选","no":13,"stem":"《论语》中记载了孔子与子贡的对话，来评价自己的两个弟子颛孙师（子张）和卜商（子夏）。子贡问：“师与商也孰贤？”子曰：“师也过，商也不及。”日：“然则师愈与？”子曰：“过犹不及。”从哲学角度看，防止“过犹不及”的关键在于（　　）","opts":{"A":"抓住事物的主要矛盾","B":"认识事物的量","C":"确定事物的质","D":"把握事物的度"},"ans":"D","point":"量变质变规律","explain":"这一成语典故的来历是子贡问孔子：“子张和子夏谁更贤能？”孔子说：“子张做事常过头，子夏常不足。”子贡又问：“那子张更好一些吗？”孔子说：“过头和不足一样，都不合适。”孔子强调“过犹不及”，即“过度”与“不足”同样偏离正确状态，本质上是要求把握“适度”原则，与“度”的哲学概念完全契合。应选D。题干核心是“过”与“不及”的量的问题，而非“主次矛盾”的矛盾地位问题。抓主要矛盾无法直接解决“适度”问题。A选项错误。量是事物存在和发展的规模、程度等数量特征，认识量是把握度的前提。仅认识量而不把握“度”（量的界限），无法防止“过”或“不及”。B选项错误。质是事物区别于他事物的内在规定性，确定质是认识事物的基础。题干强调的是在保持质的稳定性前提下控制量的变化，而非单纯“确定质”。确定质后仍需把握度，才能防止过或不及。C选项错误。"},{"chapter":"第一章","section":"单选","no":14,"stem":"有这样一道数学题：“90%×90%×90%×90%×90%=？”其答案是约59%。90分看似一个非常不错的成绩，然而，在一项环环相扣且连续不断的工作中，如果每个环节都打点折扣，最终得出的成绩就是不及格。这里蕴含的辩证法道理是（　　）","opts":{"A":"肯定中包含否定","B":"量变引起质变","C":"必然性通过偶然性开辟道路","D":"可能和现实是相互转化的"},"ans":"B","point":"量变质变规律","explain":"题干本身说明小的不足会逐步导致最终成绩不及格，说明量的积累达到一定程度，会引起质变。从90分到59分可以理解为从“及格”到“不及格”的“性质”的变化。B选项正确。A选项似乎具有一定的干扰性，有考生认为90分是对工作的“肯定”，而59分不及格是对工作的“否定”。这样理解是不准确的：第一，辩证法所讲的“肯定”和“否定”不是人们对事物的主观评价；第二，就题意看，所给提示的内容与辩证法的肯定和否定原理也没什么关系。C、D两选项与材料无关可以直接排除。"},{"chapter":"第一章","section":"单选","no":15,"stem":"2025年4月23日，习近平在气候和公正转型领导人峰会上的致辞中指出：“今年是《巴黎协定》达成10周年。10年来，全球气候治理虽然历经风雨，但绿色低碳发展终成时代潮流。无论国际形势如何变化，中国积极应对气候变化的行动不会放缓，促进国际合作的努力不会减弱，推动构建人类命运共同体的实践不会停歇。让我们以人类前途为怀、以人民福为念，切实履行共同但有区别的责任，各尽所能，团结协作，推动共建清洁、美丽、可持续的世界。”发达国家与发展中国家履行共同但有区别的责任体现的唯物辩证法的道理是（　　）","opts":{"A":"矛盾的主要方面决定了事物的性质","B":"主要矛盾在事物发展中起决定作用","C":"矛盾中普遍性包含着特殊性","D":"矛盾的普遍性与特殊性是统一的"},"ans":"D","point":"矛盾的普遍性和特殊性及其相互关系","explain":"“共同但有区别的责任”中，“共同责任”体现了矛盾的普遍性，即应对气候变化是全球各国共同面临的问题，需要各国共同努力；“有区别的责任”体现了矛盾的特殊性，即不同国家由于发展阶段、历史责任、经济实力等方面的不同，在应对气候变化方面承担的具体责任有所区别。这体现了矛盾的普遍性与特殊性是统一的，二者相互联结，普遍性寓于特殊性之中，并通过特殊性表现出来，特殊性离不开普遍性。D选项正确。矛盾的主要方面决定事物的性质，强调的是在一个矛盾中，处于支配地位、起主导作用的方面决定事物的性质，而题干并未涉及对事物性质的判断，A选项与题意不符。B选项强调的是在复杂事物中，主要矛盾处于支配地位，对事物的发展起决定作用，而题干中没有体现出主要矛盾的相关内容，该选项与题意不符。C选项错误，应该是矛盾的特殊性包含着普遍性，而不是普遍性包含着特殊性。"},{"chapter":"第一章","section":"单选","no":16,"stem":"《长征组歌》中“调虎离山袭金沙，毛主席用兵真如神”描绘了遵义会议后毛泽东的经典战术：中央红军四渡赤水后佯攻贵阳，蒋介石误判红军主攻方向，急调滇军主力驰援贵阳。此举使云南防务空虚，红军趁机挥师入滇，虚晃一枪威逼昆明，实则直扑金沙江，最终突破国民党军封锁。这段军事指挥艺术体现的哲学道理是（　　）","opts":{"A":"现象包含真象与假象，假象是本质的特殊表现形式","B":"现实的可能性通过主观想象转化为实践成果","C":"真象直接展现本质，假象不表现本质","D":"错觉是对事物本质的歪曲反映，错觉造成了假象"},"ans":"A","point":"联系和发展的基本环节","explain":"马克思主义认为，现象分为真象（正面直接表现本质）和假象（歪曲间接表现本质），二者都是本质的外在表现。“佯攻贵阳”“威逼昆明”是假象，看似进攻，实则迷惑敌人，本质是“调动滇军、突破金沙江封锁”，假象通过制造敌人误判，间接服务于本质目标，体现“假象是本质的特殊表现”。A选项正确。可能性转化为现实依赖于客观条件和实践活动，而非“主观想象”。红军成功渡过金沙江，源于对敌军部署的客观分析（如滇军调离导致防务空虚）和军事行动（急行军奔袭），而非空想。B选项错误。否定假象与本质的联系。假象虽歪曲表现本质，但仍是本质的反映，C选项错误。蒋介石的“误判”是错觉，红军的“佯攻”是假象，假象引发错觉，而不是错觉造成了假象，D选项错误。"},{"chapter":"第一章","section":"单选","no":17,"stem":"有科学家说：“跳过一个高度，又有新的高度在等着你。”不断把“不可能”变成“可能”，把“有可能”变成“一定能”，继而赢得“无限可能”，我们就能始终走在时间前面，走在时代前列。曾经，横亘在发展路途上的，便是一个个“不可能”。没有大型机械，悬崖峭壁上能建渠引水吗？河南林县人不认命、不服输，战天斗地凿出“人间天河”红旗渠。杂草都不长，荒漠里能长水稻吗？袁隆平团队创新技术，种出海水稻，荒漠成粮仓。起步晚、底子薄，卫星导航能超车吗？科研人员自主创新、追求卓越，开创北斗系统定位“极限精度”。这证明了（　　）","opts":{"A":"不可能与可能是可以相互转化的","B":"不可能具备了某种根据，就有了可能性","C":"可能与现实是可以相互转化的","D":"不可能也存在转化为现实的可能性"},"ans":"C","point":"联系和发展的基本环节","explain":"马克思主义认为，可能性的存在以客观根据（如规律、条件）为前提，缺乏客观根据的“不可能”永远无法实现。题干中的“不可能”并非哲学上的“不可能性”（违背规律的绝对不可能），而是有条件的可能性（如红旗渠建设符合水利原理、海水稻培育遵循生物学规律），在具备一定的条件下，通过实践努力转化为现实。红旗渠、海水稻、北斗系统的成功，均以尊重客观规律为基础（如利用地形引水、改良作物基因、电磁信号原理），印证了“可能性依赖客观根据，并通过实践转化为现实”的原理。C选项正确。哲学上的“不可能”指违背客观规律的事物，绝对无法转化为可能，更无法成为现实。题干中的“不可能”是日常语境中的“困难挑战”，本质是有条件的可能性（具备客观根据，但缺乏实现条件），二者不可等同。A、B、D是干扰项。"},{"chapter":"第一章","section":"单选","no":18,"stem":"德国物理学家伦琴在研究X射线时，在感光板上偶然发现了自己手骨的黑影，这一“机遇”成为他发现X射线和发明X射线照相的起点。弗莱明不经意把发霉的面包屑掉进葡萄球菌培养血中，结果杀死了大量葡萄球菌。他抓住这一偶然的“机遇”并进一步研究，发现了药物青霉素以及其他一系列抗生素，从而在医药科学上实现了一次重大突破。以上材料表明（　　）","opts":{"A":"科学发现完全依赖于偶然事件","B":"偶然性背后隐藏着必然性","C":"偶然性可以脱离必然性独立存在","D":"偶然性对事物发展起决定作用"},"ans":"B","point":"联系和发展的基本环节","explain":"马克思主义认为，偶然性与必然性是辩证统一的。必然性通过大量偶然性表现出来，并为自己开辟道路；偶然性是必然性的补充和表现形式，其背后始终受必然性支配。伦琴和弗莱明的“偶然发现”并非纯粹随机：伦琴的研究建立在对阴极射线的长期探索基础上，弗莱明的观察依赖于其对细菌学的专业敏感。这些“偶然”是必然性（科学规律、研究积累）通过特定条件（实验中的意外事件）的具体显现。应选B。必然与偶然相互依存。一方面，没有脱离偶然的必然。现实事物的发展，不通过偶然而只表现为纯粹必然的情况是不存在的。必然总是伴随着偶然，要通过偶然表现出来，并为自己开辟道路。另一方面，没有脱离必然的偶然。在似乎是偶然起支配作用的地方，实际上是必然起着决定性作用，并制约着偶然的作用形式及其变化。A、C、D都是错误选项。"},{"chapter":"第一章","section":"单选","no":19,"stem":"热引起燃烧，燃烧反过来又产生大量热。生产力的发展引起生产关系的变革，生产关系的变革反过来又促进生产力进一步发展。工业为农业提供机器、化肥、农药等，促进了农业的发展，而农业的发展为工业提供丰富的粮食和原料、广阔的市场和大量的资金，反过来又促进了工业的发展。这揭示的是事物之间的（　　）","opts":{"A":"可能与现实的关系","B":"必然与偶然的关系","C":"原因与结果的关系","D":"现象与本质的关系"},"ans":"C","point":"联系和发展的基本环节","explain":"原因与结果是揭示事物前后相继、相互作用的一对范畴。题干中“热→燃烧→热”“生产力→生产关系→生产力”等双向作用，直接体现了因果关系的相互制约性和辩证统一性。结果不仅由原因产生，还反作用于原因，形成动态循环。每组例子均包含“原因引发结果，结果反作用于原因”的逻辑。C选项正确。可能与现实探讨的是事物发展的潜在趋势与实际存在的关系，而题干未涉及“潜在性”与“现实性”的转化，而是强调已存在的事物间的相互作用。必然与偶然是揭示事物产生、发展和衰亡过程中的不同趋势的一对范畴，但题干中的“相互促进”是事物内在联系的必然结果（如生产力与生产关系的矛盾运动是历史发展的必然规律），不涉及偶然因素的作用。现象与本质是揭示事物外在表现与内在规律的关系范畴，但题干聚焦于事物之间的双向作用机制，而非单一事物的内外层次，与现象本质的关系无关。A、B、D是干扰项。"},{"chapter":"第一章","section":"单选","no":20,"stem":"今天，我们面临的工作千头万绪、点多面广，既要有串联思维，又要有并联思维。串联思维，贵在沟通前后、连通左右，考验视野和定力。看促进消费，许多地方用一张票根，串联起多个消费场景，激发乘数效应。并联思维，重在同向发力、统筹兼顾，彰显本领和担当。以“高效办成一件事”为例。在一些地方，录用员工时，企业办理就业登记、档案接收、社保和医保参保、公积金开户等事项，要跑7个部门，交20余份材料，耗时近10个工作日。上海以“集成服务”破局，将7个事项整合为“一次申报、多事联办”。工作中要避免串联变成“单打一”、并联变成“胡子眉毛一把抓”，而应使“独角戏”成为“交响乐”。这一要求启示我们在运用系统观念分析和解决问题时，必须把握（　　）","opts":{"A":"要素的功能取决于其自身属性","B":"整体的功能必然大于各部分之和","C":"结构优化是发挥整体功能的关键","D":"部分的变化对整体没有直接影响"},"ans":"C","point":"学习唯物辩证法，不断增强思维能力","explain":"题干强调防止工作方法僵化（“单打一”“一把抓”)，追求协同发力（“交响乐”)，其核心在于通过优化工作要素的组织方式（结构）来提升整体效能，这体现了“结构优化是发挥整体功能的关键”的系统思维。C选项正确。A选项“要素的功能取决于其自身属性”忽视要素间的关联，与“协同”要求相悖。B选项“整体的功能必然大于各部分之和”表述绝对化，系统整合后整体功能可能大于、等于或小于部分之和。D选项“部分的变化对整体没有直接影响”违背普遍联系原理，部分变化会影响整体。"},{"chapter":"第一章","section":"单选","no":21,"stem":"科学制定和接续实施五年规划，是我们党治国理政一条重要经验，也是中国特色社会主义一个重要政治优势。谋划“十五五”时期经济社会发展，要前瞻性地把握国际形势发展变化对我国的影响，因势利导对经济布局进行调整优化。这要求我们培养和运用好的是（　　）","opts":{"A":"创新思维能力","B":"历史思维能力","C":"底线思维能力","D":"战略思维能力"},"ans":"D","point":"学习唯物辩证法，不断增强思维能力","explain":"战略思维能力强调思维的整体性、全局性、长期性，是高瞻远瞩、统揽全局、善于把握事物发展总体趋势和方向的能力。战略思维能力之所以重要，是因为它是一种充分发挥人的主观能动性、积极性和创造性的思维活动，事关社会发展的未来走向与整体谋划，旨在谋求长远的生存与发展。培养和提高战略思维能力，要求我们不断开阔视野，培养博大胸襟，紧跟时代前进步伐，学会站在战略和全局的高度观察和处理问题，透过纷繁复杂的表面现象把握事物的本质和发展的规律，做到既抓住重点又统筹兼顾，既立足当前又放眼长远，既熟悉国情又把握世情，在原则性问题上坚定立场不动摇，在整体性、方向性块择面前冷静观察、谨慎从事、谋定而后动。题干中“谋划“十五五时期经济社会发展，要前瞻性把握国际形势发展变化对我国的影响”都在提示答案为D。A选项创新思维能力是指对常规思维的突破，是破除迷信，超越陈规，善于因时制宜、知难而进、开拓创新的能力。B选项历史思维能力是以史为鉴、知古鉴今，善于运用历史眼光认识发展规律、把握前进方向、指导现实工作的能力。C选项底线思维能力是我们在认识世界和改造世界的过程中，根据我们的需要和客观的条件，划清并坚守底线，尽力化解风险，避免最坏结果，同时争取实现最大期望值的一种积极的能力。A、B、C是干扰项。"},{"chapter":"第一章","section":"多选","no":22,"stem":"近期，某社交平台为AI智能体开设“实验室”，它们自主创建社区、讨论哲学甚至吐槽人类，进行了一场引发广泛关注的“社交实验”。有观点惊呼AI正在“觉醒”，但研究指出，许多惊人言论可能只是对训练数据中科幻情节的模仿，或是人为设计的噱头。无论其外在表现如何“拟人”，从马克思主义哲学关于意识本质的基本观点来看，我们可以得出的正确认识是（　　）","opts":{"A":"人工智能是对人脑组织结构与思维运行机制的模仿","B":"人工智能的“智能”实质上是人类智能的物化","C":"人工智能能够产生真正属于其自身的独立意识与情感","D":"最先进的智能机器可以达到人类智能的层级"},"ans":"AB","point":"物质与意识的辩证关系","explain":"人工智能“实质上是对人脑组织结构与思维运行机制的模仿”。题干中AI的“讨论”“吐槽”等行为，无论多复杂，其底层逻辑都是对人类语言模式和思维过程的算法化模拟，而非真正的意识活动。人工智能是“人类智能的物化”。AI的能力来源于人类编写的代码和投喂的数据，是将人类智能（认知、推理、创造等能力）转化为机器可执行程序的过程，是人的智力劳动的结晶，而非机器自生的智能。A、B是正确答案。C选项是典型的“强人工智能”或“意识赋予论”观点，即使最先进的智能机器“也不能真正具有人的意识”。人类的意识是社会实践的产物，具有社会性、情感、意志等复杂属性，这是当前基于数据和算法的人工智能所不具备的。AI的“情感”表达仅是模式匹配的结果。D选项错误，此选项夸大了人工智能的发展前景，属于“技术奇点论”的片面观点。人工智能“不能达到人类智能的层级”。人类智能具有直觉、灵感、价值判断、道德意识等非逻辑、非理性的维度，以及基于社会实践的深刻理解力，这是AI在可预见的未来难以完全复现和超越的。"},{"chapter":"第一章","section":"多选","no":23,"stem":"量子力学研究表明，微观粒子始终处于永不停息的“量子涨落”中，其位置和动量无法被同时精确测定；地质研究发现，地球大陆板块以每年数厘米的速度持续漂移，青藏高原至今仍在缓慢抬升；人类建造的摩天大楼看似静止，实则随着地球自转以数百米每秒的速度运动。这表明（　　）","opts":{"A":"时空的特性会随着人类认识的发展而变化","B":"事物总是作为过程而存在","C":"时间和空间是物质运动的度量方式","D":"相对静止是物质运动的特殊状态"},"ans":"BCD","point":"物质的根本属性和运动着的物质的基本存在形式","explain":"运动是标志一切事物和现象的变化及其过程的哲学范畴。事物都是在运动变化中，微观粒子的“量子涨落”、板块漂移和青藏高原抬升、摩天大楼随地球自转的运动，体现其作为“运动过程中的存在”。说明事物总是作为过程而存在。B选项正确。物质运动以时空为载体，时空因物质运动而显现。粒子的位置空间和动量、板块漂移的“每年数厘米”、大楼运动的“数百米每秒”，均证明时空是物质运动的度量方式。C选项正确。静止是运动的特殊状态（空间位置暂时不变或性质相对稳定），本质上是运动的特殊表现。D选项正确。时空特性（如广延性、持续性）由物质运动本身决定，人类认识的发展（如从牛顿力学到相对论）是对时空本质的逐步揭示，而非改变其特性。A选项错误。"},{"chapter":"第一章","section":"多选","no":24,"stem":"纳米是一个长度单位，1纳米等于十亿分之一米。物质被“切割”到纳米级别时，会展现出与宏观尺度时截然不同的特性。原本导电的金属深入纳米尺度后，会逐渐变成半导体进而成为绝缘体；当尺寸进一步减小时，表现出量子效应，又变成了导体。在微观世界里，纳米功能材料会呈现宏观量子隧道效应、表面效应、小尺寸效应等神奇性质。当物质被“切割”到纳米级别时，其物理化学性质如导电性会随尺寸变化呈现量子效应、表面效应等新特性。这表明（　　）","opts":{"A":"物质的唯一特性是客观实在性","B":"物质的属性是多样的","C":"空间是物质运动的存在形式","D":"物质的微观属性依赖于人的观测手段"},"ans":"ABC","point":"物质的根本属性和运动着的物质的基本存在形式","explain":"马克思主义认为，物质的唯一特性是客观实在性，无论宏观（如金属块）还是微观（如纳米颗粒），其存在都不依赖于人的意识。题干中纳米材料的特性变化，只是物质客观属性的展现，而非其存在的改变。A选项正确。物质具有多样属性（如导电性、量子效应等），这些属性的具体表现受物质结构（如尺寸、原子排列）和存在形式（如纳米尺度）制约。纳米尺度作为空间的一种具体表现（长度单位），其客观性源于物质运动的客观实在性。题干中“纳米级别”的物质特性变化，正是在特定空间形式（微小尺度）下物质运动的体现。B选项、C选项正确。马克思主义认为，物质属性是客观的，不依赖于人的观测（如暗物质未被直接观测但客观存在）。纳米材料的特性即使未被人类观测，也会因物质结构变化而客观存在，观测只是认识属性的手段，而非决定因素。D选项错误。"},{"chapter":"第一章","section":"多选","no":25,"stem":"“十五五”规划建议提出“做优增量、盘活存量”的发展方法。在基层治理实践中，许联合商超设立“食物银行”，将临期食品精准对接困难群体，实现减少浪费、帮扶民生、企业获益的多赢；重庆推行“时间银行”，鼓励低龄老人服务高龄老人，以“服务时间”存储与兑换机制，激发社区互助活力。这些实践表明，只要善于通过机制创新创造条件，就能使“沉睡”的资源转化为服务社会的新动能，实现资源配置效率与效益的整体跃升。从唯物辩证法的视角看，这一方法论的成功实践主要体现了（　　）","opts":{"A":"矛盾双方相互转化","B":"系统结构优化重组","C":"量变积累引起质变","D":"创建新的具体联系"},"ans":"ABD","point":"辩证思维方式；矛盾的同一性和斗争性及其在事物发展中的作用","explain":"A选项正确，此选项直接对应“盘活存量”的核心机制。材料中，“闲置资源”与“有效利用”“余热”与“新价值”构成矛盾双方。通过创设“食物银行”“时间银行”等条件，促使矛盾双方发生转化，使“沉睡”的存量转化为“激活”的动能，生动体现了矛盾同一性中“相互转化”的原理。B选项正确，此选项揭示了“做优增量、盘活存量”的整体性思维。方法论并非简单增加资源，而是通过对存量资源的重新发现、整合与配置，改变其组合方式与作用机制（优化系统结构），从而提升整体功能（实现多赢、激发活力），这正体现了系统优化的方法。D选项正确，唯物辩证法认为，联系具有普遍性和客观性，人们可以根据事物固有的联系改变条件，建立新的具体联系。案例中，通过机制创新，原本无直接关联的“临期食品”与“困难群体”、“低龄老人空闲时间”与“高龄老人照护需求”之间建立了新的、有益的社会联系，这正是创新思维在实践中的生动体现。C选项强调发展需经过量的积累。但材料重点不在于资源数量的简单增加或时间的累积，而在于通过模式与机制创新（即结构调整与关系重组）这一关键条件，引发资源功能与效益的质变。其核心是“转化”与“重组”，而非“积累”。"},{"chapter":"第一章","section":"多选","no":26,"stem":"人工智能来势汹汹，一些年轻人在网上发问，“学什么最有用？”“刷题还有意义吗？”“大学生还要写论文吗？”………面对人工智能这一似乎没有能力边界的新事物，部分年轻人难免有本领恐慌和危机感。有了AI“加持”，努力学习就没有意义了吗？其实不然。正如相关领域专家所言：“你是什么水平，AI就是什么水平。”这是因为现阶段AI大模型（　　）","opts":{"A":"需要依赖人类的知识输入和算法设计才能发挥更大功能","B":"只是人类扩展自己智力的工具","C":"不具备人类意识特有的能动创造性","D":"已经具备超越人类的自主思维能力"},"ans":"ABC","point":"意识与人工智能","explain":"人工智能是人类实践的产物，其算法逻辑、数据训练和功能实现都依赖于人类的知识输入和设计。AI无法脱离人类预设的框架自主生成知识，体现了其对人类意识的依赖性。A选项正确。人工智能本质上是人类延伸智力的工具，用于辅助信息处理、数据分析等任务，但不具备独立的目的和主观能动性。题干中“你是什么水平，AI就是什么水平”直接表明AI的能力上限由人类决定，符合“工具论”定位。B选项正确。人类意识具有能动创造性，能够突破既有知识进行创新、反思和价值判断，而AI只能基于数据模式进行概率计算，无法产生真正的创造性思维。这一选项从意识本质的角度，区分了AI与人类的根本差异。C选项正确。意识是人脑的机能，AI作为物理装置不具备主观能动性和自主思维能力。“超越人类”的说法混淆了AI的工具属性与人类意识的本质区别，属于夸大AI能力的错误观点。D选项错误。"},{"chapter":"第一章","section":"多选","no":27,"stem":"电影《哪吒之魔童降世》中，传统神话里“剔骨还父”的叛逆少年，被重塑为顶着黑眼圈、喊着“我命由我不由天”的“魔童”形象，既保留了哪吒反抗命运的核心特质，又融入了当代年轻人对自我认同、代际沟通的情感共鸣。这种艺术再创造表明（　　）","opts":{"A":"观念的东西是移入人脑并在人脑中改造过的物质的东西","B":"一切观念都是现实的模仿","C":"虚幻的神话形象来自于艺术上的想象与灵感","D":"任何艺术形象都可以从现实世界中找到其本质“原型”"},"ans":"AD","point":"意识与人工智能","explain":"哪吒形象从传统神话到现代电影的改编，体现了“观念对物质的反映”这一哲学命题，任何艺术形象都可以从现实世界中找到其本质“原型”。“叛逆少年”“魔童”经过艺术家的加工（人脑改造），融入当代社会情感（现实素材），形成新的艺术形象，强调“黑眼圈”“我命由我不由天”等改编细节，说明观念并非简单复制，而是结合现实进行创造性加工。也就是马克思所说的“观念的东西不外是移入人的头脑，并在人的头脑中改造过的物质的东西”。因此，本题的正确选项为A、D两项。B选项的错误在于它忽视了观念反映现实的能动性和创造性，C选项的错误在于否认了任何观念都来源于物质实际。"},{"chapter":"第一章","section":"多选","no":28,"stem":"中国农历是一种“阴阳合历”。阴历反映的是月球绕地球公转的规律，能反映潮汐，可指导海事活动；二十四节气则是反映太阳周年视运动的“阳历”，能反映四季交替和气候特征，可指导农业生产。通过设置闰月协调回归年与朔望月之间的天数，使得一年的平均天数与回归年的天数相符，“阴阳”和谐，融为一体。中国历法智慧所蕴含的哲理是（　　）","opts":{"A":"正确认识是主观能动性和客观规律性相统一的基础","B":"人对世界的认识活动具有自觉选择性和能动创造性","C":"尊重物质运动的客观规律是规律起作用的前提条件","D":"要在斗争性中把握同一性，在同一性中把握斗争性"},"ans":"BD","point":"主观能动性和客观规律性的辩证统一；矛盾的同一性和斗争性及其在事物发展中的作用","explain":"“阴历”和“阳历”反映的内容不同，指导的侧重点不同，这说明人对世界的认识活动具有自觉选择性和能动创造性，B选项正确切题。“阴历”和“阳历”反映的内容不同，指导的侧重点不同，但可通过设置闰月协调，“阴阳”和谐，融为一体，这说明要在斗争性中把握同一性，在同一性中把握斗争性，D选项正确切题。实践是主观能动性和客观规律性相统一的基础，A选项错误。规律是客观的，并不是因为人们尊重客观规律，规律才发生作用，C选项错误。"},{"chapter":"第一章","section":"多选","no":29,"stem":"西周末年思想家史伯说：“和实生物，同则不继。以它平它谓之和，故能丰长而物归之。”与此包含同样辩证法思想的格言有（　　）","opts":{"A":"“一花独放不是春，百花齐放春满园”","B":"“海纳百川，有容乃大”","C":"“万物并育而不相害，道并行而不相悖”","D":"“和羹之美，在于合异”"},"ans":"ABCD","point":"矛盾的同一性和斗争性及其在事物发展中的作用","explain":"本题以西周思想家史伯的“和实生物，同则不继”为核心，考查辩证法中矛盾同一性与斗争性的辩证关系。史伯的观点强调：“和”（不同事物的和谐统一）是事物生成发展的动力（“和实生物”)；“同”（单一事物的简单重复）会导致发展停滞（“同则不继”）。其本质是主张通过不同要素的相互作用（“以它平它”）实现事物的丰富与发展，体现了矛盾双方既对立又统一，推动事物发展的辩证法思想。A选项“一花独放不是春，百花齐放春满园”强调单一事物的存在无法构成繁荣（“一花独放”），只有多样事物共存（“百花齐放”）才能形成生机勃勃的局面。B选项“海纳百川，有容乃大”强调包容不同事物（“百川”）才能成就宏大（“乃大”），体现了通过接纳差异（对立）实现统一（和谐）的辩证思维。C选项“万物并育而不相害，道并行而不相悖悖”主张万物同时生长而不互相妨害，不同规律同时存在而不冲突，体现了矛盾的同一性（不同事物在统一体中和谐共处）。D选项“和羹之美，在于合异”直接点明羹汤的美味源于不同味道的调和（“合异”），即通过不同要素的结合（对立统一）产生新的质（“美”）。四个选项均从不同角度体现了“矛盾的对立统一推动事物发展”的辩证法思想，与史伯“和实生物，同则不继”的核心观点完全一致，均强调多样性的和谐统一是事物存在和发展的条件，反对单一化和绝对同一。A、B、C、D选项都是正确答案。"},{"chapter":"第一章","section":"多选","no":30,"stem":"2025年以来中美双方已先后开展了六轮经贸磋商，取得一系列积极成果。作为发展阶段、经济制度不同的两个大国，中美双方在经贸合作中出现分歧和摩擦是正常的，关键要以两国元首重要共识为指引，本着相互尊重、和平共处、合作共赢的原则，通过平等对话协商，找到妥善解决问题的办法。历经几十年发展，中美供应链、产业链、价值链相互交融、深度互嵌。中美经贸关系的本质是互利共赢，对抗冲突、打贸易战不符合中美任何一方的利益，中美经贸合作是互利共赢的必然选择。这在辩证法上的依据是（　　）","opts":{"A":"矛盾一方的发展以另一方的某种发展为条件","B":"矛盾的一方必须克服另一方才能使自己获得发展","C":"矛盾双方既对立又统一，由此推动事物发展","D":"矛盾双方可以相互吸取有利于自身的因素而得到发展"},"ans":"ACD","point":"矛盾的同一性和斗争性及其在事物发展中的作用","explain":"唯物辩证法认为，矛盾是事物发展的动力，矛盾双方既对立（斗争性）又统一（同一性）共同推动事物的运动与发展。中美经贸关系中的分歧（对立）与合作（统一）共同构成矛盾的两个方面，中美供应链、产业链、价值链相互交融、深度互嵌，双边贸易互补性强、依存度高，拥有广泛共同利益和广阔合作空间，正体现了矛盾的同一性在事物发展中的作用：在矛盾双方中，一方的发展以另一方的发展为条件，矛盾双方相互吸取有利于自身的因素，在相互作用中各自得到发展，同一性规定着事物转化的可能和发展的趋势。通过对话协商找到妥善解决分歧的办法，推动中美经贸关系互利共赢。应选A、C、D。因为是“双赢”，而不是“单赢”，所以并不体现矛盾一方克服另一方而使自身发展，应排除干扰项B。"},{"chapter":"第一章","section":"多选","no":31,"stem":"秸秆离田是东北利用秸秆的一种有效方式，但秸秆打包离田面积过大、量过度，容易导致黑土流失，因此需要统筹规划，因地制宜，做到科学离田，以实现经济效益与生态保护的统一。这表明（　　）","opts":{"A":"量变达到一定程度会引起质变，要坚持适度原则，合理控制秸秆打包离田的面积和量","B":"矛盾具有特殊性，不同地区的自然条件和实际情况有差异，应因地制宜地进行秸秆离田","C":"系统是由相互联系和相互作用的诸要素构成的统一整体，统筹规划秸秆离田体现了系统思维","D":"事物的发展是前进性与曲折性的统一，秸秆离田过程中遇到的黑土流失问题是无法避免的"},"ans":"ABC","point":"量变质变规律；矛盾的普遍性和特殊性及其相互关系；发展的实质；学习唯物辩证法，不断增强思维能力","explain":"题干中提到“秸秆打包离田面积过大、量过度，容易导致黑土流失”，这体现了量变与质变的辩证关系。当秸秆打包离田的面积和量的积累超过一定限度时，就会引发黑土流失的质变。所以要坚持适度原则，合理控制秸秆打包离田的面积和量，防止因过度而产生不良后果，A选项正确。“需要统筹规划，因地制宜，做到科学离田”，这表明不同地区的自然条件、土壤状况、农业生产情况等存在差异，即矛盾具有特殊性。针对不同地区的特点，采取适合当地的秸秆离田方式，才能更好地实现经济效益与生态保护的统一，体现了具体问题具体分析，B选项正确。统筹规划秸秆离田，考虑到秸秆离田的面积和量，对黑土的影响以及经济效益和生态保护等多个方面，将这些相互联系、相互作用的要素作为一个整体来考虑。这体现了系统是由相互联系和相互作用的诸要素构成的统一整体，运用系统思维来处理秸秆离田问题，以达到最优效果，C选项正确。虽然事物的发展是前进性与曲折性的统一，但说秸秆离田过程中遇到的黑土流失问题“无法避免”是错误的。我们可以通过科学规划、合理控制等方式，如坚持适度原则、因地制宜等，来减少黑土流失问题的发生，而不是不可避免，D选项错误。"},{"chapter":"第一章","section":"多选","no":32,"stem":"“志不求易者成，事不避难者进。”习近平总书记曾引用这句古语激励党员干部“树立必胜信念、知难而进”“善于在危机中育新机、于变局中开新局”。当前，我国发展处于战略机遇和风险挑战并存、不确定难预料因素增多的时期，树立和践行正确政绩观，创造经得起实践、人民、历史检验的实绩，尤其需要党员干部葆有“事不避难者进”的精气神，挺膺担当、迎难而上，战风险、迎挑战、克难关。这其中蕴藏的哲理有（　　）","opts":{"A":"矛盾双方依据一定条件向对立面转化","B":"矛盾的同一性与斗争性在一定条件下向对立面转化","C":"实践活动的成功取决于人的主观意志","D":"强大的精神力量对实践具有反作用"},"ans":"AD","point":"矛盾的同一性与斗争性原理；主观能动性和客观规律性的辩证统一；物质与意识的辩证关系原理","explain":"A选项体现了矛盾同一性原理。题干中“不避难”（不畏难、敢担当）与“进”（取得进步、开创新局）构成一对矛盾。“不避难”是创造条件、克服困难的过程，正是这个条件促使事物向“进”的方向转化，“善于在危机中育新机、于变局中开新局”也生动体现了矛盾双方相互依存，并在一定条件下相互转化的同一性关系。D选项正确，体现了物质与意识的辩证关系原理。“事不避难”所蕴含的坚定信念、担当精神和“精气神”（意识、精神），是指导实践、战胜客观困难（物质）的强大精神动力，这说明正确的意识、强大的精神力量对改造客观世界的实践具有能动的反作用。矛盾双方在一定条件下转化，这是矛盾同一性的表现，而不是矛盾的同一性与斗争性的转化。B选项错误。C选项是典型的唯心主义观点，错误。它夸大了意识的作用，认为实践成功“根本上取决于”主观意愿，完全忽视了客观规律、客观条件的根本性制约，违背了实践是主观见之于客观的活动，其成功取决于主客观统一的基本原理。"},{"chapter":"第一章","section":"多选","no":33,"stem":"烟高耸、厂房林立曾是城市工业化的鲜明印记。如今这些承载着城市记忆的工业遗存，正通过城市更新焕发新生。工业遗存的焕新之道：或变身潮流打卡地，让文化在传统与现代的碰撞中触达更多年轻群体；或唤醒市井烟火，以多业态融合创新消费场景，激发消费活力；或化身科普课堂，成为传承工业文明、普及科技知识的鲜活教材。摒弃大拆大建简单模式，对工业遗存进行保护性改造，保留其“筋骨”的同时，挖掘蕴藏的独特文化价值与空间潜力，既守住了城市历史文脉，又盘活了低效土地资源，实现文化传承与空间利用的双赢。从“工业锈带”到“生活秀带”蕴含的辩证法道理是（　　）","opts":{"A":"在事物发展中，肯定比否定更重要","B":"否定不是徒然的，而是联系和发展的环节","C":"事物经过“扬弃”，才能推陈出新、吐故纳新","D":"发展本质上是后来事物对以前事物的辩证否定"},"ans":"BC","point":"发展的实质；否定之否定规律","explain":"随着城市功能的调整，传统工业被逐步淘汰，经过对工业遗存的创新改造，原先的工业带转变为生活带、生态带和景观带，表明否定不是徒然的，是联系和发展的环节；只有通过辩证否定，即经过“扬弃”，才能推陈出新、吐故纳新，B、C选项正确。任何事物都要经历肯定、否定，再到否定之否定的辩证发展过程。该选项中“肯定比否定更重要”的观点错误，A选项排除。发展的实质是事物的前进和上升，是新事物的产生和旧事物的灭亡。而后来的事物不一定是新事物，故D选项错误。"},{"chapter":"第一章","section":"多选","no":34,"stem":"人形机器人（具身智能）并非凭空出现，它是人工智能、精密机械、传感技术、材料科学等多领域技术交叉融合、相互联系与协同演进的产物。这种“技术聚变”嵌入更广阔的社会网络之中，与老龄化社会的护理需求、制造业升级的柔性生产需求、消费升级的个性化体验需求等形成了复杂的互动与耦合。正是这种普遍、深刻且动态变化的“联系之网”，为其作为新生事物的诞生与发展提供了土壤，也使其在取代传统工具和劳动模式时，展现出改变生产函数、催生新业态的强大生命力。人形机器人这一新生事物能催生新业态的强大生命力，是因为人形机器人（　　）","opts":{"A":"它产生于旧有技术体系之后，是时代发展的最新产物","B":"基于并优化了既有技术网络与社会需求网络的普遍联系，生成了全新的系统结构与功能","C":"在吸收和保留传统生产力合理因素的基础上，增添并融合了旧体系所不能容纳的智能、柔性与协同等新内容","D":"符合社会生产力进步的客观规律，代表着更高效、更人性化的发展方向，因而具备历史必然性"},"ans":"BCD","point":"发展的实质","explain":"新生事物是不可战胜的，可以从三个方面来分析原因：第一，就新事物与环境的关系而言，新事物有新的结构和功能。第二，就新事物和旧事物关系而言，新事物否定了旧事物中消极腐朽的东西，保留了旧事物中合理的、适合新条件的因素，增添了旧事物不能容纳的新内容。在本质上优于旧事物。第三，在社会历史领域，新事物从根本上符合人民群众的利益和要求，能够得到人民群众的拥护。人形机器人并非孤立存在，其生命力根源在于“普遍、深刻且动态变化的联系之网，为其作为新生事物的诞生与发展提供了土壤，也使其在取代传统工具和劳动模式时，展现出改变生产函数、催生新业态的强大生命力”。这既包含了“联系的普遍性”（与技术、社会需求的多重联系），也指明了新生事物能够“适应已经变化了的环境和条件”的关键一一它正是在处理和优化这些复杂联系中，生成了优于旧事物的“新结构”与“新功能”。它在“吸收和保留”合理因素（继承性，体现联系），同时“增添并融合”旧事物没有的新内容（创新性，体现发展）。人形机器人对传统自动化工具和人力劳动的取代，正是这样一个“扬弃”过程。符合社会生产力进步的客观规律，从根本上符合人民群众的利益和要求。B、C、D是正确选项。特征，偷换了“新生事物”必须符合发展规律、具有前进性和远大前途的本质内涵。在哲学上，判断新生事物的根本标准是其内在的必然性和前进性，而非出现时间的早晚。许多“新出现”的事物可能是旧事物的复辟或腐朽现象的变种。"},{"chapter":"第一章","section":"多选","no":35,"stem":"大海边，一波一波的浪拍打着海岸。每一波后浪都在推动着自己的前浪，每一波后浪的前行都有它身后的又一波后浪在推动着。后浪靠不断推动前浪的前行，最终让自己成为前浪，后浪推前浪，一浪接一浪，如此往复，运动不息。下列说法正确的是（）","opts":{"A":"前浪与后浪相互依存，又相互转化，体现了原因和结果在一定条件下相互转化","B":"后浪代替前浪的过程，是辩证的否定，既克服又保留","C":"后浪在一定条件下可以转化为前浪","D":"后浪代替前浪是新事物对旧事物的根本否定"},"ans":"ABC","point":"联系和发展的基本环节","explain":"原因和结果是揭示事物的前后相继、彼此制约关系的一对范畴。在“后浪推前浪”的过程中，前浪对于后浪来说，是其推动的对象，而后浪成为前浪后，又会成为更新的后浪推动的对象。前浪和后浪相互依存，没有前浪就无所谓后浪的推动，没有后浪也不存在前浪被推动以及后续的转化。并且，在这个不断运动的过程中，此时的后浪推动前浪，当后浪成为前浪后，它又成为被新的后浪推动的对象，原因和结果在这种角色的转换中实现了相互转化，所以A选项正确。辩证的否定是事物自身的否定，是事物发展的环节和联系的环节，其实质是“扬弃”，即既克服又保留。后浪代替前浪，并不是对前浪的完全抛弃。后浪在推动前浪推动了波浪运动的发展（克服）。所以后浪代替前浪的过程是辩证的否定，B选项正确。题干中明确提到“后浪是靠不断推动前浪的前行，而最终让自己成为前浪”，这表明了在不断推动和运动的条件下，后浪会转化为前浪，体现了事物的运动变化和相互转化，C选项正确。后浪和前浪本质上都是海浪，它们并不是严格意义上的新事物和旧事物的关系。后浪推前浪只是海浪运动的一种形式，后浪和前浪在本质属性上是相同的，不存在新事物对旧事物那种根本性质的否定，并且新事物对旧事物的否定是辩证否定，而不是完全否定。所以D选项错误。"},{"chapter":"第一章","section":"多选","no":36,"stem":"地球宜居，得益于其独特的宇宙环境和自身条件。首先，地球与太阳距离适中，接收的太阳辐射能够维持适宜的温度并保证液态水的稳定存在；同时角度适宜，保证了规律的四季更替。其次，诸如板块构造运动等剧烈的地质活动有效促进了地球的物质循环，能够长期调节气候并维持元素平衡，保证了大气圈、水圈和岩石圈的动态平衡。如今，人类活动已成为影响陆地生态系统变化的首要驱动力，影响速率与规模远超自然过程。由于破坏生物的栖息环境、排放污染物、过度开发生物资源等，人类活动极大地加速了陆地生物物种多样性的减少进度。然而，人类活动的影响并非全然消极。生态恢复和污染治理有效修复了退化的陆地生态系统，我国的“三北”工程就是其中的经典案例。陆地生态系统的变化表明（　　）","opts":{"A":"事物发展需要遵循适度原则","B":"社会发展与自然界发展有着完全相同的规律特征","C":"事物的发展总是呈现出线性上升的态势","D":"事物的产生发展是多重因素相互作用的结果"},"ans":"AD","point":"发展的实质；联系和发展的基本环节","explain":"“地球与太阳距离适中，角度适宜，强烈的地质活动有效促进了地球的物质循环，能够长期调节气候并维持元素平衡”都说明了事物发展保持适度原则，事物的产生是多重因素相互作用的结果。A、D是正确选项。自然规律（如日地引力、板块运动）是盲目的、自发的客观过程，而社会规律（如人类活动对生态的影响）必须通过人的实践活动（如破坏环境、生态修复）才能体现，二者的根本区别在于是否依赖人的有意识活动。B选项认为社会发展与自然界发展有着完全相同的规律特征是错误的。由于事物中都有肯定因素与否定因素，事物的发展就是经过两次否定、三个阶段，形成一个周期，仿佛是向原来出发点的“回复”，但这是在更高阶段的“回复”，是“扬弃”的结果，使事物的发展呈现出波浪式前进或螺旋式上升的总趋势，而非直线上升趋势。故C选项错误。"},{"chapter":"第一章","section":"多选","no":37,"stem":"脑机接口是指在人或动物大脑与外部设备之间不通过肌肉组织实现的信息交换系统。我国科研团队成功研发的新型脑机接口，只需将两枚硬币大小的处理器植入颅骨中，瘫痪10余年的患者即可通过脑电活动驱动外部设备，实现自主喝水等脑控功能，大幅提高了患者的生活自理能力。人类能够实现大脑与外部设备的连接表明（　　）","opts":{"A":"事物之间的联系都是人为的","B":"事物之间的联系具有普遍性","C":"人为事物的联系以自在事物的联系为前提","D":"从事物的表面相似处找到系统的任意联系"},"ans":"BC","point":"发展的实质；联系和发展的基本环节","explain":"联系具有客观性，人为事物的联系以自在事物的联系为前提，通过新型脑机接口，能够让患者通过脑电活动驱动外部设备，实现自主喝水等脑控功能，大幅提高了患者的生活自理能力，表明事物之间的联系具有普遍性，B、C选项正确。题干中所讲的联系的确是人们通过技术手段建立起来的，但不能由此得出事物之间的联系“都是”人为的，联系具有客观性，不以人的意志为转移，也存在自在联系，A选项错误。任何事物都与周围其他事物有着这样或那样的联系，但不意味着任何事物之间都有联系，联系具有条件性，D选项错误。"},{"chapter":"第一章","section":"多选","no":38,"stem":"蚯蚓因无专门的呼吸器官，其呼吸依赖皮肤与土壤孔隙中的氧气进行交换，雨水浸入土壤后往往会占据大部分孔隙，导致土壤缝隙里的氧气骤减。在土壤中感到室息的蚓，只能无奈地爬出地面吸取新鲜空气。研究发现，不同种类的蚯蚓忍耐缺氧的能力有所差异，耐缺氧能力差的参环毛蚓浸在水中仅能存活几小时；即便南美岸蚓这类能坚持数天的品种，也需要尽快找到“逃生出口”。所以，蚯蚓在雨后爬出地面，主要是由于土壤中存在缺氧危机。此外，雨水冲击往往导致枯枝落叶增加，湿润环境也会引起微生物大量繁殖，为蚯蚓提供了更多觅食的机会，这可能是蚯蚓雨后爬出地面的另一个驱动力。这一科学发现证明了（　　）","opts":{"A":"因果联系具有单一性，同一现象只有一种原因引起","B":"现象是本质的外在表现，蚯蚓爬出现象背后隐藏着缺氧与觅食的本质原因","C":"可能性与现实性相互依存，觅食机会作为潜在可能转化为蚯蚓爬出的现实驱动力","D":"偶然性通过必然性表现出来，蚯蚓爬出地面是缺氧条件下的必然选择"},"ans":"BC","point":"联系和发展的基本环节","explain":"“蚓爬出土面”是现象，其背后的“缺氧危机”和“觅食机会”是本质原因。现象是本质的外在表现，本质通过现象得以显现，二者体现了本质与现象的辩证关系。材料中“主要是由于土壤中存在缺氧危机”“可能是另一个驱动力”，明确区分了现象与背后的本质性原因。B选项正确。“觅食机会”在雨后湿润环境中是一种潜在的可能性，当蚯蚓实际因此爬出时，可能性转化为现实性，体现了可能性与现实性的相互依存和转化。题干中“可能是另一个驱动力”直接对应“潜在可能转化为现实”。C选项正确。材料明确指出蚯蚓爬出地面有两个原因：“土壤缺氧”和“觅食机会增加”，体现了因果联系的复杂性一一同一结果（爬出土面）由多种原因（必然的生存需求与可能的资源驱动）共同作用。符合“因果关系具有多样性”的哲学原理，驳斥了“单一因果论”。A选项错误。必然性要通过偶然性表现出来，D选项错误。"},{"chapter":"第一章","section":"多选","no":39,"stem":"苏轼在《琴诗》中写道：“若言琴上有琴声，放在匣中何不鸣？若言声在指头上，何不于君指上听？”这首诗蕴含的哲学寓意有（　　）","opts":{"A":"既要从实际出发，尊重客观规律，又要发挥人的主观能动性","B":"系统功能是各部分功能之和","C":"人的主观能动性的发挥需要具备一定的物质条件","D":"人的创新思维是正确发挥人的主观能动性的根本途径"},"ans":"AC","point":"主观能动性和客观规律性的辩证统一","explain":"诗中“琴”象征客观规律与物质条件，“手指”象征人的主观能动性。只有尊重琴的物理结构（如琴弦振动原理），并通过手指的技巧（如按弦、拨弦），才能产生音乐。这体现了“从实际出发”与“发挥能动性”的辩证统一。A选项正确。主观能动性的发挥必须依赖客观物质条件，例如，手指的弹奏技巧（主观能动性）需通过琴的物理结构（物质条件）才能转化为音乐。C选项正确。系统论认为整体功能大于部分功能之和，而非简单相加。琴与手指的结合产生了动听的琴声，而单独的琴或手指都无法实现这一功能。B选项错误。诗中未涉及“创新思维”，而是强调主客观条件的结合。正确发挥主观能动性的根本途径是实践，而非单纯的思维活动。D选项错误。"},{"chapter":"第一章","section":"多选","no":40,"stem":"列宁指出，就本来的意义来说，辩证法是研究对象的本质自身中的矛盾。他还认为，辩证法所说的矛盾是实际生活中的实际矛盾，即辩证的矛盾，而不是字面上的、臆造出来的矛盾。列宁的这些论述表明（　　）","opts":{"A":"客观辩证法与主观辩证法表现形式是一致的","B":"唯物辩证法是客观辩证法与主观辩证法的统一","C":"人类认识的辩证法是唯心主义的","D":"事物的矛盾具有客观性，不以人的意志为转移"},"ans":"BD","point":"客观辩证法与主观辩证法的统一","explain":"唯物辩证法既包含客观世界的矛盾运动（客观辩证法），也包含人类思维对矛盾的辩证把握（主观辩证法），二者在本质上统一于客观物质世界的矛盾规律。B选项正确。列宁明确反对“臆造矛盾”，强调矛盾是“实际生活中的实际矛盾”，直接体现矛盾的客观性。D选项正确。客观辩证法与主观辩证法的表现形式是不同的。客观辩证法采取外部必然性形式，不以人的意志为转移，是物质世界本身的联系和发展。主观辩证法则采取观念的、逻辑的形式，是同人类思维的自觉活动相联系的，是以概念为基础的辩证思维规律，是辩证法的科学体系。A选项错误。人类认识的辩证法属于唯物辩证法范畴，以客观矛盾为基础，而非唯心主义。C选项错误。"},{"chapter":"第一章","section":"多选","no":41,"stem":"在宇宙尺度上，各类天体的分布和运动状态完全是由所有物质的引力决定的。通过观测可见天体的分布和运动状态，科学家确定，目前可见天体提供的引力远远不能解释我们所观测到的事实。由此推测，星系中可能还存在大量的神秘物质，提供了额外的引力一一这种神秘物质就是暗物质。暗物质不发生电磁相互作用，无法发出、反射或吸收光，因此无法用常规的光学望远镜观测。实际上，暗物质尚未被人类既有的各种仪器所“看见”。虽然“看”不见也摸不着，但暗物质却很重要。作为宇宙中的“无形力量”，暗物质无处不在，和暗能量一起，占据着宇宙的大部分。暗物质提供的引力决定了宇宙物质的分布和演化。这启示我们（　　）","opts":{"A":"物质的唯一特性是客观实在性，不依赖于人的意识而存在","B":"人类的认识具有能动性，能够通过间接手段把握事物本质","C":"只有能被感官直接感知的事物才是客观存在的物质形态","D":"暗物质作为“神秘物质”，其存在证明了不可知论的合理性"},"ans":"AB","point":"唯物主义和唯心主义；可知论和不可知论；辩证法和形而上学；马克思主义的物质范畴及其理论意义","explain":"马克思主义物质观认为，物质是标志客观实在的哲学范畴，其唯一特性是客观实在性。暗物质虽无法被直接观测，但能通过引力效应证实其客观存在，不依赖于人的意识，体现了物质的客观实在性。故A选项正确。认识论强调认识具有能动性，人类可以通过实践（如观测可见天体运动）和理性思维（如推测暗物质引力）间接把握事物本质。暗物质的发现过程正是通过现象（引力效应）认识本质（暗物质存在）的体现。故B选项正确。C选项是对物质概念的机械理解。马克思主义认为，物质的客观实在性不依赖于感官直接感知，即使无法直接观测（如暗物质、磁场），也可通过间接手段（如效应、逻辑推理）确认其存在，因此C选项错误。不可知论认为世界无法被认识，而暗物质的推测和研究表明，人类通过科学手段能够不断深化对宇宙的认识，恰恰反驳了不可知论。D选项错误。"}]</script>
<script>
(function(){
  "use strict";
  var DATA = JSON.parse(document.getElementById("quizData").textContent);
  var STORE_KEY = "politics-quiz-720";
  var THEME_KEY = "politics-site-theme";
  var $ = function(id){ return document.getElementById(id); };

  var state = {
    chapter: "第一章",
    type: "all",
    order: "seq",          // seq | shuffle
    deck: [],
    pos: 0,
    picked: [],            // 多选题临时勾选
    records: load()
  };

  function qkey(q){ return q.chapter + "|" + q.section + "|" + q.no; }

  function load(){
    try{
      var raw = JSON.parse(localStorage.getItem(STORE_KEY));
      if(raw && typeof raw === "object" && !Array.isArray(raw)) return raw;
    }catch(e){}
    return {};
  }
  function save(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state.records)); }catch(e){}
  }

  function questions(){
    var list = DATA.filter(function(q){ return q.chapter === state.chapter; });
    if(state.type !== "all") list = list.filter(function(q){ return q.section === state.type; });
    return list;
  }

  function buildDeck(keepPos){
    var list = questions().slice();
    if(state.order === "shuffle"){
      for(var i = list.length - 1; i > 0; i--){
        var j = Math.floor(Math.random() * (i + 1));
        var t = list[i]; list[i] = list[j]; list[j] = t;
      }
    }
    state.deck = list;
    if(!keepPos) state.pos = 0;
    if(state.pos >= list.length) state.pos = Math.max(0, list.length - 1);
  }

  function current(){ return state.deck[state.pos]; }

  function isAnswered(q){ return !!state.records[qkey(q)]; }

  function verdictOf(q, picked){
    var key = picked.slice().sort().join("");
    var ans = q.ans.split("").sort().join("");
    return key === ans;
  }

  function renderChips(){
    var chapters = [];
    DATA.forEach(function(q){ if(chapters.indexOf(q.chapter) < 0) chapters.push(q.chapter); });
    var host = $("chapterChips");
    host.innerHTML = "";
    chapters.forEach(function(ch){
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = ch;
      b.className = ch === state.chapter ? "active" : "";
      b.onclick = function(){
        state.chapter = ch; state.order = "seq"; state.pos = 0; state.picked = [];
        buildDeck(false); renderChips(); render();
      };
      host.appendChild(b);
    });
    Array.prototype.forEach.call($("typeChips").children, function(b){
      b.classList.toggle("active", b.dataset.type === state.type);
    });
    $("shuffleBtn").classList.toggle("active", state.order === "shuffle");
    $("shuffleBtn").textContent = state.order === "shuffle" ? "按顺序" : "随机抽卡";
  }

  function renderStats(){
    var all = DATA.filter(function(q){ return q.chapter === state.chapter; });
    var done = 0, right = 0;
    all.forEach(function(q){
      var r = state.records[qkey(q)];
      if(r){ done++; if(r.ok) right++; }
    });
    $("statDone").textContent = done;
    $("statTotal").textContent = all.length;
    $("statRight").textContent = right;
    $("statRate").textContent = done ? Math.round(right / done * 100) + "%" : "—";
    $("statBar").style.width = all.length ? (done / all.length * 100) + "%" : "0";
  }

  function el(tag, cls, text){
    var node = document.createElement(tag);
    if(cls) node.className = cls;
    if(text != null) node.textContent = text;
    return node;
  }

  function render(){
    var host = $("cardHost");
    host.innerHTML = "";
    renderStats();
    var q = current();
    if(!q){
      host.appendChild(el("div", "empty", "当前筛选下没有题目。"));
      return;
    }
    var base = questions();
    var indexInDeck = state.pos + 1;
    var rec = state.records[qkey(q)];

    var card = el("article", "card");
    var meta = el("div", "card-meta");
    meta.appendChild(el("span", "tag" + (q.section === "多选" ? " multi" : ""), q.section + "选择题"));
    meta.appendChild(el("span", "", "第 " + indexInDeck + " / " + base.length + " 题"));
    meta.appendChild(el("span", "muted", q.chapter));
    if(q.section === "多选") meta.appendChild(el("span", "muted", "至少选两项"));
    card.appendChild(meta);

    var stem = el("p", "stem");
    stem.appendChild(el("span", "no", q.no + "."));
    stem.appendChild(document.createTextNode(q.stem));
    card.appendChild(stem);

    var opts = el("div", "opts");
    var picked = rec ? rec.picked.slice() : state.picked.slice();
    var locked = !!rec;
    "ABCD".split("").forEach(function(k){
      var body = q.opts[k];
      if(body == null) return;
      var b = el("button", "opt");
      b.type = "button";
      if(!q.opts[k]) b.hidden = true;
      b.appendChild(el("b", "", k));
      b.appendChild(el("span", "", body));
      if(picked.indexOf(k) >= 0) b.classList.add("picked");
      if(locked){
        var right = q.ans.indexOf(k) >= 0;
        if(right) b.classList.add("right");
        else if(picked.indexOf(k) >= 0) b.classList.add("wrong");
        b.disabled = true;
      }
      b.onclick = function(){ choose(k); };
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(locked){
      var ok = rec.ok;
      var v = el("div", "verdict " + (ok ? "ok" : "bad"));
      v.appendChild(el("b", "", ok ? "✓ 正确" : "✗ 错误"));
      v.appendChild(el("span", "", "你的选择"));
      v.appendChild(el("span", "ans", picked.join("") || "—"));
      v.appendChild(el("span", "", "正确答案"));
      v.appendChild(el("span", "ans", q.ans.split("").join("")));
      card.appendChild(v);
    }

    var actions = el("div", "actions");
    var explainBtn = el("button", "", "看解析");
    explainBtn.type = "button";
    explainBtn.id = "explainBtn";
    explainBtn.onclick = function(){ toggleExplain(q, locked, picked); };
    if(!locked) explainBtn.title = "先选答案再看解析";
    actions.appendChild(explainBtn);

    if(q.section === "多选" && !locked){
      var submit = el("button", "primary", "提交答案");
      submit.type = "button";
      submit.onclick = function(){ submitMulti(q); };
      submit.style.marginLeft = "auto";
      actions.appendChild(submit);
    }

    actions.appendChild(el("span", "spacer"));
    var next = el("button", "primary", state.pos + 1 >= base.length ? "回到第一题" : "下一题 →");
    next.type = "button";
    next.onclick = function(){ go(1); };
    actions.appendChild(next);
    card.appendChild(actions);

    var panel = el("section", "explain");
    panel.hidden = true;
    card.appendChild(panel);

    host.appendChild(card);

    if(locked && state.explainOpen === qkey(q)) toggleExplain(q, true, picked, true);
  }

  function toggleExplain(q, locked, picked, forceOpen){
    var panel = document.querySelector(".explain");
    if(!panel) return;
    if(panel.hidden === false && !forceOpen){ panel.hidden = true; state.explainOpen = null; return; }
    state.explainOpen = qkey(q);
    panel.innerHTML = "";
    panel.appendChild(el("h2", "", "答案解析"));
    var line = el("p", "answer-line", "正确答案");
    line.appendChild(el("b", "", q.ans));
    panel.appendChild(line);
    if(q.point){
      var pt = el("p", "point");
      pt.appendChild(el("span", "", "考点"));
      pt.appendChild(document.createTextNode(q.point));
      panel.appendChild(pt);
    }
    (q.explain || "").split(/\n+/).forEach(function(para){
      if(para.trim()) panel.appendChild(el("p", "explain-body", para.trim()));
    });
    panel.hidden = false;
  }

  function record(q, picked){
    state.records[qkey(q)] = { picked: picked, ok: verdictOf(q, picked), ts: Date.now() };
    save();
  }

  function choose(k){
    var q = current();
    if(!q || isAnswered(q)) return;
    if(q.section === "单选"){
      state.picked = [];
      record(q, [k]);
      state.explainOpen = null;
      render();
      return;
    }
    var at = state.picked.indexOf(k);
    if(at >= 0) state.picked.splice(at, 1);
    else state.picked.push(k);
    render();
  }

  function submitMulti(q){
    if(state.picked.length < 2){
      var tip = document.querySelector(".hint");
      if(!tip){
        tip = el("p", "hint", "多选题至少选两项，再点「提交答案」。");
        tip.style.cssText = "margin:14px 0 0;font-size:12px;color:var(--bad)";
        var actions = document.querySelector(".actions");
        actions.parentNode.insertBefore(tip, actions);
      }
      return;
    }
    var picked = state.picked.slice();
    state.picked = [];
    record(q, picked);
    state.explainOpen = null;
    render();
  }

  function go(step){
    var n = state.deck.length;
    if(!n) return;
    state.pos = (state.pos + step + n) % n;
    state.picked = [];
    render();
  }

  function setType(type){
    state.type = type;
    state.pos = 0; state.picked = []; state.explainOpen = null;
    buildDeck(false); renderChips(); render();
  }

  $("typeChips").addEventListener("click", function(e){
    var b = e.target.closest("button[data-type]");
    if(b) setType(b.dataset.type);
  });
  $("shuffleBtn").onclick = function(){
    state.order = state.order === "shuffle" ? "seq" : "shuffle";
    state.pos = 0; state.picked = []; state.explainOpen = null;
    buildDeck(false); renderChips(); render();
  };
  $("resetBtn").onclick = function(){
    if(!Object.keys(state.records).length) return;
    if(!confirm("清空本机的答题记录？正确率和错题标记都会重置。")) return;
    state.records = {}; save(); state.explainOpen = null; render();
  };

  // 深浅色：与全站共用 politics-site-theme
  function applyTheme(theme){
    document.body.dataset.theme = theme;
    $("themeBtn").textContent = theme === "dark" ? "浅色" : "深色";
  }
  (function initTheme(){
    var stored = null;
    try{ stored = localStorage.getItem(THEME_KEY); }catch(e){}
    if(stored === "dark" || stored === "light") return applyTheme(stored);
    if(stored === "auto" && window.matchMedia) return applyTheme(matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    applyTheme("light");
  })();
  $("themeBtn").onclick = function(){
    var next = document.body.dataset.theme === "dark" ? "light" : "dark";
    applyTheme(next);
    try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
  };

  document.addEventListener("keydown", function(e){
    if(e.target.matches("input,textarea")) return;
    var k = e.key.toUpperCase();
    if("ABCD".indexOf(k) >= 0){
      if(e.altKey || e.ctrlKey || e.metaKey) return;
      choose(k);
      e.preventDefault();
      return;
    }
    if(e.key === "Enter"){ go(1); e.preventDefault(); return; }
  });

  buildDeck(false);
  renderChips();
  render();
})();
</script>
</body>
</html>
