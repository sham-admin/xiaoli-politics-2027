    $("drawTitle").textContent = "抽卡 · " + (state.chapter ? chapterTitle(state.chapter) : (state.module + " 全部"));
    $("drawAvail").textContent = "可抽：单选 " + singles + " 题 / 多选 " + multis + " 题";
    var s = $("drawSingle"), m = $("drawMulti");
    s.max = singles; m.max = multis;
    if(singles === 0) s.value = 0;
    if(multis === 0) m.value = 0;
    if(+s.value > singles) s.value = Math.min(5, singles);
    if(+m.value > multis) m.value = Math.min(5, multis);
    $("drawPanel").hidden = false;
    (singles ? s : m).focus();
  }

  function shuffle(list){
    for(var i = list.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = list[i]; list[i] = list[j]; list[j] = t;
    }
    return list;
  }

  function startDraw(){
    closeInfo();
    var pool = chapterPool();
    var singles = pool.filter(function(q){ return q.section === "单选"; });
    var multis = pool.filter(function(q){ return q.section === "多选"; });
    var n = Math.max(0, Math.min(parseInt($("drawSingle").value, 10) || 0, singles.length));
    var m = Math.max(0, Math.min(parseInt($("drawMulti").value, 10) || 0, multis.length));
    if(n + m === 0){
      $("drawAvail").textContent = "单选和多选至少各抽 0 题以外，要选一个大于 0 的数量。";
      return;
    }
    var items = shuffle(shuffle(singles.slice()).slice(0, n).concat(shuffle(multis.slice()).slice(0, m)));
    state.session = { items: items, pos: 0, entries: {}, done: false };
    state.picked = [];
    state.explainOpen = null;
    $("drawPanel").hidden = true;
    renderChips();
    render();
  }

  function exitSession(){
    closeInfo();
    state.session = null;
    state.picked = [];
    state.explainOpen = null;
    buildDeck();
    renderChips();
    render();
  }

  function renderResult(){
    var s = state.session;
    var total = s.items.length;
    var done = 0, right = 0;
    var byType = { "单选": { d: 0, r: 0 }, "多选": { d: 0, r: 0 } };
    var wrong = [];
    s.items.forEach(function(q){
      var e = s.entries[qkey(q)];
      if(!e) return;
      done++;
      var t = byType[q.section];
      t.d++;
      if(e.ok){ right++; t.r++; }
      else wrong.push({ q: q, e: e });
    });
    var host = $("cardHost");
    host.innerHTML = "";
    var card = el("section", "card result");
    var score = el("div", "score");
    score.appendChild(document.createTextNode(done ? Math.round(right / done * 100) : 0));
    score.appendChild(el("small", "", "%"));
    card.appendChild(score);
    card.appendChild(el("p", "result-sub", "答对 " + right + " / " + done + " 题" + (done < total ? "（还有 " + (total - done) + " 题未答）" : "")));
    card.appendChild(el("p", "result-split",
      "单选 " + byType["单选"].r + "/" + byType["单选"].d +
      " · 多选 " + byType["多选"].r + "/" + byType["多选"].d +
      " · 本轮共 " + total + " 题"));

    if(wrong.length){
      var list = el("div", "wrong-list");
      list.appendChild(el("h3", "", "错题 " + wrong.length + " 道"));
      wrong.forEach(function(item){
        var row = el("div", "wrong-item");
        row.appendChild(el("span", "qno", item.q.chapter + " · " + item.q.section + " · 第 " + item.q.no + " 题"));
        row.appendChild(el("span", "pick", "你选 " + (item.e.picked.join("") || "—")));
        row.appendChild(el("span", "right", "正确 " + item.q.ans));
        row.appendChild(el("span", "excerpt", item.q.stem.slice(0, 46) + "…"));
        list.appendChild(row);
      });
      card.appendChild(list);
    }

    var actions = el("div", "actions");
    var again = el("button", "primary", "再抽一轮");
    again.type = "button";
    again.onclick = function(){ exitSession(); openDraw(); };
    var back = el("button", "", "返回题库");
    back.type = "button";
    back.onclick = exitSession;
    actions.appendChild(again);
    actions.appendChild(back);
    card.appendChild(actions);
    host.appendChild(card);
  }


  /* ---------- 答题卡 ---------- */

  function sheetItems(){
    if(state.session) return state.session.items;
    return state.deck;
  }

  function renderSheet(){
    var items = sheetItems();
    var cur = state.session ? state.session.pos : state.pos;
    var grid = $("sheetGrid");
    grid.innerHTML = "";
    if(!items.length){
      grid.appendChild(el("div", "sheet-empty", "当前没有题目。"));
      $("sheetSum").textContent = "";
      return;
    }
    var done = 0, right = 0;
    items.forEach(function(q, i){
      var rec = state.session ? state.session.entries[qkey(q)] : state.records[qkey(q)];
      var b = el("button", "", String(i + 1));
      b.type = "button";
      b.title = q.chapter + " " + q.section + " 第 " + q.no + " 题";
      if(rec){
        done++;
        if(rec.ok){ right++; b.classList.add("ok"); }
        else b.classList.add("bad");
      }
      if(i === cur) b.classList.add("current");
      if(q.section === "多选"){
        var d = el("span", "dot");
        d.title = "多选题";
        b.appendChild(d);
      }
      b.onclick = function(){ jumpTo(i); };
      grid.appendChild(b);
    });
    $("sheetTitle").textContent = state.session ? "答题卡 · 本轮" : "答题卡";
    $("sheetSum").textContent = "共 " + items.length + " 题 · 已答 " + done + " · 对 " + right + " · 错 " + (done - right);
  }

  function jumpTo(i){
    closeInfo();
    if(state.session){
      state.session.done = false;
      state.session.pos = i;
    } else {
      state.pos = i;
    }
    state.picked = [];
    state.explainOpen = null;
    closeSheet();
    render();
  }

  function openSheet(){
    renderSheet();
    $("sheet").classList.add("open");
    $("sheetBackdrop").classList.add("open");
    $("sheetBtn").setAttribute("aria-expanded", "true");
    document.body.classList.add("sheet-open");
  }
  function closeSheet(){
    $("sheet").classList.remove("open");
    $("sheetBackdrop").classList.remove("open");
    $("sheetBtn").setAttribute("aria-expanded", "false");
    document.body.classList.remove("sheet-open");
  }

  /* ---------- 事件绑定 ---------- */

  $("typeChips").addEventListener("click", function(e){
    if(state.session) return;
    var b = e.target.closest("button[data-type]");
    if(!b) return;
    state.type = b.dataset.type;
    state.pos = 0; state.picked = []; state.explainOpen = null;
    buildDeck(); renderChips(); render();
  });
  $("sheetBtn").onclick = function(){
    $("sheet").classList.contains("open") ? closeSheet() : openSheet();
  };
  $("modalClose").onclick = closeInfo;
  $("modalBackdrop").onclick = closeInfo;
  $("sheetClose").onclick = closeSheet;
  $("sheetBackdrop").onclick = closeSheet;
  $("drawBtn").onclick = function(){
    $("drawPanel").hidden ? openDraw() : ($("drawPanel").hidden = true);
  };
  $("drawCancel").onclick = function(){ $("drawPanel").hidden = true; };
  $("quitBtn").onclick = function(){
    if(confirm("结束本轮抽卡？已答的题目会保留在总进度里。")) exitSession();
  };
  $("drawStart").onclick = startDraw;
  $("resetBtn").onclick = function(){
    if(!Object.keys(state.records).length) return;
    if(!confirm("清空本机的答题记录？正确率和错题标记都会重置。")) return;
    state.records = {};
    if(state.session) state.session.entries = {};
    save(); state.explainOpen = null; render();
  };

  // 深浅色：与全站共用 politics-site-theme
  function applyTheme(theme){
    document.body.dataset.theme = theme;
    $("themeBtn").textContent = theme === "dark" ? "浅色" : "深色";
  }
  (function initTheme(){
    var stored = null;
    try{ stored = localStorage.getItem(THEME_KEY); }catch(e){}
    if(stored === "dark" || stored === "light") return applyTheme(stored);
    if(stored === "auto" && window.matchMedia) return applyTheme(matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    applyTheme("light");
  })();
  $("themeBtn").onclick = function(){
    var next = document.body.dataset.theme === "dark" ? "light" : "dark";
    applyTheme(next);
    try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
  };

  document.addEventListener("keydown", function(e){
    if(e.target.matches("input,textarea")) return;
    var k = e.key.toUpperCase();
    if("ABCD".indexOf(k) >= 0){
      if(e.altKey || e.ctrlKey || e.metaKey) return;
      choose(k);
      e.preventDefault();
      return;
    }
    if(e.key === "Escape"){
      if($("modal").classList.contains("open")){ closeInfo(); e.preventDefault(); return; }
      if($("sheet").classList.contains("open")){ closeSheet(); e.preventDefault(); }
      return;
    }
    if(e.key === "ArrowLeft"){ go(-1); e.preventDefault(); return; }
    if(e.key === "ArrowRight"){ go(1); e.preventDefault(); return; }
    if(e.key === "Enter"){
      if(!state.session) go(1);
      else if(current() && isAnswered(current())) go(1);
      e.preventDefault();
    }
  });

  buildDeck();
  renderChips();
  render();
})();
</script>
</body>
</html>
