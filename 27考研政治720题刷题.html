int":"近代中国国情和中国革命的时代特征","explain":"题干的这段话出自毛泽东在1925年撰写的《中国社会各阶级的分析》一文。原文的开始是这样的：“谁是我们的朋友，谁是我们的敌人？这个问题是革命的首要问题。”接着进一步指出：“中国过去一切革命斗争成效甚少，其基本原因，就是因为不能团结真正的朋友，以攻击真正的敌人。”这篇文章论述和回答的是革命中敌我友划分的基本依据和立场，应选D。选项A、B、C均不是本题所论述的内容。","notes":"①「D选项」《中国社会各阶级的分析》（1925年）：1）指出中国革命的首要问题是分清敌友2）论述了社会各阶级在中国革命中的地位和作用，阐明了中国革命的对象、动力和领导权等2②「D选项」分清敌友，这是革命的首要问题，正如毛泽东指出的：“谁是我们的敌人？谁是我们的朋友？这个问题是革命的首要问题。中国过去一切革命斗争成效甚少，其基本原因就是不能团结真正的朋友，以攻击真正的敌人。”近代中国社会的性质和主要矛盾，决定了中国革命的主要敌人就是帝国主义、封建主义和官像资本主义","tips":"","module":"毛概","title":"第二章 · 新民主主义革命理论"},{"chapter":"第二章","section":"单选","no":4,"stem":"在中国革命进程中，具有新民主主义革命和社会主义革命双重性质的事件是（　　）","opts":{"A":"没收地主阶级的土地归农民所有","B":"没收官僚资本归新民主主义国家所有","C":"没收帝国主义在华企业归新民主主义国家所有","D":"赎买民族工商业归人民民主专政国家所有"},"ans":"B","point":"新民主主义的基本纲领","explain":"在中国革命进程中，没收官僚资本，不仅具有新民主主义革命的性质，同时也具有社会主义革命的性质。没收官僚资本，是新民主主义革命的三大经济纲领之一，自然具有新民主主义革命的性质，是新民主主义经济纲领中的一项重要内容。没收官僚资本，使这种控制国家经济命脉的巨大经济力量集中到了人民民主专政的国家手中，成为对国民经济进行社会主义改造的具有决定意义的开端。因此，它也就具有了社会主义革命的性质。A选项和C选项都是反帝反封建的新民主主义革命的主要任务和内容，D选项对民族工商业进行和平赎买归人民民主专政国家所有是社会主义改造时期的革命任务，其性质是社会主义的。","notes":"新民主主义经济纲领的内容是，没收封建地主阶级的土地归农民所有，没收官僚资产阶级的垄断资本归新民主主义的国家所有，保护民族工商业，其中：1)没收封建地主阶级的土地归农民所有，是新民主主义革命的主要内容（“得民心者得天下”）2）没收官僚资本归新民主主义国家所有，是新民主主义革命的题中应有之义（官僚资本是买办的、封建的国家垄断资本主义）：没收官像资本，包含着新民主主义革命和社会主义革命的双重性质。通过没收官僚资本建立起来的具有社会主义性质的国营经济，在新民主主义社会的多种经济成分中居于领导地位3）保护民族工商业，是新民主主义经济纲领中极具特色的一项内容（随着斗争的发展，民族资产阶级也逐步向共产党靠拢，这种现象曾经被人称作“开万国未有之奇”）2「B选项」新民主主义革命任务是反帝反封反官资，社会主义革命任务是反资反私","tips":"","module":"毛概","title":"第二章 · 新民主主义革命理论"},{"chapter":"第二章","section":"单选","no":5,"stem":"土地革命战争时期，毛泽东指出：“一国之内，在四周白色政权的包围中，有一小块或若干小块红色政权的区域长期地存在，这是世界各国从来没有的事。这种奇事的发生，有其独特的原因。”红色政权能够存在和发展的根本原因是（　　）","opts":{"A":"中国是一个经济政治发展极端不平衡的半殖民地半封建大国","B":"国民革命的政治影响及良好的群众基础","C":"全国革命形势的继续发展","D":"相当力量的正式红军的存在以及共产党坚强有力的组织和正确领导"},"ans":"A","point":"新民主主义革命的道路","explain":"农村包围城市武装夺取政权理论是毛泽东思想形成的标志，这一问题在考研政治中已多次考查。当时的中国是一个半殖民地半封建的大国，经济政治发展不平衡。由于经济发展不平衡，没有统一的资本主义经济，自给自足的地方性农业经济广泛存在，这就为在农村建立革命根据地提供了必要的物质条件；政治发展的不平衡性，造成了广大农村是反动统治的薄弱环节，又使红色政权获得了深厚的阶级基础；由于几个帝国主义国家的间接统治及其相互间的矛盾和斗争，造成了军阀割据的局面和连绵不断的军阀混战，红色政权获得了存在和发展的缝隙；由于中国是一个大国，革命力量大有回旋余地。这是农村革命根据地能够存在和发展的根本原因。因此选A。B选项是农村革命根据地能够存在和发展的客观原因，C、D选项是农村革命根据地能够存在和发展的主观原因，但都非根本原因。","notes":"中国革命必须走农村包围城市、武装夺取政权的道路，是由中国的具体国情决定的\n②「A选项」红色政权存在的根本原因在于，中国半殖民地半封建社会的性质导致政治经济发展不平衡，白色政权间存在矛盾（近代中国是多个帝国主义间接统治的经济落后的半殖民地国家，社会政治经济发展极端不平衡，四分五裂，军阀割据，存在不少的统治薄弱环节，为党在农村开展革命斗争、建设革命根据地提供了缝隙和可能）权能否长期存在，取决于全国革命形势是否继续向前发展这样一个条件，只要反帝仍是全国革命形势的大趋势，那么小地方红色政权也能成为取得全国政权许多力量中间的一个力量）4「D选项」相当力量正式红军的存在，为农村革命根据地的创立、巩固和发展提供了坚强后盾（若没有正式红军的力量，只有一些地方赤卫队，怎么抵抗国民党反动派军队的进攻？）「D选项」党的有力领导及其政策的不错误，为农村革命根据地建设和发展提供了重要的主观条件","tips":"","module":"毛概","title":"第二章 · 新民主主义革命理论"},{"chapter":"第二章","section":"单选","no":6,"stem":"1930年1月，毛泽东在《星星之火，可以燎原》一文中写道：“我所说的中国革命高潮快要到来，决不是如有些人所谓‘有到来之可能”那样完全没有行动意义的、可望而不可即的一种空的东西。它是站在海岸遥望海中已经看得见杆尖头了的一只航船，它是立于高山之巅远看东方已见光芒四射喷薄欲出的一轮朝日，它是躁动于母腹中的快要成熟了的一个婴儿。”这段话是针对当时党内和红军中存在的（　　）","opts":{"A":"“在全国范围内先争取群众后建立政权”的理论","B":"“御敌于国门之外”的主张","C":"“一省或数省的首先胜利”的设想","D":"“红旗到底能打多久”的疑问"},"ans":"D","point":"新民主主义革命的道路","explain":"1927年大革命失败以后，党的工作重点由城市转入农村，中国革命暂时进入低潮，毛泽东同志领导建立了第一个农村革命根据地一一井冈山根据地。但是，大革命失败后一系列的挫折，如南昌起义、广州起义、秋收暴动，使得党内和红军内始终笼罩着一种悲观情绪。自从跟随朱德上井冈山不久，林彪的悲观情绪就开始流露出来，且越来越严重。林彪经常说些“天天吃南瓜，能打得天下吗？”“一个井冈山，十个井冈山也是空的”之类的牢骚话。与林彪同时战斗在井冈山的萧克后来回忆说：“在井冈山，林彪曾提出‘井冈山红旗到底能够打多久？，”作为一个高级指挥员，林彪这种右倾悲观主义的影响很恶劣。针对这种疑问，1930年1月5日，毛泽东为了批判党内存在的错误思想，在《星星之火，可以燎原》一文中进一步阐明了中国革命只能走与资本主义国家不同的道路，即后来的农村包围城市、武装夺取政权的道路。正确选项是D。A选项“在全国范围内先争取群众后建立政权”的理论，也是土地革命战争时期出现的一种错误思想，当时在革命道路问题上，党内一些人坚持“城市中心论”，毛泽东指出：“他们没有在游击区域内建立红色政权的深刻观念。认为在距离革命高潮尚远的时期做建立政权的艰苦工作为徒劳，而希望用比较轻便的流动游击方式去扩大政治的影响，等到全国各地争取群众的工作做好了，或做到某个地步了，然后来一个全国暴动，那时把红军的力量加上去，就成为全国形势的大革命这种全国范围的、包括一切地方的、先争取群众后建立政权的理论，我觉得是于中国革命不适合的。”A选项不符合题意。B选项“御敌于国门之外”的主张出自第五次反“围剿”开始时，临时中央的主要领导人废弃过去几次反“围剿”中行之有效的积极防御的方针，而实行军事冒险主义，主张和推行“御敌于国门之外”“短促突击”“六路分兵”、建立正规军打阵地战等一整套“左”倾教条主义的错误方针，最终导致第五次反“围剿”的失败和中央根据地的丧失。B选项不符合题意。C选项“一省或数省的首先胜利”的设想的背景是，1929年到1930年国际国内形势发生了一些重要变化，大革命失败后经过两年多的艰苦奋斗，党的组织和党的工作有了一定程度的恢复和发展，红军和革命根据地进一步巩固与扩大，中国革命事业开始走向复兴，但在总体上看还没有形成革命的高潮。在这种情况下，当时中央的一些领导人，逐步形成“左”倾冒险主义错误。在1928年中共六大前后，中央在共产国际的指导下，提出了一个准备以夺取中心城市来实现一省或几省首先胜利的武装总暴动方案。1930年3月初，中央的工作实际上由李立三主持。中原大战和湘粤桂边战争爆发后，李立三认为革命形势已经在全国成熟。在1930年6月11日召开的中央政治局会议上，通过由李立三起草的《目前政治任务的决议》，“左”倾冒险主义在中央取得了统治地位。“左”倾冒险主义错误在实际工作中的实施，使党和革命事业遭受了严重的损失。C选项不符合题意。","notes":"①「D选项」毛泽东为了批判党内存在的右倾悲观错误思想，在《星星之火，可以燎原》一文中进一步阐明了中国革命只能走与资本主义国家不同的道路，即后来的农村包围城市、武装夺取政权的道路","tips":"毛泽东通过生动的比喻和深刻的分析，针对的是当时党内普遍存在的“红旗到底能打多久”的悲观疑问。他通过批评这种悲观思想，提出了“星星之火，可以燎原”的著名论断，强调中国革命高潮即将到来的必然性。只要能记住这篇文章是在批判党内存在的右倾悲观错误思想，就可以选出D选项，因为只有D选项是悲观疑问。","module":"毛概","title":"第二章 · 新民主主义革命理论"},{"chapter":"第二章","section":"单选","no":7,"stem":"毛泽东在《《共产党人》发刊词》中指出，为取得新民主主义革命、社会主义革命和建设的伟大胜利，必须推进的一项“伟大的工程”是指（　　）","opts":{"A":"走农村包围城市的道路，夺取全国胜利","B":"建立并巩固抗日民族统一战线","C":"建设广大群众性的马克思主义政党","D":"建立新民主主义的新国家、新社会"},"ans":"C","point":"新民主主义革命的三大法宝","explain":"高度重视和不断加强党的建设，是中国共产党从小到大、由弱到强，从挫折中奋起、在战胜困难中不断成熟的一大法宝，也是党领导的伟大事业不断取得胜利的根本保证。以毛泽东为主要代表的中国共产党人，在《《共产党人》发刊词》中明确提出了党的建设是一项伟大工程，并在实践中创造了许多经验，为取得新民主主义革命、社会主义革命和建设的伟大胜利提供了根本保障。应选C。A选项讲的是革命道路，B选项讲的是新民主主义革命的三大法宝之一，D选项讲述的是革命前途。","notes":"《《共产党人）发刊词》（1939年）：1）第一次提出党在革命中的三大法宝，即统一战线、武装斗争、党的建设2）第一次明确提出中国共产党自身建设的目标，即把中国共产党建设成为全范围的、广大群众思想上政治上组织上全巩固的马克思主义政党，毛泽东把建设这样的党称之为“伟大的工程”3）指出统一战线和武装斗争是中国共产党领导的新民主主义革命的两个基本特点，是中国革命的两个武器，党组织是掌握这两个武器的英勇战士","tips":"","module":"毛概","title":"第二章 · 新民主主义革命理论"},{"chapter":"第二章","section":"单选","no":8,"stem":"毛泽东在《中国革命和中国共产党》中论述了民主革命和社会主义革命的关系，他指出：“民主革命是社会主义革命的必要准备，社会主义革命是民主革命的必然趋势。”这两个革命阶段能够有机连接的原因是（　　）","opts":{"A":"资本主义道路在中国走不通","B":"俄国十月革命为中国提供了经验","C":"民主革命中包含了社会主义因素","D":"中国国情决定中国革命必须分两步走"},"ans":"C","point":"新民主主义革命的总路线","explain":"毛泽东在《中国革命和中国共产党》中论述了民主革命和社会主义革命的关系、他指出：“民主革命是社会主义革命的必要准备，社会主义革命是民主革命的必然趋势”。这是因为中国革命的全部结果是：一方面有资本主义因素的发展，另一方面有社会主义因素的发展。在新民主主义革命过程中形成和发展起来的新民主主义政治、经济、文化，都是工人阶级领导的，因而都具有社会主义因素。如中国共产党的政治领导、社会主义国营经济的领导地位、马克思主义在思想文化领域中的指导地位等。这些因素的增长，为新民主主义革命胜利以后向社会主义转变创造了必要的条件。所以本题正确选项是C“民主革命中包含了社会主义因素”。A选项“资本主义道路在中国走不通”并未说明为什么中国通过新民主主义革命，会走向社会主义。B选项“俄国十月革命为中国提供了经验”也不符合题意。十月革命是社会主义革命，而中国革命分为民主革命和社会主义革命两个阶段，在革命发展阶段问题上，十月革命没有为中国革命提供成功的经验。D选项“中国国情决定中国革命必须分两步走”并没有揭示新民主主义革命与社会主义革命之间紧密衔接的内在关系，它谈的是两个革命阶段的区别。","notes":"中国革命分两步走，第一步是民主革命，第二步是社会主义革命关于新民主主义革命与社会主义革命关系的观点中国革命分两步走既看到区别又看到联系正确二次革命论只看到区别未看到联系错误(右倾)一次革命论只看到联系未看到区别错误（“左”倾）（无间断革命、毕其功于一役）","tips":"D选项描述的是中国革命的阶段性特征，但并未解释为什么这两个阶段能够有机连接，一定要注意主义革命之间紧密衔接的内在关系，它谈的是两个革命阶段的区别。","module":"毛概","title":"第二章 · 新民主主义革命理论"},{"chapter":"第二章","section":"单选","no":9,"stem":"中国新民主主义革命时期的统一战线包含着两个联盟。其中基本的、主要的联盟是（　　）","opts":{"A":"工人阶级同城市小资产阶级的联盟","B":"以工农联盟为主体的工人阶级同农民、小资产阶级等其他劳动人民的联盟","C":"以工农联盟为主体的工人阶级同农民、小资产阶级和民族资产阶级的联盟","D":"工人阶级同可以合作的非劳动人民的联盟"},"ans":"B","point":"","explain":"新民主主义革命的三大法宝新民主主义革命时期的革命统一战线包含着两个联盟：一是以工农联盟为主体的工人阶级与农民、小资产阶级等其他劳动人民的联盟。二是工人阶级同可以合作的非劳动人民的联盟，主要是和民族资产阶级的联盟，也包含特定历史条件下同一部分地主阶级、带买办性的大资产阶级的联盟。在这两个联盟中，第一个联盟基本上是劳动者之间的联盟，是基本的、主要的。应选B。A和C选项属于对两个联盟的错误表述。A选项在第一个联盟方面表述不完整，而C选项表述的是民主革命的基本动力，不能理解为第二个联盟。掌握第二个联盟概念的关键在于要把握革命的主体是工人阶级，不是笼统的劳动者联盟。如果把第二个联盟表述为“工人阶级和劳动人民同一切可以合作的非劳动人民之间的联盟”也是错误的。D选项不符合题目要求。","notes":"①「B选项」从总体上讲，中国共产党领导的革命统一战线，包含着两个联盟：1）工人阶级同农民阶级、广大知识分子及其他劳动者的联盟，主要是工农联盟。这个联盟是统一战线的基础，是基本的、主要的2）工人阶级和非劳动人民的联盟，主要是与民族资产阶级的联盟","tips":"","module":"毛概","title":"第二章 · 新民主主义革命理论"},{"chapter":"第二章","section":"单选","no":10,"stem":"1939年毛泽东在《《共产党人》发刊词》一文中，总结了中国革命两次胜利和两次失败的经验教训，揭示了中国革命发展的客观规律，指出中国革命的两个基本特点，我们战胜敌人的两个基本武器是（　　）","opts":{"A":"土地革命和根据地建设","B":"党的建设和群众路线","C":"实事求是和独立自主","D":"统一战线和武装斗争"},"ans":"D","point":"新民主主义革命的三大法宝","explain":"统一战线能够团结一切可以团结的力量，最大限度地扩大革命阵营，汇聚各方面的力量共同反对敌人；武装斗争是中国革命的主要斗争形式，以革命的武装反对反革命的武装，是夺取政权的重要手段。二者相互配合，统一战线为武装斗争提供支持和力量源泉，武装斗争为统一战线的巩固和发展提供保障，是战胜敌人的两个基本武器，所以D选项正确A选项土地革命是中国共产党在革命根据地开展的重要工作，通过没收地主土地分给农民，调动农民的革命积极性；根据地建设包括政治、经济、文化等方面建设，为革命提供了坚实的后方基地。但土地革命和根据地建设是在统一战线和武装斗争的基础上进行的，是中国革命过程中的重要举措，并非战胜敌人的两个基本武器，所以A选项错误。B选项党的建设是中国革命取得胜利的重要保证，通过加强党的思想建设、组织建设、作风建设等，提高党的凝聚力和战斗力；群众路线是党的根本工作路线，强调一切为了群众，一切依靠群众，从群众中来，到群众中去。党的建设和群众路线对于革命胜利至关重要，但不是战胜敌人的两个基本武器，所以B选项错误。C选项实事求是是马克思主义的精髓，是中国共产党的思想路线的核心，强调从实际出发，理论联系实际；独立自主是中国革命和建设的基本立足点，强调依靠自己的力量进行革命和建设。实事求是和独立自主是中国共产党在革命和建设过程中遵循的重要原则和方法，并非战胜敌人的两个基本武器，所以C选项错误。","notes":"指出统一战线、武装斗争、党的建设是中国共产党在中国革命中战胜敌人的三个主要法宝\n②「D选项」三大法宝的关系：毛泽东指出，统一战线和武装斗争是中国革命的两个基本特点，是战胜敌人的两个基本武器。统一战线是实行武装斗争的统一战线，武装斗争是统一战线的中心支柱，实质上为工人阶级领导的农民战争。党的组织则是掌握统一战线和武装斗争这两个武器以实行对敌冲锋陷阵的英勇战士","tips":"","module":"毛概","title":"第二章 · 新民主主义革命理论"},{"chapter":"第二章","section":"单选","no":11,"stem":"1948年10月2日，刘少奇同志在同华北记者团谈话时，讲了一个希腊神话故事：巨人安泰是地神之子，他在同对手搏斗时，只要身不离地，就能从大地母亲那里不断吸取力量，所向无敌；但是，只要他一离开大地，就会毫无力量。他的对手赫拉克勒斯发现了他的这一特征，在一次搏斗中突然把他举到半空中将他扼死。刘少奇借用这一神话故事强调中国共产党始终要（　　）","opts":{"A":"坚持理论联系实际","B":"保持党的方针政策的正确","C":"保持对敌人的高度警惕","D":"保持同人民群众的血肉联系"},"ans":"D","point":"新民主主义革命的三大法宝","explain":"刘少奇同志将中国共产党比喻成巨人安泰，将群众比喻成大地母亲。中国共产党的群众路线是相信群众、依靠群众，从群众中来，到群众中去，保持与人民群众的密切联系。因此D选项正确。A选项“坚持理论联系实际”指的是要求我们既重视用理论指导实践，又重视实践对理论的基础作用，不符合题意。B选项“保持党的方针政策的正确”表述过于笼统，并没有具体指出什么样的方针政策才是正确的。历史实践证明党的理论政策，只有顺民意、谋民利、得民心，得到人民群众的支持和拥护，才能永远立于不败之地。C选项“保持对敌人的高度警惕”没有把握题意的主旨。","notes":"","tips":"安泰的力量来源于与大地的接触，一旦脱离则失去生命力。这一比喻直接指向党与群众的关系，只有始终与群众紧密联系，党才能获得力量源泉。","module":"毛概","title":"第二章 · 新民主主义革命理论"},{"chapter":"第二章","section":"单选","no":12,"stem":"“房子是应该经常打扫的，不打扫就会积满了灰尘，脸是应该经常洗的，不洗也就会灰尘满面。我们同志的思想、我们党的工作，也会沾染灰尘的，也应该打扫和洗涤。”这段话形象地反映了中国共产党在长期革命实践中形成的（　　）","opts":{"A":"密切联系群众的优良作风","B":"批评与自我批评的优良作风","C":"理论联系实际的优良作风","D":"艰苦奋斗的优良作风"},"ans":"B","point":"新民主主义革命的三大法宝","explain":"1945年4月24日，毛泽东在中共七大上作题为《论联合政府》的政治报告，概括了党的三大优良作风，他指出：“以马克思列宁主义的理论思想武装起来的中国共产党，在中国人民中产生了新的工作作风，这主要的就是理论和实践相结合的作风，和人民群众紧密地联系在一起的作风以及自我批评的作风…有无认真的自我批评，也是我们和其他政党互相区别的显著的标志之一。我们曾经说过，房子是应该经常打扫的，不打扫就会积满了灰尘；脸是应该经常洗的，不洗也就会灰尘满面。我们同志的思想，我们党的工作，也会沾染灰尘的，也应该打扫和洗涤。“流水不腐，户枢不蠹’，是说它们在不停的运动中抵抗了微生物或其他生物的侵蚀。对于我们，经常地检讨工作，在检讨中推广民主作风，不惧怕批评和自我批评，实行‘知无不言，言无不尽，‘言者无罪，闻者足戒”“有则改之，无则加勉”这些中国人民的有益的格言，正是抵抗各种政治灰尘和政治微生物侵蚀我们同志的思想和我们党的肌体的唯一有效的方法。”应选B。A选项“密切联系群众的优良作风”、C选项“理论联系实际的优良作风”也是中共七大概括的党的三大优良作风，但不是题干材料表明的内容。D选项“艰苦奋斗的优良作风”是毛泽东同志在党的七届二中全会上指出的。A、C、D选项均不符合题意。","notes":"1949年3月在河北省平山县西柏坡村召开了中共七届二中全会，提出“两个务必”思想：务必使同志们继续地保持谦虚、谨慎、不骄、不躁的作风，务必使同志们继续地保持艰苦奋斗的作风“两个务必”的思想，包含着对我国几千年历史治乱规律的深刻借鉴，包含着对我们党艰苦卓绝奋斗历程的深刻总结，包含着对胜利了的政党永葆先进性和纯洁性、对即将诞生的人民政权实现长治久安的深刻忧思，包含着对我们党坚持全心全意为人民服务根本宗旨的深刻认识，思想意义和历史意义十分深远3「B选项」党在领导新民主主义革命过程中的三大优良作风（1945年中共七大）：1）理论联系实际（放在首位）2）密切联系群众3）批评与自我批评真题思维点技题干中“房子要经常打扫、脸要经常洗”的生动比喻，形象地说明了批评与自我批评对于清除党内思想灰尘、保持党的纯洁性的重要作用。","tips":"","module":"毛概","title":"第二章 · 新民主主义革命理论"},{"chapter":"第二章","section":"多选","no":13,"stem":"在半殖民地半封建的近代中国，社会矛盾呈现出错综复杂的状况。在诸多社会矛盾中，占支配地位的主要矛盾是帝国主义和中华民族的矛盾、封建主义和人民大众的矛盾，而帝国主义和中华民族的矛盾，又是各种矛盾中最主要的矛盾。近代中国社会的性质和主要矛盾，决定了近代中国革命的根本任务是（　　）","opts":{"A":"推翻帝国主义、封建主义和官僚资本主义的统治","B":"变革阻碍生产力发展的生产关系","C":"确立社会主义政治经济制度","D":"为建设富强民主的国家、改善人民生活扫清障碍，创造必要的前提"},"ans":"ABD","point":"新民主主义革命的总路线","explain":"近代中国社会的性质和主要矛盾，决定了近代中国革命的根本任务是推翻帝国主义、封建主义和官僚资本主义的统治，变革阻碍生产力发展的生产关系，为建设富强民主的国家、确立人民当家作主的政治制度、改善人民生活，扫清障碍、创造必要的前提。C选项是干扰项，建立社会主义制度是社会主义革命的任务。","notes":"①「C选项」近代中国革命的根本任务属于新民主主义革命阶段，而“确立社会主义政治经济制度”是社会主义革命阶段的任务中国近代社会的主要矛盾决定了两大历史任务：争得民族独立和人民解放，实现国家富强和人民富裕。在两大历史任务中，前一个任务为后一个任务扫清障碍，为实现中华民族伟大复兴的中国梦创造必要前提，后一个任务是前一个任务的最终目的和必然要求。要争得民族独立和人民解放，必须首先进行反帝反封建的民主革命\n③「A、B、D选项新民主主义革命是无产阶级领导的，人民大众的，反对帝国主义、封建主义和官像资本主义的革命，其目标是建立“无产阶级领导的各革命阶级的联合专政”。随着国民党反动统治的覆灭和中华人民共和国的成立，中国新民主主义革命（中国革命）赢得了基本的胜利","tips":"","module":"毛概","title":"第二章 · 新民主主义革命理论"},{"chapter":"第二章","section":"多选","no":14,"stem":"在十月革命的影响下，1919年中国爆发五四运动。在五四运动中，工人阶级（　　）","opts":{"A":"开始以独立的政治力量登上历史舞台","B":"开始与农民阶级紧密结合成为革命的主力军","C":"由自在阶级转变为自为阶级","D":"开始成为中国革命的领导力量"},"ans":"ACD","point":"新民主主义革命的总路线","explain":"在十月革命的影响下，1919年中国爆发五四运动，工人阶级开始以独立的政治力量登上历史舞台，由自在阶级转变为自为阶级，开始成为中国革命的领导力量。工人阶级与农民阶级紧密结合主要是在后续的革命进程中逐渐深入的，且农民是中国革命的主力军。B为干扰项。","notes":"①「A选项」五四运动，中国工人阶级开始以独立的姿态登上历史舞台，中国人民对帝国主义的认识进入理性认识阶段最早出现的一个新的社会阶级，是新的社会生产力的代表，是近代中国最进步的阶级，是中国革命的领导力量\n③「B选项」农民是中国革命的主力军，其中的贫雇农是无产阶级最可靠的同盟军，而中农是无产阶级可靠的同盟军。农民问题是中国革命的基本问题，新民主主义革命实质上就是中国共产党领导下的农民革命，中国革命战争实质上就是党领导下的农民战争自在阶级：指阶级觉悟不高，尚未建立自己的政党组织，对资本主义社会的认识处于感性认识阶段的无产阶级自为阶级：指阶级觉悟提高，建立了自己的政党组织，并在革命理论指导下，对资本主义社会的认识达到理性认识阶段的无产阶级","tips":"","module":"毛概","title":"第二章 · 新民主主义革命理论"},{"chapter":"第二章","section":"多选","no":15,"stem":"毛泽东在《新民主主义论》中指出：“既然中国社会还是一个殖民地、半殖民地、半封建的社会，既然中国革命的敌人主要的还是帝国主义和封建势力，既然中国革命的任务是为了推翻这两个主要敌人的民族革命和民主革命；而推翻这两个敌人的革命，有时还有资产阶级参加，即使大资产阶级背叛革命而成了革命的敌人，革命的锋芒也不是向着一般的资本主义和资本主义的私有财产，而是向着帝国主义和封建主义。”这说明决定了中国革命的性质是资产阶级民主主义革命的是（）","opts":{"A":"中国革命的领导者是无产阶级","B":"近代中国半殖民地半封建社会的性质","C":"中国革命的历史任务","D":"中国革命属于世界无产阶级社会主义革命的一部分"},"ans":"BC","point":"新民主主义革命的总路线","explain":"题干中“既然中国革命的敌人主要的还是帝国主义和封建势力，既然中国革命的任务是为了推翻这两个主要敌人的民族革命和民主革命”就表明了近代中国半殖民地半封建社会的性质和中国革命的历史任务，决定了中国革命的性质是资产阶级民主主义革命。中国革命的领导者是无产阶级，中国革命属于世界无产阶级社会主义革命的一部分是新民主主义革命“新”的表现，而不是这场革命性质的决定因素。A、D是干扰项。","notes":"五四运动标志着新民主主义革命的开端，护法运动的失败标志着旧民主主义革命的终结\n②「A选项」新民主主义和旧民主主义区别：旧民主主义革命的领导者是资产阶级，新民主主义领导者是无产阶级，根本标志在于领导权掌握在资产阶级还是无产阶级手中\n③「B、C选项」新民主主义革命性质依然是资产阶级民主主义革命（社会性质、革命对象、革命任务决定），但领导阶级变了，所以叫“新”4「D选项」新民主主义革命属于世界无产阶级社会主义革命的一部分，但它的性质是资产阶级民主革命","tips":"","module":"毛概","title":"第二章 · 新民主主义革命理论"},{"chapter":"第二章","section":"多选","no":16,"stem":"新民主主义的政治、新民主主义的经济和新民主主义的文化相结合，就是新民主主义的共和国。指导新民主主义共和国进行经济建设的根本方针是（　　）","opts":{"A":"用和平赎买的方法改造资本主义工商业","B":"没收封建地主阶级的土地归农民所有","C":"没收官僚资产阶级的垄断资本归新民主主义国家所有","D":"保护民族工商业"},"ans":"BCD","point":"新民主主义的基本纲领","explain":"新民主主义的经济纲领是：没收封建地主阶级的土地归农民所有，没收官僚资产阶级的垒断资本归新民主主义的国家所有，保护民族工商业。这三大经济纲领是指导新民主主义共和国进行经济建设的根本方针。应选B、C、D。用和平赎买的方法改造资本主义工商业是社会主义改造时期采取的政策。","notes":"②「A选项」新民主主义革命任务是反帝反封反官资，社会主义革命任务是反资反私","tips":"","module":"毛概","title":"第二章 · 新民主主义革命理论"},{"chapter":"第二章","section":"多选","no":17,"stem":"一个政党的纲领，是公开树立起来的一面旗帜，是表明党的性质的重要标志。1940年，毛泽东在《新民主主义论》中，阐述了新民主主义的政治、经济和文化。1945年，他在党的七大所作的政治报告《论联合政府》中，把新民主主义的政治、经济和文化进行了具体阐述，形成了新民主主义的基本纲领。这一纲领（　　）","opts":{"A":"是新民主主义革命总路线的具体展开和体现","B":"把新民主主义的政治、经济和文化与党的基本纲领联系起来","C":"为新民主主义革命指明了具体奋斗目标","D":"直接指导了社会主义制度的确立"},"ans":"ABC","point":"新民主主义的基本纲领","explain":"1945年，毛泽东在党的七大所作的政治报告《论联合政府》中，进一步把新民主主义的政治、经济和文化与党的基本纲领联系起来，进行了具体阐述，形成了新民主主义的基本纲领。新民主主义的基本纲领是新民主主义革命总路线的进一步展开和体现，为新民主主义革命指明了具体奋斗目标。A、B、C选项正确。D选项新民主主义基本纲领指导的是新民主主义革命，不是直接指导社会主义制度的建立。","notes":"①「D选项」新民主主义基本纲领指导的是新民主主义革命，并不直接指导社会主义革命","tips":"","module":"毛概","title":"第二章 · 新民主主义革命理论"},{"chapter":"第二章","section":"多选","no":18,"stem":"近代中国社会的阶级结构呈现“两头小中间大”的特点，其中“两头”指（　　）","opts":{"A":"无产阶级","B":"农民阶级","C":"地主大资产阶级","D":"城市小资产阶级"},"ans":"AC","point":"新民主主义革命的三大法宝","explain":"毛泽东在抗日战争时期撰写的一篇文章中分析了中国社会的阶级力量状况，指出：“中国社会是一个两头小中间大的社会，无产阶级和地主大资产阶级都只占少数，最广大的人民是农民、城市小资产阶级以数毕竟较少，力量较弱。地主大资产阶级虽然人数也不多，但由于掌握着全国性政权，又有帝国主义的支持，便成为无产阶级强大的敌人。在这种情况下，农民、城市小资产阶级以及其他中间阶级，往往在革命中具有举足轻重的作用。无产阶级要战胜强大的敌人，必须同农民、城市小资产阶级和其他中间阶级结成广泛的革命统一战线。故A和C选项正确。农民、城市小资产阶级属于“中间部分”。B、D选项不符合题意。","notes":"①「A、C选项」中国社会是一个两头小中间大的社会，无产阶级和地主大资产阶级都只占少数，最广大的人民是农民、城市小资产阶级以及其他的中间阶级","tips":"","module":"毛概","title":"第二章 · 新民主主义革命理论"},{"chapter":"第二章","section":"多选","no":19,"stem":"全民族抗战开始后，党的队伍空前壮大。至1938年底，党员人数从抗战初期4万多增加到50多万，中国共产党已经成为具有广泛群众基础的全国性大党。但是，党的建设也面临一些特殊困难。为此，1939年8月，中央政治局作出《关于巩固党的决定》，指出：在思想上政治上组织上巩固党，成为我们今天极端严重的任务。两个月后，毛泽东在为《共产党人》杂志写的发刊词中提出要把“建设一个全国范围的、广大群众性的、思想上政治上组织上完全巩固的布尔什维克化的中国共产党”的任务，作为党的建设“伟大的工程”来进行。中国共产党在推进党的建设这一“伟大的工程”中，面临的特殊困难是（　　）","opts":{"A":"党的理论长时期准备不足","B":"中国社会封建思想的影响","C":"党长期在农村发展，且处于战争环境之中，容易组织松散、软弱散","D":"共产国际在一段时期内存在的教条主义倾向对中国共产党的影响"},"ans":"ABCD","point":"新民主主义革命的三大法宝","explain":"半殖民地半封建的中国，是一个以农民为主体的国度，无产阶级人数很少，农民和其他小资产阶级占人口的大多数，农民和小资产阶级出身的党员占多数。各种非无产阶级思想，特别是小资产阶级思想必然反映到党内来，党内无产阶级思想和非无产阶级思想之间的矛盾成为党内思想上的主要矛盾。“有许多党员，在组织上入了党，思想上并没有完全入党，甚至完全没有入党。”加之党长期在农村发展，且处于战争环境之中，如果不加强党的组织建设、作风建设，党就会组织松散、软弱散，不可能成为坚强有力的战斗堡垒，不可能具备优良的作风，更不可能赢得人民群众的支持并取得革命胜利。此外，共产国际在一段时期内影响，甚至控制着中国共产党，党组织在一段时期内存在的教条主义倾向自然给中国共产党的自身建设带来特殊困难。这些情况决定了要建设一个广大群众性的、马克思主义的无产阶级政党，是一项艰巨的任务，必须不断地结合革命形势的发展需要加强党的建设。A、B、C、D选项均符合题意。","notes":"","tips":"由于理论准备不足，党内出现了主观主义、宗派主义和党八股等问题，影响了党的思想统一和政治坚定。1941年开展的整风运动正是为了解决这些问题，通过破除教条主义的束缚，确立了实事求是的思想路线。","module":"毛概","title":"第二章 · 新民主主义革命理论"},{"chapter":"第二章","section":"多选","no":20,"stem":"毛泽东在《《共产党人》发刊词》中阐明了中国共产党在中国革命中的几个基本问题，认为正确地理解了这些问题及其相互关系，就等于正确地领导了全部中国革命。这些基本问题是（　　）","opts":{"A":"革命转变问题","B":"统一战线问题","C":"武装斗争问题","D":"党的建设问题"},"ans":"BCD","point":"新民主主义革命的三大法宝","explain":"毛泽东在《《共产党人》发刊词》一文中，总结了中国革命两次胜利和两次失败的经验教训，揭示了中国革命发展的客观规律，提出了统一战线、武装斗争、党的建设是党在中国革命中战胜敌人的三个主要法宝。“正确地理解了这三个问题及其相互关系，就等于正确地领导了全部中国革命。”A选项题干未有涉及","notes":"1「B、C、D选项」毛泽东于1939年10月撰写的《共产党人〉发刊词》，总结了中国共产党成立以来的历史经验，指出统一战线、武装斗争、党的建设是中国共产党在中国革命中战胜敌人的三个主要法宝三大法宝的关系：毛泽东指出，统一战线和武装斗争是中国革命的两个基本特点，是战胜敌人的两个基本武器。统一战线是实行武装斗争的统一战线，武装斗争是统一战线的中心支柱，实质上为工人阶级领导的农民战争。党的组织则是掌握统一战线和武装斗争这两个武器以实行对敌冲锋陷阵的英勇战士","tips":"","module":"毛概","title":"第二章 · 新民主主义革命理论"},{"chapter":"第二章","section":"多选","no":21,"stem":"瓦窑堡会议后，毛泽东认为，“国事是国家的公事，不是一党一派的私事”。他有时一天写七八封致国民党将领和要员的书信，动员他们联合抗日。如致朱绍良的信中指出国共两党团结对敌的必要性，“十年战，随处与先生相遇，可谓大有缘矣！然蚌相持，渔人伺于其侧，为蚌者不亦危乎？付上共产党致国民党书，为国家民族谋，亦为先生谋也。两党两军之间，无胶固不解之冤，有同舟共济之责”，期望双方“抛嫌释怨，以对付共同之敌”。在新民主主义革命时期，以国共合作为基础所建立的统一战线有（　　）","opts":{"A":"国民革命联合战线","B":"工农民主统一战线","C":"抗日民族统一战线","D":"人民民主统一战线"},"ans":"AC","point":"新民主主义革命的三大法宝","explain":"在新民主主义革命时期，国共两党有过两次合作：一是大革命时期的第一次国共合作，建立了国民革命联合战线；二是在抗战时期，建立了抗日民族统一战线。题干材料亦有体现。因此，A、C备选项符合题意。B、D备选项分别是在土地革命战争和解放战争时期建立的统一战线，当时处于国共两党对抗阶段，不符合题意。","notes":"关于新民主主义革命时期不同统一战线统一战线主要目标1924—1927国民革命联合战线（第一次国共合作）反对帝国主义支持下的北洋军阀1927—1937工农民主统一战线反对封建压迫和国民党新军阀1937—1945抗日民族统一战线（第二次国共合作）反对日本帝国主义19461949人民民主统一战线反对美帝国主义支持下的国民党反动派","tips":"","module":"毛概","title":"第二章 · 新民主主义革命理论"},{"chapter":"第三章","section":"单选","no":1,"stem":"毛泽东指出：“从中华人民共和国成立，到社会主义改造基本完成，这是一个过渡时期。”在这个过渡时期，我国社会的性质是（　　）","opts":{"A":"半殖民地半封建社会","B":"资本主义社会","C":"新民主主义社会","D":"社会主义社会"},"ans":"C","point":"新民主主义社会是一个过渡性的社会","explain":"从中华人民共和国成立到1956年底社会主义改造基本完成，是我国从新民主主义到社会主义过渡的时期。这一时期，我国社会的性质是新民主主义社会。新民主主义社会不是一个独立的社会形态，而是由新民主主义向社会主义转变的过渡性的社会形态。应选C。A选项是新中国成立前的社会性质；B选项不符合我国历史发展阶段；D选项是1956年社会主义改造完成后的社会性质。","notes":"①「B选项」近代中国没有经过典型的资本主义阶段而直接过渡到社会主义社会，中国的民族资本主义经济没有也不可能成为中国社会经济的主要形式\n②「C选项」从中华人民共和国成立到社会主义改造基本完成，是我国从新民主主义到社会主义的过渡时期。这一时期，我国社会的性质是新民主主义社会。新民主主义社会不是一个独立的社会形态，而是由新民主主义向社会主义转变的过渡性社会形态\n③「A选项」从1840年鸦片战争开始到1949年中华人民共和国成立之前的近代中国，是半殖民地半封建社会。鸦片战争前的中国社会是封建社会。鸦片战争以后，独立的中国逐步变成半殖民地的中国，封建的中国逐步变成半封建的中国\n④「D选项」1956年底，我国对农业、手工业和资本主义工商业的社会主义改造基本完成，社会主义公有制已成为我国社会的经济基础，标志着中国历史上长达数千年的阶级剥削制度的结束和社会主义基本制度的确立，其中建立起社会主义经济制度是我国进入社会主义社会最主要的标志","tips":"","module":"毛概","title":"第三章 · 社会主义改造理论"},{"chapter":"第三章","section":"单选","no":2,"stem":"毛泽东提到：“国营经济是社会主义性质的，合作社经济是半社会主义性质的，加上私人资本主义，加上个体经济，加上国家和私人合作的国家资本主义经济，这些就是人民共和国的几种主要的经济成分，这些就构成新民主主义的经济形态”。其中个体经济向社会主义集体经济过渡的形式是（　　）","opts":{"A":"私人资本主义经济","B":"国营经济","C":"合作社经济","D":"国家资本主义经济"},"ans":"C","point":"新民主主义社会是一个过渡性的社会","explain":"半社会主义性质的合作社经济是个体经济向社会主义集体经济过渡的形式，应选C。A选项私人资本主义经济是保护下来的民族工商业；B选项国营经济是新民主主义社会的经济主体；D选项国家资本主义经济是私人资本主义经济向社会主义国营经济过渡的形式。","notes":"在新民主主义社会中，存在着五种经济成分：1）国营经济（领导，社会主义性质）2）个体经济（绝对优势，十字路口经济）3）私人资本主义经济（资本主义性质）4）合作社经济（过渡性质，半社会主义性质）5）国家资本主义经济（过渡性质，若干社会主义性质）在这些经济成分中，通过没收官僚资本而形成的社会主义国营经济，掌握了主要经济命脉，居于领导地位。而以农业和手工业为主体的个体经济，则在国民经济中占绝对优势\n③「C选项」半社会主义性质的合作社经济是个体经济向社会主义集体经济过渡的形式，国家资本主义经济是私人资本主义经济向社会主义国营经济过渡的形式。所以，主要的经济成分有三种：社会主义经济、个体经济和资本主义经济","tips":"","module":"毛概","title":"第三章 · 社会主义改造理论"},{"chapter":"第三章","section":"单选","no":3,"stem":"马克思、恩格斯在创立科学社会主义理论时就提出了从资本主义社会向社会主义社会过渡的问题。列宁在俄国十月革命胜利后也曾设想通过国家资本主义对资产阶级的生产资料进行和平赎买，转化为公有财产。马克思列宁主义关于过渡时期的理论在中国的具体化，为中国社会主义改造提供行动指南的是（　　）","opts":{"A":"新民主主义革命总路线","B":"党在过渡时期的总路线","C":"“多快好省”的社会主义建设总路线","D":"“调整、巩固、充实、提高”的方针"},"ans":"B","point":"党在过渡时期的总路线及其依据","explain":"党在过渡时期的总路线和总任务，是要在一个相当长的时期内，逐步实现国家的社会主义工业化，并逐步实现国家对农业、对手工业和对资本主义工商业的社会主义改造。党在过渡时期的总路线，将马克思列宁主义关于过渡时期的理论在中国进一步具体化，为中国社会主义改造提供了行动指南。应选B。A选项新民主主义革命的总路线，即无产阶级领导的，人民大众的，反对帝国主义、封建主义和官僚资本主义的革命。这是指引新民主主义革命取得胜利的路线。C选项是在1958年5月召开的中共八大二次会议上通过的，“鼓足干劲、力争上游、多快好省地建设社会主义”的社会主义建设总路线。总路线虽然提出了“多快好省”四个字，但在宣传和实际工作中却只强调突出了“快”，提出“速度是总路线的灵魂”。这就导致了不顾客观规律，片面追求工业生产和建设的高速度，导致以高指标、瞎指挥、浮夸风和“共产风”为主要标志的“左”倾错误严重泛滥。D选项指1961年1月中共八届九中全会决定，从1961年起在两三年内对国民经济实行“调整、巩固、充实、提高”的方针，这是党在经济工作指导方针上的重大转变。以此为起点，我国社会主义建设开始从“大跃进”轨道转入全面调整。","notes":"中共八大确定，我国社会主义经济建设的方针是在综合平衡中稳步前进\n②「D选项」中共八届九中全会（1961年）对国民经济实行的方针：调整、巩固、充实、提高，以此为起点，我国社会主义建设开始从“大跃进”轨道转入全面调整\n③「C选项」1958年党的八大二次会议通过了“鼓足干劲、力争上游、多快好省”的建设社会主义的总路线，之后“大跃进”运动在全国范围内发动起来\n④「B选项」党在过渡时期的总路线和总任务，是要在一个相当长的时期内，逐步实现国家的社会主义工业化，并逐步实现国家对农业、对手工业和对资本主义工商业的社会主义改造","tips":"","module":"毛概","title":"第三章 · 社会主义改造理论"},{"chapter":"第三章","section":"单选","no":4,"stem":"我国以和平赎买的方式完成对资本主义工商业的改造，采取的是从低级到高级的国家资本主义的过渡形式。其中高级形式的国家资本主义是（　　）","opts":{"A":"公私合营","B":"委托加工","C":"计划订货","D":"统购包销"},"ans":"A","point":"适合中国特点的社会主义改造道路","explain":"国家资本主义，就是在国家直接控制和支配下的资本主义经济。我国社会主义改造中出现的国家资本主义经济，“是在人民政府管理之下的，用各种形式和国营社会主义经济联系着的，并受工人监督的资本主义经济”。高级形式的国家资本主义是公私合营，包括个别企业的公私合营和全行业的公私合营。B、C、D选项都是初级形式的国家资本主义。","notes":"国家资本主义的形式具体形式利润分配企业性质采取委托加工、计划“四马分肥”，即企业的利润按国家所得初级形式的国家税、企业公积金、工人福利费、资方红利若干社会主义性质资本主义订货、统购包销、经销代销等形式四个方面进行分配，资方红利大体占1/4续表高级形式的国家个别企业的公私合营四马分肥半社会主义性质资本主义全行业的公私合营定股定息社会主义性质","tips":"","module":"毛概","title":"第三章 · 社会主义改造理论"},{"chapter":"第三章","section":"单选","no":5,"stem":"社会主义基本制度的确立是中国历史上最深刻最伟大的社会变革，为当代中国一切发展进步奠定了制度基础，也为中国特色社会主义制度的创新和发展提供了重要前提。在我国，社会主义基本制度确立的标志是（　　）","opts":{"A":"中华人民共和国的成立","B":"土地改革的完成","C":"社会主义改造的基本完成","D":"第一部社会主义宪法的颁布"},"ans":"C","point":"","explain":"社会主义基本制度的确立及其理论根据所有制基本上转变成为劳动群众集体所有的公有制。资本主义私有制基本上转变为国家所有即全民所有的公有制。社会主义公有制已成为我国社会的经济基础，标志着中国历史上长达数千年的阶级剥削制度的结束和社会主义基本制度的确立。社会主义改造的基本完成和由此带来的社会各方面的变化，表明社会主义制度已经在我国的经济领域、政治领域及社会生活其他领域基本确立，表明我国由一个新民主主义的国家转变为社会主义国家。应选C。A选项中华人民共和国的成立是新民主主义革命胜利标志，B选项土地改革的完成是1952年完成的反封建任务，D选项是1954年颁布的宪法，均非社会主义制度在中国确立的标志。","notes":"有制已成为我国社会的经济基础，标志着中国历史上长达数千年的阶级剥削制度的结束和社会主义基本制度的确立，其中建立起社会主义经济制度是我国进入社会主义社会最主要的标志","tips":"","module":"毛概","title":"第三章 · 社会主义改造理论"},{"chapter":"第三章","section":"多选","no":6,"stem":"新民主主义社会不是一个独立的社会形态，而是由新民主主义向社会主义转变的过渡性的社会形态。在新民主主义社会的五种经济成分中，具有过渡性质的经济成分是（　　）","opts":{"A":"国营经济","B":"合作社经济","C":"国家资本主义经济","D":"个体经济"},"ans":"BC","point":"","explain":"亲新民主主义社会是一个过渡性的社会和资本主义经济。其中具有过渡性质的经济成分是合作社经济、国家资本主义经济。合作社经济是个体经济向社会主义集体经济过渡的形式，国家资本主义经济是私人资本主义经济向社会主义国营经济过渡的形式。B、C选项正确。国营经济当时已经是社会主义性质，成为国民经济的主导。个体经济既可以自发地走向资本主义，也可以被引导走向社会主义，其本身并不代表一种独立的发展方向，被称为“十字路口”的经济成分。A、D是干扰项。","notes":"","tips":"","module":"毛概","title":"第三章 · 社会主义改造理论"},{"chapter":"第三章","section":"多选","no":7,"stem":"新民主主义主要的经济成分是：社会主义经济、个体经济和资本主义经济。与这三种不同性质的主要经济成分相联系，中国社会的阶级构成主要是工人阶级、农民阶级和其他小资产阶级、民族资产阶级等基本的阶级力量。新民主主义这三种基本的经济成分及与之相联系的阶级力量之间的矛盾，在当时集中表现为（　　）","opts":{"A":"新民主主义和资本主义两条道路的矛盾","B":"地主阶级与农民阶级的矛盾","C":"社会主义和资本主义两条道路的矛盾","D":"工人阶级和资产阶级的矛盾"},"ans":"CD","point":"新民主主义社会是一个过渡性的社会","explain":"与新民主主义时期三种不同性质的主要经济成分相联系，中国社会的阶级构成主要是工人阶级、农民阶级和其他小资产阶级、民族资产阶级等基本的阶级力量。由于农民和手工业者的个体经济既可以自发地走向资本主义，也可以被引导走向社会主义，其本身并不代表一种独立的发展方向。因此，这三种基本的经济成分及与之相联系的三种基本的阶级力量之间的矛盾，就集中表现为社会主义和资本主义两条道路、工人阶级和资产阶级两个阶级的矛盾。C、D选项正确。中国当时已经是新民主主义，发展方向是要走向社会主义的。地主阶级伴随着新民主主义革命尤其是土地改革，其作为一个阶级在社会上已被消灭。","notes":"①「C、D选项」建国初期主要矛盾：1）1949—1952年底：人民大众同帝国主义、封建主义和国民党残余势力之间的矛盾2）1953一1956年底：国内是无产阶级与资产阶级之间的矛盾，国际是中国同帝国主义之间的矛盾毛泽东在八大提出的社会主要矛盾：人民对于建立先进工业国的要求与落后的农业国现实之间的矛盾；人民对于经济文化迅速发展的需要与当前经济文化不能满足人民需要的状况之间的矛盾邓小平在十一届六中全会上指出社会主要矛盾：人民日益增长的物质文化需要与落后的社会生产之间的矛盾习近平在党的十九大指出社会主要矛盾：人民日益增长的美好生活需要与不平衡不充分的发展之间的矛盾5「A选项」新民主主义社会不是一个独立的社会形态，而是属于社会主义体系的、逐步过渡到社会主义的过渡性质的社会","tips":"新民主主义不是一种独立的社会形态，而是向社会主义过渡的阶段。将新民主主义与资本主义并列为两条道路是概念上的错误。1952年底，土地改革基本完成后，地主阶级已被消灭，这一矛盾已不是新民主主义社会的主要矛盾，脑海里一定要清晰重大历史事件的时间年份，干扰项极其容易在时间线上做文章","module":"毛概","title":"第三章 · 社会主义改造理论"},{"chapter":"第三章","section":"多选","no":8,"stem":"1952年党中央在酿过渡时期总路线时，毛泽东把实现向社会主义转变的设想，由建国之初的“先搞工业化建设”再一举过渡，改变为“建设和改造同时并举，逐步过渡”，这一改变原因和条件是（　　）","opts":{"A":"我国社会主义经济因素的不断增长和对资本主义经济的限制","B":"为了确定我国工业化建设的社会主义方向","C":"我国工业化建设取得了重大成就","D":"民主革命的遗留任务已经完成"},"ans":"ABD","point":"党在过渡时期的总路线及其依据","explain":"要从根本上改变中国贫穷落后的面貌，把中国从一个落后的农业国变为一个先进的工业国，就必须实现国家的工业化，这是近代以来无数仁人志士梦寐以求的理想，是中国共产党领导各族人民实现国家独立和富强，使中国能够自立于世界民族之林的必由之路。在当时中国的具体条件下，就必须实现社会主义工业化。经过1949年到1952年三年的努力，我国已经有了相对强大和迅速发展的社会主义国营经济。到1952年我国国民经济得以恢复，民主革命遗留任务已经完成，经济、政治及社会面貌发生巨大变化。社会主义的国营经济在国家经济生活中实际上已居于相对强大的地位，并且明显地表现出相对其他经济成分的优越性。这不仅为党提出过渡时期总路线奠定了物质基础，也充分体现了我国进行社会主义改造的必然性。这些情况使毛泽东把实现向社会主义转变的设想，由建国之初的“先搞工业化建设”再一举过渡，改变为“建设和改造同时并举，逐步过渡”，本题A、B、D选项符合题意。1952年我国刚提出实现社会主义工业化的任务，工业化建设尚未开始。C选项错误。","notes":"①「C选项」1952年我国刚提出实现社会主义工业化的任务，工业化建设尚未开始第一个五年计划，简称“一五”计划，是指从1953年到1957.年发展中国国民经济的计划，由周恩来、陈云同志主持制定，“一五”计划超额完成了规定的任务，实现了国民经济快速增长，并为我国的工业化奠定了初步基础。第一个五年计划的制定与实施也标志着系统建设社会主义的开始社会主义工业化是1953一1957年“一五”计划的核心目标，社会主义工业化的系统推进始于1953年过渡时期总路线提出的“一化三改”。“一五”计划的核心任务就是要集中主要力量发展重工业“一五”计划只是社会主义工业化的起步阶段，社会主义工业化远未完成，即使在今天，中国仍在继续推进新型工业化，工业化是一个长期过程","tips":"到1952年，民主革命的遗留任务已基本完成。土地改革在全国范围内完成，“工人阶级和资产阶级之间、社会主义道路和资本主义道路之间的矛盾”成为社会的主要矛盾。","module":"毛概","title":"第三章 · 社会主义改造理论"},{"chapter":"第三章","section":"多选","no":9,"stem":"对于经济文化比较落后的国家能不能够先于发达国家实行社会主义革命、建立社会主义制度的问题，在国际共产主义运动历史上曾经有过激烈争论。中国建立社会主义制度的实践表明（　　）","opts":{"A":"中国可以在没有实现工业化的情况下进入社会主义","B":"必须等待生产力高度发达才能进行社会主义革命","C":"社会主义革命可以为生产力发展开辟道路","D":"经济文化比较落后的国家建立的社会主义还只能是初级阶段的社会主义"},"ans":"ACD","point":"社会主义基本制度的确立及其理论根据","explain":"毛泽东曾经用英、法、德、美、日等国家的历史发展说明：“生产关系的革命，是生产力的一定发展所引起的。但是，生产力的大发展，总是在生产关系改变以后。”邓小平结合中国的情况指出，“我们也是反对庸俗的生产力论”，“当时中国有了先进的无产阶级的政党，有了初步的资本主义经济，加上国际条件，所以在一个很不发达的中国能搞社会主义。这和列宁讲的反对庸俗的生产力论一样”。中国建立社会主义制度的实践证明，一方面，中国可以在没有实现工业化的情况下进入社会主义，社会主义基本制度的确立正是为了推进中国的工业化、现代化建设；另一方面，由于经济文化还比较落后，中国的社会主义还只能是初级阶段的社会主义，或者叫社会主义初级阶段。不经过社会生产力的极大发展，是不可能超越这个阶段的。应选A、C、D。B选项错误，认为还没有生产力大发展，实行社会主义的经济前提来否定经济文化比较落后的国家可以走向社会主义。列宁批评这种观点是“庸俗生产力论”","notes":"①「B选项」认为还没有生产力大发展，实行社会主义的经济前提来否定经济文化比较落后的国家可以走向社会主义。列宁批评这种观点是“庸俗生产力论”","tips":"B选项也明显不符合当时中国社会主义革命的现实情况，当时中国生产力并不发达，但同样进行了社会主义革命并顺利进入社会主义社会。","module":"毛概","title":"第三章 · 社会主义改造理论"},{"chapter":"第三章","section":"多选","no":10,"stem":"中国共产党根据马克思列宁主义关于农业社会主义改造的思想，从我国的实际出发，开创了一条有中国特点的农业合作化道路，成功地实现了对个体农业的社会主义改造。其历史经验主要有（　　）","opts":{"A":"坚持积极领导、稳步前进的方针","B":"遵循自愿互利、典型示范和国家帮助的原则","C":"在土地改革后不失时机的引导个体农民走互助合作道路","D":"采取从互助组到初级社再到高级社的逐步过渡形式"},"ans":"ABCD","point":"适合中国特点的社会主义改造道路","explain":"对农业的社会主义改造：第一，积极引导农民组织起来，走互助合作道路；第二，农业合作化遵循自愿互利、典型示范和国家帮助的原则，以互助合作的优越性吸引农民走合作化道路；第三，正确分析农村的阶级和阶层状况，制定正确的阶级政策；第四，坚持积极领导、稳步前进的方针，采取循序渐进的步骤。农业社会主义改造大体经历了互助组、初级社和高级社三个发展阶段。A、B、C、D都是正确选项。","notes":"对农业的社会主义改造，是三大改造中首先进行的对农业改造遵循自愿互利、典型示范和国家帮助的原则（农民既是私有者又是劳动者，对农民不能采取剥夺的办法，只能引导、说服和教育，使其自愿地走合作化的道路）对农业改造坚持积极领导、稳步前进的方针，采取循序渐进的步骤（对手工业的社会主义改造，党和政府同样采取了积极领导、稳步前进的方针）","tips":"","module":"毛概","title":"第三章 · 社会主义改造理论"},{"chapter":"第三章","section":"多选","no":11,"stem":"根据党在过渡时期总路线的要求，在推进农业合作化运动的同时，党和政府也有计划、有步骤地开展了对资本主义工商业的社会主义改造，创造性地开辟了一条适合中国国情的对资本主义工商业进行社会主义改造的道路。这包括（　　）","opts":{"A":"用和平赎买的方法改造资本主义工商业","B":"采取从低级到高级的国家资本主义的过渡形式","C":"把资本主义工商业者改造成为自食其力的社会主义劳动者","D":"没收民族资本归新民主主义国家所有"},"ans":"ABC","point":"适合中国特点的社会主义改造道路","explain":"对资本主义工商业进行社会主义改造的道路包括：第一，用和平赎买的方法改造资本主义工商业；第二，采取从低级到高级的国家资本主义的过渡形式；第三，把资本主义工商业者改造成为自食其力的社会主义劳动者。应选A、B、C。没收官僚资本归新民主主义国家所有，对于民族资本并没有没收过，D选项错误","notes":"1「D选项」没收官僚资本，包含着新民主主义革命和社会主义革命的双重性质。通过没收官僚资本建立起来的具有社会主义性质的国营经济，在新民主主义社会的多种经济成分中居于领导地位\n②「B选项」对资本主义工商业社会主义改造的步骤：1）初级形式的国家资本主义（具有了社会主义因素）2）个别企业的公私合营（半社会主义性质）3）全行业的公私合营（社会主义性质）3「A选项」所谓赎买，就是国家有偿地将私营企业改变为国营企业，将资本主义私有制改变为社会主义公有制。赎买的具体方式不是由国家支付一笔巨额补偿资金，而是让资本家在一定年限内从企业经营所得中获取一部分利润用，适当照顾”的原则，对他们在政治上适当安排、工作上发挥作用、生活上妥善照顾，通过改造阶级成分的方式达到从整体上消灭资产阶级的目的","tips":"","module":"毛概","title":"第三章 · 社会主义改造理论"},{"chapter":"第三章","section":"多选","no":12,"stem":"在进行社会主义改造和向社会主义过渡的进程中，中国共产党积累了丰富的历史经验，主要有（　　）","opts":{"A":"坚持社会主义工业化建设与社会主义改造同时并举","B":"采取积极引导、逐步过渡的方式","C":"追求单一的社会主义经济模式","D":"用和平方法进行改造"},"ans":"ABD","point":"适合中国特点的社会主义改造道路","explain":"在进行社会主义改造和向社会主义过渡的进程中，中国共产党积累了丰富的历史经验。第一，坚持社会主义工业化建设与社会主义改造同时并举；第二，采取积极引导、逐步过渡的方式；第三，用和平方法进行改造。坚持和平的办法，不仅保证了我国社会主义改造的顺利进行，而且维护了社会的稳定，极大地促进了社会主义事业的发展。应选A、B、D。C选项不是社会主义改造的经验，而是我国的社会主义改造中出现的一些失误和偏差，主要表现为在社会主义经济模式的选择和理解上过于单一，追求纯粹的单一的社会主义经济成分。","notes":"①「C选项」追求单一的社会主义经济模式不是社会主义改造的经验，而是我国的社会主义改造中出现的一些失误和偏差","tips":"","module":"毛概","title":"第三章 · 社会主义改造理论"},{"chapter":"第三章","section":"多选","no":13,"stem":"1956年，社会主义改造的基本完成和由此带来的社会各方面的变化，表明社会主义制度已经在我国的经济领域、政治领域及社会生活其他领域基本确立，表明我国由一个新民主主义的国家转变为社会主义国家。这些变化包括（　　）","opts":{"A":"社会主义公有制已成为我国社会的经济基础","B":"《中华人民共和国宪法》把中国人民行使当家作主权利的政治制度用根本大法形式确定下来","C":"在中国大陆，剥削阶级作为整体被消灭","D":"完成了社会主义工业化的进程"},"ans":"ABC","point":"社会主义基本制度的确立及其理论根据","explain":"1956年底，我国对农业、手工业和资本主义工商业的社会主义改造基本完成，农业、手工业个体所有制基本上转变成为劳动群众集体所有的公有制。资本主义私有制基本上转变为国家所有，即全民所有的公有制。这两种社会主义经济成分在经济结构中已占绝对优势，社会主义公有制已成为我国社会的经济基础，与此同时，我国的人民民主政治建设也在有步骤地向前推进。《中华人民共和国宪法》把中国人民行使当家作主权利的政治制度用根本大法形式确定下来，在中国大陆，官僚资产阶级已被消灭，原来的地主和富农正在被改造为自食其力的劳动者，民族资产阶级被改造成自食其力的社会主义劳动者，剥削阶级作为整体被消灭。应选A、B、C。D选项错误，经过“一化三改”，旧中国重工业过分落后的面貌有所改变。一大批旧中国没有的基础工业部门和大中型工业企业相继建立，工业技术水平和工程设计能力有了较大提高，从而奠定了我国社会主义工业化的初步基础。但不能说完成了社会主义工业化进程。","notes":"①「D选项」社会主义工业化并未随“一五”计划的制定与实施而实现。“一五”计划只是社会主义工业化的起步阶段，社会主义工业化远未完成，即使在今天，中国仍在继续推进新型工业化，工业化是一个长期过程\n②「A选项」1956年底，我国对农业、手工业和资本主义工商业的社会主义改造基本完成，社会主义公有制已成为我国社会的经济基础，标志着中国历史上长达数千年的阶级剥削制度的结束和社会主义基本制度的确立，其中建立起社会主义经济制度是我国进入社会主义社会最主要的标志\n③「C选项」社会主义改造消灭了在中国延续几千年的封建剥削压迫制度，实现了中华民族有史以来最为广泛而深刻的社会变革。我国的无产阶级同资产阶级之间的矛盾已基本解决，几千年来的阶级剥削制度的历史已经基本结束，社会主义的社会制度在我国已经基本建立起来","tips":"","module":"毛概","title":"第三章 · 社会主义改造理论"},{"chapter":"第三章","section":"多选","no":14,"stem":"毛泽东指出：“当人民推翻了帝国主义、封建主义和官僚资本主义的统治之后，中国要向哪里去？向资本主义，还是向社会主义？…事实已经回答了这个问题：只有社会主义能够救中国。社会主义制度促进了我国生产力的突飞猛进的发展，这一点，甚至连国外的敌人也不能不承认了。”社会主义基本制度在中国确立的重大意义包括（　　）","opts":{"A":"极大地促进了我国社会生产力的发展，使广大劳动人民真正成为国家的主人","B":"进一步改变了世界政治经济格局，增强了社会主义的力量","C":"实现了党的历史上具有深远意义的伟大转折，开启了社会主义现代化建设的伟大征程","D":"独创性的理论原则和经验总结丰富和发展了科学社会主义理论"},"ans":"ABD","point":"确立社会主义基本制度的重大意义","explain":"社会主义基本制度的确立极大地提高了工人阶级和广大劳动人民的积极性和创造性，极大地促进了我国社会生产力的发展，使广大劳动人民真正成为国家的主人。社会主义基本制度的确立，使占世界人口1/4的东方大国进入了社会主义社会，这是世界社会主义发展史上又一个历史性的伟大胜利。它进一步改变了世界政治经济格局，增强了社会主义的力量，对维护世界和平产生了积极影响。社会主义基本制度的确立，是以毛泽东为代表的中国共产党人对一个脱胎于半殖民地半封建的东方大国如何进行社会主义革命问题的系统回答和正确解决，是马克思列宁主义关于社会主义革命理论在中国的正确运用和创造性发展的结果。它不仅再次证明了马克思列宁主义的真理性，而且以其独创性的理论原则和经验总结丰富和发展了科学社会主义理论。应选A、B、D。党的十一届三中全会作出把党和国家工作中心转移到经济建设上来、实行改革开放的历史性决策，实现了新中国成立以来党的历史上具有深远意义的伟大转折，开启了改革开放和社会主义现代化建设的伟大征程。C选项不符合题意。","notes":"①「C选项」以十一届三中全会为起点，中国进入了改革开放和社会主义现代化建设的历史新时期，开启了我国改革开放和社会主义现代化建设新时期社会主义基本制度的确立是中国历史上最深刻最伟大的社会变革，为当代中国一切发展进步奠定了制度基础，为实现中华民族伟大复兴奠定了根本政治前提和制度基础，为当代中国一切发展进步奠定了根本政治前提和制度基础，使广大劳动人民真正成为国家的主人","tips":"","module":"毛概","title":"第三章 · 社会主义改造理论"},{"chapter":"第四章","section":"单选","no":1,"stem":"党的八大提出要把党和国家的工作重点转到技术革命和社会主义建设上来。这是因为社会主义改造完成后我国社会的主要矛盾已经发生了变化，社会主要矛盾已经变成了（　　）","opts":{"A":"无产阶级与资产阶级的矛盾","B":"社会主义道路与资本主义道路的矛盾","C":"人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾","D":"生产关系与生产力、上层建筑与经济基础的矛盾"},"ans":"C","point":"正确认识和处理社会主义社会矛盾的思想","explain":"党的八大正确分析了社会主义改造完成后我国社会主要矛盾的变化，指出我们国内的主要矛盾已经不再是工人阶级和资产阶级的矛盾，而是人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾。据此，党中央提出：全国人民的主要任务是集中力量发展社会生产力，实现国家工业化，逐步满足人民日益增长的物质和文化需要；要把党和国家的工作重点转到技术革命和社会主义建设上来。A、B两选项是过渡时期社会的主要矛盾；D选项是社会主义社会基本矛盾，非主要矛盾。","notes":"建国初期主要矛盾：1）1949一1952年底：人民大众同帝国主义、封建主义和国民党残余势力之间的矛盾。2）1953一1956年底：国内是无产阶级与资产阶级之间的矛盾，国际上是中国同帝国主义之间的矛盾\n②「C选项」毛泽东在八大提出的社会主要矛盾：人民对于建立先进工业国的要求与落后的农业国现实之间的矛盾；人民对于经济文化迅速发展的需要与当前经济文化不能满足人民需要的状况之间的矛盾邓小平在十一届六中全会上指出社会主要矛盾：人民日益增长的物质文化需要与落后的社会生产之间的矛盾习近平在党的十九大指出社会主要矛盾：人民日益增长的美好生活需要与不平衡不充分的发展之间的矛盾\n③「D选项」生产力与生产关系、经济基础与上层建筑之间的矛盾，是人类社会基本矛盾。社会基本矛盾是其他一切社会矛盾的根源。规定和制约着社会主要矛盾的存在和发展，社会主要矛盾是社会基本矛盾的具体体现","tips":"","module":"毛概","title":"第四章 · 社会主义建设道路初步探索的理论成果"},{"chapter":"第四章","section":"单选","no":2,"stem":"1956年，毛泽东先后在中央政治局扩大会议和最高国务会议上，作了《论十大关系》的报告，初步总结了我国社会主义建设的经验，明确提出要以苏为鉴，独立自主地探索适合中国情况的社会主义建设道路。他说：“特别值得注意的是，最近苏联方面暴露了他们在建设社会主义过程中的一些缺点和错误，他们走过的弯路，你还想走？过去我们就是鉴于他们的经验教训，少走了一些弯路，现在当然更要引以为戒。”这就明确了建设社会主义必须根据本国情况走自己的道路这一根本思想。《论十大关系》标志着（　　）","opts":{"A":"党探索中国社会主义建设道路的良好开端","B":"马克思主义中国化的第一次历史性飞跃完成","C":"社会主义改造基本完成和制度确立的标志","D":"提出社会主义初级阶段理论的重要起点"},"ans":"A","point":"调动一切积极因素为社会主义事业服务的思想","explain":"1956年4月和5月，毛泽东先后在中央政治局扩大会议和最高国务会议上，作了《论十大关系》的报告，初步总结了我国社会主义建设的经验，明确提出了以苏为鉴，独立自主地探索适合中国情况的社会主义建设道路。《论十大关系》标志着党探索中国社会主义建设道路的良好开端。应选A。B选项错误，“马克思主义中国化第一次历史性飞跃”指毛泽东思想的形成，其标志是新民主主义革命道路理论的形成，而非1956年社会主义建设时期的《论十大关系》。C选项错误，社会主义改造基本完成和制度确立的标志是1956年底三大改造的完成，而非《论十大关系》的发表。二者时间接近但内容不同，前者是生产关系变革的完成，后者是建设道路的探索。D选项错误，“社会主义初级阶段理论”是改革开放后（1987年十三大）提出的，属于中国特色社会主义理论体系，与1956年毛泽东探索时期的理论无直接关联。","notes":"关于《论十大关系》（1956年4月）的知识点总结：1）十大关系：重工业和轻工业、农业的关系（第一大关系)：沿海工业和内地工业的关系；经济建设和国防建设的关系；国家、生产单位和生产者个人的关系；中央和地方的关系；汉族和少数民族的关系；党和非党的关系；革命和反革命的关系；是非关系；中国和外国的关系2）确定了一个基本方针：“努力把党内党外、国内国外的一切积极的因素，直接的、间接的积极因素全部调动起来”为社会主义建设服务，这成为同年9月召开的中共八大的指导思想。同时也是“关于国家政治生活的主题正确处理人民内部矛盾”这一论断的根本着眼点3）这篇文章明确提出了以苏为鉴，独立自主地探索适合中国情况的社会主义建设道路、提出向外国学习。《论十大关系》标志着党探索中国社会主义建设道路的良好开端4）提出了以农业为基础，以工业为主导，以农轻重为序发展国民经济的总方针5）提出了一整套“两条腿走路”的方针，即重工业和轻工业同时并举；中央工业和地方工业同时并举；沿海工业和内地工业同时并举；大型企业和小型企业同时并举《论十大关系》确定了一个基本方针：努力把党内党外、国内国外的一切积极的因素，直接的、间接的积极因素全部调动起来为社会主义建设服务，这成为同年9月召开的中共八大的指导思想。同时也是“关于国家政治生活的主题一一正确处理人民内部矛盾”这一论断的根本着眼点要向外国学习。《论十大关系》标志着党探索中国社会主义建设道路的良好开端4「B选项」马克思主义中国化第一次历史性飞跃指毛泽东思想的形成，其标志是新民主主义革命道路理论的形成（深入阐述农村包围城市、武装夺取政权的思想）\n③「C选项」1956 年三大改造基本完成，标志着我国进入了社会主义初级阶段，以生产资料公有制、按劳分配和计划经济体制为特征的社会主义经济制度建立起来，这是中国进入社会主义社会最主要的标志（划分社会形态的依据是社会经济基础特别是生产关系的性质)","tips":"","module":"毛概","title":"第四章 · 社会主义建设道路初步探索的理论成果"},{"chapter":"第四章","section":"单选","no":3,"stem":"社会主义基本制度确立后，如何在中国这样一个经济文化比较落后的东方大国建设和巩固社会主义，是党面临的全新课题。1956年4月，毛泽东作了《论十大关系》的报告，在初步总结我国社会主义建设经验的基础上，从十个方面论述了我国社会主义建设需要重点把握的重大关系。“十大关系”所围绕的基本方针是（　　）","opts":{"A":"正确处理人民内部矛盾","B":"调动一切积极因素为社会主义事业服务","C":"既反保守又反冒进，在综合平衡中稳步前进","D":"集中力量向科学进军"},"ans":"B","point":"调动一切积极因素为社会主义事业服务的思想","explain":"如何在中国这样一个经济文化比较落后的东方大国建设和巩固社会主义，是党在20世纪50年代社会主义基本制度确立后面临的一项薪新课题。1956年4月和5月，毛泽东先后在中央政治局扩大会议和最高国务会议上，作了《论十大关系》的报告，报告确定了一个基本方针，就是“努力把党内党外、国内国外的一切积极的因素，直接的、间接的积极因素全部调动起来”，为社会主义建设服务。为了贯彻这一方针，报告从十个方面论述了我国社会主义建设需要重点把握的十项重大关系。A选项“正确处理人民内部矛盾”是当时社会主义国家政治生活的主题；C选项“既反保守又反冒进、在综合平衡中稳步前进”是党的八大提出的经济建设的指导方针；D选项“集中力量向科学进军”是在社会主义建设初期党提出的关于科学和教育工作的口号。","notes":"①「B选项」《论十大关系》确定了一个基本方针：努力把党内党外、国内国外的一切积极的因素，直接的、间接的积极因素全部调动起来为社会主义建设服务，这成为同年9月召开的中共八大的指导思想。同时也是“关于国家政治生活的主题一一正确处理人民内部矛盾”这一论断的根本着眼点\n②「C选项」中共八大指出在经济建设上，制定既反保守又反冒进，即在综合平衡中稳步前进的方针关于中共八大（1956年9月）的知识点总结：1）指出国内主要矛盾是人民对于建立先进的工业国的要求同落后的农业国的现实之间的矛盾，人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾2）当前主要任务一一集中发展生产力，实现国家工业化，逐步满足人民日益增长的物质和文化需要；根本任务一一在新的生产关系下面保护和发展生产力社会主义民主、健全社会主义法制；在执政党建设上，要提高全党的马克思列宁主义思想水平，健全党内民主集中制补充：计划生产是主体，一定范围的自由生产为补充：国家市场是主体，一定范围的自由市场为补充5）通过中国共产党在全国执政以后制定的第一部党章","tips":"","module":"毛概","title":"第四章 · 社会主义建设道路初步探索的理论成果"},{"chapter":"第四章","section":"单选","no":4,"stem":"新中国的工业化是在苏联的影响下起步的。走中国工业化道路，是中国共产党初步探索我国社会主义建设道路的一个重要思想。当时所讲的工业化道路问题，主要是指（　　）","opts":{"A":"经济建设和国防建设的关系问题","B":"中央和地方的关系问题","C":"沿海工业和内地工业的关系问题","D":"重工业、轻工业和农业的发展关系问题"},"ans":"D","point":"走中国工业化道路的思想","explain":"毛泽东在《论十大关系》中论述的第一大关系，便是重工业、轻工业和农业的关系。在《关于正确处理人民内部矛盾的问题》一文中，毛泽东明确提出要走一条有别于苏联的中国工业化道路。他提出以农业为基础，以工业为主导，以农轻重为序发展国民经济的总方针，以及一整套“两条腿走路”的方针，即重工业和轻工业同时并举，中央工业和地方工业同时并举，沿海工业和内地工业同时并举，大型工业和中小型工业并举，等等。当时所讲的工业化道路问题，实质就是正确处理重工业和轻工业、农业的关系，这符合中国人口多、工业基础薄弱的实际，对于加快我国经济建设具有重要意义。A选项“经济建设和国防建设的关系问题”、B选项“中央和地方的关系问题”、C选项“沿海工业和内地工业的关系问题”都是《论十大关系》中深刻论述的正确处理经济建设和社会发展中的一系列重大关系。但并不符合工业化道路的实质。","notes":"《论十大关系》提出了一整套“两条腿走路”的方针，即重工业和轻工业同时并举，中央工业和地方工业同时并举，沿海工业和内地工业同时并举，大型企业和小型企业同时并举\n③「D选项」十大关系：重工业和轻工业、农业的关系（第一大关系)：沿海工业和内地工业的关系；经济建设和国防建设的关系，国家、生产单位和生产者个人的关系：中央和地方的关系：汉族和少数民族的关系：党和非党的关系：革命和反革命的关系：是非关系：中国和外国的关系","tips":"","module":"毛概","title":"第四章 · 社会主义建设道路初步探索的理论成果"},{"chapter":"第四章","section":"单选","no":5,"stem":"在探索中国社会主义建设道路过程中，毛泽东提出：“把我们的国家建设好要多少年呢？我看大概要一百年吧。要分几步来走：大概有十几年会稍微好一点；有个二三十年就更好一点；有个五十年可以勉强像个样子；有一百年那就了不起，就和现在大不相同了。社会主义这个阶段，又可能分为两个阶段”，这两个阶段分别是（　　）","opts":{"A":"不发达的社会主义和比较发达的社会主义","B":"社会主义初级阶段和社会主义高级阶段","C":"新民主主义社会和社会主义社会","D":"社会主义革命阶段和社会主义建设阶段"},"ans":"A","point":"初步探索的其他理论成果","explain":"20世纪50年代末60年代初，毛泽东在总结社会主义实践经验的基础上，提出“社会主义这个阶段，又可能分为两个阶段：第一个阶段是不发达的社会主义，第二个阶段是比较发达的社会主义”。这一论述为后来社会主义初级阶段理论提供了重要启示。B选项错误，“社会主义初级阶段”是改革开放后邓小平提出的理论（1987年十三大确立），强调我国处于社会主义的不发达阶段，属于单一阶段而非“两个阶段”。C选项错误，“新民主主义社会和社会主义社会”是过渡时期理论的划分（1949一1956年），前者是向社会主义过渡的阶段，后者是制度确立后的阶段，不属于社会主义社会内部的阶段划分。D选项错误，“社会主义革命”（如三大改造）和“社会主义建设”是不同模块历史任务的划分，而非社会主义社会发展阶段的划分。","notes":"1「A选项」在探索中国社会主义建设道路过程中，毛泽东提出：社会主义这个阶段，又可能分为两个阶段，第一个阶段是不发达的社会主义，第二个阶段是比较发达的社会主义。后一阶段可能比前一阶段需要更长的时间\n②「B选项」十三大第一次比较系统地阐述了社会主义初级阶段理论，明确概括了党“一个中心、两个基本点”的基本路线一一即以经济建设为中心，坚持四项基本原则，坚持改革开放","tips":"","module":"毛概","title":"第四章 · 社会主义建设道路初步探索的理论成果"},{"chapter":"第四章","section":"单选","no":6,"stem":"1964年底，周恩来在三届全国人大一次会议上所作的政府工作报告中正式宣布，“把我国建设成为一个具有现代农业、现代工业、现代国防和现代科学技术的社会主义强国”。同时，周恩来提出了建设“四个现代化”的战略步骤：从第三个五年计划开始，第一步要建立一个独立的比较完整的工业体系和国民经济体系，第二步要全面实现“四个现代化”，使中国的经济发展走在世界的前列。在当时，实现“四个现代化”关键在于（　　）","opts":{"A":"农业现代化","B":"工业现代化","C":"科学技术现代化","D":"国防现代化"},"ans":"C","point":"初步探索的其他理论成果","explain":"在科技工作方面，我们党提出了“向科学进军”的口号，强调实现“四个现代化”关键在于科学技术现代化，要实行重点发展、迎头赶上的科技发展战略，努力赶超世界先进水平。应选C。A、B、D选项是“四个现代化”战略目标的内容，但非关键。","notes":"「C选项」第三届人大一次会议（1964年12月）：周恩来提出“四个现代化”现代农业、现代工业、现代国防和现代科学技术。在科技工作方面，我们党提出了“向科学进军”的口号，强调实现“四个现代化”关键在于科学技术现代化","tips":"","module":"毛概","title":"第四章 · 社会主义建设道路初步探索的理论成果"},{"chapter":"第四章","section":"单选","no":7,"stem":"邓小平在总结新中国成立后历史经验时深刻指出：“什么是我国今天最重要的新情况，最重要的新问题呢？当然就是实现四个现代化，或者像我在前面说的，实现中国式的现代化。我们已经说过，深入研究中国实现四个现代化所遇到的新情况、新问题，并且作出有重大指导意义的答案，这将是我们思想理论工作者对马克思主义的重大贡献”。他强调，过去“多少年来我们吃了一个大亏，社会主义改造基本完成了，还是‘以阶级斗争为纲'，忽视发展生产力。‘文化大革命”更走到了极端。”邓小平的这一反思，从根本上总结了党在初步探索时期最主要的经验教训之一，即必须（　　）","opts":{"A":"正确认识社会主义社会的主要矛盾和根本任务，集中力量发展生产力","B":"坚持“无产阶级专政下继续革命”的理论，防止资本主义复辟","C":"通过不断调整生产关系来推动生产力发展，实现“一大二公”","D":"将思想文化领域的革命作为社会主义建设的中心工作来抓"},"ans":"A","point":"社会主义建设道路初步探索的意义和经验教训","explain":"邓小平的反思明确指出，社会主义改造基本完成后，党的工作重心应转向发展生产力，而非继续“以阶级斗争为纲”。选项A准确概括了这一核心观点，即必须正确认识社会主义社会的主要矛盾和根本任务，集中力量发展生产力。B、C、D选项均与邓小平的论述相悸，属于过去“左”的错误思想","notes":"「A选项」关于十一届三中全会（1978年12月）的知识点总结：1）党的十一届三中全会果断作出了把党和国家工作重点转移到社会主义现代化建设上来的战略决策，提出了一系列有利于增强党的团结和调动一切积极因素的方针政策，标志着党重新确立了马克思主义的思想路线2）解放思想、实事求是的思想路线，是邓小平理论的活的灵魂，是邓小平理论的精髓。1978年《解放思想，实事求是，团结一致向前看》重要讲话：是解放思想、开辟新时期新道路、开创中特新理论的宣言书3）果断停止使用“以阶级斗争为纲”的口号，决定从1979 年1月起把全党的工作重心转移到社会主义现代化建设上来，提出了改革开放的任务4)重新确立了马克思主义的思想路线、政治路线和组织路线5）恢复了党的民主集中制的优良传统，审查解决了历史上遗留的一批重大问题和一些重要领导人的功过是非问题6）高度评价了关于真理标准问题的讨论8）以这次全会为起点，中国进入了改革开放和社会主义现代化建设的历史新时期；开启了我国改革开放和社会主义现代化建设新时期\n②「A选项」邓小平强调：社会主义的本质，是解放生产力，发展生产力，消灭剥削，消除两极分化，最终达到共同富裕。这表明他将发展生产力作为社会主义的根本任务","tips":"邓小平确实强调生产关系要适应生产力发展水平，但他明确反对“一大二公”的人民公社化运动模式。“一大二公”是1958年“大跃进”和人民公社化运动的核心内容，邓小平对此持批评态度。","module":"毛概","title":"第四章 · 社会主义建设道路初步探索的理论成果"},{"chapter":"第四章","section":"多选","no":8,"stem":"调动一切积极因素为社会主义事业服务，是党关于社会主义建设的一条极为重要的方针，对于最大限度地团结全国各族人民，为建设社会主义现代化国家而奋斗具有长远的指导意义。调动一切积极因素为社会主义事业服务的要求是（　　）","opts":{"A":"必须消除一切消极因素","B":"必须坚持中国共产党的领导","C":"必须发展社会主义民主政治","D":"努力化消极因素为积极因素"},"ans":"BCD","point":"调动一切积极因素为社会主义事业服务的思想","explain":"1956年4月和5月，毛泽东先后在中央政治局扩大会议和最高国务会议上，作了《论十大关系》的报告，初步总结了我国社会主义建设的经验，明确提出了以苏为鉴，独立自主地探索适合中国情况的社会主义建设道路。报告确定了一个基本方针，就是调动一切积极因素为社会主义事业服务。为贯彻这一方针，报告从十个方面论述了我国社会主义建设需要重点把握的重大关系。充分调动一切积极因素，尽可能地克服消极因素，并且努力化消极因素为积极因素，是社会主义事业前进的现实需要。调动一切积极因素为社会主义事业服务，必须坚持中国共产党的领导。调动一切积极因素为社会主义事业服务，必须发展社会主义民主政治。A选项错误，不可能消除一切消极因素，只能尽可能地克服消极因素。","notes":"《论十大关系》确定了一个基本方针：努力把党内党外、国内国外的一切积极的因素，直接的、间接的积极因素全部调动起来为社会主义建设服务，这成为同年9月召开的中共八大的指导思想。同时也是“关于国家政治生活的主题一一正确处理人民内部矛盾”这一论断的根本着眼点","tips":"这一类细节知识点同学们不可能全部能记清楚，在考场上更多还是观察选项结构特征去选最合适的答案，例如A、D就是矛盾的两个选项，选D就不选A，而且A选项“消除一切”说法太绝对，可以直接排除，B、C选项说不出问题就选上。","module":"毛概","title":"第四章 · 社会主义建设道路初步探索的理论成果"},{"chapter":"第四章","section":"多选","no":9,"stem":"1957年，毛泽东在《关于正确处理人民内部矛盾的问题》的报告中指出：“在社会主义社会中，基本的矛盾仍然是生产关系和生产力之间的矛盾，上层建筑和经济基础之间的矛盾。”但社会主义社会的基本矛盾同以往社会的基本矛盾“具有根本不同的性质和情况”。这种“不同的性质和情况”是指（　　）","opts":{"A":"生产关系与生产力之间存在着一定程度的对抗和冲突","B":"生产关系和生产力基本适应、上层建筑和经济基础基本适应","C":"这种矛盾建立在人民根本利益一致的基础上","D":"它是非对抗性的矛盾"},"ans":"BCD","point":"正确认识和处理社会主义社会矛盾的思想","explain":"毛泽东指出：“在社会主义社会中，基本的矛盾仍然是生产关系和生产力之间的矛盾，上层建筑和经济基础之间的矛盾。”但社会主义社会的基本矛盾同以往社会的基本矛盾“具有根本不同的性质和情况”。以往社会的基本矛盾，生产关系与生产力之间存在着一定程度的对抗和冲突，而社会主义社会的基本矛盾是在生产关系和生产力基本适应、上层建筑和经济基础基本适应条件下的矛盾，是在人民根本利益一致基础上的矛盾。因此，它不是对抗性的矛盾，而是非对抗性的矛盾。B、C、D是正确选项。生产关系与生产力之间存在着一定程度的对抗和冲突是以往社会基本矛盾共有的特点。","notes":"①「B、C、D选项」社会主义社会的基本矛盾同以往社会的基本矛盾具有根本不同的性质和情况。以往社会的基本矛盾，生产关系与生产力之间存在着一定程度的对抗和冲突，而社会主义社会的基本矛盾是在生产关系和生产力基本适应、上层建筑和经济基础基本适应条件下的矛盾，是在人民根本利益一致基础上的矛盾。因此，它不是对抗性的矛盾，而是非对抗性的矛盾社会主义社会基本矛盾运动具有“又相适应又相矛盾”的特点，其中，相适应的一面是基本方面，相矛盾的一面是非基本方面","tips":"","module":"毛概","title":"第四章 · 社会主义建设道路初步探索的理论成果"},{"chapter":"第四章","section":"多选","no":10,"stem":"毛泽东在1957年2月所作的《关于正确处理人民内部矛盾的问题》的报告，系统论述了社会主义社会矛盾的理论。毛泽东指出，矛盾是普遍存在的，社会主义社会同样充满着矛盾，正是这些矛盾推动着社会主义社会不断地向前发展。“矛盾不断出现，又不断解决，就是事物发展的辩证规律。”毛泽东作出这一论述的背景包括（　　）","opts":{"A":"在我国社会主义改造基本完成以后，无产阶级同资产阶级之间的矛盾已经基本解决","B":"大量人民内部矛盾逐步成为政治生活中居于主导地位的矛盾","C":"在全党和全国工作重心由革命转向建设的时候，面临着一个如何认识和处理社会主义社会矛盾的问题","D":"苏联在社会主义建设的实践中，为我国正确处理人民内部矛盾提供了成功经验"},"ans":"ABC","point":"正确认识和处理社会主义社会矛盾的思想","explain":"我国社会主义改造完成以后，国内的社会矛盾和阶级关系发生重大变化，无产阶级同资产阶级之间的矛盾已经基本解决。那么，社会主义社会是否还存在着矛盾？存在什么性质的矛盾？如何正确认识和解决这些矛盾？这是全面建设社会主义面临的重大问题。只有正确回答和解决这些问题，才能把社会主义事业推向前进。由于我国社会主义改造和建设中出现了一些失误，以及少数干部存在着官僚主义作风，严重脱离群众，引起了部分群众的不满。1956年秋冬，在一些农村、工厂、学校还出现了“闹事”的情况。面对这些新问题新矛盾，许多党员和干部思想上缺乏准备，也缺乏处理这些问题和矛盾的经验。这表明，在全党和全国工作重心由革命转向建设的时候，面临着一个如何认识和处理社会主义社会矛盾的问题。应选 A、B、C。斯大林在领导苏联社会主义建设的实践中，一开始不承认社会主义社会存在矛盾，后来又认为苏联社会主义社会存在着严重的阶级矛盾，在实践中造成了严重后果。D选项表述错误。","notes":"①「A选项」建国初期主要矛盾：1）1949一1952年底：人民大众同帝国主义、封建主义和国民党残余势力之间的矛盾2）1953—1956年底：国内是无产阶级与资产阶级之间的矛盾，国际上是中国同帝国主义之间的矛盾\n②「B选项」毛泽东在八大提出的社会主要矛盾：人民对于建立先进工业国的要求与落后的农业国现实之间的矛盾；人民对于经济文化迅速发展的需要与当前经济文化不能满足人民需要的状况之间的矛盾\n③「B选项」1957年，毛泽东在《关于正确处理人民内部矛盾的问题》中提出，要把正确处理人民内部矛盾作为国家政治生活的主题，这一论断的根本着眼点就在于调动一切积极因素，团结一切可以团结的力量，把全党的注意力转到社会主义建设上来\n④「D选项」斯大林在领导苏联社会主义建设的实践中，一开始不承认社会主义社会存在矛盾，后来又认为苏联社会主义社会存在着严重的阶级矛盾，在实践中造成了严重后果","tips":"1956年苏共二十大后，赫鲁晓夫秘密报告揭露了斯大林的错误，导致东欧社会主义国家出现动荡特别是波匈事件的发生，表明苏联模式存在严重问题。毛泽东在报告中提到：“波匈事件”对中国也有一定影响，这说明苏联的经验并非成功经验，反而带来了负面影响。","module":"毛概","title":"第四章 · 社会主义建设道路初步探索的理论成果"},{"chapter":"第四章","section":"多选","no":11,"stem":"1957年2月，毛泽东在《关于正确处理人民内部矛盾的问题》的报告强调：在我们面前有两类社会矛盾，这就是敌我矛盾和人民内部矛盾，这是两类性质完全不同的矛盾。在我国，由于民族资产阶级有两面性，工人阶级同民族资产阶级的矛盾属于（　　）","opts":{"A":"人民内部的矛盾","B":"敌我矛盾","C":"对抗性矛盾","D":"非对抗性矛盾"},"ans":"AD","point":"正确认识和处理社会主义社会矛盾的思想","explain":"人民内部矛盾是在人民根本利益一致基础上的矛盾，因而是非对抗性的矛盾。毛泽东特别指出，在我国，由于民族资产阶级有两面性，工人阶级同民族资产阶级的矛盾属于人民内部的矛盾。应选A、D两项。敌我矛盾是人民同反抗社会主义革命、敌视和破坏社会主义建设的社会势力和社会集团的矛盾，这是根本利益对立基础上的矛盾，因而是对抗性的矛盾。B、C选项不符合题意。","notes":"①「A、D选项」人民内部矛盾是在人民根本利益一致基础上的矛盾，因而是非对抗性的矛盾。毛泽东特别指出，在我国，由于民族资产阶级有两面性，工人阶级同民族资产阶级的矛盾属于人民内部的矛盾\n②「A、D选项」民族资产阶级具有两面性：在社会主义革命时期，民族资产阶级既有剥削工人取得利润的一面，又有拥护中国共产党的领导、拥护宪法、愿意接受社会主义改造的一面。民族资产阶级和工人阶级之间存在着的剥削和被剥削的对抗性矛盾，如果处理得当，可以转变为非对抗性的矛盾，可以用和平的方法解决这个矛盾","tips":"","module":"毛概","title":"第四章 · 社会主义建设道路初步探索的理论成果"},{"chapter":"第四章","section":"多选","no":12,"stem":"实现工业化是中国近代以来历史发展的必然要求，也是国家独立和富强的必要条件。新中国成立初期，我国曾一度过多强调重工业和基础设施的发展，影响了农业和轻工业的发展，造成了一定程度的比例失调，这就促使毛泽东和党的其他领导人思考如何走出一条适合中国国情的工业化道路的问题。走中国工业化道路，必须（　　）","opts":{"A":"采取正确的经济建设方针","B":"保护民族工商业","C":"调整和完善所有制结构","D":"积极探索适合我国情况的经济体制和运行机制"},"ans":"ACD","point":"走中国工业化道路的思想","explain":"走中国工业化道路，必须采取正确的经济建设方针，必须调整和完善所有制结构，必须积极探索适合我国情况的经济体制和运行机制。应选A、C、D。保护民族工商业的政策是新民主主义经济纲领的内容，并非社会主义经济建设的内容。B选项是干扰项。","notes":"①「B选项」保护民族工商业的政策是新民主主义经济纲领的内容，并非社会主义经济建设的内容新民主主义的经济纲领的内容：没收封建地主阶级的土地归农民所有，没收官像资产阶级的垄断资本归新民主主义的国家所有，保护民族工商业\n③「B选项」中国工业化道路特指社会主义改造基本完成后的阶段，此时社会主义制度已确立，工作重心正式转向发展生产力和实现工业化，而非改造初期以制度变革为主的阶段。只有在社会主义制度确立后，才能真正探索“社会主义工业化”道路。","tips":"到1956年底，全国基本实现了对资本主义工商业的社会主义改造，民族工商业已转变为社会主义公有制经济的一部分。此时党的工作重点已从社会主义改造转向社会主义建设。题干讨论的是“中国工业化道路”，特指社会主义改造基本完成后，如何进一步发展工业化的阶段，此时民族工商业已不再是独立的经济成分。","module":"毛概","title":"第四章 · 社会主义建设道路初步探索的理论成果"},{"chapter":"第四章","section":"多选","no":13,"stem":"在社会主义建设时期，党领导人民探索社会主义建设道路，历经艰辛和曲折，在理论和实践上取得了一系列重要成果。这些成果对于巩固我国社会主义制度，开创和发展中国特色社会主义，促进世界社会主义的发展，具有重要意义。这体现在（　　）","opts":{"A":"巩固和发展了社会主义制度","B":"为开创中国特色社会主义提供了宝贵经验、理论准备、物质基础","C":"丰富了科学社会主义的理论和实践","D":"完成了马克思主义与中国实际相结合"},"ans":"ABC","point":"","explain":"初步探索的意义为开创中国特色社会主义提供了宝贵经验、理论准备、物质基础。第三，丰富了科学社会主义的理论和实践。应选A、B、C。由于我们对马克思主义关于社会主义的一些基本原理的理解不够深入，对中国的基本国情缺乏深刻认识，没有完全搞清楚什么是社会主义、怎样建设社会主义的问题，也没有完全摆脱苏联模式的影响，采取了一些脱离实际、超越发展阶段的政策和措施，导致我国社会主义建设道路的探索遭遇严重曲折。所以说成功实现了马克思主义与中国具体实际的第二次结合是错误的。D选项错误。","notes":"马克思主义与中国实际的“第一次结合”是指马克思主义与新民主主义革命结合，第一次结合的理论成果是毛泽东思想马克思主义与中国实际的“第二次结合”是指马克思主义与中国社会主义建设相结合；毛泽东提出这而非一次完成的终点，时至今日我们依然在结合的路上","tips":"","module":"毛概","title":"第四章 · 社会主义建设道路初步探索的理论成果"},{"chapter":"第五章","section":"单选","no":1,"stem":"第一次比较系统地初步回答了在中国这样的经济文化比较落后的国家如何建设社会主义、如何巩固和发展社会主义的一系列基本问题，用新的思想观点，继承和发展了马克思主义，开拓了马克思主义新境界，把对社会主义的认识提高到新的科学水平，成为中国特色社会主义理论体系开篇之作的是（　　）","opts":{"A":"毛泽东思想","B":"邓小平理论","C":"“三个代表”重要思想","D":"科学发展观"},"ans":"B","point":"","explain":"中国特色社会主义理论体系的形成和指导意义，进一步论述了邓小平对这一理论的创立作出的独创性贡献。邓小平理论第一次比较系统地初步回答了在中国这样的经济文化比较落后的国家如何建设社会主义、如何巩固和发展社会主义的一系列基本问题，用新的思想观点，继承和发展了马克思主义，开拓了马克思主义新境界，把对社会主义的认识提高到新的科学水平，是中国特色社会主义理论体系的开篇之作。应选B。会主义理论体系的开篇之作。“三个代表”重要思想、科学发展观也属于中国特色社会主义理论体系的内容，但时间晚于邓小平理论，也不是开篇之作。A、C、D选项不符合题意。","notes":"①「B选项」中国特色社会主义理论体系，是在认真总结我国社会主义建设正反两方面的历史经验、科学判断党和国家发展所处历史方位的基础上形成并不断发展的。邓小平理论是中国特色社会主义理论体系的开篇之作，因此，邓小平理论的形成过程也就是中国特色社会主义理论体系的形成过程毛泽东思想不涉及改革，中国特色社会主义理论体系和习近平新时代中国特色社会主义思想不涉及中国革命","tips":"","module":"毛概","title":"第五章 · 中国特色社会主义理论体系的形成发展"},{"chapter":"第五章","section":"单选","no":2,"stem":"1982年邓小平在党的十二大开幕词中明确提出：走自己的道路，建设有中国特色的社会主义。从此，“中国特色社会主义”成为（　　）","opts":{"A":"毛泽东思想的活的灵魂","B":"社会主义初级阶段基本路线的核心内容","C":"我们党的全部理论和实践创新的主题","D":"改革开放和社会主义现代化建设的唯一纲领"},"ans":"C","point":"中国特色社会主义理论体系的形成","explain":"1982年邓小平在党的十二大开幕词中明确提出：走自己的道路，建设有中国特色的社会主义。从此，“中国特色社会主义”成为我们党的全部理论和实践创新的主题。应选C。A选项错误，毛泽东思想的活的灵魂是实事求是、群众路线、独立自主；B选项错误，“社会主义初级阶段基本路线”的核心内容是1987年十三大提出的“一个中心、两个基本点”；D选项错误，“唯一纲领”表述绝对化，中国特色社会主义在不同时期有具体纲领（如社会主义初级阶段纲领、新时代纲领），“唯一”一词违背理论发展的开放性。","notes":"关于邓小平理论的总结：1）主题形成于十二大2）轮廓形成于十三大3）走向成熟南方谈话4）邓小平理论正式提出于十五大，并写入党章\n②「C选项」关于中共十二大（1982年）的知识点总结：1）1982年邓小平在党的十二大开幕词中明确提出走自己的道路，建设有中国特色的社会主义。正式提出了“建设有中国特色的社会主义”的新命题，成为我们党全部理论和实践创新的主题2）制定全面开创社会主义现代化建设新局面的纲领3）邓小平理论主题的形成4）自十二大起，按照党章规定，党的全国代表大会每五年召开一次，实现了制度化\n③「A选项」十一届六中全会（1981年）科学概括了毛泽东思想的科学内涵和主要内容，指出毛泽东思想活的灵魂是实事求是、群众路线、独立自主4「B选项」十三大第一次比较系统地阐述了社会主义初级阶段理论，明确概括了党的“一个中心、两个基本点”的基本路线一以经济建设为中心，坚持四项基本原则，坚持改革开放","tips":"中国特色社会主义在不同时期有不同的具体纲领（如社会主义初级阶段纲领、新时代纲领），“唯一纲领”表述太过绝对。","module":"毛概","title":"第五章 · 中国特色社会主义理论体系的形成发展"},{"chapter":"第五章","section":"多选","no":3,"stem":"党的十九大、十九届六中全会提出的“十个明确”“十四个坚持”“十三个方面成就”概括了习近平新时代中国特色社会主义思想的主要内容。习近平新时代中国特色社会主义思想科学回答的重大时代课题包括（　　）","opts":{"A":"传承什么样的中华优秀传统文化、怎样传承中华优秀传统文化","B":"新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义","C":"建设什么样的社会主义现代化强国、怎样建设社会主义现代化强国","D":"建设什么样的长期执政的马克思主义政党、怎样建设长期执政的马克思主义政党"},"ans":"BCD","point":"中国特色社会主义理论体系在新时代的新篇章","explain":"党的十九大、十九届六中全会提出的“十个明确”“十四个坚持”“十三个方面成就”概括了习近平新时代中国特色社会主义思想的主要内容。习近平新时代中国特色社会主义思想科学回答了新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义，建设什么样的社会主义现代化强国、怎样建设社会主义现代化强国，建设什么样的长期执政的马克思主义政党、怎样建设长期执政的马克思主义政党等重大时代课题。应选B、C、D。习近平新时代中国特色社会主义思想坚持把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合，并不是回答传承什么样的中华优秀传统文化，怎样传承中华优秀传统文化的课题。排除A选项。","notes":"邓小平理论回答的基本问题：什么是社会主义，怎样建设社会主义“三个代表”重要思想回答的基本问题：建设什么样的党、怎样建设党科学发展观回答的基本问题：实现什么样的发展、怎样发展4「B、C、D选项」习近平新时代中国特色社会主义思想回答的重大时代课题：1）新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义2）建设什么样的社会主义现代化强国、怎样建设社会主义现代化强国3）建设什么样的长期执政的马克思主义政党、怎样建设长期执政的马克思主义政党","tips":"","module":"毛概","title":"第五章 · 中国特色社会主义理论体系的形成发展"},{"chapter":"第六章","section":"单选","no":1,"stem":"党的十三大召开前夕，邓小平强调指出：“社会主义本身是共产主义的初级阶段，而我们中国又处在社会主义的初级阶段，就是不发达的阶段。一切都要从这个实际出发，根据这个实际来制订规划。”这一论述（　　）","opts":{"A":"首次提出了社会主义初级阶段概念","B":"首次系统阐述了社会主义初级阶段理论","C":"首次把社会主义初级阶段作为事关全局的基本国情加以把握","D":"首次对社会主义发展阶段进行了划分"},"ans":"C","point":"","explain":"礻社会主义初级阶段理论和党的基本路线是处在初级阶段，是初级阶段的社会主义。社会主义本身是共产主义的初级阶段，而我们中国又处在社会主义的初级阶段，就是不发达的阶段。一切都要从这个实际出发，根据这个实际来制订规划。”这个论述，第一次把社会主义初级阶段作为事关全局的基本国情加以把握，明确了这一问题是制定路线、政策的出发点和根本依据。党的十三大对社会主义初级阶段和党的基本路线的系统阐述，表明了党对社会主义和中国国情认识上的一次飞跃。A选项“首次提出了社会主义初级阶段概念”是在1978年党的十一届三中全会前后；B选项“首次系统阐述了社会主义初级阶段理论”是在党的十三大上；D选项“首次对社会主义发展阶段进行了划分”是在20世纪50年代末60年代初毛泽东在读苏联《政治经济学教科书》时。","notes":"①「B选项」关于中共十三大（1987年）的知识点总结：1）制定“三步走”发展战略基本路线以经济建设为中心，坚持四项基本原则，坚持改革开放3)提出了社会主义初级阶段的基本路线，第一次对中国特色社会主义理论进行系统地概括4）标志着邓小平理论轮廓的形成\n②「A选项」首次提出社会主义初级阶段概念是在1978年党的十一届三中全会前后\n③「D选项」在探索中国社会主义建设道路过程中，毛泽东提出：社会主义这个阶段，又可能分为两个阶段，第一个阶段是不发达的社会主义，第二个阶段是比较发达的社会主义。后一阶段可能比前一阶段需要更长的时间","tips":"邓小平在十三大前夕的论述主要是概括性的，邓小平明确指出：“一切都要从这个实际出发，根据这个实际来制订规划”，这标志着社会主义初级阶段从一个理论概念上升为指导国家发展全局的基本国情。此题很多同学不仔细审题，题千材料问的是十三大前夕这一句论述体现的意义，而不是选十三大具体包含的内容。","module":"毛概","title":"第六章 · 邓小平理论"},{"chapter":"第六章","section":"单选","no":2,"stem":"新中国成立以后，以毛泽东同志为主要代表的中国共产党人在探索什么是社会主义、怎样建设社会主义的过程中，提出了一系列关于社会主义建设的重要思想，取得了巨大成就，为社会主义建设积累了宝贵经验，但在探索中也出现了不少失误。党对我国社会主义建设经验教训和社会主要矛盾进行科学分析得出的最重要的结论是（　　）","opts":{"A":"以阶级斗争为纲推动社会发展","B":"中国长期处在社会主义初级阶段","C":"党和国家的工作重点是科技工作","D":"社会主义的根本任务是发展生产力"},"ans":"D","point":"礻社会主义改革开放和社会主义市场经济理论","explain":"党的十一届三中全会以后，我们党把工作重点转移到经济建设上来，强调社会主义的根本任务是发展生产力。社会主义的根本任务是发展生产力，党和国家的工作重点是经济建设，这是党对我国社会主义建设经验教训和社会主要矛盾进行科学分析得出的最重要的结论。应选D。A选项“以阶级斗争为纲”是1957年后“左”倾错误的产物，违背了对社会主要矛盾的正确分析，并非科学结论；B选项“我们的社会主义制度还是处于初级的阶段”是总结了新中国成立以后我们党在认识社会主义发展阶段问题上的经验教训得出的结论；C选项党和国家的工作重点是经济建设，而不仅仅是科技工作。","notes":"「D选项」党的十一届三中全会以后，我们党把工作重点转移到经济建设上来，强调社会主义的根本任务是发展生产力2②「A选项」十一届三中全会果断停止使用“以阶级斗争为纲”的口号，决定从1979年1月起把全党的工作重心转移到社会主义现代化建设上来，提出了改革开放的任务","tips":"","module":"毛概","title":"第六章 · 邓小平理论"},{"chapter":"第六章","section":"单选","no":3,"stem":"邓小平曾深刻指出：“我们建设社会主义的方向是完全正确的，但什么叫社会主义，怎样建设社会主义，还在摸索之中。”他反思过去社会主义建设中的教训，认为“问题是什么是社会主义，如何建设社会主义。我们的经验教训有许多条，最重要的一条，就是要搞清楚这个问题。”在改革开放初期，面对种种疑虑和争论，邓小平尖锐地提出：“不解放思想不行，甚至于包括什么叫社会主义这个问题也要解放思想。”邓小平之所以反复强调必须首先搞清楚“什么是社会主义、怎样建设社会主义”这个根本问题，并提出社会主义本质论，主要是为了从根本上（　　）","opts":{"A":"纠正照搬照抄苏联社会主义具体模式的教条主义做法","B":"纠正脱离生产力发展水平、抽象地谈论社会主义的错误认识","C":"纠正否定社会主义基本制度、主张走资本主义道路的错误倾向","D":"纠正忽视上层建筑对经济基础反作用的片面性认识"},"ans":"B","point":"邓小平理论首要的基本的理论问题和精髓","explain":"题干引用了邓小平关于要“搞清楚”社会主义的系列论述，其历史背景是我国在改革开放前曾长期存在离开生产力发展，抽象地从“一大二公”、平均主义等观念出发来界定和建设社会主义的倾向，导致实践中出现偏差。邓小平的社会主义本质论，正是为了正本清源，将人们对社会主义的认识从抽象的观念和僵化的模式中解放出来，扎根于生产力发展的现实基础。B选项准确指出了这一理论的主要针对性。A选项是干扰项，虽然我国曾学习苏联模式，但邓小平反思的问题核心并非单纯针对“苏联模式”这一具体形态，而是针对更为普遍的、脱离生产力抽象谈论社会主义的思维方式；C选项同为干扰项，邓小平提出本质论时，国内主要思想僵化问题并非“否定社会主义基本制度”，而是对“什么是社会主义”认识不清，本质论恰恰是在坚持社会主义基本制度的基础上深化认识；D选项也是干扰项，本质论聚焦于澄清对社会主义根本属性的认识，其核心纠偏对象并非“忽视上层建筑反作用”这一具体哲学观点。","notes":"①「B选项」邓小平指出：社会主义的本质，是解放生产力，发展生产力，消灭剥削，消除两极分化，最终达到共同富裕。这一论断把解放和发展生产力置于社会主义本质的核心位置，直接针对脱离生产力发展水平、抽象谈论社会主义的错误认识","tips":"此题需要从材料中获取关键信息，邓小平指出：“我们总结了几十年搞社会主义的经验，社会主义是什么，马克思主义是什么，过去我们并没有完全搞清楚。”这表明他关注的是对社会主义本质的重新认识，而不仅仅是纠正照搬苏联模式。","module":"毛概","title":"第六章 · 邓小平理论"},{"chapter":"第六章","section":"单选","no":4,"stem":"所谓精髓，对于理论而言，指的是能使这一理论得以形成和发展并贯穿始终，同时又体现在这一理论中最本质的东西。邓小平理论的精髓是（　　）","opts":{"A":"社会主义初级阶段理论","B":"解放思想、实事求是","C":"三个有利于标准","D":"四项基本原则"},"ans":"B","point":"邓小平理论的精髓","explain":"解放思想、实事求是贯穿邓小平理论形成发展的全过程，是这一理论中最本质的东西。解放思想、实事求是，是邓小平理论的精髓。应选B。A选项社会主义初级阶段理论是邓小平理论的重要基石，它科学判断了我国的基本国情，为制定路线方针政策提供了依据。但该理论属于对具体国情的分析，而非贯穿整个理论的核心方法论；C选项“三个有利于”标准（是否有利于发展社会主义社会的生产力，是否有利于增强社会主义国家的综合国力，是否有利于提高人民的生活水平）是判断改革成效的实践准则，属于邓小平理论的具体内容。它是解放思想、实事求是在实践中的应用，而非理论的精髓本身；D选项四项基本原则（坚持社会主义道路、坚持人民民主专政、坚持中国共产党的领导、坚持马克思列宁主义毛泽东思想）是立国之本，属于党的基本路线的重要内容。虽然它们是改革开放和现代化建设的政治保证，但并非邓小平理论的精髓。","notes":"毛泽东思想活的灵魂即实事求是，群众路线，独立自主，其中实事求是是毛泽东思想的基本点，是毛泽东思想的精髓\n②「B选项」邓小平理论的活的灵魂、邓小平理论的精髓是解放思想、实事求是","tips":"","module":"毛概","title":"第六章 · 邓小平理论"},{"chapter":"第六章","section":"多选","no":5,"stem":"1992年初，邓小平在南方谈话中对社会主义本质作出了总结性的理论概括，他指出：“社会主义的本质，是解放生产力，发展生产力，消灭剥削，消除两极分化，最终达到共同富裕。”这一科学概括（　　）","opts":{"A":"既坚持了科学社会主义的基本原则，又赋予其鲜明的时代特色","B":"摆脱了长期以来忽视建设社会主义根本目的和目标的认识，是探索中国特色社会主义取得的重大理论成果之一","C":"破除了脱离生产力水平抽象谈论社会主义的认识，是对马克思主义的重大发展","D":"既包括了社会主义社会的生产力问题，又包括了社会主义社会的生产关系问题"},"ans":"ABCD","point":"邓小平理论首要的基本的理论问题","explain":"1992年初，邓小平在南方谈话中指出：“社会主义的本质，是解放生产力，发展生产力，消灭剥削，消除两极分化，最终达到共同富裕。”这一概括一方面强调必须集中力量解放和发展生产力，另一方面指出解放和发展生产力的手段和目的。他提出的社会主义本质理论突出强调消灭剥削、消除两极分化，最终达到共同富裕这一社会主义发展的目标，破除了脱离生产力水平抽象谈论社会主义的认识，并从生产力和生产关系两个方面阐明了实现这个目标的途径。这一科学概括，既坚持了科学社会主义的基本原则，又赋予其鲜明的时代特色，是探索中国特色社会主义取得的重大理论成果之一，是对马克思主义的重大发展。A、B、C、D选项均正确。","notes":"","tips":"","module":"毛概","title":"第六章 · 邓小平理论"},{"chapter":"第六章","section":"多选","no":6,"stem":"邓小平指出：“改革是中国的第二次革命”，这一论断的含义是指（　　）","opts":{"A":"改革与第一次革命具有相同的内容","B":"改革也是为了扫除发展社会生产力的障碍，使中国摆脱贫穷落后的状态","C":"改革的实质和目标是要从根本上改变束缚我国生产力发展的经济体制","D":"改革引起社会生活各方面的深刻变化"},"ans":"BCD","point":"社会主义改革开放和社会主义市场经济理论","explain":"改革是一场深刻的社会变革，是中国的第二次革命，是实现中国现代化的必由之路。邓小平指出：“改革的性质同过去的革命一样，也是为了扫除发展社会生产力的障碍，使中国摆脱贫穷落后的状态。从这个意义上说，改革也可以叫革命性的变革。”改革的实质和目标是要从根本上改变束缚我国生产力发展的经济体制，建立充满生机和活力的社会主义新经济体制，同时相应地改革政治体制和其他方面的体制，以实现中国的社会主义现代化邓小平讲改革是一场革命，是中国的第二次革命，是相对于第一次革命来谈的。党领导的第一次革命将半殖民地半封建的旧中国变成一个社会主义新中国，第二次革命则要把一个经济文化比较落后的社会主义中国变成一个富强民主文明的社会主义现代化中国。两者在革命的对象、革命的形式、革命的性质和所要解决模块的矛盾上都是不同的。所以，A选项不正确。","notes":"「A选项」改革也是一次革命，马克思主义里的“革命”，核心是“根本的、颠覆性的变革”，不是简单的“改变/微调”，也不只有“流血牺性的暴力革命”这一种形式一一暴力革命只是特定历史条件下的革命形式，和平条件下的“根本变革”（改革），在马克思主义视角下也叫革命。简单说：普通改变是“修修补补”，革命是“连根拔起、重建新秩序”。革命性的反义词就是保守成规，一成不变，一潭死水中国共产党一开始就是一个区别于第二国际旧式社会改良党的新型工人阶级革命政党","tips":"改革与第一次革命（新民主主义革命）在性质和内容上有本质区别。第一次革命是推翻旧制度、建立新制度的阶级斗争，而改革是在社会主义制度框架内的自我完善。","module":"毛概","title":"第六章 · 邓小平理论"},{"chapter":"第六章","section":"多选","no":7,"stem":"“计划经济不等于社会主义，资本主义也有计划；市场经济不等于资本主义，社会主义也有市场。”邓小平这一论断的内涵是（　　）","opts":{"A":"计划和市场都属于社会基本制度的范畴","B":"计划和市场都是资源配置的方式","C":"计划和市场不是社会主义与资本主义的本质区别","D":"计划和市场是不能兼容的"},"ans":"BC","point":"社会主义改革开放和社会主义市场经济理论","explain":"邓小平关于社会主义市场经济体制的理论，搞清了什么是社会主义，怎样建设社会主义这样一个关键问题，极大地推动了中国经济的发展和社会的进步。这一理论，具有深刻和丰富的内涵：第一，计划经济和市场经济不是区分社会主义和资本主义的标志，它们不属于社会基本制度的范畴，而是资源配置的不同方式。第二，社会主义实行市场经济是为了更有效地发展社会生产力，社会主义与市场经济之间不存在根本矛盾。第三，计划和市场都是调节经济的手段，计划多一点，还是市场多一点，不是社会主义与资本主义的区别。故B、C选项是正确的。而A选项把计划和市场看作属于社会基本制度的范畴，显然是错误的；D选项认为计划和市场不能兼容，和邓小平计划和市场关系的理论不一致，也是错误的。","notes":"①「A选项」计划和市场都是调节经济的手段，属于社会基本经济体制，是不同的资源配置方式，而不是社会基本制度范畴\n②「B、C选项」在南方谈话中（1992年），邓小平明确提出：计划经济不等于社会主义，资本主义也有计划；市场经济不等于资本主义，社会主义也有市场。计划多一点还是市场多一点，不是社会主义与资本主义的本质区别。计划和市场都是经济手段\n③「D选项」市场经济作为资源配置的一种方式本身不具有制度属性，可以和不同的社会制度结合，从而表现出不同的性质：坚持社会主义制度与市场经济的结合，是社会主义市场经济的特色所在、优势所在","tips":"","module":"毛概","title":"第六章 · 邓小平理论"},{"chapter":"第六章","section":"多选","no":8,"stem":"1992年，邓小平在南方谈话中明确指出：“计划多一点还是市场多一点，不是社会主义与资本主义的本质区别。计划经济不等于社会主义，资本主义也有计划；市场经济不等于资本主义，社会主义也有市场。计划和市场都是经济手段。”这一精辟论述（　　）","opts":{"A":"明确把建立社会主义市场经济体制作为我国经济体制改革的目标","B":"从理论上突破了计划经济和市场经济是制度属性的观念","C":"从根本上解除了把计划经济和市场经济看作属于社会基本制度范畴的思想束缚","D":"标志着邓小平的社会主义市场经济理论的形成"},"ans":"BCD","point":"社会主义改革开放和社会主义市场经济理论","explain":"1992年，邓小平在南方谈话中明确指出：“计划多一点还是市场多一点，不是社会主义与资本主义的本质区别。计划经济不等于社会主义，资本主义也有计划；市场经济不等于资本主义，社会主义也有市场。计划和市场都是经济手段。”这一精辟论述，从理论上突破了计划经济和市场经济是制度属性的观念，从根本上解除了把计划经济和市场经济看作属于社会基本制度范畴的思想束缚，标志着邓小平的社会主义市场经济理论的形成。应选B、C、D。这一论述为党的十四大明确把建立社会主义市场经济体制作为我国经济体制改革的目标奠定了理论基础，不能说它直接确定了这一目标。A是干扰项。","notes":"①「A选项」1992年党的十四大确立了社会主义市场经济体制的改革目标是建立社会主义市场经济体制，坚持社会主义制度与市场经济的结合\n②「B、C、D选项」关于1992年南方谈话的知识点总结：1）计划和市场都是经济手段；邓小平明确提出：计划经济不等于社会主义，资本主义也有计划；市场经济不等于资本主义，社会主义也有市场。市场经济作为资源配置的一种方式本身不具有制度属性，可以和不同的社会制度结合，从而表现出不同的性质2）阐明了社会主义本质一一解放生产力，发展生产力，消灭剥削，消除两极分化，最终达到共同富裕3）提出“发展才是硬道理”4）提出“改革开放胆子要大一些和三个有利于标准”判断改革和各方面工作是非得失，归根到底要看是否有利于发展社会主义社会的生产力，是否有利于增强社会主义国家的综合国力，是否有利于提高人民的生活水平为标准5）指出社会主义初级阶段的长期性和前途：阐述社会主义初级阶段长期性和社会主义必将代替资本主义6）强调加强党的建设，南方谈话推进改革开放和社会主义现代化建设进入新阶段，深刻回答了长期困扰和束缚人们思想的许多重大问题，是把改革开放和现代化建设推向新阶段的又一个解放思想实事求是的宣言书。标志邓小平理论逐步走向成熟，是邓小平理论的集大成之作，对十四大具有指导作用、对社会主义现代化建设事业具有重大意义","tips":"","module":"毛概","title":"第六章 · 邓小平理论"},{"chapter":"第七章","section":"单选","no":1,"stem":"社会主义的根本任务是发展社会生产力，马克思主义执政党必须高度重视解放和发展生产力。我们党建立时就是以中国先进生产力的代表走上历史舞台的。发展生产力的决定因素是（　　）","opts":{"A":"丰富的自然资源储备","B":"完善的市场机制和体系","C":"广大工人、农民和知识分子","D":"科技进步和创新配套课程"},"ans":"D","point":"始终代表中国先进生产力的发展要求","explain":"科技进步和创新是发展生产力的决定因素。只有大力推进知识创新、科技创新，才能实现科学技术的跨越式发展。先进生产力的发展是同生产关系、上层建筑的不断完善密切联系在一起的。丰富的自然资源储备是生产力发展的重要物质基础。自然资源本身并不能直接转化为生产力，需要通过科技手段进行开发和利用。完善的市场机制和体系对于生产力发展具有重要的促进作用。它可以优化资源配置，提高生产效率，激发市场活力。但市场机制只是为生产力发展提供了一个良好的外部环境，它本身并不能直接创造生产力，所以完善的市场机制和体系不是决定生产力发展的关键因素。广大工人、农民和知识分子始终是推动我国先进生产力发展和社会全面进步的根本力量。但劳动者的能力和水平的发挥，很大程度上依赖于科技进步所带来的知识和技能的提升，所以广大工人、农民和知识分子不能单独作为发展生产力的决定因素。A、B、C选项都不符合题意。","notes":"1「D选项」科技进步和创新是发展生产力的决定因素。创新是引领发展的第一动力","tips":"","module":"毛概","title":"第七章 · “三个代表”重要思想"},{"chapter":"第七章","section":"多选","no":2,"stem":"党要承担起推动中国社会进步的历史责任，必须始终紧紧抓住发展这个执政兴国的第一要务。发展之所以成为中国共产党执政兴国的第一要务，是因为（　　）","opts":{"A":"发展是坚持党的先进性的要求","B":"发展是国际竞争中赢得主动的需要","C":"用发展的办法解决前进中的问题，是改革开放以来我们的一条重要经验","D":"发展是硬道理，中国解决所有问题的关键在于依靠自己的发展"},"ans":"ABCD","point":"发展是党执政兴国的第一要务","explain":"党要承担起推动中国社会进步的历史责任，必须始终紧紧抓住发展这个执政兴国的第一要务，把坚持党的先进性和发挥社会主义制度的优越性，落实到发展先进生产力、发展先进文化、实现最广大人民的根本利益上来，推动社会全面进步，促进人的全面发展。中国特色社会主义是靠发展来不断巩固和推进的。发展是在国际竞争中赢得主动的需要。用发展的办法解决前进中的问题，是改革开放以来我们的一条重要经验。发展是硬道理，中国解决所有问题的关键在于依靠自己的发展。A、B、C、D选项均正确。","notes":"发展是党执政兴国的第一要务，要正确认识和处理改革、发展、稳定的关系，改革是动力，发展是目的，稳定是前提。把不断改善人民生活作为处理改革、发展、稳定关系的重要结合点","tips":"","module":"毛概","title":"第七章 · “三个代表”重要思想"},{"chapter":"第八章","section":"单选","no":1,"stem":"发展社会主义民主政治，坚持中国特色社会主义政治发展道路，最根本的是要（　　）","opts":{"A":"坚持党的领导、人民当家作主和依法治国的有机统一","B":"实现民主政治的制度化、规范化、程序化","C":"充分发挥人民群众的监督作用","D":"有领导、有步骤地推进政治体制改革"},"ans":"A","point":"发展社会主义民主政治","explain":"中共十六大报告明确指出：“发展社会主义民主政治，最根本的是要把坚持党的领导、人民当家作主和依法治国有机统一起来。”所以，正确选项是A。B、C、D选项都是发展社会主义民主政治的重要内容，并非根本。","notes":"①「A选项」中共十六大报告明确指出：发展社会主义民主政治，最根本的是要把坚持党的领导、人民当家作主和依法治国有机统一起来。其中，党的领导是人民当家作主和依法治国的根本保证，人民当家作主是社会主义民主政治的本质和核心，依法治国是党领导人民治理国家的基本方略真题思维点技就算没记住，题干问法有“根本”二字，也优先选择包含“党的领导”的选项。","tips":"","module":"毛概","title":"第八章 · 科学发展观"},{"chapter":"第八章","section":"单选","no":2,"stem":"京津冀协同发展国家战略实施以来，取得系列突破。北京疏解非首都功能，为高精尖产业腾出空间；产业协作深化，探索“北京研发、津冀转化”模式；生态治理上建立流域横向生态补偿机制，依据水质考核结果进行资金横向转移；交通构建“轨道上的京津冀”，发展跨省公交，打造“1小时通勤圈”；公共服务方面，实现异地就医医保直接结算全覆盖。这一系列从功能疏解、产业协同、生态共保、交通互联到民生共享的多领域、跨区域的复杂实践，最为深刻地诠释了科学发展的根本方法是（　　）","opts":{"A":"统筹兼顾","B":"全面协调可持续","C":"以人为本","D":"快速发展"},"ans":"A","point":"统筹兼顾是科学发展观的根本方法","explain":"题干以京津冀协同发展的丰富实践为材料，系统展示了其在统筹非首都功能疏解与承接、统筹产业创新协作与布局、统筹生态环境保护与补偿、统筹交通基础设施互联互通、统筹公共服务共建共享等多维度、多领域的复杂关系与利益。这一战略实践的核心特征在于运用系统思维，兼顾了北京与津冀、疏解与提升、经济发展与生态保护、硬件联通与软件共享等多重重大关系，这正是统筹兼顾根本方法的生动体现和成功运用。应选A。B选项“全面协调可持续”是科学发展观的基本要求，强调发展的整体性、平衡性和持久性，虽然京津冀协同发展也体现了这些特点，但题干材料更侧重于通过主动“统筹”各方利益与关系来达成“协调”与“可持续”，其方法论指向更为具体和直接。C选项“以人为本”是科学发展观的核心，强调发展的目的是为了人，材料中民生共享体现了这一点，但并非贯穿整个复杂系统工程最突出的方法论原则。D选项“快速发展”不符合科学发展更重质量与效益的要求。","notes":"①「A选项」统筹兼顾是科学发展观的根本方法，强调在发展中要总搅全局、协调各方利益、妥善处理各种关系添真题思维点拔材料中的京津冀协同发展正是通过统筹三地资源、打破行政壁垒、协调功能定位，实现了从“一城一地”到“一盘棋”的转变。这种全局思维和系统谋划，正是统等兼顾方法的核心体现。","tips":"","module":"毛概","title":"第八章 · 科学发展观"},{"chapter":"导论","section":"单选","no":1,"stem":"习近平总书记强调，坚持用马克思主义之“矢去射新时代中国之“的”，必须牢牢把握新时代的历史方位和实践要求。这一重要论述强调的是（　　）","opts":{"A":"要在不断总结新鲜经验中进一步丰富和发展科学社会主义基本原则","B":"必须坚持对待马克思主义的科学态度","C":"把马克思主义基本原理与中华优秀传统文化相结合","D":"把马克思主义基本原理同中国具体实际相结合"},"ans":"D","point":"习近平新时代中国特色社会主义思想是“两个结合”的重大成果","explain":"题干中“用马克思主义之‘矢’射新时代中国之‘的’”，强调以马克思主义理论为指导（“矢”)，解决中国实际问题（“的”），核心是坚持理论与实践的统一，体现了“把马克思主义基本原理同中国具体实际相结合”的要求。应选D。要在不断总结新鲜经验中进一步丰富和发展科学社会主义基本原则，探索社会主义道路，必须坚持对待马克思主义的科学态度。这些都是正确把握科学社会主义基本原则的态度，A、B选项不符合题意。C选项是“两个结合”的重要内容（与中华优秀传统文化相结合），但题干侧重“新时代中国之“的””，即当前中国具体实际，而非文化层面的结合，故不选。","notes":"①「D选项」习近平新时代中国特色社会主义思想是马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合的重大成果，是坚持“两个结合”的光辉典范“两个结合”是我们党在探索中国特色社会主义道路中得出的规律性认识，是我们取得成功的最大法宝新时代中国特色社会主义思想坚持把马克思主义基本原理同中国具体实际相结合，用马克思主义之“失”去射新时代中国之“的”，是最现实、最鲜活的中国化时代化的马克思主义“两个结合”让中国特色社会主义道路有了更加宏阔深远的历史纵深，拓展了中国特色社会主义道路的文化根基，开辟了广阔的理论和实践创新空间，表明我们党对中国道路、理论、制度的认识达到了新高度，表明我们党的历史自信、文化自信达到了新高度，表明我们党在传承中华优秀传统文化中推进理论创新的自觉性达到了新高度（三个新高度）","tips":"题干中用马克思主义之“矢”去射新时代中国之“的”这一句话也明显是强调把马克思主义基本原理同中国具体实际相结合的意思。","module":"习思想","title":"导论"},{"chapter":"导论","section":"单选","no":2,"stem":"习近平新时代中国特色社会主义思想内涵十分丰富，体现着理论和实际相结合、认识论和方法论相统一，其中习近平新时代中国特色社会主义思想的世界观、方法论和贯穿其中的立场观点方法的重要体现是（　　）","opts":{"A":"“十个明确”","B":"“十四个坚持”","C":"“十三个方面成就”","D":"“六个必须坚持”"},"ans":"D","point":"习近平新时代中国特色社会主义思想是完整的科学体系","explain":"党的二十大提出的“六个必须坚持”，是习近平新时代中国特色社会主义思想的世界观、方法论和贯穿其中的立场观点方法的重要体现。应选D。党的十九大、十九届六中全会提出的“十个明确”“十四个坚持”“十三个方面成就”概括了习近平新时代中国特色社会主义思想的主要内容。“十个明确”是习近平新时代中国特色社会主义思想的主体内容，集中体现了这一思想体系的主要观点和基本精神，构成了这一思想体系的四梁八柱，发挥着统摄作用。“十四个坚持”是习近平新时代中国特色社会主义思想的重要组成部分，是在治国理政各方面作出的理论分析和政策指导，构成了新时代坚持和发展中国特色社会主义的基本方略。“十三个方面成就”对新时代伟大实践进行了科学总结，全景式地展示了习近平新时代中国特色社会主义思想的理论与实践成果。A、B、C选项均不符合题意。","notes":"①「D选项」习近平新时代中国特色社会主义思想科学体系=主要内容（“十个明确”“十四个坚持”“十三个方面成就”）+世界观和方法论（“六个必须坚持”)。“十个明确”“十四个坚持”“十三个\n②「A选项」“十个明确”是习近平新时代中国特色社会主义思想的主体内容，集中体现了这一思想体系的主要观点和基本精神，构成了这一思想体系的四梁八柱，发挥着统摄作用\n③「B选项」“十四个坚持”是在治国理政各方面作出的理论分析和政策指导，构成了新时代坚持和发展中国特色社会主义的基本方略主义思想的理论与实践成果\n③「D选项」党的二十大提出的“六个必须坚持”，是新时代中国特色社会主义思想的世界观、方法论和贯穿其中的立场观点方法的重要体现：1）坚持人民至上是根本价值立场，体现了历史唯物主义群众史观2）坚持自信自立是内在精神特质，体现了客观规律性和主观能动性的有机结合3）坚持守正创新是鲜明理论品格，体现了变与不变、继承与发展的内在联系4）坚持问题导向是重要实践要求，体现了矛盾的普遍性和客观性5）坚持系统观念是基本思想和工作方法，体现了辩证唯物主义普遍联系的原理6）坚持胸怀天下是中国共产党人的境界格局，体现了马克思主义追求人类进步和解放的崇高理想","tips":"","module":"习思想","title":"导论"},{"chapter":"导论","section":"多选","no":3,"stem":"时代是思想之母，实践是理论之源。当代中国正经历着我国历史上最为广泛而深刻的社会变革，也正在进行着人类历史上最为宏大而独特的实践创新。这是一个需要思想理论的时代，是一个产生思想理论的时代，也是一个在伟大变革中不断推动思想理论向前发展的时代。习近平新时代中国特色社会主义思想正是在这个时代中创立并不断丰富发展的。习近平新时代中国特色社会主义思想创立的时代背景包括（　　）","opts":{"A":"世界百年未有之大变局加速演进","B":"中华民族伟大复兴进入关键时期","C":"中国式现代化全面推进拓展","D":"中国共产党自我革命开辟新的境界"},"ans":"ABCD","point":"习近平新时代中国特色社会主义思想创立的时代背景","explain":"习近平新时代中国特色社会主义思想创立的时代背景包括：第一，世界百年未有之大变局加速演进。面对复杂多变的国际环境带来的新矛盾新挑战，以习近平同志为核心的党中央深刻把握中国和世界关系的历史性变化，深刻回答“人类社会何去何从”的历史之问，既在谋求我国发展中促进世界共同发展，又在世界共同发展中推进我国发展，为解决世界经济、国际安全、全球治理、人类文明发展等一系列重大问题提供了新的方向、新的方案、新的选择。第二，中华民族伟大复兴进入关键时期。习近平新时代中国特色社会主义思想，正是在中华民族迎来从站起来、富起来到强起来的伟大飞跃，实现中华民族伟大复兴进入不可逆习近平新时代中国特色社会主义思想概论转的历史进程中创立并不断丰富发展的。第三，中国式现代化全面推进拓展。习近平新时代中国特色社会主义思想，正是在成功推进和拓展中国式现代化、推动人类文明发展的历史进程中创立并不断丰富发展的。科学社会主义在21世纪的中国焕发新的蓬勃生机。习近平新时代中国特色社会主义思想，正是在对科学社会主义理论与实践的深邃思考、深刻总结，对坚持和发展中国特色社会主义的不懈探索、砺前行中创立并不断丰富发展的。第四，中国共产党自我革命开辟新的境界。习近平新时代中国特色社会主义思想，正是在党不断实现自我净化、自我完善、自我革新、自我提高，以伟大自我革命引领伟大社会革命的过程中创立并不断丰富发展的。应选A、B、C、D。","notes":"1「A、B、C、D选项」习近平新时代中国特色社会主义思想创立的时代背景：1）世界百年未有之大变局加速演进2）中华民族伟大复兴进入关键时期3）中国式现代化全面推进拓展4）科学社会主义在21世纪的中国焕发新的蓬勃生机5）中国共产党自我革命开辟新的境界","tips":"","module":"习思想","title":"导论"},{"chapter":"导论","section":"多选","no":4,"stem":"习近平新时代中国特色社会主义思想是马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合的重大成果，是坚持“两个结合”的光辉典范。“两个结合”是（　　）","opts":{"A":"新时代中国特色社会主义思想的世界观、方法论","B":"我们党在探索中国特色社会主义道路中得出的规律性认识","C":"我们取得成功的最大法宝","D":"对坚持和发展马克思主义作出的重大理论贡献"},"ans":"BCD","point":"习近平新时代中国特色社会主义思想是“两个结合”的重大成果","explain":"习近平新时代中国特色社会主义思想是马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合的重大成果，是坚持“两个结合”的光辉典范。“两个结合”是我们党在探索中国特色社会主义道路中得出的规律性认识，是我们取得成功的最大法宝。“两个结合”是对坚持和发展马克思主义作出的重大理论贡献。应选B、C、D。党的二十大提出的“六个必须坚持”，是习近平新时代中国特色社会主义思想的世界观、方法论和贯穿其中的立场观点方法的重要体现。","notes":"新时代中国特色社会主义思想是马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合的重大成果，是坚持“两个结合”的光辉典范的最大法宝\n③「A选项」党的二十大提出的“六个必须坚持”，是新时代中国特色社会主义思想的世界观、方法论和贯穿其中的立场观点方法的重要体现","tips":"像B、D选项这种具体作用意义政策类表述，符合材料主题且表述无明显错误就可以选。","module":"习思想","title":"导论"},{"chapter":"导论","section":"多选","no":5,"stem":"习近平新时代中国特色社会主义思想，以薪新的思想内容丰富发展了马克思主义，形成了完整的科学体系。这一思想从理论和实践的结合上科学回答的重大时代课题是（配套让","opts":{"A":"新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义","B":"建设什么样的社会主义现代化强国、怎样建设社会主义现代化强国","C":"新形势下实现什么样的发展、怎样发展","D":"建设什么样的长期执政的马克思主义政党、怎样建设长期执政的马克思主义政党"},"ans":"ABD","point":"习近平新时代中国特色社会主义思想是完整的科学体系","explain":"习近平新时代中国特色社会主义思想，从理论和实践的结合上科学回答了新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义，建设什么样的社会主义现代化强国、怎样建设社会主义现代化强国，建设什么样的长期执政的马克思主义政党、怎样建设长期执政的马克思主义政党等重大时代课题，以薪新的思想内容丰富发展了马克思主义，形成了完整的科学体系。应选A、B、D。新形势下实现什么样的发展、怎样发展是科学发展观着重回答的问题。C是干扰项。","notes":"邓小平理论回答的基本问题：什么是社会主义，怎样建设社会主义“三个代表”重要思想回答的基本问题：建设什么样的党、怎样建设党\n③「C选项」科学发展观回答的基本问题：实现什么样的发展、怎样发展\n④「A、B、D选项」习近平新时代中国特色社会主义思想回答的重大时代课题：1）新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义2）建设什么样的社会主义现代化强国、怎样建设社会主义现代化强国3）建设什么样的长期执政的马克思主义政党、怎样建设长期执政的马克思主义政党","tips":"","module":"习思想","title":"导论"},{"chapter":"导论","section":"多选","no":6,"stem":"习近平新时代中国特色社会主义思想坚定历史自信、文化自信，坚持古为今用、推陈出新，不断赋予科学理论鲜明的中国特色，让马克思主义更深地扎根于中国的土地上，扎根于亿万人民的心中。这是因为这一思想（　　）","opts":{"A":"把马克思主义思想精髓同中华优秀传统文化精华贯通起来","B":"把马克思主义同人民群众日用而不觉的共同价值观念融通起来","C":"将中华民族的伟大精神和丰富智慧更深层次地注入马克思主义","D":"借鉴和吸收了人类文明的一切优秀道德成果"},"ans":"ABC","point":"习近平新时代中国特色社会主义思想是“两个结合”的重大成果","explain":"习近平新时代中国特色社会主义思想坚定历史自信、文化自信，坚持古为今用、推陈出新，把马克思主义思想精髓同中华优秀传统文化精华贯通起来、同人民群众日用而不觉的共同价值观念融通起来，将中华民族的伟大精神和丰富智慧更深层次地注入马克思主义，聚变为新的理论优势，不断赋予科学理论鲜明的中国特色，让马克思主义更深地扎根于中国的土地上，扎根于亿万人民的心中。借鉴和吸收人类文明优秀道德成果，虽然是习近平新时代中国特色社会主义思想对待人类文明成果秉承的正确的态度和科学的方法，但不是让马克思主义更深地扎根于中国的土地上的原因，故排除D选项。","notes":"①「D选项」借鉴和吸收人类文明优秀道德成果，是新时代中国特色社会主义思想对待人类文明成果秉承的正确的态度和科学的方法\n②「D选项」中国式现代化，深深植根于中华优秀传统文化，体现科学社会主义的先进本质，借鉴吸收一切人类优秀文明成果，代表人类文明进步的发展方向，是一种全新的人类文明形态","tips":"题干问的是让马克思主义更深地扎根于中国的土地上的原因，所以要选跟“中国”相关的选项。习近平新时代中国特色社会主义思想概论","module":"习思想","title":"导论"},{"chapter":"第一章","section":"单选","no":1,"stem":"只有社会主义才能救中国，只有中国特色社会主义才能发展中国，这是历史的结论、人民的选择。这证明一个国家实行什么样的主义，关键要看（　　）","opts":{"A":"这个主义是否严格遵循科学社会主义基本原则","B":"这个主义能否解决这个国家面临的历史性理题","C":"这个主义是否符合全球多数国家的主流发展模式","D":"这个主义能否得到全体社会成员的一致认同"},"ans":"B","point":"中国特色社会主义是社会主义而不是其他什么主义","explain":"中国特色社会主义是科学社会主义理论逻辑和中国社会发展历史逻辑的辩证统一。中国特色社会主义之所以是社会主义，而不是其他什么主义，就是因为我们始终坚持科学社会主义基本原则，并根据新的时代条件赋予其鲜明的中国特色。因此只有社会主义才能救中国，只有中国特色社会主义才能发展中国，这个主义能够解决这个国家面临的历史性课题，B选项正确。A选项仅强调了理论的指导，忽视了理论与实践的结合；C选项混淆了“本国国情”与“国际模式”的主次关系；D选项夸大了社会成员认同的绝对性，均不符合题意。","notes":"①「B选项」马克思主义强调，判断社会制度优劣的根本标准在于其能否推动生产力发展、解决社会主要矛盾。中国特色社会主义理论体系明确指出，一个国家选择何种主义，必须以能否解决本国历史性课题为根本衡量标准","tips":"此题考查大家知识点延伸理解，C、D选项可以一来轻松排除，因为我们要走自己的路，D选项夸大了社会成员认同的绝对性。而A选项，虽然科学社会主义原则是根本遵循，但若机械照搬（如苏联模式），脱离本国实际仍会导致失败。所以只能选B，真题往往很多选项都是自己平常没有遇见过的，但是干扰项命题思路大家基本都见过，需要着重培养排除干扰项的能力。","module":"习思想","title":"第一章 · 新时代坚持和发展中国特色社会主义"},{"chapter":"第一章","section":"单选","no":2,"stem":"习近平总书记指出：“中国特色社会主义是不是好，要看事实，要看中国人民的判断，而不是看那些戴着有色眼镜的人的主观臆断。”中国特色社会主义“好”，根本上在于（　　）","opts":{"A":"中国特色社会主义植根中国大地，契合中国实际，体现了中国人民的意愿","B":"中国特色社会主义理论体系是改革开放以来党的全部理论和实践的主题","C":"中国特色社会主义制度是我国国家治理体系和国家治理能力的集中体现","D":"中国特色社会主义文化是激励全党全国各族人民奋勇前进的强大精神力量"},"ans":"A","point":"中国特色社会主义是社会主义而不是其他什么主义","explain":"中国特色社会主义植根中国大地，契合中国实际，体现中国人民意愿，这是中国特色社会主义“好”的根本原因。因为符合国情和人民意愿，才能得到人民支持，推动国家发展，实现人民幸福，题干中“要看事实，要看中国人民的判断”都在暗示A选项正确。改革开放以来党的全部理论和实践的主题是坚持和发展中国特色社会主义，而不是中国特色社会主义理论体系，B选项表述错误，且不能说明中国特色社会主义“好”的根本原因。我国国家治理体系和治理能力是中国特色社会主义制度及其执行能力的集中体现，C选项表述错误，且没有指出中国特色社会主义“好”的根本所在。中国特色社会主义文化是激励全党全国各族人民奋勇前进的强大精神力量，也不能说明中国特色社会主义“好”的根本原因，D选项错误。","notes":"①「B选项」1982年在党的十二大上，邓小平理论的主题（中国特色社会主义）形成。1982年邓小平在党的十二大开幕词中明确提出：走自己的道路，建设有中国特色的社会主义。制定全面开创社会主义现代化建设新局面的纲领。从此，“中国特色社会主义”成为我们党的全部理论和实践创新的主题然真题思维点拔题干明确指出“要看中国人民的判断”，这与选项A中“体现了中国人民的意愿”高度契合。","tips":"","module":"习思想","title":"第一章 · 新时代坚持和发展中国特色社会主义"},{"chapter":"第一章","section":"单选","no":3,"stem":"中国特色社会主义道路自信、理论自信、制度自信、文化自信，来源于实践、来源于人民、来源于真理。我们坚定“四个自信”的理论支撑和根本依据是（　　）","opts":{"A":"深厚的实践基础和人民的广泛参与、深切认同","B":"连绵不绝的中华5000多年文明","C":"马克思主义深刻揭示了社会主义必然代替资本主义的客观规律","D":"中国革命文化"},"ans":"C","point":"坚定道路自信、理论自信、制度自信、文化自信","explain":"马克思主义深刻揭示了社会主义必然代替资本主义的客观规律，这是我们坚定“四个自信”的理论支撑和根本依据。因此C选项正确。A选项深厚的实践基础和人民的广泛参与、深切认同，铸就了“四个自信”的坚实根基。B选项连绵不绝的中华5000多年文明，是中国特色社会主义的文化根脉和突出优势，是我们在世界风云激荡中站稳脚跟的根基。D选项中国革命文化是中国特色社会主义文化的一个重要源泉，A、B、D选项与题干要求不符，故排除。","notes":"改革开放以来我们取得一切成绩和进步的根本原因，归结起来就是：开辟了中国特色社会主义道路，形成了中国特色社会主义理论体系，确立了中国特色社会主义制度，发展了中国特色社会主义文化。其中，道路是实现途径，理论体系是行动指南，制度是根本保障，文化是精神力量，四者统一于中国特色社会主义伟大实践中国特色社会主义道路自信、理论自信、制度自信、文化自信，来源于实践、来源于人民、来源于真理\n③「C选项」马克思主义深刻揭示了社会主义必然代替资本主义的客观规律，这是我们坚定“四个自信”的理论支撑和根本依据我们说要坚定中国特色社会主义道路自信、理论自信、制度自信，说到底是要坚定文化自信，文化自信是更基础、更广泛、更深厚的自信，是一个国家、一个民族发展中最基本、最深沉、最持久的力量（“三更三最”）","tips":"除了直接熟悉记忆知识点之外，题干问的是“理论支撑”，也只有C选项跟理论最贴近。习近平新时代中国特色社会主义思想概论","module":"习思想","title":"第一章 · 新时代坚持和发展中国特色社会主义"},{"chapter":"第一章","section":"多选","no":4,"stem":"习近平指出：“当代中国的伟大社会变革，不是简单延续我国历史文化的母版，不是简单套用马克思主义经典作家设想的模板，不是其他国家社会主义实践的再版，也不是国外现代化发展的翻版。”对于这一论述的理解正确的是（　　）","opts":{"A":"中国特色社会主义写出了科学社会主义的“新版本”","B":"社会主义必须定于一尊，必须始终坚持马克思主义在意识形态的统治地位","C":"中国特色社会主义既坚持科学社会主义基本原则，又根据新的时代条件赋予其鲜明的中国特色","D":"中国式现代化既有各国现代化的共同特征，更有基于自己国情的中国特色"},"ans":"ACD","point":"中国特色社会主义是社会主义而不是其他什么主义","explain":"中国特色社会主义是科学社会主义理论逻辑和中国社会发展历史逻辑的辩证统一。中国特色社会主义之所以是社会主义，而不是其他什么主义，就是因为我们始终坚持科学社会主义基本原则，并根据新的时代条件赋予其鲜明的中国特色。这使得中国式现代化既有各国现代化的共同特征，更有基于自己国情的中国特色中国特色社会主义写出了科学社会主义的“新版本”。A、C、D是正确选项社会主义并没有定于一尊、一成不变的套路，B是干扰项。","notes":"①「A选项」中国特色社会主义写出了科学社会主义的“新版本”。习近平总书记指出：“当代中国的伟大社会变革，不是简单延续我国历史文化的母版，不是简单套用马克思主义经典作家设想的模板，不是其他国家社会主义实践的再版，也不是国外现代化发展的翻版。”\n②「B选项」社会主义并没有定于一尊、一成不变的套路，每个国家有自己不一样的国情，要走自己的路","tips":"","module":"习思想","title":"第一章 · 新时代坚持和发展中国特色社会主义"},{"chapter":"第一章","section":"多选","no":5,"stem":"党的十八大以来，经过科学分析，我们党及时作出我国社会主要矛盾已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾的重大战略判断。新时代我国社会主要矛盾的变化（　　）","opts":{"A":"明确了解决当代中国发展主要问题的根本着力点","B":"是在社会主义初级阶段中发生的变化","C":"使我国基本国情发生了重大变化","D":"改变了我国是世界最大发展中国家的国际地位"},"ans":"AB","point":"社会主要矛盾变化是关系全局的历史性变化","explain":"党的十八大以来，经过科学分析，我们党及时作出我国社会主要矛盾已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾的重大战略判断。新时代我国社会主要矛盾的变化，反映了社会发展的客观实际，明确了解决当代中国发展主要问题的根本着力点。新时代我国社会主要矛盾的变化，是在社会主义初级阶段中发生的变化，没有改变对我国社会主义所处历史阶段的判断。A、B是正确选项。我们既要看到我国社会主要矛盾发生的变化，也要看到我国仍处于并将长期处于社会主义初级阶段的基本国情没有变，我国是世界最大发展中国家的国际地位没有变。C、D是干扰项。","notes":"①「A、B选项」党的十八大以来，经过科学分析，我们党及时作出我国社会主要矛盾已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾的重大战略判断。新时代我国社会主要矛盾的变化明确了解决当代中国发展主要问题的根本着力点。新时代我国社会主要矛盾的变化，是在社会主义初级阶段中发生的变化，没有改变对我国社会主义所处历史阶段的判断，我国仍处于并将长期处于社会主义初级阶段的基本国情没有变，我国是世界最大发展中国家的国际地位没有变","tips":"","module":"习思想","title":"第一章 · 新时代坚持和发展中国特色社会主义"},{"chapter":"第一章","section":"多选","no":6,"stem":"中国特色社会主义进入新时代，是长期以来特别是党的十八大以来我们党领导人民不解奋斗的必然结果，是我们党在科学把握形势和实践发展变化基础上作出的重大判断。中国特色社会主义进入新时代是（　　）","opts":{"A":"我国社会主要矛盾发生新变化的反映","B":"党的主要任务发生新变化的反映","C":"中国和世界关系发生新变化的反映","D":"我国脱贫攻坚战取得了全面胜利的反映"},"ans":"ABC","point":"中国特色社会主义新时代是我国发展新的历史方位","explain":"中国特色社会主义进入新时代，是我国社会主要矛盾发生新变化的反映，是党的主要任务发生新变化的反映，是中国和世界关系发生新变化的反映，因此A、B、C是正确选项。2021年2月25日，全国脱贫攻坚总结表彰大会举行，习近平在会上庄严宣告：我国脱贫攻坚战取得了全面胜利。我国历史性地解决了绝对贫困问题，全面建成小康社会目标如期实现。而从2012年党的十八大开始，中国特色社会主义进入新时代。所以D属于干扰项，","notes":"①「A、B、C选项」中国特色社会主义进入新时代的依据（矛盾、任务、关系都变了）：1）中国特色社会主义进入新时代，是我国社会主要矛盾发生新变化的反映。我国社会主要矛盾的变化是我们党作出中国特色社会主义进入新时代重大判断的基本依据2）中国特色社会主义进入新时代，是党的主要任务发生新变化的反映。党的十八大后，党面临的主要任务是，实现第一个百年奋斗目标，开启实现第二个百年奋斗目标新征程，朝着实现中华民族伟大复兴的宏伟目标继续前进3）中国特色社会主义进入新时代，是中国和世界关系发生新变化的反映2「D选项1从2012年党的十八大开始，中国特色社会主义进入新时代。2021年7月，习近平总书记在庆祝中国共产党成立100周年大会上宣告，经过全党全国各族人民持续奋斗，我们实现了第一个百年奋目标，在中华大地上全面建成了小康社会，历史性地解决了绝对贫困问题，正在意气风发向着全面建成社会主义现代化强国的第二个百年奋斗目标迈进","tips":"","module":"习思想","title":"第一章 · 新时代坚持和发展中国特色社会主义"},{"chapter":"第二章","section":"单选","no":1,"stem":"新中国成立时，我国一穷二白，连日用的煤油、火柴、铁钉都称为洋油、洋火、洋钉。为尽快改变这种落后状况，我们党进行了艰辛探索，提出努力把我国建设成为一个具有现代农业、现代工业、现代国防和现代科学技术的社会主义强国。经过实施几个五年计划，我国建立起独立的比较完整的工业体系和国民经济体系，特别是取得了“两弹一星”等国防尖端科技突破，党在社会主义建设初步探索中取得的独创性理论成果和巨大成就，为现代化建设提供了（　　）","opts":{"A":"根本社会条件习近平新时代中国特色社会主义思想概论","B":"根本政治前提和制度基础","C":"宝贵经验、理论准备、物质基础","D":"充满新的活力的体制保证和快速发展的物质条件"},"ans":"C","point":"实现中华民族伟大复兴的中国梦","explain":"中华人民共和国成立时，我国一穷二白，连日用的煤油、火柴、铁钉都称为洋油、洋火、洋钉。为尽快改变这种落后状况，我们党进行了艰辛探索，提出努力把我国建设成为一个具有现代农业、现代工业、现代国防和现代科学技术的社会主义强国。经过实施几个五年计划，我国建立起独立的比较完整的工业体系和国民经济体系，特别是取得了“两弹一星”等国防尖端科技突破，党在社会主义革命和建设中取得的独创性理论成果和巨大成就，为现代化建设提供了宝贵经验、理论准备、物质基础。应选C。A选项对应建立了人民当家作主的中华人民共和国，实现了民族独立、人民解放，为实现现代化创造了根本社会条件。B选项对应新中国成立后，我们党团结带领人民进行社会主义革命，消灭在中国延续几千年的封建制度，确立社会主义基本制度，实现了中华民族有史以来最为广泛而深刻的社会变革，为现代化建设奠定根本政治前提和制度基础。D选项对应实行改革开放，实行社会主义市场经济体制，实现了从生产力相对落后的状况到经济总量跃居世界第二的历史性突破，实现了人民生活从温饱不足到总体小康、奔向全面小康的历史性跨越，为中国式现代化提供了充满新的活力的体制保证和快速发展的物质条件。习近平新时代中国特色社会主义思想概论","notes":"「A选项」新民主主义革命时期，我们党团结带领人民进行革命斗争，取得了新民主主义革命的胜利（新中国的成立），为实现现代化创造了根本社会条件度，确立社会主义基本制度，实现了中华民族有史以来最为广泛而深刻的社会变革，为现代化建设奠定根本政治前提和制度基础\n③「C选项」党在社会主义革命和建设中取得的独创性理论成果和巨大成就，为现代化建设提供了宝贵经验、理论准备、物质基础4「D选项」改革开放和社会主义现代化建设新时期，我们党作出把党和国家工作中心转移到经济建设上来、实行改革开放的历史性决策，开启了中国式现代化的新长征，为中国式现代化提供了充满新的活力的体制保证和快速发展的物质条件进入新时代，我们党围绕解决现代化建设中存在的突出矛盾和问题，不断实现理论和实践上的创新突破，成功推进和拓展了中国式现代化，为中国式现代化提供了更为完善的制度保证、更为坚实的物质基础、更为主动的精神力量","tips":"","module":"习思想","title":"第二章 · 以中国式现代化全面推进中华民族伟大复兴"},{"chapter":"第二章","section":"单选","no":2,"stem":"科学制定和接续实施五年规划，是我们党治国理政一条重要经验，也是中国特色社会主义一个重要政治优势。在谋划“十五五”时期经济社会发展时，必须紧紧围绕的核心目标是（　　）","opts":{"A":"全面建成小康社会","B":"基本实现社会主义现代化","C":"全体人民共同富裕","D":"推动高质量发展"},"ans":"B","point":"全面建成社会主义现代化强国","explain":"2025年4月30日，习近平在部分省区市“十五五”时期经济社会发展座谈会上的讲话中指出：科学制定和接续实施五年规划，是我们党治国理政一条重要经验，也是中国特色社会主义一个重要政治优势。谋划“十五五”时期经济社会发展，必须准确把握“十五五”时期的阶段性要求，着眼强国建设、民族复兴伟业，紧紧围绕基本实现社会主义现代化目标，一个领域一个领域合理确定目标任务、提出思路举措。A选项“全面建成小康社会”是2020年已实现的目标；C选项“全体人民共同富裕”是到本世纪中叶要实现的更长远的目标；D选项“推动高质量发展”是经济社会发展的主题，均不符合题干对核心目标的要求。","notes":"国建设、民族复兴伟业，紧紧围绕基本实现社会主义现代化目标\n②「B、C选项」全面建成社会主义现代化强国的两步走战略安排：第一步，从2020年到2035年基本实现社会主义现代化；第二步，在基本实现社会主义现代化的基础上，到本世纪中叶，把我国建设成为富强民主文明和谐美丽的社会主义现代化强国。到那时，全体人民共同富裕基本实现\n③「D选项」高质量发展是新时代我国经济社会发展的鲜明主题，是全面建设社会主义现代化国家的首要任务\n④「A选项」2021年7月，习近平总书记在庆祝中国共产党成立100周年大会上庄严宣告：经过全党全国各族人民持续奋斗，我们实现了第一个百年奋斗目标，在中华大地上全面建成了小康社会，历史性地解决了绝对贫困问题，正在意气风发向着全面建成社会主义现代化强国的第二个百年奋斗目标迈进","tips":"A、C选项可以轻易排除，因为时间阶段不匹配，十五五规划（2026一一2030年）是我国迈向2035年基本实现现代化的关键时期，只有B选项最接近时间节点。","module":"习思想","title":"第二章 · 以中国式现代化全面推进中华民族伟大复兴"},{"chapter":"第二章","section":"单选","no":3,"stem":"西方现代化带来了物质主义的膨胀，而且在一整套经济社会制度的塑造下，使人陷入物欲横流的循环而无法摆脱，本来很丰富的人性被掏空、被简化。美国学者马尔库塞在《单向度的人》一书中就深刻批判过这种现象，人性应该是多面的，但在资本主义条件下遭到削弱摧残而变得单一了。这是人类社会发展的悲剧，也是人道主义的悲剧。中国式现代化着眼促进人的自由而全面的发展，强调的根本要求是（　　）","opts":{"A":"共同富裕、消除贫困","B":"物质富足、精神富有","C":"生态宜居、社会和谐","D":"自由平等、公正法治"},"ans":"B","point":"中国式现代化的中国特色","explain":"题干通过批判西方现代化中物质主义对人性的单一化扭曲，强调中国式现代化需避免“物欲掏空人性”的弊端，追求人的“全面发展”。“物质富足”对应生存发展的物质基础，“精神富有”对应人性丰富、自由发展的精神需求，二者统一于“人的自由而全面发展”的目标。应选B选项。A选项侧重社会公平，C选项侧重生态与社会和谐，D选项侧重政治价值，均未直接回应题干中“物质与精神平衡发展”的核心指向。","notes":"中国式现代化的中国特色（内涵）：1）中国式现代化是人口规模巨大的现代化。这是中国式现代化的显著特征2）中国式现代化是全体人民共同富裕的现代化。这是中国式现代化的本质特征，也是区别于西方现代化的显著标志3）中国式现代化是物质文明和精神文明相协调的现代化。物质富足、精神富有是社会主义现代化的根本要求4）中国式现代化是人与自然和谐共生的现代化5）中国式现代化是走和平发展道路的现代化","tips":"从材料中“物欲横流、本来很丰富的人性被掏空”等语句可以推断出强调中国式现代化需促进人的自由全面发展，物质精神都需要协调发展，只有B选项最符合材料主旨。","module":"习思想","title":"第二章 · 以中国式现代化全面推进中华民族伟大复兴"},{"chapter":"第二章","section":"单选","no":4,"stem":"西方现代化的最大弊端，就是以资本为中心而不是以人民为中心，追求资本利益最大化而不是服务绝大多数人的利益，导致贫富差距过大、两极分化严重。一些发展中国家没有解决好两极分化、阶层固化等问题，结果掉进了“中等收入陷阱”。中国式现代化则与之不同。中国式现代化区别于西方现代化的显著标志是（　　）","opts":{"A":"中国式现代化是人与自然和谐共生的现代化","B":"中国式现代化是物质文明和精神文明相协调的现代化","C":"中国式现代化是全体人民共同富裕的现代化","D":"中国式现代化是走和平发展道路的现代化"},"ans":"C","point":"中国式现代化的中国特色","explain":"题干明确指出西方现代化“以资本为中心”导致贫富差距、两极分化，而中国式现代化的核心是“服务绝大多数人的利益”，着力解决两极分化、阶层固化等问题。“全体人民共同富裕”直接回应了这一对比，体现了中国式现代化“以人民为中心”的本质，是区别于西方以资本增值为目标的根本特征。应选C。A、B、D选项也都是中国式现代化的特征，但不符合题意。","notes":"","tips":"材料中“贫富差距过大、两极分化严重”等语句可以推断出在强调共同富裕。习近平新时代中国特色社会主义思想概论","module":"习思想","title":"第二章 · 以中国式现代化全面推进中华民族伟大复兴"},{"chapter":"第二章","section":"单选","no":5,"stem":"党的二十大确立了全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴的中心任务，阐述了中国式现代化的中国特色、本质要求、重大原则等，对推进中国式现代化作出战略部署。要把这些战略部署落到实处，把中国式现代化蓝图变为现实，根本动力在于（　　）","opts":{"A":"进一步全面深化改革，不断完善各方面体制机制，为推进中国式现代化提供制度保障","B":"始终坚持以人民为中心的发展思想，充分激发全体人民参与现代化建设的主体能动性","C":"完整准确全面贯彻新发展理念，切实推动经济社会发展全面转入高质量发展轨道","D":"坚持发扬斗争精神，应对前进路上各种风险挑战"},"ans":"A","point":"推进中国式现代化需要牢牢把握的重大原则","explain":"党的二十大明确指出，以中国式现代化全面推进中华民族伟大复兴是一次新的长征，前途光明，任重道远。前进道路上，必须牢牢把握以下重大原则：一是坚持和加强党的全面领导；二是坚持中国特色社会主义道路；三是坚持以人民为中心的发展思想；四是坚持深化改革开放；五是坚持发扬斗争精神。全面建设社会主义现代化国家、全面推进中华民族伟大复兴，动力在于全面深化改革开放。题干强调“根本动力”，聚焦于破除体制机制障碍、激发发展活力的核心作用，应选A。B选项侧重发展的价值取向（以人民为中心），C选项侧重发展的理念和路径（新发展理念），D选项侧重应对风险挑战的精神状态（发扬斗争精神），均未直接指向“动力”这一关键范畴。","notes":"①「A选项」全面深化改革开放，是新时代坚持和发展中国特色社会主义的根本动力在全面建设社会主义现代化国家新征程上，根本动力仍然是改革开放，要继续用足用好改革开放这个关键一招实践发展永无止境，解放思想永无止境，改革开放也永无止境，改革开放只有进行时、没有完成时。这是历史唯物主义态度","tips":"会基本矛盾”。","module":"习思想","title":"第二章 · 以中国式现代化全面推进中华民族伟大复兴"},{"chapter":"第二章","section":"多选","no":6,"stem":"100多年前，孙中山先生描绘了近代中国谋求现代化的蓝图：修建160万公里公路、16万公里铁路、3个世界级大海港把这些当时遥不可及的梦想变为现实的，正是中国共产党领导的中国式现代化的宏伟实践。今天，中国已经全面建成小康社会，国际影响力、号召力显著提升，中华民族伟大复兴进入了不可逆转的历史进程。这表明，中国式现代化（　　）","opts":{"A":"创造了放之四海而皆准的现代化标准","B":"为实现中华民族伟大复兴指明了道路","C":"开辟了具有普遍性的现代化新模式","D":"最突出的优势是坚持中国共产党领导"},"ans":"BD","point":"中国式现代化创造了人类文明新形态","explain":"孙中山先生描绘了近代中国谋求现代化的蓝图，如今中华民族伟大复兴进入了不可逆转的历史进程，这表明中国式现代化为实现中华民族伟大复兴指明了道路，B选项正确。“把这些当时遥不可及的梦想变为现实的，正是中国共产党领导的中国式现代化的宏伟实践”说明中国式现代化最突出的优势是坚持中国共产党领导，D选项正确。世界上不存在放之四海而皆准的现代化标准，A选项不选。中国式现代化是根据中国的国情提出的，是普遍性和特殊性相统一的现代化新模式，C选项不选。","notes":"①「D选项」中国式现代化是中国共产党领导的社会主义现代化，这是对中国式现代化的定性，是管总管根本的中国式现代化，深深植根于中华优秀传统文化，体现科学社会主义的先进本质，借鉴吸收一切人类优秀文明成果，代表人类文明进步的发展方向，是一种全新的人类文明形态中国式现代化提供了一种全新的现代化模式，中国式现代化是对西方式现代化理论和实践的重大超越，中国式现代化为广大发展中国家独立自主迈向现代化、探索现代化道路的多样性提供了全新选择4「A、C选项」世界上不存在放之四海而皆准的现代化标准。社会主义并没有定于一尊、一成不变的套路，每个国家有自己不一样的国情，要走自己的路","tips":"","module":"习思想","title":"第二章 · 以中国式现代化全面推进中华民族伟大复兴"},{"chapter":"第二章","section":"多选","no":7,"stem":"党的二十大报告明确指出：“中国式现代化，是中国共产党领导的社会主义现代化”。这是对中国式现代化定性的话，是管总、管根本的。强调党在中国式现代化建设中的领导地位，是因为党的领导（　　）","opts":{"A":"决定中国式现代化的根本性质","B":"确保中国式现代化锚定奋斗目标行稳致远","C":"激发建设中国式现代化的强劲动力","D":"凝聚建设中国式现代化的磅力量"},"ans":"ABCD","point":"中国式现代化的本质要求","explain":"党的领导决定中国式现代化的根本性质。党的性质宗旨、初心使命、信仰信念、政策主张决定了中国式现代化是社会主义现代化，而不是别的什么现代化。党的领导确保中国式现代化锚定奋斗目标行稳致远。我们党始终坚守初心使命，矢志为中国人民谋幸福、为中华民族谋复兴，坚持把远大理想和阶段性目标统一起来，一旦确定目标，就咬定青山不放松，接续奋斗、艰苦奋斗、不懈奋斗。党的领导激发建设中国式现代化的强劲动力。改革开放是决定当代中国命运的关键一招，也是决定中国式现代化成败的关键一招。党的领导凝聚建设中国式现代化的磅力量。我们党深刻认识到中国式现代化是亿万人民自己的事业，人民是中国式现代化的主体，必须紧紧依靠人民，尊重人民创造精神，汇集全体人民的智慧和力量，才能推动中国式现代化不断向前发展。A、B、C、D是正确选项。","notes":"①「A、B、C、D选项」党的领导直接关系中国式现代化的根本方向、前途命运、最终成败：第一，党的领导决定中国式现代化的根本性质（是社会主义现代化）；第二，党的领导确保中国式现代化锚定奋斗目标行稳致远（一代一代地接力推进）；第三，党的领导激发建设中国式现代化的强劲动力（改革开放）；第四，党的领导凝聚建设中国式现代化的磅力量（汇集全体人民的智慧和力量）","tips":"","module":"习思想","title":"第二章 · 以中国式现代化全面推进中华民族伟大复兴"},{"chapter":"第二章","section":"多选","no":8,"stem":"中国式现代化，深深植根于中华优秀传统文化，体现科学社会主义的先进本质，借鉴吸收一切人类优秀文明成果，代表人类文明进步的发展方向，是一种全新的人类文明形态。中国式现代化是全新的人类文明形态，在于它（　　）","opts":{"A":"提供了一种全新的现代化模式","B":"是对西方式现代化理论和实践的重大超越","C":"成为广大发展中国家定于一尊的现代化模式","D":"为广大发展中国家独立自主迈向现代化、探索现代化道路的多样性提供了全新选择"},"ans":"ABD","point":"中国式现代化创造了人类文明新形态","explain":"中国式现代化，深深植根于中华优秀传统文化，体现科学社会主义的先进本质，借鉴吸收一切人类优秀文明成果，代表人类文明进步的发展方向，是一种全新的人类文明形态。中国式现代化提供了一种全新的现代化模式，是对西方式现代化理论和实践的重大超越，为广大发展中国家独立自主迈向现代化、探索现代化道路的多样性提供了全新选择。应选A、B、D。世界文明是多样的，世界上既不存在定于一尊的现代化模式，也不存在放之四海而皆准的现代化标准。C选项错误。","notes":"1「C选项」世界上不存在放之四海而皆准的现代化标准。社会主义并没有定于一尊、一成不变的套路，每个国家有自己不一样的国情，要走自己的路习近平新时代中国特色社会主义思想概论中国式现代化，深深植根于中华优秀传统文化，体现科学社会主义的先进本质，借鉴吸收一切人类优秀文明成果，代表人类文明进步的发展方向，是一种全新的人类文明形态\n③「A、B、D选项」中国式现代化提供了一种全新的现代化模式，中国式现代化是对西方式现代化理论和实践的重大超越，中国式现代化为广大发展中国家独立自主迈向现代化、探索现代化道路的多样性提供了全新选择","tips":"","module":"习思想","title":"第二章 · 以中国式现代化全面推进中华民族伟大复兴"},{"chapter":"第二章","section":"多选","no":9,"stem":"党的十九大作出了从全面建成小康社会到基本实现社会主义现代化，再到全面建成社会主义现代化强国的战略安排。党的二十大进一步明确，全面建成社会主义现代化强国总的战略安排是分两步走：从2020年到2035年基本实现社会主义现代化；从2035年到本世纪中叶把我国建成富强民主文明和谐美丽的社会主义现代化强国。全面建成社会主义现代化强国的战略安排（　　）","opts":{"A":"把基本实现社会主义现代化的时间提前了十五年","B":"提出了全面建设社会主义现代化国家、全面推进中华民族伟大复兴的更高目标","C":"明确了全面建成社会主义现代化强国的时间表","D":"为当前和今后一个历史时期我国发展指明了方向、规划了蓝图"},"ans":"ABCD","point":"全面建成社会主义现代化强国","explain":"全面建成小康社会不是终点，而是新生活、新奋斗的起点。全面建成社会主义现代化强国的战略安排，把基本实现社会主义现代化的时间提前了十五年，提出了全面建设社会主义现代化国家、全面推进中华民族伟大复兴的更高目标，明确了全面建成社会主义现代化强国的时间表，为当前和今后一个历史时期我国发展指明了方向、规划了蓝图。A、B、C、D都是正确选项。","notes":"全面建成社会主义现代化强国的两步走战略安排：第一步，从2020年到2035年基本实现社会主义现代化；第二步，在基本实现社会主义现代化的基础上，到本世纪中叶，把我国建设成为富强民主文明和谐美丽的社会主义现代化强国。到那时，全体人民共同富裕基本实现","tips":"与邓小平同志提出的“三步走”战略相比，习近平总书记对中国式现代化的战略安排“将基本实现现代化的时间由原来的21世纪中叶提前到2035年。","module":"习思想","title":"第二章 · 以中国式现代化全面推进中华民族伟大复兴"},{"chapter":"第二章","section":"多选","no":10,"stem":"守正创新是我们党在新时代治国理政的重要思想方法。守正才能不迷失方向、不犯颠覆性错误，创新才能把握时代、引领时代。中国式现代化的探索就是一个在继承中发展、在守正中创新的历史过程。在全面建成中国式现代化进程中，正确处理守正与创新的关系，应该认识到（　　）","opts":{"A":"要毫不动摇坚持中国式现代化的中国特色、本质要求和重大原则","B":"要把创新摆在国家发展全局的突出位置，大力推进理论创新、实践创新、制度创新、文化创新以及其他各方面创新","C":"守正创新是中国共产党和中国人民最显著的精神标识","D":"守正和创新体现了继承与发展、原则性与创造性的辩证统一0.62习近平新时代中国特色社会主义思想概论"},"ans":"ABD","point":"推进中国式现代化需要正确处理的重大关系","explain":"守正和创新体现了继承与发展、原则性与创造性的辩证统一，在推进中国式现代化新征程上，首先要守好中国式现代化的本和源、根和魂，毫不动摇坚持中国式现代化的中国特色、本质要求和重大原则，坚持党的基本理论、基本路线、基本方略，坚持党的十八大以来的一系列重大方针政策，确保中国式现代化的正确方向。同时，要把创新摆在国家发展全局的突出位置，顺应时代发展要求，着眼于解决重大理论和实践问题，积极识变应变求变，大力推进理论创新、实践创新、制度创新、文化创新以及其他各方面创新，不断开辟发展新领域新赛道，塑造发展新动能新优势。应该选A、B、D。团结就是力量，奋斗开创未来。团结奋斗是中国共产党和中国人民最显著的精神标识，是中国人民创造历史伟业的必由之路。C选项错误。","notes":"①「C选项」团结奋斗是中国共产党和中国人民最显著的精神标识，是中国人民创造历史伟业的必由之路","tips":"出现了“最高级”比较绝对的说法一定要格外小心，仔细判断固定搭配是否正确。其余具体作用意义政策类表述，符合材料主题且表述无明显错误就可以选。","module":"习思想","title":"第二章 · 以中国式现代化全面推进中华民族伟大复兴"},{"chapter":"第三章","section":"单选","no":1,"stem":"中国共产党作为最高政治领导力量，在党和国家事业发展中居于中心地位。党的领导的最高原则，党保持团结统一和强大战斗力、不断取得胜利的关键所在是（　　）","opts":{"A":"严格的纪律规矩和优良作风","B":"全心全意为人民服务的根本宗旨","C":"党中央集中统一领导","D":"民主集中制的组织原则和领导制度"},"ans":"C","point":"维护党中央权威和集中统一领导","explain":"事在四方，要在中央。党中央集中统一领导是党的领导的最高原则，是党保持团结统一和强大战斗力、不断取得胜利的关键所在。C选项正确。A选项强调纪律作风，虽为党的建设重要内容，但非“最高原则”；B选项是党的根本宗旨，体现价值取向，不直接指向领导原则；D选项是党的组织制度和领导制度（民主集中制），而题干聚焦“最高原则”，党中央集中统一领导是民主集中制中“集中”方面的最高体现，二者存在包含关系，但D选项未直接点明“党中央集中统一”这一核心，故为干扰项。","notes":"坚持党的全面领导是坚持和发展中国特色社会主义的必由之路。中国特色社会主义最本质的特征是中量，坚持党中央集中统一领导是最高政治原则党的领导是中国特色社会主义制度体系的核心、“根”和“源”，是国家治理体系和治理能力现代化的关键，“心脏”和“引擎”，管根本、管全局、管长远，发挥着提纲领、无可替代的作用，是党和国家的根本所在、命脉所在，是全国各族人民的利益所系、幸福所系党的领导是社会主义法治最根本的保证，党的领导是推进全面依法治国的根本保证，是人民当家作主的根本保证…….（看到根本保证就选）党的领导是中国特色社会主义（法治）最本质的特征、我国宪法最显著的特征、中国特色社会主义法治之魂，我们的法治同西方资本主义国家的法治最大的区别党的领导是中国特色社会主义制度最大优势，党的领导制度是中国特色社会主义制度建设的关键党的领导是中国最大的国情、最高政治原则党的领导是坚持和发展中国特色社会主义的必由之路8「C选项」党中央集中统一领导是党的领导的最高原则习近平新时代中国特色社会主义思想概论","tips":"","module":"习思想","title":"第三章 · 坚持党的全面领导"},{"chapter":"第三章","section":"单选","no":2,"stem":"维护党中央权威和集中统一领导，是一个成熟的马克思主义执政党的重大建党原则。党的历史、新中国发展的历史都告诉我们：要治理好我们这个大党、治理好我们这个大国，保证党的团结和集中统一至关重要，维护党中央权威至关重要。维护党中央权威和集中统一领导，最关键的是（　　）","opts":{"A":"坚决贯彻党的理论、路线方针政策","B":"坚决维护习近平同志党中央的核心、全党的核心地位","C":"各级地方和部门的党组织服从服务于党中央权威","D":"全体党员服从党的全国代表大会和中央委员会"},"ans":"B","point":"维护党中央权威和集中统一领导","explain":"2019年通过的《中共中央关于加强党的政治建设的意见》强调，坚持和加强党的全面领导最重要的是坚决维护党中央权威和集中统一领导，坚决维护党中央权威和集中统一领导最关键的是坚决维护习近平同志党中央的核心、全党的核心地位。党的十八大以来，党和国家事业取得历史性成就、发生历史性变革，根本在于坚定维护习近平总书记党中央的核心、全党的核心地位，坚定维护党中央权威和集中统一领导。坚决贯彻党的理论、路线方针政策，各级地方和部门的党组织服从服务于党中央权威，全体党员服从党的全国代表大会和中央委员会，都是维护党中央权威和集中统一领导的重要体现，但不是最关键的因素。A、C、D选项不符合题意。","notes":"党中央集中统一领导是党的领导的最高原则，是党保持团结统一和强大战斗力、不断取得胜利的关键所在：1）维护党中央权威和集中统一领导，是一个成熟的马克思主义执政党的重大建党原则2）维护党中央权威和集中统一领导，必须坚决贯彻党的理论、路线方针政策和党中央决策部署3）维护党中央权威和集中统一领导，最关键的是坚决维护习近平同志党中央的核心、全党的核心地位4）维护党中央权威和集中统一领导，同坚持党的民主集中制是完全一致的。中国共产党是以民主集中制为根本组织原则和领导制度的马克思主义政党。必须坚持党员个人服从党的组织，少数服从多数，下级组织服从上级组织。我们强调坚持党中央权威和集中统一领导，不是说不要民主集中制了，不要发扬党内民主，把这两者对立起来是不对的。民主集中制是民主和集中紧密结合的制度，民主和集中这两个方面中的任何一个方面都不能偏废","tips":"","module":"习思想","title":"第三章 · 坚持党的全面领导"},{"chapter":"第三章","section":"单选","no":3,"stem":"中国共产党领导是国家治理体系的核心，党的领导制度是中国特色社会主义制度建设的关键。党的领导制度是一个系统完备、内涵丰富的制度体系，这一制度体系的主体内容是（　　）","opts":{"A":"建立不忘初心、牢记使命的制度，形成长效机制","B":"完善坚定维护党中央权威和集中统一领导的各项制度","C":"健全党的全面领导制度，确保党在各种组织中发挥领导作用","D":"健全为人民执政、靠人民执政的各项制度"},"ans":"C","point":"党的领导制度是我国的根本领导制度","explain":"党的领导制度是一个系统完备、内涵丰富的制度体系，主要涵盖六个方面的制度，其中健全党的全面领导制度，确保党在各种组织中发挥领导作用，是这一制度体系的主体内容。应选C。建立不忘初心、牢记使命的制度，形成长效机制，为坚持和完善党的领导制度体系奠定坚实基础；完善坚定维护党中央权威和集中统一领导的各项制度，坚决把维护习近平同志党中央的核心、全党的核心地位落到实处，明确这一制度体系必须坚持的最高原则；健全为人民执政、靠人民执政各项制度，巩固党执政的阶级基础，厚植党执政的群众基础，反映这一制度体系的价值追求；A、B、D选项不符合题意。","notes":"①「C选项」中国共产党领导是国家治理体系的核心，党的领导制度是中国特色社会主义制度建设的关键。健全党的全面领导制度，确保党在各种组织中发挥领导作用，是这一制度体系的主体内容党中央对重大工作的领导体制，是加强党的全面领导的制度安排，是实现党的全面领导的直接体现中国特色社会主义制度是一个严密完整的科学制度体系，起四梁八柱作用的是根本制度、基本制度、重要制度，其中具有统领地位的是党的领导制度","tips":"","module":"习思想","title":"第三章 · 坚持党的全面领导"},{"chapter":"第三章","section":"多选","no":4,"stem":"中国特色社会主义有很多特点和特征，其中最本质的特征是中国共产党领导。这个最本质特征是（　　）","opts":{"A":"在近代以来中国历史发展中形成的","B":"由中国最广大人民的根本利益决定的","C":"由实现中华民族伟大复兴历史任务决定的","D":"由社会主义初级阶段基本国情直接决定的"},"ans":"ABC","point":"中国最大的国情就是中国共产党的领导","explain":"中国特色社会主义有很多特点和特征，其中最本质的特征是中国共产党领导。这个最本质特征是在近代以来中国历史发展中形成的，是由中国最广大人民根本利益和实现中华民族伟大复兴历史任务决定的。应选A、B、C。初级阶段的基本国情与中国最大的国情就是中国共产党的领导并不构成因果关系。D是干扰项。","notes":"1「A选项」中国共产党作为最高政治领导力量不是自封的，而是在历史发展中形成的。在近代以来风云变幻的历史大潮中，中国共产党从各种政治力量中脱颖而出，成为众望所归的领导核心中国共产党作为最高政治领导力量是由我国国家性质和政治制度体系决定的。我国是工人阶级领导的、以工农联盟为基础的人民民主专政的社会主义国家，工人阶级领导是通过其先锋队一一中国共产党领导实现的3「B、C选项」中国共产党作为最高政治领导力量是由中华民族伟大复兴事业决定的。党作为最高政治领导力量，是国家和民族兴旺发达的根本所在，是全国各族人民幸福安康的根本所在，对于实现中华民族伟大复兴具有根本性意义","tips":"社会主义初级阶段是当前国情，但党的领导是超越具体阶段的根本政治原则，若仅由国情决定，则无法解释中国共产党在革命时期（非初级阶段）的领导地位形成。这一类选项可以通过分析逻辑是否合理来判定。","module":"习思想","title":"第三章 · 坚持党的全面领导"},{"chapter":"第三章","section":"多选","no":5,"stem":"坚持中国共产党的领导地位是一个重大的理论和实践问题。在当今中国，没有大于中国共产党的政治力量或其他什么力量。党政军民学，东西南北中，党是领导一切的，是最高的政治领导力量。这一论断深刻阐明了中国共产党在国家政治生活中的领导核心地位。坚持中国共产党作为最高政治领导力量（　　）","opts":{"A":"是由我国国家性质和政治制度体系决定的","B":"是由中华民族伟大复兴事业决定的","C":"是由中国共产党的长期执政地位决定的","D":"得到了最广大人民群众的支持和拥护"},"ans":"ABD","point":"中国共产党是最高政治领导力量","explain":"中国共产党作为最
