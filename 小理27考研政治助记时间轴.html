<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>政治时间轴 · 我的考点联动版</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23A32B2B'/%3E%3Ctext x='16' y='23' font-size='19' fill='%23FBFAF7' text-anchor='middle' font-family='serif'%3E%E5%8F%B2%3C/text%3E%3C/svg%3E">
<meta name="theme-color" id="themeColor" content="#E9E5DA">
<script>
(function () {
  var saved = null;
  try { saved = localStorage.getItem('politics-site-theme'); } catch (e) {}
  var dark = saved === 'dark';
  if (saved !== 'dark' && saved !== 'light') {
    dark = !!(window.matchMedia &&
      window.matchMedia('(prefers-color-scheme: dark)').matches);
  }
  if (dark) {
    document.documentElement.setAttribute('data-theme', 'dark');
    var meta = document.getElementById('themeColor');
    if (meta) meta.setAttribute('content', '#15171B');
  }
})();
</script>
<style>
:root{
  color-scheme:light;
  --paper:#E9E5DA; --card:#FBFAF7; --ink:#20242A; --ink2:#5F5B52;
  --blue:#1F4E6B; --red:#A32B2B; --ochre:#7A5A3B; --pine:#3E6B4F;
  --line:#CFC8B8; --line2:#E2DCCC;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","STSong",serif;
  font-size:15px; line-height:1.75;
  background-image:radial-gradient(rgba(31,78,107,.045) 1px, transparent 1px);
  background-size:22px 22px;
}
.wrap{max-width:1180px; margin:0 auto; padding:0 16px 72px}

/* 顶栏 */
.top{display:flex; align-items:flex-start; gap:14px; padding:26px 0 14px; border-bottom:1px solid var(--ink)}
h1{margin:0; font-size:clamp(26px,6vw,34px); font-weight:700; letter-spacing:.06em; line-height:1.25}
.sub{margin:6px 0 0; color:var(--ink2); font-size:13px; letter-spacing:.02em}
.prog{margin-left:auto; text-align:right; flex:0 0 auto; padding-top:4px}
.prog .num{font-family:ui-sans-serif, system-ui, sans-serif; font-size:19px; font-weight:600; letter-spacing:.02em}
.prog .lab{color:var(--ink2); font-size:11px; letter-spacing:.1em; display:block}
.ring{width:42px; height:42px}

/* 工具条 */
.bar{display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line)}
.tabs{display:flex; gap:16px; overflow-x:auto; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  border:0; background:none; padding:4px 0 6px; font:inherit; font-size:13.5px; color:var(--ink2);
  cursor:pointer; white-space:nowrap; border-bottom:2px solid transparent; min-height:32px;
}
.tab.on{color:var(--ink); border-bottom-color:var(--blue); font-weight:700}
.search{flex:1 1 190px; min-width:0}
.search input{
  width:100%; border:0; border-bottom:1px solid var(--line); background:transparent;
  font:inherit; font-size:16px; padding:6px 2px; color:var(--ink); outline:none;
}
.search input:focus{border-bottom-color:var(--blue)}
.search input::placeholder{color:#6A655A}
.theme-btn{
  flex:0 0 auto; width:44px; height:44px; display:inline-flex; align-items:center; justify-content:center;
  border:1px solid var(--line); border-radius:50%; background:none; color:var(--ink2);
  padding:0; cursor:pointer; transition:color .18s, border-color .18s, background .18s;
}
.theme-btn:hover{color:var(--ink); border-color:var(--ink2)}
.theme-btn:focus-visible{outline:2px solid var(--blue); outline-offset:2px}
.theme-btn svg{width:18px; height:18px; display:block}
.theme-btn .icon-sun{display:none}
[data-theme="dark"] .theme-btn .icon-moon{display:none}
[data-theme="dark"] .theme-btn .icon-sun{display:block}
.theme-auto{
  flex:0 0 auto; display:none; padding:6px 2px; border:0; background:none;
  font:inherit; font-size:11.5px; letter-spacing:.04em; color:var(--ink2);
  cursor:pointer; white-space:nowrap;
}
.theme-auto.show{display:inline-block}
.theme-auto:hover{color:var(--ink)}
.theme-auto:focus-visible{outline:2px solid var(--blue); outline-offset:2px}
.sr-only{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
}

/* 主体 */
main{display:block; margin-top:8px}
@media(min-width:960px){
  main{display:grid; grid-template-columns:minmax(0,1fr) 396px; gap:30px; align-items:start}
}

/* 时间轴：三列 grid，轴线与圆点同列 */
.axis{position:relative; padding:6px 0 0}
.node{
  display:grid; grid-template-columns:62px 26px minmax(0,1fr); align-items:start;
  border:0; background:none; padding:0; margin:0; text-align:left; width:100%; cursor:pointer;
  font:inherit; color:inherit; min-height:44px;
}
.node .yr{font-family:ui-sans-serif, system-ui, sans-serif; font-size:17px; font-weight:600; letter-spacing:.01em; padding-top:11px}
.node .mo{display:block; font-size:10.5px; color:var(--ink2); font-weight:400; letter-spacing:.04em}
.rail{position:relative; align-self:stretch}
.rail::before{content:""; position:absolute; left:calc(50% - .5px); top:0; bottom:0; width:1px; background:var(--line)}
.node:first-child .rail::before{top:16px}
.node:last-child .rail::before{bottom:calc(100% - 16px)}
.mark{
  position:absolute; left:50%; top:11px; width:9px; height:9px; margin-left:-4.5px;
  background:var(--ochre); border:1px solid rgba(0,0,0,.18);
}
.p-中 .mark{background:var(--red)}
.p-下 .mark{background:var(--blue)}
.p-新 .mark{background:var(--pine)}
.card{padding:9px 0 16px 4px; border-bottom:1px solid var(--line2)}
.node:last-child .card{border-bottom:0}
.card .nm{font-size:16.5px; font-weight:700; line-height:1.4; display:flex; gap:8px; align-items:baseline}
.card .nm .tag{font-size:10.5px; font-weight:400; color:var(--ink2); border:1px solid var(--line); padding:0 4px; letter-spacing:.05em; flex:0 0 auto}
.card .one{color:var(--ink2); font-size:13px; margin-top:1px}
.card .kp{color:var(--blue); font-size:12.5px; margin-top:4px}
.node.on .card{border-bottom-color:var(--blue)}
.node.on .nm{color:var(--blue)}
.node:focus-visible{outline:2px solid var(--blue); outline-offset:3px}

/* 详情面板 */
.panel{
  background:var(--card); border:1px solid var(--line); margin-top:18px;
  box-shadow:0 1px 0 rgba(0,0,0,.03);
}
@media(min-width:960px){
  .panel{position:sticky; top:18px; margin-top:20px; max-height:calc(100vh - 38px); overflow:auto}
}
.p-head{padding:16px 18px 13px; border-bottom:1px solid var(--line2); display:flex; gap:12px; align-items:flex-start}
.p-head h2{margin:0; font-size:19px; font-weight:700; line-height:1.35}
.p-head .py{font-family:ui-sans-serif, system-ui, sans-serif; color:var(--ink2); font-size:12.5px; display:block; margin-top:2px}
.p-head .close{margin-left:auto; border:0; background:none; font:inherit; font-size:13px; color:var(--ink2); cursor:pointer; padding:4px 2px; display:none}
.p-body{padding:4px 18px 18px}
.sec{padding:12px 0; border-bottom:1px solid var(--line2)}
.sec:last-child{border-bottom:0}
.sec h3{
  margin:0 0 5px; font-size:11px; letter-spacing:.16em; color:var(--blue); font-weight:700;
}
.sec h3.r{color:var(--red)}
.sec p{margin:0; font-size:14.5px}
.sec ul{margin:0; padding-left:1.1em}
.sec li{font-size:14px; margin:.22em 0}
.chain{display:flex; flex-direction:column; gap:7px}
.ch{font-size:13px; display:flex; gap:8px; align-items:baseline}
.ch .cy{font-family:ui-sans-serif, system-ui, sans-serif; color:var(--ink2); flex:0 0 auto}
.ch .cr{color:var(--red); font-size:11.5px; border:1px solid currentColor; padding:0 4px; flex:0 0 auto}
.anchor{
  background:linear-gradient(transparent 62%, rgba(163,43,43,.14) 62%);
  font-size:15px; font-weight:700;
}
.done{
  display:flex; gap:10px; align-items:center; justify-content:space-between;
  padding:13px 18px; border-top:1px solid var(--line2);
}
.btn{
  border:1px solid var(--ink); background:none; color:var(--ink); font:inherit; font-size:13.5px;
  padding:9px 14px; cursor:pointer; min-height:44px; letter-spacing:.03em;
}
.btn.on{background:var(--ink); color:var(--card); border-color:var(--ink)}
.btn.ghost{border-color:var(--line); color:var(--ink2)}
.navmini{display:flex; gap:8px}

/* 马原 */
.theory{display:grid; gap:14px; margin-top:14px}
.tblock{background:var(--card); border:1px solid var(--line); padding:15px 17px}
.tblock h3{margin:0 0 8px; font-size:15.5px; font-weight:700; display:flex; gap:9px; align-items:baseline}
.tblock h3 span{font-size:11px; color:var(--ink2); font-weight:400; letter-spacing:.08em}
.tblock ul{margin:0; padding-left:1.15em}
.tblock li{font-size:13.8px; margin:.28em 0}
.tblock .hook{color:var(--red); font-size:12.5px; margin-top:8px}
.empty{color:var(--ink2); font-size:13.5px; padding:26px 0}

/* 窄屏抽屉 */
@media(max-width:959px){
  .panel{
    position:fixed; left:0; right:0; bottom:0; top:auto; margin:0; z-index:20;
    max-height:88vh; overflow:auto; transform:translateY(102%);
    transition:transform .28s cubic-bezier(.3,.8,.3,1); border-left:0; border-right:0; border-bottom:0;
    box-shadow:0 -8px 30px rgba(0,0,0,.16);
  }
  .panel.open{transform:translateY(0)}
  .p-head .close{display:block}
  .mask{position:fixed; inset:0; background:rgba(20,22,26,.32); z-index:19}
  body.sheet-open{overflow:hidden}
}
button.ch.go{border:0;background:none;font:inherit;padding:0;cursor:pointer;text-align:left;color:inherit}
button.ch.go:hover span:last-child{text-decoration:underline; text-underline-offset:3px}
button.ch.go:focus-visible{outline:2px solid var(--blue); outline-offset:2px}

body.theory-mode main{grid-template-columns:1fr}
body.theory-mode .panel{display:none}
@media(prefers-reduced-motion:reduce){
  .panel{transition:none}
}

/* 黑夜模式 */
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#15171B; --card:#1D2025; --ink:#E9E4D8; --ink2:#B4AEA1;
  --blue:#8FB4C9; --red:#D97878; --ochre:#C9A97F; --pine:#87B594;
  --line:#363A42; --line2:#2A2E34;
}
[data-theme="dark"] body{
  background-image:radial-gradient(rgba(180,196,210,.06) 1px, transparent 1px);
}
[data-theme="dark"] ::selection{background:#3C4A57; color:#F2EDE2}
[data-theme="dark"] .search input::placeholder{color:#958F83}
[data-theme="dark"] .mark{border-color:rgba(255,255,255,.22)}
[data-theme="dark"] .panel{box-shadow:0 1px 0 rgba(0,0,0,.35)}
[data-theme="dark"] .anchor{background:linear-gradient(transparent 62%, rgba(217,120,120,.26) 62%)}
.ring circle{stroke:var(--line)}
.ring #ringArc{stroke:var(--blue)}
@media(max-width:959px){
  [data-theme="dark"] .panel{box-shadow:0 -8px 30px rgba(0,0,0,.5)}
  [data-theme="dark"] .mask{background:rgba(4,5,7,.6)}
}

/* 打印：无论当前主题，一律使用浅色纸张 */
@media print{
  :root,:root[data-theme="dark"]{
    color-scheme:light;
    --paper:#fff; --card:#fff; --ink:#111; --ink2:#333;
    --blue:#1F4E6B; --red:#8f1f1f; --ochre:#6b5138; --pine:#2f5540;
    --line:#bbb; --line2:#ddd;
  }
  html,body{background:#fff!important;color:#111!important}
  body.sheet-open{overflow:visible!important}
  [data-theme="dark"] body{background-image:none!important}
  .wrap{max-width:none;padding:0}
  .top{padding-top:0;border-color:#bbb}
  .bar,.theme-btn,.theme-auto,.mask,.done,.p-head .close{display:none!important}
  main{display:block}
  .panel{
    position:static; max-height:none; overflow:visible; margin-top:18px;
    transform:none!important;
    box-shadow:none!important; background:#fff!important; border-color:#bbb!important;
  }
  .panel:empty{display:none}
  .card,.node,.tblock{break-inside:avoid}
  .card{border-color:#bbb}
  .tblock{background:#fff!important;border-color:#bbb!important}
  [data-theme="dark"] .mark{border-color:rgba(0,0,0,.35)!important}
  .anchor{background:none!important;border-bottom:1px solid #A32B2B}
  .tag{border-color:#bbb!important;color:#333!important}
  .p-head{border-color:#bbb}
  .sec{border-color:#ddd}
  .p-head h2,.sec p,.sec li,.ch,.card .nm{color:#111}
  a{color:inherit!important;text-decoration:none!important}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>政治时间轴</h1>
      <p class="sub">2027 考研 · 史纲 / 毛中特 / 马原 · 考点联动版</p>
    </div>
    <div class="prog">
      <span class="lab">已掌握</span>
      <svg class="ring" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="16" fill="none" stroke="#CFC8B8" stroke-width="2"/>
        <circle id="ringArc" cx="20" cy="20" r="16" fill="none" stroke="#1F4E6B" stroke-width="2"
                stroke-dasharray="100.5 100.5" stroke-dashoffset="100.5" transform="rotate(-90 20 20)"/>
      </svg>
      <span class="num" id="progTxt">0 / 26</span>
    </div>
  </header>

  <div class="bar">
    <div class="tabs" id="tabs" role="group" aria-label="时间轴筛选">
      <button class="tab on" data-p="all" aria-pressed="true">全部</button>
      <button class="tab" data-p="上" aria-pressed="false">上编 1840—1919</button>
      <button class="tab" data-p="中" aria-pressed="false">中编 1919—1949</button>
      <button class="tab" data-p="下" aria-pressed="false">下编 1949 以后</button>
      <button class="tab" data-p="theory" aria-pressed="false">马原速查</button>
    </div>
    <div class="search"><input id="q" type="search" placeholder="搜事件、年份、考点" aria-label="搜索事件、年份、考点" autocomplete="off"></div>
    <button class="theme-btn" id="themeToggle" type="button" aria-label="黑夜模式" title="切换到黑夜模式" aria-pressed="false">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.3 14.6A8.5 8.5 0 1 1 9.4 3.7a6.7 6.7 0 0 0 10.9 10.9Z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button class="theme-auto" id="themeAuto" type="button" aria-label="恢复跟随系统主题">跟随系统</button>
  </div>

  <main>
    <section id="axis" class="axis"></section>
    <aside id="panel" class="panel"></aside>
  </main>
  <div class="sr-only" id="srStatus" role="status" aria-live="polite"></div>

  <footer style="margin-top:46px; padding-top:14px; border-top:1px solid var(--ink); color:var(--ink2); font-size:11.5px; line-height:1.8">
    <p style="margin:0 0 4px">私人复习用，2027 考研政治。考点为个人二次整理，非教材原文，请以最新大纲与统编教材为准。</p>
    <p style="margin:0">版式参考开源项目《史纲 · 毛中特 流光时间轴》（MIT License，github.com/akanewton），文字与代码另行独立编写。</p>
  </footer>
</div>
<div id="mask" class="mask" hidden></div>

<script>

 ma:'人民日益增长的物质文化需要同落后的社会生产之间的矛盾',
 ta:'全面建设小康社会',
 k:['十六大：“三个代表”写入党章','十七大：科学发展观写入党章，提出全面建设小康社会新要求','十八大：全面建成小康社会，提出“五位一体”总体布局'],
 c:[['2017','中共十九大','进入新时代']],
 w:[['易混','“三个代表”与科学发展观都是党的指导思想，但写入党章的时间不同'],['考法','问理论体系构成→ 邓小平理论、三个代表、科学发展观、习近平新时代中国特色社会主义思想']],
 a:'三个代表，科学发展，体系接续。'},

{y:2017,m:'10 月',n:'中共十九大与新时代',p:'下',one:'主要矛盾新表述，新时代新思想',
 bg:'中国特色社会主义进入新时代，十九大确立习近平新时代中国特色社会主义思想。',
 ma:'人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾',
 ta:'实现中华民族伟大复兴',
 k:['习近平新时代中国特色社会主义思想写入党章','新时代主要矛盾转变，但“两个没有变”（初级阶段、最大发展中国家）','两步走：2020—2035 基本实现现代化，2035—本世纪中叶建成社会主义现代化强国'],
 c:[['2022','中共二十大','发展']],
 w:[['易混','主要矛盾变了，但初级阶段的基本国情没有变'],['考法','问新时代内涵→ 决胜全面建成小康社会、进而全面建设社会主义现代化强国的时代']],
 a:'十九大判矛盾，新时代两步走。'}
];

/* ===== 马原速查 ===== */
const THEORY = [
{n:'唯物论',s:'物质 · 意识 · 运动',list:['物质决定意识，意识是物质的反映并反作用于物质','运动是物质的根本属性和存在方式，静止是运动的特殊状态','时间和空间是物质运动的存在形式，时空是客观的'],hook:'易错：意识不是物质，但意识的内容来源于物质。'},
{n:'辩证法',s:'联系 · 发展 · 矛盾',list:['两大特征：普遍联系、永恒发展','三大规律：对立统一（矛盾）、质量互变、否定之否定','五对范畴：内容与形式、本质与现象、原因与结果、必然与偶然、现实与可能'],hook:'易错：矛盾的普遍性寓于特殊性之中，不是特殊性寓于普遍性。'},
{n:'认识论',s:'实践 · 真理',list:['实践是认识的基础：来源、动力、检验标准、目的','认识过程：感性认识→理性认识，再回到实践，两次飞跃','真理是客观的、具体的，绝对性与相对性统一'],hook:'易错：实践是检验真理的唯一标准，不是认识本身。'},
{n:'唯物史观',s:'社会存在 · 人民群众',list:['社会存在决定社会意识，社会意识具有相对独立性','生产力与生产关系、经济基础与上层建筑两对基本矛盾','人民群众是历史的创造者，人的本质是一切社会关系的总和'],hook:'易错：社会意识并不是总落后于社会存在，也可能超前。'},
{n:'政治经济学',s:'商品 · 剩余价值 · 资本',list:['商品二因素由劳动二重性决定：具体劳动创造使用价值，抽象劳动创造价值','剩余价值来源于雇佣工人的剩余劳动，绝对与相对两种生产方法','资本循环三个阶段、周转速度受固定流动资本构成影响'],hook:'易错：剩余价值不是流通中产生的，而是在生产领域产生、流通中实现。'},
{n:'科学社会主义',s:'从空想到科学',list:['唯物史观与剩余价值学说使社会主义从空想变为科学','共产主义两个阶段：社会主义（按劳分配）、共产主义（按需分配）','人的自由全面发展是共产主义的最高价值目标'],hook:'易记：两大发现（唯物史观、剩余价值学说）撑起科学社会主义。'}
];
</script>
<script>
/* ===== 页面逻辑 ===== */
const $ = (s) => document.querySelector(s);
const axis = $('#axis'), panel = $('#panel'), mask = $('#mask'), tabs = $('#tabs'), qEl = $('#q');
const KEY = 'zz_politics_timeline_v1';
const S = { view:'timeline', p:'all', q:'', cur:0, done:new Set() };
try {
  const raw = JSON.parse(localStorage.getItem(KEY) || '[]');
  if (Array.isArray(raw)) S.done = new Set(raw.filter(n => n >= 0 && n < DATA.length));
} catch (e) {}

const PER = {
  上:'上编 · 旧民主主义革命 1840—1919',
  中:'中编 · 新民主主义革命 1919—1949',
  下:'下编 · 社会主义革命、建设与改革 1949—'
};

function match(d, q) {
  const pool = [d.n, String(d.y), d.m, d.one, d.ma, d.ta, d.a, d.bg, ...d.k, ...d.w.flat()].join(' ');
  return pool.toLowerCase().includes(q.toLowerCase());
}
function list() {
  const q = S.q.trim();
  return DATA.map((d, i) => ({ d, i }))
    .filter(o => (S.p === 'all' || o.d.p === S.p) && (!q || match(o.d, q)));
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify([...S.done])); } catch (e) {}
}
function updateProg() {
  const n = S.done.size, total = DATA.length;
  $('#progTxt').textContent = n + ' / ' + total;
  const C = 2 * Math.PI * 16;
  $('#ringArc').setAttribute('stroke-dasharray', C + ' ' + C);
  $('#ringArc').setAttribute('stroke-dashoffset', C * (1 - n / total));
}
function announce(text) {
  const el = $('#srStatus');
  if (el) el.textContent = text;
}

function renderAxis() {
  if (S.view === 'theory') { renderTheory(); return; }
  const arr = list();
  if (!arr.length) {
    axis.innerHTML = '<p class="empty">没有匹配的节点。换个关键词，或切到「全部」。</p>';
    panel.innerHTML = '';
    panel.classList.remove('open');
    mask.hidden = true;
    document.body.classList.remove('sheet-open');
    announce('没有匹配的节点');
    return;
  }
  axis.innerHTML = arr.map(({ d, i }) => {
    const tag = S.done.has(i) ? '已掌握' : (d.p === '上' ? '上编' : d.p === '中' ? '中编' : '下编');
    return '<button class="node p-' + d.p + (i === S.cur ? ' on' : '') + '" data-i="' + i + '" aria-pressed="' + (i === S.cur) + '">' +
      '<span class="yr">' + d.y + '<span class="mo">' + (d.m || '') + '</span></span>' +
      '<span class="rail" aria-hidden="true"><span class="mark"></span></span>' +
      '<span class="card">' +
        '<span class="nm">' + d.n + '<span class="tag">' + tag + '</span></span>' +
        '<span class="one">' + d.one + '</span>' +
      '</span></button>';
  }).join('');
  axis.querySelectorAll('.node').forEach(b => {
    b.addEventListener('click', () => select(+b.dataset.i, true));
  });
}

function renderTheory() {
  axis.innerHTML = '<div class="theory">' + THEORY.map(t =>
    '<div class="tblock"><h3>' + t.n + '<span>' + t.s + '</span></h3>' +
    '<ul>' + t.list.map(x => '<li>' + x + '</li>').join('') + '</ul>' +
    '<p class="hook">' + t.hook + '</p></div>').join('') + '</div>';
}

function renderPanel() {
  const d = DATA[S.cur];
  if (!d) { panel.innerHTML = ''; return; }
  const isDone = S.done.has(S.cur);
  const chain = d.c.map(([y, nm, rel]) => {
    const t = DATA.findIndex(x => x.n === nm);
    const head = '<span class="cy">' + y + '</span><span class="cr">' + rel + '</span>';
    return t >= 0
      ? '<button class="ch go" data-i="' + t + '">' + head + '<span>' + nm + '</span></button>'
      : '<span class="ch">' + head + '<span>' + nm + '</span></span>';
  }).join('');
  panel.innerHTML =
    '<div class="p-head">' +
      '<div><h2>' + d.n + '</h2><span class="py">' + d.y + ' 年 ' + (d.m || '') + '<br>' + PER[d.p] + '</span></div>' +
      '<button class="close" id="closeP" aria-label="收起详情">收起</button>' +
    '</div>' +
    '<div class="p-body">' +
      '<div class="sec"><h3>历史背景</h3><p>' + d.bg + '</p></div>' +
      '<div class="sec"><h3>主要矛盾</h3><p>' + d.ma + '</p></div>' +
      '<div class="sec"><h3>历史任务</h3><p>' + d.ta + '</p></div>' +
      '<div class="sec"><h3>关键考点</h3><ul>' + d.k.map(x => '<li>' + x + '</li>').join('') + '</ul></div>' +
      '<div class="sec"><h3>时间链 · 因果</h3><div class="chain">' + chain + '</div></div>' +
      '<div class="sec"><h3 class="r">易混辨析 · 考法</h3><ul>' + d.w.map(x => '<li><b>' + x[0] + '｜</b>' + x[1] + '</li>').join('') + '</ul></div>' +
      '<div class="sec"><h3 class="r">记忆锚点</h3><p class="anchor">' + d.a + '</p></div>' +
    '</div>' +
    '<div class="done">' +
      '<div class="navmini"><button class="btn ghost" id="prev">上一条</button><button class="btn ghost" id="next">下一条</button></div>' +
      '<button class="btn' + (isDone ? ' on' : '') + '" id="dm">' + (isDone ? '已掌握' : '标记已掌握') + '</button>' +
    '</div>';

  $('#closeP').addEventListener('click', closeSheet);
  $('#dm').addEventListener('click', () => {
    if (S.done.has(S.cur)) S.done.delete(S.cur); else S.done.add(S.cur);
    save(); updateProg(); renderAxis(); renderPanel();
    const dm = $('#dm');
    if (dm) dm.focus({ preventScroll: true });
    announce((S.done.has(S.cur) ? '已标记为掌握：' : '已取消掌握：') + DATA[S.cur].n);
  });
  $('#prev').addEventListener('click', () => {
    step(-1);
    const b = $('#prev');
    if (b) b.focus({ preventScroll: true });
  });
  $('#next').addEventListener('click', () => {
    step(1);
    const b = $('#next');
    if (b) b.focus({ preventScroll: true });
  });
  panel.querySelectorAll('.ch.go').forEach(b => {
    b.addEventListener('click', () => select(+b.dataset.i, true));
  });
}

function step(dir) {
  const arr = list();
  if (!arr.length) return;
  const pos = arr.findIndex(o => o.i === S.cur);
  const next = pos < 0 ? arr[0].i : arr[(pos + dir + arr.length) % arr.length].i;
  select(next, false);
}

function select(i, openSheet) {
  const wasOpen = panel.classList.contains('open');
  S.cur = i;
  renderAxis();
  renderPanel();
  const d = DATA[i];
  if (d) announce(d.n + '，' + d.y + ' 年' + (d.m ? ' ' + d.m : ''));
  if (openSheet && window.matchMedia('(max-width: 959px)').matches) {
    panel.classList.add('open');
    mask.hidden = false;
    document.body.classList.add('sheet-open');
    const close = $('#closeP');
    if (close) close.focus({ preventScroll: true });
  } else if (wasOpen && window.matchMedia('(max-width: 959px)').matches) {
    const close = $('#closeP');
    if (close) close.focus({ preventScroll: true });
  }
}

function closeSheet() {
  const wasOpen = panel.classList.contains('open');
  panel.classList.remove('open');
  mask.hidden = true;
  document.body.classList.remove('sheet-open');
  if (!wasOpen) return;
  const node = axis.querySelector('.node[data-i="' + S.cur + '"]');
  const fallback = tabs.querySelector('.tab.on') || qEl;
  (node || fallback).focus({ preventScroll: true });
}

tabs.addEventListener('click', (e) => {
  const b = e.target.closest('.tab');
  if (!b) return;
  tabs.querySelectorAll('.tab').forEach(t => {
    t.classList.remove('on');
    t.setAttribute('aria-pressed', 'false');
  });
  b.classList.add('on');
  b.setAttribute('aria-pressed', 'true');
  if (b.dataset.p === 'theory') {
    S.view = 'theory';
    document.body.classList.add('theory-mode');
  } else {
    S.view = 'timeline';
    S.p = b.dataset.p;
    document.body.classList.remove('theory-mode');
    if (!list().some(o => o.i === S.cur)) {
      const arr = list();
      if (arr.length) S.cur = arr[0].i;
    }
  }
  renderAxis();
  if (S.view === 'timeline') {
    renderPanel();
    announce('已筛选：' + b.textContent.trim() + '，共 ' + list().length + ' 个节点');
  } else {
    closeSheet();
    announce('马原速查');
  }
});

qEl.addEventListener('input', () => {
  S.q = qEl.value;
  const arr = list();
  if (arr.length && !arr.some(o => o.i === S.cur)) {
    S.cur = arr[0].i;
    renderAxis();
    renderPanel();
    announce('已切换到 ' + DATA[S.cur].n + '，共 ' + arr.length + ' 个匹配');
    return;
  }
  renderAxis();
  announce(arr.length ? '共 ' + arr.length + ' 个匹配' : '没有匹配的节点');
});

mask.addEventListener('click', closeSheet);

document.addEventListener('keydown', (e) => {
  if (S.view !== 'timeline') return;
  if (e.key === 'Escape') { closeSheet(); return; }
  if (e.target && e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
});

/* ===== 黑夜模式 ===== */
(function () {
  const root = document.documentElement;
  const btn = $('#themeToggle');
  const auto = $('#themeAuto');
  const meta = document.getElementById('themeColor');
  const THEME_KEY = 'politics-site-theme';

  function readSaved() {
    try { return localStorage.getItem(THEME_KEY); } catch (e) { return null; }
  }
  function systemDark() {
    return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }
  function preferredDark() {
    const saved = readSaved();
    if (saved === 'dark') return true;
    if (saved === 'light') return false;
    return systemDark();
  }
  function apply(dark) {
    if (dark) root.setAttribute('data-theme', 'dark');
    else root.removeAttribute('data-theme');
    btn.setAttribute('aria-pressed', String(dark));
    btn.title = dark ? '切换到日间模式' : '切换到黑夜模式';
    if (meta) meta.setAttribute('content', dark ? '#15171B' : '#E9E5DA');
    if (auto) {
      const saved = readSaved();
      auto.classList.toggle('show', saved === 'dark' || saved === 'light');
    }
  }

  btn.addEventListener('click', () => {
    const dark = root.getAttribute('data-theme') !== 'dark';
    try { localStorage.setItem(THEME_KEY, dark ? 'dark' : 'light'); } catch (e) {}
    apply(dark);
  });

  if (auto) auto.addEventListener('click', () => {
    try { localStorage.setItem(THEME_KEY, 'auto'); } catch (e) {}
    apply(preferredDark());
  });

  apply(preferredDark());

  window.addEventListener('storage', (e) => {
    if (e.key === THEME_KEY || e.key === null) apply(preferredDark());
  });
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onChange = () => {
      const saved = readSaved();
      if (saved === 'dark' || saved === 'light') return;
      apply(mq.matches);
    };
    if (mq.addEventListener) mq.addEventListener('change', onChange);
    else if (mq.addListener) mq.addListener(onChange);
  }
})();

renderAxis();
renderPanel();
updateProg();
</script>
</body>
</html>
